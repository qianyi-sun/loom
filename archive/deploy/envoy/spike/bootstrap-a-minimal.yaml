# Envoy spike A — minimal HTTP CONNECT forward proxy (no routing,
# no allowlist). Establishes baseline: does Envoy proxy HTTPS via
# CONNECT at all in this configuration? If yes, A is the foundation
# spike B builds on.
#
# Run: docker run --rm --network=host -v $(pwd)/bootstrap-a-minimal.yaml:/etc/envoy/envoy.yaml envoyproxy/envoy:v1.30-latest
# Test: curl -x http://localhost:30443 https://httpbin.org/ip

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: forward_proxy
      address:
        socket_address: { address: 0.0.0.0, port_value: 30443 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: forward_proxy
                # CONNECT method is what HTTP clients use for HTTPS-
                # via-proxy. Without explicit upgrade config Envoy
                # rejects CONNECT with 405.
                upgrade_configs:
                  - upgrade_type: CONNECT
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: connect_anything
                      domains: ["*"]
                      routes:
                        - match:
                            connect_matcher: {}
                          route:
                            cluster: dynamic_forward_proxy_cluster
                            # upgrade_configs at route level so the
                            # CONNECT terminates here (proxy) rather
                            # than being forwarded as a CONNECT to
                            # the upstream.
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                http_filters:
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config:
                        name: dynamic_forward_proxy_cache
                        dns_lookup_family: V4_ONLY
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: dynamic_forward_proxy_cluster
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: dynamic_forward_proxy_cache
            dns_lookup_family: V4_ONLY
