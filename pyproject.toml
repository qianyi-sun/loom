[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-platform"
version = "0.0.0"
description = "Shared platform contracts for agentic data generation and evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "CARIN Research Center" }
]
dependencies = [
  "alembic>=1.13,<2.0",
  "boto3>=1.34,<2.0",
  "fastapi>=0.136,<0.137",
  "harbor==0.9.0",
  "httpx>=0.28,<0.29",
  "httpx2>=2.3,<3.0",
  "huggingface-hub>=0.36,<2.0",
  "litellm>=1.70,<2.0",
  "matplotlib>=3.9,<4.0",
  "numpy>=2.0,<3.0",
  "openpyxl>=3.1,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "pyyaml>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "tenacity>=9.0,<10.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.60,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_data_platform.benchmarks" = ["patches/*.patch"]
"agentic_data_platform.benchmarks.catalogs" = ["*.json"]
"agentic_data_platform.frontend.static" = ["*.html", "*.css", "*.js"]
"agentic_data_platform.persistence" = ["alembic/*.py", "alembic/versions/*.py"]
