[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.0.0"
description = "Loom — team platform for running LLMs on customizable tasks with pluggable agents, tracking performance, and saving results."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Loom Contributors" }
]
dependencies = [
  "aiofiles>=23.2,<25.0",
  "alembic>=1.13,<2.0",
  "anthropic>=0.40,<1.0",
  "boto3>=1.34,<2.0",
  "cryptography>=42.0,<50.0",
  "docker>=7.0,<8.0",
  "fastapi>=0.110,<1.0",
  "greenlet>=3.0,<4.0",
  "google-generativeai>=0.8,<1.0",
  "httpx>=0.27,<1.0",
  "huggingface-hub>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "jsonschema>=4.21,<5.0",
  "litellm>=1.70,<2.0",
  "openai>=1.55,<3.0",
  "pillow>=12.0,<13.0",
  "prometheus-client>=0.19,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyjwt>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3.0",
  "structlog>=24.1,<25.0",
  "tenacity>=9.0,<10.0",
  "tomli-w>=1.0,<2.0",
  "types-aiofiles>=23.2,<25.0",
  "uvicorn[standard]>=0.32,<1.0",
  "zstandard>=0.23,<1.0",
  "argon2-cffi>=23.1,<26.0",
  "rfc8785>=0.1.4,<0.2",
  "numpy>=2.0,<3.0",
  "loom-bundle-checksum>=0.1.0,<0.2",
]

[project.optional-dependencies]
# Gateway native Pod TokenReview needs IAM refresh, without the Kubernetes CLI/client.
# Match the thin actuator and uv.lock so both images use the verified SDK API.
nebius-gateway = ["nebius==0.6.1"]
modal = [
  "modal>=0.66.55,<0.80",
]
# `loom cluster {status, render, up, down}` — k8s deployment path.
# Optional because most users (dev / single-box / library consumers)
# don't need it, and the python kubernetes client adds ~10 MB of
# transitive deps. Lazy-imported in `loom_cli.cluster_cmd` with a
# friendly install hint on ModuleNotFoundError.
cluster = [
  "kubernetes>=28.1,<32.0",
  "nebius>=0.6,<0.7",
]
# Production/staging rollout runner tooling. These are first-party sibling
# packages used by catalog provisioning and benchmark release gates; keep this
# extra on every clean rollout driver so candidate commands do not depend on
# developer-local editable installs.
rollout = [
  "loom-benchmarks",
  "loom-benchmark-terminal-bench-2",
]
# `loom run --model hf:<id>` / `--model file:<path>` launches vLLM as a
# managed subprocess. Optional because vLLM has GPU requirements + heavy
# CUDA wheels that most users don't need.
vllm = [
  "vllm>=0.6,<1.0",
]
# `loom_egress_xds` is a standalone process whose
# Envoy/gRPC deps (`envoy-data-plane`, `xds-protos`) require
# `protobuf>=6`, which conflicts with `google-generativeai`'s
# `protobuf<6` pin. Rather than crippling the main project's
# uv-resolution by adding an incompatible extra, those deps live in
# the standalone `deploy/Dockerfile.egress-xds` requirements (added
# in PR-C1b). This PR's code (config_builder + watcher) has no
# Envoy/gRPC imports — they live in the gRPC server module only.
dev = [
  "hypothesis>=6.100,<7.0",
  "kubernetes>=28.1,<32.0",
  "mypy>=1.10,<2.0",
  "nebius>=0.6,<0.7",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<7.0",
  "pytest-timeout>=2.3,<3.0",
  "ruff>=0.5,<1.0",
  "testcontainers[minio,postgres]>=4.4,<5.0",
  "types-docker>=7.0,<8.0",
]

[dependency-groups]
# Coverage aggregation runs in small, isolated CI jobs. Keeping the tool in the
# project lock avoids a floating `pip install` without forcing those jobs to
# install Loom's full runtime dependency set.
ci-coverage = [
  "coverage>=7,<8",
]

[project.scripts]
loom = "loom_cli.__main__:main"
loom-capacity-trusted-launcher = "loom_capacity_executor.trusted_launcher:main"
loom-task-image-authority = "loom_task_image_authority.__main__:main"

[project.entry-points."loom.family.keys"]
instance_id_prefix = "loom.family_run.keys:InstanceIdPrefixExtractor"

[project.entry-points."loom.family.sequencers"]
alphabetical = "loom.family_run.sequencers:AlphabeticalSequencer"
ranking_file = "loom.family_run.sequencers:RankingFileSequencer"
submitted_order = "loom.family_run.sequencers:SubmittedOrderSequencer"

[project.entry-points."loom.family.advance"]
always_on_terminal = "loom.family_run.advance:AlwaysOnTerminalPredicate"
success_or_retry_exhausted = "loom.family_run.advance:SuccessOrRetryExhaustedPredicate"

[project.entry-points."loom.family.adapters"]
noop = "loom.family_run.adapters:NoopAdapter"
skill_patcher_llm = "loom.family_run.skill_patcher_llm:SkillPatcherLLMAdapter"

[project.entry-points."loom.family.failure_policies"]
stall_family = "loom.family_run.failure:StallFamilyPolicy"
skip_and_advance = "loom.family_run.failure:SkipAndAdvancePolicy"
abort_family = "loom.family_run.failure:AbortFamilyPolicy"

[project.entry-points."loom.family.state_backends"]
s3_artifacts = "loom.family_run.state_backends:S3ArtifactsStateBackend"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["loom*", "loom_drivers*", "capacity_guard_migrations*", "capacity_migrations*"]

[tool.setuptools.package-data]
"loom_cli.data" = ["*.toml", "*.json", "grafana/*.json", "envoy/*.yaml"]
# Jinja2 manifests rendered by `loom cluster render`.
# `importlib.resources.files()` picks these up via the package
# spec; without this entry they'd be excluded from the wheel.
"loom_cli.templates.k8s" = ["*.yaml.j2", "_env.j2"]
"loom_cli.catalog_data" = ["*.json"]
"loom.integrations.behavior" = [
  "provider_assets/offline_judge/*.json",
  "provider_assets/offline_judge/*.md",
  "provider_assets/offline_judge/*.py",
  "provider_assets/offline_judge/tools/*.py",
]
"capacity_migrations" = ["alembic.ini", "env.py", "script.py.mako"]
"capacity_migrations.versions" = ["*.py"]
"capacity_guard_migrations" = ["alembic.ini", "env.py", "script.py.mako"]
"capacity_guard_migrations.versions" = ["*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["**/_generated.py"]

[tool.uv]
# Keep one universal lock for the three platforms that develop, validate, and
# roll out Loom. These platform constraints do not narrow the package metadata's
# existing Python >=3.11 support; the lock retains the required Python forks.
required-version = "==0.11.26"
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.workspace]
members = [
  "packages/loom-launcher",
  "packages/loom-bundle-checksum",
  "packages/loom-benchmarks",
  "packages/loom-benchmark-terminal-bench-2",
  "packages/loom-terminalgen",
]

[tool.uv.sources]
loom-bundle-checksum = { workspace = true }
loom-benchmarks = { workspace = true }
loom-benchmark-terminal-bench-2 = { workspace = true }
loom-terminalgen = { workspace = true }

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
# E501: line length handled by formatter.
# RUF001-003: ambiguous Unicode chars in identifiers/docstrings/comments —
#   the spec and plan docs use × (multiplication sign) and similar
#   notation in code docstrings/comments intentionally.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Preserve the explicitly authorized TerminalGen delivery byte-for-byte. These
# are modernization/style findings only; functional and security checks remain
# enabled, and Loom's production runtime never invokes the legacy CLI directly.
"packages/loom-terminalgen/src/terminalgen/*.py" = [
  "B008", "I001", "RUF100", "UP017", "UP033", "UP035", "UP037", "UP042",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["packages/loom-bundle-checksum"]
# Nebius integration checks active platform entrypoints. Retired pool/host
# infrastructure stays in the checkout for migration history, outside recursive
# discovery. Imports from active modules are still followed and type-checked;
# this is not an error suppression or an import-isolation guarantee.
files = [
  "packages/loom-bundle-checksum/loom_bundle_checksum",
  "src/loom",
  "src/loom_llm_gateway",
  "src/loom_control_plane",
  "src/loom_worker",
  "src/loom_benchmark_tool",
  "src/loom_service",
  "src/loom_cli",
  "src/loom_drivers",
  "src/loom_egress_xds",
  "src/loom_family_orchestrator",
  "src/loom_pipeline_orchestrator",
  "src/loom_listen",
  "src/loom_execution_actuator",
  "src/loom_execution_capacity_collector",
]
exclude = [
  '^src/loom_cli/rollout/',
  '^src/loom_(capacity_[^/]+|task_image_authority|task_image_builder_guard|personal_dev_[^/]+)/',
  '^src/loom_cli/(cluster_[^/]+|capacity_control_plane[^/]*|gb10_[^/]+|personal_dev[^/]*|rollout_lock[^/]*|environment_state|dev_cmd|inference_cmd)\.py$',
  '^src/(loom|loom_service|loom_service/routes)/(personal_dev[^/]*|dev_instance[^/]*)\.py$',
  '^src/loom_control_plane/(gb10_[^/]+|slurm_[^/]+|elastic_slurm_worker_controller|worker_pool_autoscaler|shared_capacity_broker|global_dev_fleet_autoscaler|global_execution_fence)\.py$',
  '^src/loom/staging_(capacity_database_bootstrap|mutation_[^/]+)\.py$',
]
plugins = ["pydantic.mypy"]

# boto3 / botocore don't ship type stubs and the full boto3-stubs[s3] package
# is heavy. We treat boto3 as untyped at the import boundary.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# Kubernetes does not publish complete typing metadata. The execution actuator
# and capacity collector still receive the locked SDK through the dev and
# cluster extras so their tests exercise the real quantity/request boundaries.
[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

# jsonschema 4.x bundles partial stubs but not py.typed. Treat as untyped.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# loom-launcher is an in-repo PyPI-style sibling package at
# packages/loom-launcher/. It's installed via `pip install -e
# packages/loom-launcher` in dev; mypy can't resolve the sibling
# path automatically, so we suppress the missing-import warning at
# the boundary. The launcher itself ships strict-typed under its own
# pyproject.
[[tool.mypy.overrides]]
module = ["loom_launcher", "loom_launcher.*"]
ignore_missing_imports = true

# loom-benchmarks is a sibling package at packages/loom-benchmarks/,
# installed editable into the venv. mypy can't auto-resolve the sibling
# path; suppress missing-import at the boundary. The package ships its
# own pyproject + tests under packages/loom-benchmarks/tests.
[[tool.mypy.overrides]]
module = ["loom_benchmarks", "loom_benchmarks.*"]
ignore_missing_imports = true

# loom-benchmark-terminal-bench-2 is a sibling under packages/, same
# story as loom-benchmarks — suppress missing-import at the boundary.
[[tool.mypy.overrides]]
module = ["loom_benchmark_terminal_bench_2", "loom_benchmark_terminal_bench_2.*"]
ignore_missing_imports = true

# datasets (HuggingFace) has no stubs; treat as untyped.
[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

# harbor is pinned in the worker image (deploy/Dockerfile.worker) but not a
# dev dependency; no py.typed / stubs. Suppress at the import boundary.
[[tool.mypy.overrides]]
module = ["harbor", "harbor.*"]
ignore_missing_imports = true

# loom_egress_xds imports Envoy protobuf bindings and gRPC.
# envoy-data-plane and xds-protos ship .py protobuf classes with no
# stubs / py.typed; grpcio similarly. Suppressing missing-import at
# the boundary so the package can be type-checked in CI without
# pulling in types-grpcio (heavy + lags grpcio releases).
[[tool.mypy.overrides]]
module = [
  "envoy", "envoy.*",
  "grpc", "grpc.*",
  "google.protobuf.any_pb2",
  "google.protobuf.duration_pb2",
  "google.protobuf.message",
  "psycopg", "psycopg.*",
]
ignore_missing_imports = true

[tool.coverage.run]
# Match the retired infrastructure scope rather than lowering the shared-code
# coverage floor. Generic worker, service, durable DB contracts, execution
# actuator and Nebius capacity collector remain measured.
omit = [
  "*/loom_cli/rollout/*",
  "*/loom_capacity_*/*",
  "*/loom_task_image_authority/*",
  "*/loom_task_image_builder_guard/*",
  "*/loom_personal_dev_*/*",
  "*/loom_cli/cluster_*.py",
  "*/loom_cli/capacity_control_plane*.py",
  "*/loom_cli/gb10_*.py",
  "*/loom_cli/personal_dev*.py",
  "*/loom_cli/rollout_lock*.py",
  "*/loom_cli/environment_state.py",
  "*/loom_cli/dev_cmd.py",
  "*/loom_cli/inference_cmd.py",
  "*/loom/personal_dev*.py",
  "*/loom/dev_instance*.py",
  "*/loom_service/personal_dev*.py",
  "*/loom_service/dev_instance*.py",
  "*/loom_service/routes/personal_dev*.py",
  "*/loom_service/routes/dev_instance*.py",
  "*/loom_control_plane/gb10_*.py",
  "*/loom_control_plane/slurm_*.py",
  "*/loom_control_plane/elastic_slurm_worker_controller.py",
  "*/loom_control_plane/worker_pool_autoscaler.py",
  "*/loom_control_plane/shared_capacity_broker.py",
  "*/loom_control_plane/global_dev_fleet_autoscaler.py",
  "*/loom_control_plane/global_execution_fence.py",
  "*/loom/staging_capacity_database_bootstrap.py",
  "*/loom/staging_mutation_*.py",
]

[tool.coverage.paths]
# Normalize the hosted runner checkout roots before combining shard data.
# Dedicated Nebius runner paths can be added when that runner contract exists.
source = [
  "src",
  "/home/runner/work/*/*/src",
]
packages = [
  "packages",
  "/home/runner/work/*/*/packages",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/fixtures/tasks/*/tests/test_*.py are sandbox test bodies meant to
# run inside the verifier container with /workspace mounted — collecting
# them from the host fails on the hardcoded /workspace path. Exclude.
# (Plus the pytest defaults — they must be re-listed when overriding.)
norecursedirs = [
  "tests/fixtures",
  ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv",
]
# tests/system require docker-compose + built service images and take
# minutes to run; opt in explicitly with `pytest tests/system`.
addopts = "--ignore=tests/system"
# Per-test wall-clock cap from pytest-timeout. A single hanging test
# A hang in `test_claim_endpoint::test_claim_rejects_unauth` can otherwise
# block the whole CI for about 20 minutes. It becomes a single failed test,
# letting the rest of the suite finish. Docker-tier tests can override
# with `@pytest.mark.timeout(N)` on the test/class.
timeout = 60
# `signal` (SIGALRM) is more aggressive than `thread` — interrupts
# the test even when it's blocked in a C-level extension. Required to
# interrupt `test_claim_endpoint::test_claim_rejects_unauth` when it blocks on
# `starlette.TestClient.__exit__` and
# `anyio` portal shutdown that the thread-method timer can't interrupt.
timeout_method = "signal"
markers = [
  "legacy_pool: OLDLAB/GB10/Slurm-specific case retained for migration history; excluded from Nebius integration CI.",
  "swe_bench_smoke: SWE-Bench Verified end-to-end smoke; pulls ~5GB per-instance images. Opt-in via LOOM_RUN_SWE_BENCH_SMOKE=1.",
  "docker: integration tests that spin up real Docker containers via the host daemon (DockerDriver, network-policy, trial-e2e, subprocess-agent). Excluded from the default integration CI tier; run via the `integration-docker` workflow job or `pytest -m docker` locally.",
  "integration: PgBouncer + Postgres container integration tests. Require Docker; skip with `-m 'not integration'` in environments without Docker.",
  "cluster_smoke: credential-free Nebius runtime and disposable Kubernetes execution contracts. Run via the `cluster-smoke` CI job.",
]
