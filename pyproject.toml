[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.0.0"
description = "Loom — agent evaluation and training-data generation runtime."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "CARIN Research Center" }
]
dependencies = [
  "aiofiles>=23.2,<25.0",
  "alembic>=1.13,<2.0",
  "boto3>=1.34,<2.0",
  "dirhash>=0.5,<1.0",
  "docker>=7.0,<8.0",
  "litellm>=1.70,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "structlog>=24.1,<25.0",
  "tenacity>=9.0,<10.0",
  "types-aiofiles>=23.2,<25.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.5,<1.0",
  "testcontainers[minio,postgres]>=4.4,<5.0",
  "types-docker>=7.0,<8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["loom*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
# E501: line length handled by formatter.
# RUF001-003: ambiguous Unicode chars in identifiers/docstrings/comments —
#   the spec and plan docs use × (multiplication sign) and similar
#   notation in code docstrings/comments intentionally.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/loom"]
plugins = ["pydantic.mypy"]

# boto3 / botocore don't ship type stubs and the full boto3-stubs[s3] package
# is heavy. We treat boto3 as untyped at the import boundary.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
