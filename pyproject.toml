[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-platform"
version = "0.0.0"
description = "Shared platform contracts for agentic data generation and evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "CARIN Research Center" }
]

[tool.setuptools.packages.find]
where = ["src"]
