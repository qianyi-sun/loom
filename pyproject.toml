[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-platform"
version = "0.0.0"
description = "Shared platform contracts for agentic data generation and evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "CARIN Research Center" }
]
dependencies = [
  "alembic>=1.13,<2.0",
  "boto3>=1.34,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_data_platform.benchmarks.catalogs" = ["*.json"]
"agentic_data_platform.persistence" = ["alembic/*.py", "alembic/versions/*.py"]
