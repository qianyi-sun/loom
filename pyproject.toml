[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.0.0"
description = "Loom — team platform for running LLMs on customizable tasks with pluggable agents, tracking performance, and saving results."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Loom Contributors" }
]
dependencies = [
  "aiofiles>=23.2,<25.0",
  "alembic>=1.13,<2.0",
  "anthropic>=0.40,<1.0",
  "boto3>=1.34,<2.0",
  "cryptography>=42.0,<50.0",
  "daytona>=0.184,<0.200",
  "dirhash>=0.5,<1.0",
  "docker>=7.0,<8.0",
  "fastapi>=0.110,<1.0",
  "greenlet>=3.0,<4.0",
  "google-generativeai>=0.8,<1.0",
  "httpx>=0.27,<1.0",
  "huggingface-hub>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "jsonschema>=4.21,<5.0",
  "litellm>=1.70,<2.0",
  "openai>=1.55,<2.0",
  "prometheus-client>=0.19,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyjwt>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3.0",
  "structlog>=24.1,<25.0",
  "tenacity>=9.0,<10.0",
  "tomli-w>=1.0,<2.0",
  "types-aiofiles>=23.2,<25.0",
  "uvicorn[standard]>=0.32,<1.0",
  "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
modal = [
  "modal>=0.66.55,<0.80",
]
# `loom cluster {status, render, up, down}` — k8s deployment path.
# Optional because most users (dev / single-box / library consumers)
# don't need it, and the python kubernetes client adds ~10 MB of
# transitive deps. Lazy-imported in `loom_cli.cluster_cmd` with a
# friendly install hint on ModuleNotFoundError.
cluster = [
  "kubernetes>=28.1,<32.0",
]
# `loom run --model hf:<id>` / `--model file:<path>` launches vLLM as a
# managed subprocess. Optional because vLLM has GPU requirements + heavy
# CUDA wheels that most users don't need.
vllm = [
  "vllm>=0.6,<1.0",
]
# `loom_egress_xds` (#78 Phase C) is a standalone process whose
# Envoy/gRPC deps (`envoy-data-plane`, `xds-protos`) require
# `protobuf>=6`, which conflicts with `google-generativeai`'s
# `protobuf<6` pin. Rather than crippling the main project's
# uv-resolution by adding an incompatible extra, those deps live in
# the standalone `deploy/Dockerfile.egress-xds` requirements (added
# in PR-C1b). This PR's code (config_builder + watcher) has no
# Envoy/gRPC imports — they live in the gRPC server module only.
dev = [
  "hypothesis>=6.100,<7.0",
  "mypy>=1.10,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<7.0",
  "pytest-timeout>=2.3,<3.0",
  "ruff>=0.5,<1.0",
  "testcontainers[minio,postgres]>=4.4,<5.0",
  "types-docker>=7.0,<8.0",
]

[project.scripts]
loom = "loom_cli.__main__:main"

[project.entry-points."loom.family.keys"]
instance_id_prefix = "loom.family_run.keys:InstanceIdPrefixExtractor"

[project.entry-points."loom.family.sequencers"]
alphabetical = "loom.family_run.sequencers:AlphabeticalSequencer"
ranking_file = "loom.family_run.sequencers:RankingFileSequencer"
submitted_order = "loom.family_run.sequencers:SubmittedOrderSequencer"

[project.entry-points."loom.family.advance"]
always_on_terminal = "loom.family_run.advance:AlwaysOnTerminalPredicate"
success_or_retry_exhausted = "loom.family_run.advance:SuccessOrRetryExhaustedPredicate"

[project.entry-points."loom.family.adapters"]
noop = "loom.family_run.adapters:NoopAdapter"
skill_patcher_llm = "loom.family_run.skill_patcher_llm:SkillPatcherLLMAdapter"

[project.entry-points."loom.family.failure_policies"]
stall_family = "loom.family_run.failure:StallFamilyPolicy"
skip_and_advance = "loom.family_run.failure:SkipAndAdvancePolicy"
abort_family = "loom.family_run.failure:AbortFamilyPolicy"

[project.entry-points."loom.family.state_backends"]
s3_artifacts = "loom.family_run.state_backends:S3ArtifactsStateBackend"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loom*", "loom_drivers*"]

[tool.setuptools.package-data]
"loom_cli.data" = ["*.toml"]
# Jinja2 manifests rendered by `loom cluster render` (#76 Phase 1B).
# `importlib.resources.files()` picks these up via the package
# spec; without this entry they'd be excluded from the wheel.
"loom_cli.templates.k8s" = ["*.yaml.j2"]
"loom_cli.catalog_data" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["**/_generated.py"]

[tool.uv]
# Keep uv resolution valid for both local Mac development and Linux CI.
required-environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
# E501: line length handled by formatter.
# RUF001-003: ambiguous Unicode chars in identifiers/docstrings/comments —
#   the spec and plan docs use × (multiplication sign) and similar
#   notation in code docstrings/comments intentionally.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/loom", "src/loom_llm_gateway", "src/loom_control_plane", "src/loom_worker", "src/loom_benchmark_tool", "src/loom_service", "src/loom_cli", "src/loom_drivers", "src/loom_egress_xds", "src/loom_listen"]
plugins = ["pydantic.mypy"]

# boto3 / botocore don't ship type stubs and the full boto3-stubs[s3] package
# is heavy. We treat boto3 as untyped at the import boundary.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# jsonschema 4.x bundles partial stubs but not py.typed. Treat as untyped.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# loom-launcher is an in-repo PyPI-style sibling package at
# packages/loom-launcher/. It's installed via `pip install -e
# packages/loom-launcher` in dev; mypy can't resolve the sibling
# path automatically, so we suppress the missing-import warning at
# the boundary. The launcher itself ships strict-typed under its own
# pyproject.
[[tool.mypy.overrides]]
module = ["loom_launcher", "loom_launcher.*"]
ignore_missing_imports = true

# loom-benchmarks is a sibling package at packages/loom-benchmarks/,
# installed editable into the venv. mypy can't auto-resolve the sibling
# path; suppress missing-import at the boundary. The package ships its
# own pyproject + tests under packages/loom-benchmarks/tests.
[[tool.mypy.overrides]]
module = ["loom_benchmarks", "loom_benchmarks.*"]
ignore_missing_imports = true

# loom-benchmark-terminal-bench-2 is a sibling under packages/, same
# story as loom-benchmarks — suppress missing-import at the boundary.
[[tool.mypy.overrides]]
module = ["loom_benchmark_terminal_bench_2", "loom_benchmark_terminal_bench_2.*"]
ignore_missing_imports = true

# datasets (HuggingFace) has no stubs; treat as untyped.
[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

# loom_egress_xds (#190) imports Envoy protobuf bindings + grpc.
# envoy-data-plane and xds-protos ship .py protobuf classes with no
# stubs / py.typed; grpcio similarly. Suppressing missing-import at
# the boundary so the package can be type-checked in CI without
# pulling in types-grpcio (heavy + lags grpcio releases).
[[tool.mypy.overrides]]
module = [
  "envoy", "envoy.*",
  "grpc", "grpc.*",
  "google.protobuf.any_pb2",
  "google.protobuf.duration_pb2",
  "google.protobuf.message",
  "psycopg", "psycopg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tests/fixtures/tasks/*/tests/test_*.py are sandbox test bodies meant to
# run inside the verifier container with /workspace mounted — collecting
# them from the host fails on the hardcoded /workspace path. Exclude.
# (Plus the pytest defaults — they must be re-listed when overriding.)
norecursedirs = [
  "tests/fixtures",
  ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv",
]
# tests/system require docker-compose + built service images and take
# minutes to run; opt in explicitly with `pytest tests/system`.
addopts = "--ignore=tests/system"
# Per-test wall-clock cap from pytest-timeout. A single hanging test
# (issue #7 observed `test_claim_endpoint::test_claim_rejects_unauth`
# hang the whole CI for ~20 min) now becomes a single failed test,
# letting the rest of the suite finish. Docker-tier tests can override
# with `@pytest.mark.timeout(N)` on the test/class.
timeout = 60
# `signal` (SIGALRM) is more aggressive than `thread` — interrupts
# the test even when it's blocked in a C-level extension. Required to
# kill the hang in `test_claim_endpoint::test_claim_rejects_unauth`
# (issue #7), which blocks on `starlette.TestClient.__exit__` →
# `anyio` portal shutdown that the thread-method timer can't interrupt.
timeout_method = "signal"
markers = [
  "swe_bench_smoke: SWE-Bench Verified end-to-end smoke; pulls ~5GB per-instance images. Opt-in via LOOM_RUN_SWE_BENCH_SMOKE=1.",
  "docker: integration tests that spin up real Docker containers via the host daemon (DockerDriver, network-policy, trial-e2e, subprocess-agent). Excluded from the default integration CI tier; run via the `integration-docker` workflow job or `pytest -m docker` locally.",
  "integration: pgbouncer + Postgres container integration tests (#609). Require Docker; skip with `-m 'not integration'` in environments without Docker.",
  "cluster_smoke: kind-based cluster smoke tests that render, apply, and verify Loom k8s manifests end-to-end. Require kind + Docker. Run via the `cluster-smoke` CI job or `pytest -m cluster_smoke` locally.",
]
