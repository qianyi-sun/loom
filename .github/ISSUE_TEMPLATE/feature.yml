name: Feature
description: Track a product, platform, or workflow feature
title: "[Feature] "
labels: ["enhancement", "type:feature"]
body:
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Stakeholders / scope
        - Infra / deployment
        - Requirements
        - Product / architecture
        - Engineering system
        - Operations / governance
        - MVP pilot
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - urgent blocker
        - P1 - high priority
        - P2 - normal priority
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know this is done?
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation Updates
      description: Which architecture, development, deployment, or user docs must change with this feature?
    validations:
      required: true
