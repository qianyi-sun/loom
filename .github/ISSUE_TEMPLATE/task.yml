name: Task
description: Track implementation, operations, or research work
title: "[Task] "
labels: ["type:task"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Code implementation
        - Documentation
        - CI/CD
        - Dev environment
        - GitHub issue/project management
        - Release / governance
        - Benchmark catalog
        - Research intake
        - Operations
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be true when this is complete?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Relevant context, constraints, or links.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: What command, review, deployment, or manual check proves completion?
    validations:
      required: true
