name: Architecture Decision
description: Propose or record a platform architecture decision
title: "[Architecture] "
labels: ["workstream:product-design", "type:decision"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem, constraint, or tradeoff requires an architecture decision?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Run lifecycle / scheduler
        - Service API / auth
        - Model provider / LLM gateway
        - Benchmark catalog / task materialization
        - Agent adapter / sandbox runtime
        - Evaluator / scoring
        - Storage / artifacts / trajectories
        - Web SPA / dashboard
        - Deployment / operations / observability
        - Governance / release
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What decision or design are you proposing?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List viable alternatives and why they are weaker for this project.
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What does this enable, block, simplify, or make harder?
    validations:
      required: true
