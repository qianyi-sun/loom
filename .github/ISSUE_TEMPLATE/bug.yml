name: Bug
description: Report broken behavior, failed checks, or incorrect platform results
title: "[Bug] "
labels: ["bug", "type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / service
        - Auth / teams / tokens
        - Model provider / LLM gateway
        - Benchmark catalog / task bundle
        - Batch / trial lifecycle
        - Worker / sandbox runtime
        - Storage / artifacts / trajectories
        - Web SPA
        - CLI
        - CI / deployment / operations
        - Documentation
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, run ids, benchmark/task ids, logs, or screenshots when available.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is blocked and how severe is it?
    validations:
      required: true
