name: trusted-image-release-controller

# Manual compatibility entry point for the historical personal-dev publisher.
# Daily dev publication belongs to nebius-candidate; do not reconcile a second
# release chain on a timer.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-image-release-controller-dev
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile protected dev image publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile exact protected head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/ops/trusted_image_release_controller.py
          --repository "$GITHUB_REPOSITORY"
          --branch dev
          --checkout-head "$GITHUB_SHA"
