name: deploy-environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment."
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: "Already-built Loom image tag or digest suffix to deploy."
        required: true
        type: string
      dry_run:
        description: "Render and audit only; do not apply."
        required: false
        type: boolean
        default: false
      candidate_sha:
        description: "Required for production: dev candidate SHA with successful release gate evidence."
        required: false
        type: string
      release_gate_run_id:
        description: "Required for production: release-promotion-gate workflow run id."
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Deploy development
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'development' &&
        github.ref == 'refs/heads/dev'
      }}
    runs-on: ubuntu-latest
    environment:
      name: development
    env:
      LOOM_KUBECONFIG_B64: ${{ secrets.LOOM_KUBECONFIG_B64 }}
      LOOM_CLUSTER_CONFIG_B64: ${{ secrets.LOOM_CLUSTER_CONFIG_B64 }}
      LOOM_DEPLOY_TOKEN: ${{ secrets.LOOM_DEPLOY_TOKEN }}
      LOOM_DEPLOY_ENVIRONMENT: development
      LOOM_IMAGE_TAG: ${{ inputs.image_tag }}
      LOOM_DRY_RUN: ${{ inputs.dry_run }}
      LOOM_ROLLOUT_EVIDENCE_DIR: rollout-evidence
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Deploy development
        run: bash scripts/ops/deploy_environment.sh
      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-evidence-${{ inputs.environment }}-${{ inputs.image_tag }}
          path: rollout-evidence/
          if-no-files-found: warn

  deploy-staging:
    name: Deploy staging
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'staging' &&
        github.ref == 'refs/heads/dev'
      }}
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      LOOM_KUBECONFIG_B64: ${{ secrets.LOOM_KUBECONFIG_B64 }}
      LOOM_CLUSTER_CONFIG_B64: ${{ secrets.LOOM_CLUSTER_CONFIG_B64 }}
      LOOM_DEPLOY_TOKEN: ${{ secrets.LOOM_DEPLOY_TOKEN }}
      LOOM_DEPLOY_ENVIRONMENT: staging
      LOOM_IMAGE_TAG: ${{ inputs.image_tag }}
      LOOM_DRY_RUN: ${{ inputs.dry_run }}
      LOOM_ROLLOUT_EVIDENCE_DIR: rollout-evidence
      LOOM_ROLLOUT_LOCK_DIR: ${{ vars.LOOM_ROLLOUT_LOCK_DIR }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Deploy staging
        run: bash scripts/ops/deploy_environment.sh
      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-evidence-${{ inputs.environment }}-${{ inputs.image_tag }}
          path: rollout-evidence/
          if-no-files-found: warn

  deploy-production:
    name: Deploy production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'production' &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      LOOM_KUBECONFIG_B64: ${{ secrets.LOOM_KUBECONFIG_B64 }}
      LOOM_CLUSTER_CONFIG_B64: ${{ secrets.LOOM_CLUSTER_CONFIG_B64 }}
      LOOM_DEPLOY_TOKEN: ${{ secrets.LOOM_DEPLOY_TOKEN }}
      LOOM_DEPLOY_ENVIRONMENT: production
      LOOM_IMAGE_TAG: ${{ inputs.image_tag }}
      LOOM_DRY_RUN: ${{ inputs.dry_run }}
      LOOM_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      LOOM_RELEASE_GATE_RUN_ID: ${{ inputs.release_gate_run_id }}
      LOOM_ROLLOUT_EVIDENCE_DIR: rollout-evidence
      LOOM_ROLLOUT_LOCK_DIR: ${{ vars.LOOM_ROLLOUT_LOCK_DIR }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ops/verify_production_release_gate.sh
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Deploy production
        run: bash scripts/ops/deploy_environment.sh
      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-evidence-${{ inputs.environment }}-${{ inputs.image_tag }}
          path: rollout-evidence/
          if-no-files-found: warn
