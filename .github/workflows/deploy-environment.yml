name: deploy-environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment."
        required: true
        type: choice
        options:
          - development
          - production
      image_tag:
        description: "Already-built Loom image tag or digest suffix to deploy."
        required: true
        type: string
      dry_run:
        description: "Render and audit only; do not apply."
        required: false
        type: boolean
        default: false
      candidate_sha:
        description: "Required for production: dev candidate SHA with successful release gate evidence."
        required: false
        type: string
      release_gate_run_id:
        description: "Required for production: release-promotion-gate workflow run id."
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Deploy development
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'development' &&
        github.ref == 'refs/heads/dev'
      }}
    runs-on: ubuntu-latest
    environment:
      name: development
    env:
      LOOM_KUBECONFIG_B64: ${{ secrets.LOOM_KUBECONFIG_B64 }}
      LOOM_CLUSTER_CONFIG_B64: ${{ secrets.LOOM_CLUSTER_CONFIG_B64 }}
      LOOM_DEPLOY_TOKEN: ${{ secrets.LOOM_DEPLOY_TOKEN }}
      LOOM_DEPLOY_ENVIRONMENT: development
      LOOM_IMAGE_TAG: ${{ inputs.image_tag }}
      LOOM_DRY_RUN: ${{ inputs.dry_run }}
      LOOM_ROLLOUT_EVIDENCE_DIR: rollout-evidence
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock
      - name: Deploy development
        run: bash scripts/ops/deploy_environment.sh
      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollout-evidence-${{ inputs.environment }}-${{ inputs.image_tag }}
          path: rollout-evidence/
          if-no-files-found: warn

  deploy-production:
    name: Deploy production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'production' &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      LOOM_KUBECONFIG_B64: ${{ secrets.LOOM_KUBECONFIG_B64 }}
      LOOM_CLUSTER_CONFIG_B64: ${{ secrets.LOOM_CLUSTER_CONFIG_B64 }}
      LOOM_DEPLOY_TOKEN: ${{ secrets.LOOM_DEPLOY_TOKEN }}
      LOOM_DEPLOY_ENVIRONMENT: production
      LOOM_IMAGE_TAG: ${{ inputs.image_tag }}
      LOOM_DRY_RUN: ${{ inputs.dry_run }}
      LOOM_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      LOOM_RELEASE_GATE_RUN_ID: ${{ inputs.release_gate_run_id }}
      LOOM_ROLLOUT_EVIDENCE_DIR: rollout-evidence
      LOOM_ROLLOUT_LOCK_DIR: ${{ vars.LOOM_ROLLOUT_LOCK_DIR }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Verify release gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ops/verify_production_release_gate.sh
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock
      - name: Deploy production
        run: bash scripts/ops/deploy_environment.sh
      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollout-evidence-${{ inputs.environment }}-${{ inputs.image_tag }}
          path: rollout-evidence/
          if-no-files-found: warn
