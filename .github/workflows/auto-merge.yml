name: auto-merge

# This controller runs from the trusted base branch definition and never checks
# out or executes pull-request code. It grants no merge authority itself:
# branch protection still requires every current-head CI gate to succeed.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: enable squash auto-merge
    if: >-
      !github.event.pull_request.draft &&
      (github.event.pull_request.base.ref == 'dev' ||
       (github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge when not already queued
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "invalid pull request number" >&2
            exit 1
          }
          if [[ "$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" \
            --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            echo "Auto-merge is already enabled for PR #${PR_NUMBER}."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash
