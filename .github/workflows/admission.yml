name: admission

# Native pull-request admission. Each validation lane is a reusable workflow
# called from the pull-request head, and this workflow exposes one stable
# GitHub-Actions-owned required check: `admission`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]

concurrency:
  group: admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-validation:
    name: repository validation
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci.yml
    with:
      admission_call: true

  image-validation:
    name: image validation
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/images.yml
    with:
      admission_call: true

  cluster-validation:
    name: cluster validation
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/cluster-smoke.yml
    with:
      admission_call: true

  staging-validation:
    name: staging validation
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/staging-smoke.yml
    with:
      admission_call: true

  admission:
    name: admission
    if: ${{ always() && !github.event.pull_request.draft }}
    needs:
      - repository-validation
      - image-validation
      - cluster-validation
      - staging-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce native validation results
        shell: bash
        env:
          REPOSITORY_RESULT: ${{ needs.repository-validation.result }}
          IMAGE_RESULT: ${{ needs.image-validation.result }}
          CLUSTER_RESULT: ${{ needs.cluster-validation.result }}
          STAGING_RESULT: ${{ needs.staging-validation.result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in REPOSITORY IMAGE CLUSTER STAGING; do
            result_variable="${lane}_RESULT"
            result="${!result_variable}"
            if [[ "$result" != "success" ]]; then
              echo "FAIL: ${lane,,} validation result=${result}" >&2
              failed=1
            fi
          done
          exit "$failed"
