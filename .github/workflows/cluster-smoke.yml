name: cluster-smoke

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('gate=manual / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.sha,
             github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft' ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base == null)) &&
      format('gate=filtered / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha,
             github.event.pull_request.base.sha,
             github.event.pull_request.updated_at,
             github.event.action,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      format('gate=full / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha,
             github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') }}

# Validates the `loom cluster {render, up, status, down}` round-trip
# against a real (kind) Kubernetes API. Catches manifest-schema
# regressions and CLI-integration regressions that golden-file tests
# can't surface.
#
# Scope: this smoke targets the deploy *contract*, not pod readiness.
# We apply manifests with --skip-preflight + --no-wait, then verify:
#   - kubectl accepts every object (schema validation by the API server)
#   - `cluster status --format json` reads back the expected shape
#   - `cluster down --yes` removes every applied object
#
# Pod readiness (loom-* containers actually starting) requires the
# real image set and depends on `images.yml`; that's tracked separately.
#
# Trigger model:
#   - workflow_dispatch (manual)
#   - PRs selected by changed paths or the additive `cluster-smoke` label
#   - push to dev when cluster CLI / templates change

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "src/loom_cli/cluster_cmd.py"
      - "src/loom_cli/cluster_config.py"
      - "src/loom_cli/templates/k8s/**"
      - ".github/workflows/cluster-smoke.yml"
  pull_request:
    # Every relevant non-draft PR reports the protected gate name. The planner
    # selects smoke from changed paths or labels and filters metadata events.
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # Irrelevant metadata runs use a separate pending slot. Otherwise GitHub's
  # one-pending-run rule lets a filtered event evict the authoritative
  # replacement that must follow a canceled full run.
  group: >-
    cluster-smoke-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base != null)) &&
      'authoritative' || 'background'
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
         (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
          contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
         (github.event.action == 'edited' && github.event.changes.base != null)) }}

jobs:
  plan:
    name: cluster smoke plan
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.plan.outputs.cluster_smoke }}
      gate_mode: ${{ steps.plan.outputs.gate_mode }}
      publisher_active: ${{ steps.plan.outputs.publisher_active }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Plan required cluster smoke validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          TRUSTED_PROMOTION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              PR_LABELS_JSON='["cluster-smoke"]'
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --github-output "$GITHUB_OUTPUT"
          publisher_active=false
          if [[ "$TRUSTED_PROMOTION" == "true" ]]; then
            publisher_active=true
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${BASE_SHA}^{tree}"
            if git cat-file -e \
              "${BASE_SHA}:.github/workflows/authoritative-gates.yml" 2>/dev/null; then
              publisher_active=true
            fi
          fi
          printf 'publisher_active=%s\n' "$publisher_active" >> "$GITHUB_OUTPUT"

  smoke:
    name: kind smoke (render → apply → status → down)
    needs: plan
    if: >-
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install kind
        run: |
          curl -sSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind --version

      - name: Install kubectl
        run: |
          curl -sSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -s -L https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Sync python deps (with [dev], [cluster], and [rollout] extras)
        run: |
          uv python install 3.11
          uv sync --locked --all-packages --extra dev --extra cluster --extra rollout --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned cluster smoke lane
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_paths < <(
            uv run --no-sync python scripts/component_ownership.py test-paths --lane cluster-smoke
          )
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest "${test_paths[@]}"

      - name: Create kind cluster
        run: |
          kind create cluster --name loom-smoke --wait 60s
          kubectl --context kind-loom-smoke cluster-info

      - name: Create loom namespace + required Secrets
        # Bootstrap loom-secrets from schema via `loom cluster bootstrap-secrets`.
        # --smoke-defaults substitutes test-grade placeholder values for every
        # secret key declared in config/loom-schema.toml, so the Secret always
        # covers the full key set even as new entries are added to the schema.
        # kind sets the current kubeconfig context to kind-loom-smoke, so the
        # generated kubectl command targets the right cluster without --context.
        run: |
          set -e
          kubectl --context kind-loom-smoke create namespace loom
          eval "$(uv run --no-sync loom cluster bootstrap-secrets --namespace=loom --smoke-defaults)"
          printf '[admin]\ntoken="smoke"\n' > /tmp/admin-secrets.toml
          kubectl --context kind-loom-smoke -n loom create secret generic loom-admin-secret \
            --from-file=secrets.toml=/tmp/admin-secrets.toml

      - name: loom cluster render — manifests parse + match schema
        run: |
          uv run --no-sync python -m loom_cli cluster render > /tmp/manifests.yaml
          wc -l /tmp/manifests.yaml
          # Server-side dry-run validates schema against the live API.
          kubectl --context kind-loom-smoke -n loom apply \
            --dry-run=server -f /tmp/manifests.yaml

      - name: loom cluster audit — public/internal boundary check
        # Static check: no LoadBalancer/NodePort Services, Ingress
        # backends on the allowlist, no hostPort declarations. Runs
        # before apply so a boundary regression fails fast (#77).
        run: uv run --no-sync python -m loom_cli cluster audit

      - name: loom cluster up — apply, skip preflight + wait
        # --skip-preflight: dummy Secrets pass preflight but the smoke
        # doesn't depend on it; --no-wait: pods can't reach Ready
        # without the real images, and we're testing the apply
        # contract, not pod readiness.
        run: |
          uv run --no-sync python -m loom_cli cluster up \
            --context kind-loom-smoke --namespace loom \
            --skip-preflight --no-wait

      - name: Verify expected workloads exist
        run: |
          set -e
          kubectl --context kind-loom-smoke -n loom get deploy,sts,ds,svc,ingress
          # Platform services must always be present regardless of profile.
          kubectl --context kind-loom-smoke -n loom get deploy loom-service
          kubectl --context kind-loom-smoke -n loom get deploy loom-control-plane
          kubectl --context kind-loom-smoke -n loom get sts loom-postgres

          # loom-worker is conditional on k8s_worker.enabled in the
          # profile that was rendered. #383 flipped the schema default
          # to false; check whichever shape got rendered so the smoke
          # test doesn't false-fail when the worker Deployment is
          # legitimately absent (staging/production) and doesn't
          # false-pass when it's legitimately present (development).
          if grep -Fq "name: loom-worker" /tmp/manifests.yaml; then
            echo "manifest includes loom-worker → verifying it exists in cluster"
            kubectl --context kind-loom-smoke -n loom get deploy loom-worker
          else
            echo "manifest omits loom-worker (k8s_worker.enabled=false) → verifying absence"
            if kubectl --context kind-loom-smoke -n loom get deploy loom-worker 2>/dev/null; then
              echo "FAIL: loom-worker Deployment exists in cluster but was not in the rendered manifest" >&2
              exit 1
            fi
            echo "PASS: loom-worker correctly absent"
          fi

      - name: loom cluster status --format json
        run: |
          uv run --no-sync python -m loom_cli cluster status \
            --context kind-loom-smoke --namespace loom \
            --format json | tee /tmp/status.json
          # Sanity: the JSON shape carries the components list with
          # known names.
          python -c '
          import json, os, sys
          d = json.load(open("/tmp/status.json"))
          names = {c["name"] for c in d["components"]}
          # Components that must be present regardless of profile.
          expected = {
              "loom-service", "loom-control-plane", "loom-llm-gateway",
              "loom-web", "postgres", "minio",
          }
          # loom-worker only expected when the rendered manifest
          # included it (#383 made it conditional on
          # k8s_worker.enabled).
          manifest = open("/tmp/manifests.yaml").read()
          if "name: loom-worker" in manifest:
              expected.add("loom-worker")
          missing = expected - names
          if missing:
              print(f"FAIL: status missing components: {sorted(missing)}",
                    file=sys.stderr)
              sys.exit(1)
          print(f"PASS: status reported {len(names)} components, "
                f"including {sorted(expected)}")
          '

      - name: loom cluster down --yes
        run: |
          uv run --no-sync python -m loom_cli cluster down \
            --context kind-loom-smoke --namespace loom --yes

      - name: Verify teardown
        run: |
          # All deployments + statefulsets + daemonsets gone.
          for kind in deploy sts ds; do
            count=$(kubectl --context kind-loom-smoke -n loom get $kind \
              -o name 2>/dev/null | wc -l)
            if [ "$count" != "0" ]; then
              echo "FAIL: $kind still present after down ($count items)" >&2
              kubectl --context kind-loom-smoke -n loom get $kind
              exit 1
            fi
          done
          echo "PASS: namespace empty after down"

      - name: Cleanup kind
        if: always()
        run: kind delete cluster --name loom-smoke

  cluster-smoke-gate:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && 'cluster-smoke-gate-manual' ||
          github.event_name == 'push' && 'cluster-smoke-gate-push' ||
          needs.plan.outputs.gate_mode == 'full' &&
          needs.plan.outputs.publisher_active == 'false' &&
          'cluster-smoke-gate' ||
          needs.plan.outputs.gate_mode == 'full' && 'cluster-smoke-gate-attempt' ||
          'cluster-smoke-gate-filtered' }}
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, smoke]
    steps:
      - name: Enforce selected cluster smoke result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_MODE: ${{ needs.plan.outputs.gate_mode }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          if [[ "$GATE_MODE" == "filtered" ]]; then
            [[ "$SMOKE_RESULT" == "skipped" ]] || exit 1
            exit 0
          fi
          case "$REQUIRED" in
            true|false) ;;
            *) echo "FAIL: invalid planner boolean required=${REQUIRED@Q}" >&2; exit 1 ;;
          esac
          if [[ "$REQUIRED" == "true" ]]; then
            [[ "$SMOKE_RESULT" == "success" ]] || exit 1
          else
            [[ "$SMOKE_RESULT" == "skipped" || "$SMOKE_RESULT" == "success" ]] || exit 1
          fi
