name: cluster-smoke

# Credential-free Nebius Kubernetes execution and rendering contracts.
# Selection and admission are owned by the calling CI workflow.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cluster-contract:
    name: Nebius Kubernetes execution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LOOM_RUN_DISPOSABLE_K3S: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Sync cluster-contract dependencies
        run: |
          uv python install 3.11
          uv sync --locked --all-packages --extra dev --extra cluster --python 3.11
          uv pip check --python .venv/bin/python

      - name: Verify disposable Docker engine
        run: docker info

      - name: Verify manifest-owned Nebius Kubernetes contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_paths < <(
            uv run --no-sync python scripts/component_ownership.py test-paths --lane cluster-smoke
          )
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest -m "not legacy_pool" "${test_paths[@]}"
