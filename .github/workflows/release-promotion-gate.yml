name: release-promotion-gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "40-character SHA from dev being promoted."
        required: true
        type: string
      image_tag:
        description: "Already-built image tag or digest suffix deployed to staging."
        required: true
        type: string
      evidence_manifest_b64:
        description: "Base64-encoded release gate evidence JSON manifest."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promotion-gate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      IMAGE_SELECTOR: ${{ inputs.image_tag }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'error: candidate_sha must be exactly 40 lowercase hexadecimal characters\n' >&2
            exit 1
          fi

          tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          digest_pattern='^sha256:[0-9a-f]{64}$'
          if [[ ! "${IMAGE_SELECTOR}" =~ ${tag_pattern} ]] && \
             [[ ! "${IMAGE_SELECTOR}" =~ ${digest_pattern} ]]; then
            printf 'error: image selector must be a safe OCI tag or sha256 digest\n' >&2
            exit 1
          fi

  release-gate:
    name: Release promotion gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      IMAGE_SELECTOR: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Assert candidate checkout identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${CANDIDATE_SHA}" ]]; then
            printf 'error: checked out HEAD does not match validated candidate_sha\n' >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync release gate dependencies
        run: uv sync --extra cluster --extra rollout --extra dev --python 3.11

      - name: Decode release evidence manifest
        env:
          EVIDENCE_MANIFEST_B64: ${{ inputs.evidence_manifest_b64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["EVIDENCE_MANIFEST_B64"].strip()
          Path("release-gate-input.json").write_bytes(base64.b64decode(raw, validate=True))
          PY

      - name: Validate environment isolation policy
        run: |
          uv run python scripts/validate_environment_isolation.py \
            --profiles-dir deploy/environments \
            --workflow .github/workflows/deploy-environment.yml

      - name: Render and audit staging manifests
        run: |
          uv run loom cluster render \
            --config deploy/environments/staging.cluster.toml \
            > staging-rendered.yaml
          uv run loom cluster audit \
            --config deploy/environments/staging.cluster.toml

      - name: Render and audit production manifests
        run: |
          uv run loom cluster render \
            --config deploy/environments/production.cluster.toml \
            > production-rendered.yaml
          uv run loom cluster audit \
            --config deploy/environments/production.cluster.toml

      - name: Validate release gate evidence
        run: |
          python3 scripts/ops/release_gate.py validate \
            --manifest release-gate-input.json \
            --candidate-sha "${CANDIDATE_SHA}" \
            --image-tag "${IMAGE_SELECTOR}" \
            --output-json release-gate-evidence.json \
            --output-markdown release-gate-evidence.md
          cat release-gate-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify official evidence round trip
        run: |
          python3 scripts/ops/release_gate.py verify-production \
            --manifest release-gate-evidence.json \
            --candidate-sha "${CANDIDATE_SHA}" \
            --image-tag "${IMAGE_SELECTOR}"

      - name: Upload release gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-evidence
          path: |
            release-gate-evidence.json
            release-gate-evidence.md
            release-gate-input.json
            staging-rendered.yaml
            production-rendered.yaml
          if-no-files-found: error
