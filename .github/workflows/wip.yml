# Placeholder workflow during Loom buildout.
#
# Real CI ships in Plan 7 Task 15 (deploy/ + .github/workflows/ rewrite).
# Until then this workflow exists only so the GitHub UI shows a passing
# state on PRs and pushes — the original ci.yml / release.yml / deploy.yml
# are archived under legacy/github/workflows/ for reference.
name: WIP — Loom buildout

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  wip-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "Loom is being rebuilt. See docs/plans/ for the roadmap."
          echo "Real CI lands with Plan 7 Task 15."
