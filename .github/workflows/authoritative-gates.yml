# publisher-contract: dynamic-run-name-v3
name: authoritative-gates
run-name: >-
  publisher-metrics-v1
  trigger=${{ github.event_name }}
  source_workflow=${{ github.event.workflow_run.workflow_id || 0 }}
  source_run=${{ github.event.workflow_run.id || 0 }}
  source_attempt=${{ github.event.workflow_run.run_attempt || 0 }}
  delivery=${{ github.event.action }}
  pull=${{ github.event.pull_request.number || 0 }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  workflow_run:
    workflows: [CI, images, cluster-smoke, staging-smoke]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  checks: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  # CheckRuns created with the workflow token attach to this workflow's first
  # GitHub Actions check suite for the head. Keep that suite successful even
  # when a Draft PR intentionally filters every publisher matrix job.
  suite-anchor:
    name: keep authoritative publisher suite successful
    if: github.event_name == 'pull_request_target'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Complete trusted PR suite
        run: ":"

  publish:
    name: publish authoritative gate (${{ matrix.context }})
    if: >-
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event) &&
       contains(fromJSON('[302898379,302898384,302898381,302898388]'),
                github.event.workflow_run.workflow_id) &&
       (github.event.action != 'in_progress' ||
        github.event.workflow_run.run_attempt > 1)) ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'converted_to_draft' ||
        (!github.event.pull_request.draft &&
         (contains(fromJSON('["opened","reopened","ready_for_review","synchronize"]'), github.event.action) ||
          (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
           contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
          (github.event.action == 'edited' && github.event.changes.base != null)))))
    strategy:
      fail-fast: false
      matrix:
        context: >-
          ${{ fromJSON(
            github.event_name == 'pull_request_target' &&
              '["repository-checks","images-gate","cluster-smoke-gate","staging-smoke-gate"]' ||
            github.event.workflow_run.workflow_id == 302898379 && '["repository-checks"]' ||
            github.event.workflow_run.workflow_id == 302898384 && '["images-gate"]' ||
            github.event.workflow_run.workflow_id == 302898381 && '["cluster-smoke-gate"]' ||
            github.event.workflow_run.workflow_id == 302898388 && '["staging-smoke-gate"]' ||
            '["invalid"]') }}
    concurrency:
      group: >-
        authoritative-gate-publisher-${{ matrix.context }}-${{
          github.event.pull_request.head.sha ||
          github.event.workflow_run.head_sha ||
          github.run_id
        }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish authoritative gate state
        env:
          AUTHORITATIVE_CONTEXT: ${{ matrix.context }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ops/authoritative_gate.py
          --event-path "$GITHUB_EVENT_PATH"
          --context "$AUTHORITATIVE_CONTEXT"
