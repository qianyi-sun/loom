# publisher-contract: dynamic-run-name-v2
name: authoritative-gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  workflow_run:
    workflows: [CI, images, cluster-smoke, staging-smoke]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  checks: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  publish:
    name: publish authoritative gate (${{ matrix.context }})
    if: >-
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["pull_request","merge_group"]'), github.event.workflow_run.event) &&
       contains(fromJSON('[302898379,302898384,302898381,302898388]'),
                github.event.workflow_run.workflow_id)) ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'converted_to_draft' ||
        (!github.event.pull_request.draft &&
         (contains(fromJSON('["opened","reopened","ready_for_review","synchronize"]'), github.event.action) ||
          (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
           contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
          (github.event.action == 'edited' && github.event.changes.base != null)))))
    strategy:
      fail-fast: false
      matrix:
        context: >-
          ${{ fromJSON(
            github.event_name == 'pull_request_target' &&
              '["repository-checks","images-gate","cluster-smoke-gate","staging-smoke-gate"]' ||
            github.event.workflow_run.workflow_id == 302898379 && '["repository-checks"]' ||
            github.event.workflow_run.workflow_id == 302898384 && '["images-gate"]' ||
            github.event.workflow_run.workflow_id == 302898381 && '["cluster-smoke-gate"]' ||
            github.event.workflow_run.workflow_id == 302898388 && '["staging-smoke-gate"]' ||
            '["invalid"]') }}
    concurrency:
      group: >-
        authoritative-gates-${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_sha ||
          github.event.pull_request.head.sha }}-${{ matrix.context }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish authoritative gate state
        env:
          AUTHORITATIVE_CONTEXT: ${{ matrix.context }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ops/authoritative_gate.py
          --event-path "$GITHUB_EVENT_PATH"
          --context "$AUTHORITATIVE_CONTEXT"
