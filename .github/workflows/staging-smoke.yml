name: staging-smoke

# Disposable application lifecycle smoke; no live environment credentials.
# Selection and admission are owned by the calling CI workflow.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  system-smoke:
    name: manifest-owned system smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Sync system-smoke dependencies
        run: |
          uv python install 3.11
          uv sync --locked --all-packages --extra dev --extra cluster --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned system smoke lane
        shell: bash
        env:
          LOOM_SYSTEM_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/system-smoke-compose.log
        run: |
          set -euo pipefail
          mapfile -t test_paths < <(
            uv run --no-sync python scripts/component_ownership.py test-paths --lane system-smoke
          )
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest -m "not legacy_pool" --timeout=1200 "${test_paths[@]}"

      - name: Show system-smoke compose diagnostics
        if: failure()
        env:
          LOOM_SYSTEM_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/system-smoke-compose.log
          LOOM_WORKER_TOKEN: unused-diagnostics-token
        run: |
          if [[ ! -s "${LOOM_SYSTEM_SMOKE_DIAGNOSTICS}" ]]; then
            echo "fixture diagnostics missing; capturing remaining Compose state" >&2
            # The helper captures the equivalent of
            # `--profile worker --profile task-image-builder logs
            # --no-color --tail=300` and redacts it before writing to
            # runner.temp.
            uv run --no-sync python -c \
              'from tests.system.docker_compose import preserve_compose_diagnostics; preserve_compose_diagnostics()' \
              || true
          fi
          if [[ -s "${LOOM_SYSTEM_SMOKE_DIAGNOSTICS}" ]]; then
            cat "${LOOM_SYSTEM_SMOKE_DIAGNOSTICS}"
          else
            echo "system-smoke diagnostics unavailable" >&2
          fi

      - name: Cleanup system-smoke compose stack
        if: always()
        env:
          LOOM_WORKER_TOKEN: unused-cleanup-token
          LOOM_TASK_IMAGE_BUILDER_TOKEN: unused-cleanup-builder-token
        run: |
          timeout 60s docker compose -f deploy/docker-compose.test.yml \
            --profile worker --profile task-image-builder \
            down -v --remove-orphans
