name: staging-smoke

# Closes step 1-3 + 12 of the manual staging smoke gate in
# docs/operator-runbook.md by automating the deploy-and-verify
# round-trip with REAL images. Where the kind smoke (#107) uses
# `loom cluster up --no-wait` against unbuilt images, this workflow
# builds the five loom images, loads them into kind, runs
# `loom cluster up` WITHOUT --no-wait, waits for every pod to
# reach Ready, and probes the /healthz + /metrics endpoints.
#
# Steps 4-11 (trial submission against a provider, trajectory +
# ATIF download) still require either a real provider key or a
# mock OpenAI server. Mock-server work is a follow-up — this
# automation closes the deploy-readiness gap, which is the
# longest-running and most-likely-to-regress part of the smoke.
#
# Trigger model:
#   - workflow_dispatch (manual)
#   - PRs labelled `staging-smoke` (gated; full smoke is slow)
#
# Expected runtime: ~15-20 min (5 image builds + kind boot + apply
# + wait-for-ready).

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  smoke:
    name: kind staging smoke (build images → cluster up → verify ready)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'staging-smoke'))
    runs-on: ubuntu-latest
    # 5 image builds (uncached) + kind boot + ingress-nginx + apply +
    # wait-for-ready easily run 30-40 min on a cold runner. 45 leaves
    # headroom for the wait step's worst case.
    timeout-minutes: 45
    env:
      IMAGE_TAG: smoke-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Install kind + kubectl
        run: |
          curl -sSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl -sSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -s -L https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kind --version && kubectl version --client=true

      - name: Install uv + sync deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync python deps (with [cluster] extra)
        # Pin Python 3.11 to match what the loom Dockerfiles use
        # (python:3.11-slim). ubuntu-latest defaults to Python 3.12,
        # which can hit "no wheel for current platform" on pinned
        # transitive deps that haven't shipped 3.12 wheels.
        run: |
          uv python install 3.11
          uv sync --extra cluster --python 3.11

      - name: Build images (parallel)
        # Build all 5 loom images in parallel. Each gets the smoke
        # run-id as its tag so concurrent runs on the same daemon
        # don't collide. The Dockerfile names (control-plane,
        # gateway, service, worker, web) don't match the image names
        # (loom-control-plane, loom-llm-gateway, loom-service,
        # loom-worker, loom-web) one-to-one — `gateway` Dockerfile
        # produces `loom-llm-gateway`. Image names MUST match what
        # the k8s templates reference.
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=1
          # (dockerfile-suffix, image-name) pairs.
          builds=(
            "control-plane:loom-control-plane"
            "gateway:loom-llm-gateway"
            "service:loom-service"
            "worker:loom-worker"
            "web:loom-web"
          )
          pids=()
          for pair in "${builds[@]}"; do
            suffix="${pair%%:*}"
            image_name="${pair##*:}"
            image="${image_name}:${IMAGE_TAG}"
            (
              echo "::group::Build ${image}"
              docker build -f "deploy/Dockerfile.${suffix}" \
                -t "${image}" . 2>&1 | sed "s/^/[${suffix}] /"
              echo "::endgroup::"
            ) &
            pids+=($!)
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=$?
          done
          exit "$rc"

      - name: Create kind cluster
        # The ingress-nginx kind manifest pins its controller pod to
        # nodes with `ingress-ready=true`. Without this kind config
        # the controller pod sits Pending forever. extraPortMappings
        # let the host reach the controller on 80/443.
        run: |
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - { containerPort: 80,  hostPort: 80,  protocol: TCP }
                - { containerPort: 443, hostPort: 443, protocol: TCP }
          EOF
          kind create cluster --name loom-staging \
            --config /tmp/kind-config.yaml --wait 60s
          kubectl --context kind-loom-staging cluster-info

      - name: Install ingress-nginx (so preflight's IngressClass check passes)
        # Kind doesn't ship with an ingress controller; preflight
        # would fail without one. Install the standard ingress-nginx
        # for kind. Wait for the controller pod + IngressClass to
        # land before continuing.
        run: |
          kubectl --context kind-loom-staging apply -f \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/kind/deploy.yaml
          # The kind manifest creates a Job + Deployment + IngressClass.
          # IngressClass appears almost immediately, but the controller
          # pod takes ~30s to become Ready.
          kubectl --context kind-loom-staging wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Load images into kind
        # `kind load docker-image` copies the image from the host's
        # Docker daemon into kind's containerd. Without this, pods
        # would fail to pull (kind has no registry config for
        # `loom-*:smoke-*` tags).
        run: |
          for image_name in loom-control-plane loom-llm-gateway loom-service loom-worker loom-web; do
            kind load docker-image "${image_name}:${IMAGE_TAG}" \
              --name loom-staging
          done

      - name: Bootstrap namespace + Secrets
        # Bootstrap loom-secrets from schema via `loom cluster bootstrap-secrets`.
        # --smoke-defaults covers every key declared in config/loom-schema.toml
        # with test-grade placeholders. kind sets the current kubeconfig context
        # to kind-loom-staging after cluster creation, so the generated kubectl
        # command targets the right cluster without an explicit --context flag.
        run: |
          set -e
          kubectl --context kind-loom-staging create namespace loom
          ADMIN_TOKEN="loom_admin_$(openssl rand -hex 24)"
          echo "::add-mask::${ADMIN_TOKEN}"
          echo "ADMIN_TOKEN=${ADMIN_TOKEN}" >> "$GITHUB_ENV"

          eval "$(uv run loom cluster bootstrap-secrets --namespace=loom --smoke-defaults)"

          printf '[admin]\ntoken="%s"\n' "${ADMIN_TOKEN}" > /tmp/admin.toml
          kubectl --context kind-loom-staging -n loom create secret generic loom-admin-secret \
            --from-file=secrets.toml=/tmp/admin.toml

      - name: Generate cluster-config.toml
        # image_tag must match what we built + loaded above.
        # worker = 0 because the worker template needs hostPath
        # /var/run/docker.sock for the sandbox-Docker driver, and
        # kind nodes don't expose the host docker socket (kind runs
        # inside a container itself). Real worker readiness is a
        # production-only concern; the smoke verifies the other 4
        # components + gateway-router DaemonSet.
        run: |
          cat > /tmp/cluster-config.toml <<EOF
          namespace = "loom"
          image_tag = "${IMAGE_TAG}"
          ingress_host = "loom.staging.example"
          [replicas]
          service = 1
          control_plane = 1
          gateway = 1
          web = 1
          worker = 0
          EOF

      - name: loom cluster preflight
        # All required secrets exist; storage + ingress class are
        # available via kind's default CNI + storage provisioner.
        run: |
          uv run python -m loom_cli cluster preflight \
            --context kind-loom-staging --namespace loom

      - name: loom cluster audit
        # Boundary check on the rendered manifests before apply.
        run: |
          uv run python -m loom_cli cluster audit \
            --config /tmp/cluster-config.toml

      - name: loom cluster up (apply, no-wait)
        # Apply manifests but return immediately. Postgres needs to
        # be Ready before we can apply migrations, and the long-
        # running services (CP, gateway, service) refuse to start
        # until Alembic head is reached. We orchestrate the sequence
        # explicitly below.
        run: |
          uv run python -m loom_cli cluster up \
            --context kind-loom-staging --namespace loom \
            --config /tmp/cluster-config.toml \
            --skip-preflight --no-wait

      - name: Wait for Postgres + MinIO Ready
        # Infrastructure StatefulSets with no DB dependency of their
        # own; reach Ready within 1-2 min of cold-start.
        run: |
          set -euo pipefail
          kubectl --context kind-loom-staging -n loom wait \
            --for=condition=Ready pod/loom-postgres-0 --timeout=180s
          kubectl --context kind-loom-staging -n loom wait \
            --for=condition=Ready pod/loom-minio-0 --timeout=180s

      - name: Apply Alembic migrations
        # Services validate `schema at head` and refuse to start
        # otherwise (`loom.db.schema_startup`). `loom service up`
        # does dev auto-migration; `loom cluster up` doesn't because
        # production migration is an explicit operator action. We
        # run alembic against the live Postgres via port-forward;
        # each role-scoped DB URL (cp-db-url, gw-db-url, svc-db-url)
        # points at the same Postgres + a different database name
        # set by the smoke-defaults secrets.
        run: |
          set -euo pipefail
          kubectl --context kind-loom-staging -n loom port-forward \
            svc/loom-postgres 15432:5432 &
          PF_PID=$!
          trap "kill ${PF_PID} 2>/dev/null || true" EXIT
          sleep 3

          for key in cp-db-url gw-db-url svc-db-url; do
            DB_URL=$(kubectl --context kind-loom-staging -n loom \
              get secret loom-secrets \
              -o jsonpath="{.data.${key}}" | base64 -d)
            # Rewrite host:port to localhost:15432 so local alembic
            # can reach the cluster Postgres via the port-forward.
            LOCAL_DB_URL=$(echo "${DB_URL}" \
              | sed -E 's#@[^/]+/#@localhost:15432/#')
            echo "::add-mask::${LOCAL_DB_URL}"
            echo "::group::alembic upgrade head for ${key}"
            LOOM_DB_URL="${LOCAL_DB_URL}" uv run alembic \
              -c migrations/alembic.ini upgrade head
            echo "::endgroup::"
          done

      - name: loom cluster up (wait for components Ready)
        # Now that migrations are applied, the services come up
        # cleanly. Re-invoke `loom cluster up` to use its
        # wait-for-ready loop (apply is idempotent — kubectl apply
        # is a no-op when manifests are unchanged).
        run: |
          uv run python -m loom_cli cluster up \
            --context kind-loom-staging --namespace loom \
            --config /tmp/cluster-config.toml \
            --skip-preflight \
            --timeout 600 --poll-interval 5

      - name: loom cluster status
        run: |
          uv run python -m loom_cli cluster status \
            --context kind-loom-staging --namespace loom \
            --format table

      - name: Verify /healthz on every service via port-forward
        # Probe each service's /healthz from a temporary port-forward.
        # If any returns non-200, dump pod logs + fail.
        run: |
          set -euo pipefail
          # local_port:svc:svc_port:path. Use local ports >= 18080 to
          # avoid colliding with host services bound by kind's
          # extraPortMappings (e.g. ingress-nginx on 80/443).
          for spec in \
              "18080:loom-control-plane:8080:/healthz" \
              "19100:loom-llm-gateway:9100:/healthz" \
              "18090:loom-service:8090:/api/v1/health" \
              "18000:loom-web:80:/" ; do
            local_port=$(echo "$spec" | cut -d: -f1)
            svc=$(echo "$spec" | cut -d: -f2)
            svc_port=$(echo "$spec" | cut -d: -f3)
            path=$(echo "$spec" | cut -d: -f4-)
            echo "::group::probe ${svc}${path}"
            kubectl --context kind-loom-staging -n loom port-forward \
              "svc/${svc}" "${local_port}:${svc_port}" &
            pf_pid=$!
            sleep 3
            if ! curl -fsS --max-time 10 "http://localhost:${local_port}${path}"; then
              echo "::error::probe failed for ${svc}${path}"
              kubectl --context kind-loom-staging -n loom logs \
                "-l" "app=${svc}" --tail=200
              kill $pf_pid 2>/dev/null || true
              exit 1
            fi
            kill $pf_pid 2>/dev/null || true
            wait $pf_pid 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Verify /metrics on every service
        # /metrics is the prometheus-client endpoint shipped in
        # #81 slice B-1..B-4. A successful scrape proves the
        # observability surface is wired end-to-end.
        run: |
          set -euo pipefail
          for spec in \
              "18080:loom-control-plane:8080" \
              "19100:loom-llm-gateway:9100" \
              "18090:loom-service:8090" ; do
            local_port=$(echo "$spec" | cut -d: -f1)
            svc=$(echo "$spec" | cut -d: -f2)
            svc_port=$(echo "$spec" | cut -d: -f3)
            echo "::group::scrape ${svc}/metrics"
            kubectl --context kind-loom-staging -n loom port-forward \
              "svc/${svc}" "${local_port}:${svc_port}" &
            pf_pid=$!
            sleep 3
            # `-L` to follow the 307 from prometheus_client's mounted
            # ASGI app (`/metrics` → `/metrics/`).
            body=$(curl -fsSL --max-time 10 "http://localhost:${local_port}/metrics" || echo "FAILED")
            if [ "$body" = "FAILED" ] || ! echo "$body" | grep -q "^# HELP "; then
              echo "::error::no prometheus output from ${svc}/metrics"
              echo "first 500 chars: ${body:0:500}"
              kill $pf_pid 2>/dev/null || true
              exit 1
            fi
            echo "OK — first metric: $(echo "$body" | grep '^# HELP' | head -1)"
            kill $pf_pid 2>/dev/null || true
            wait $pf_pid 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Verify storage lifecycle round-trip against real MinIO
        # Closes #230. Exercises the entire pipeline end-to-end:
        # CLI subcommand → boto3 → real MinIO → boto3 read-back → doctor
        # diff. The unit tests for the renderer pass against a stub S3
        # client; this step is the only thing that catches a wire-
        # format mismatch (boto3 vs MinIO).
        #
        # 1. Pull MinIO creds from the live Secret bootstrapped above
        #    (--smoke-defaults values, so deterministic).
        # 2. Pre-create the three reference buckets (MinIO doesn't
        #    auto-create on PUT; production buckets are created by
        #    loom_service at startup, but we want lifecycle apply to
        #    succeed even on a fresh cluster).
        # 3. Apply the example storage-lifecycle.toml.
        # 4. doctor --storage-lifecycle-config should exit 0.
        # 5. Re-apply (idempotency); doctor still exit 0.
        # 6. Tamper: drop a rule out-of-band; doctor should exit 1 and
        #    name the missing rule.
        run: |
          set -euo pipefail

          ACCESS_KEY=$(kubectl --context kind-loom-staging -n loom \
            get secret loom-secrets \
            -o jsonpath='{.data.minio-access-key}' | base64 -d)
          SECRET_KEY=$(kubectl --context kind-loom-staging -n loom \
            get secret loom-secrets \
            -o jsonpath='{.data.minio-secret-key}' | base64 -d)
          export LOOM_SVC_MINIO_ACCESS_KEY="${ACCESS_KEY}"
          export LOOM_SVC_MINIO_SECRET_KEY="${SECRET_KEY}"
          echo "::add-mask::${ACCESS_KEY}"
          echo "::add-mask::${SECRET_KEY}"

          kubectl --context kind-loom-staging -n loom port-forward \
            svc/loom-minio 19000:9000 &
          PF_PID=$!
          trap "kill ${PF_PID} 2>/dev/null || true" EXIT
          sleep 3

          export LOOM_SVC_MINIO_ENDPOINT="http://localhost:19000"

          # Pre-create reference buckets so apply has somewhere to land.
          for bucket in trajectories artifacts atif; do
            uv run python -c "
          import os, boto3
          from botocore.config import Config
          s3 = boto3.client(
              's3', endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region_name='us-east-1',
              config=Config(signature_version='s3v4'),
          )
          try:
              s3.create_bucket(Bucket='${bucket}')
          except s3.exceptions.BucketAlreadyOwnedByYou:
              pass
          "
          done

          echo "::group::dry-run apply"
          uv run loom cluster bootstrap-storage-lifecycle \
            --config config/storage-lifecycle.example.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}" --dry-run
          echo "::endgroup::"

          echo "::group::first apply"
          uv run loom cluster bootstrap-storage-lifecycle \
            --config config/storage-lifecycle.example.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          echo "::endgroup::"

          echo "::group::doctor after first apply (must exit 0)"
          uv run loom cluster doctor \
            --context kind-loom-staging --namespace loom \
            --storage-lifecycle-config config/storage-lifecycle.example.toml \
            --storage-lifecycle-endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          echo "::endgroup::"

          echo "::group::second apply (idempotency check)"
          uv run loom cluster bootstrap-storage-lifecycle \
            --config config/storage-lifecycle.example.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          uv run loom cluster doctor \
            --context kind-loom-staging --namespace loom \
            --storage-lifecycle-config config/storage-lifecycle.example.toml \
            --storage-lifecycle-endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          echo "::endgroup::"

          echo "::group::tamper: remove trajectories lifecycle, doctor must fail"
          uv run python -c "
          import os, boto3
          from botocore.config import Config
          s3 = boto3.client(
              's3', endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region_name='us-east-1',
              config=Config(signature_version='s3v4'),
          )
          s3.delete_bucket_lifecycle(Bucket='trajectories')
          "
          if uv run loom cluster doctor \
               --context kind-loom-staging --namespace loom \
               --storage-lifecycle-config config/storage-lifecycle.example.toml \
               --storage-lifecycle-endpoint "${LOOM_SVC_MINIO_ENDPOINT}"; then
            echo "::error::doctor should have FAILED after removing lifecycle, but it passed"
            exit 1
          fi
          echo "doctor correctly reported drift after tamper"
          echo "::endgroup::"

          echo "::group::heal: re-apply, doctor should exit 0 again"
          uv run loom cluster bootstrap-storage-lifecycle \
            --config config/storage-lifecycle.example.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          uv run loom cluster doctor \
            --context kind-loom-staging --namespace loom \
            --storage-lifecycle-config config/storage-lifecycle.example.toml \
            --storage-lifecycle-endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          echo "::endgroup::"

      - name: Capture pod state on success (for reference)
        if: success()
        run: |
          kubectl --context kind-loom-staging -n loom get all
          kubectl --context kind-loom-staging -n loom describe pods \
            | head -200

      - name: Capture pod state + logs on failure
        if: failure()
        run: |
          kubectl --context kind-loom-staging -n loom get all
          kubectl --context kind-loom-staging -n loom describe pods
          for component in control-plane llm-gateway service worker web; do
            echo "::group::logs ${component}"
            kubectl --context kind-loom-staging -n loom logs \
              "-l" "app=loom-${component}" --tail=200 --previous \
              2>/dev/null || true
            kubectl --context kind-loom-staging -n loom logs \
              "-l" "app=loom-${component}" --tail=200 \
              2>/dev/null || true
            echo "::endgroup::"
          done

      - name: loom cluster down --yes
        if: always()
        run: |
          uv run python -m loom_cli cluster down \
            --context kind-loom-staging --namespace loom --yes \
            || true

      - name: Cleanup kind
        if: always()
        run: kind delete cluster --name loom-staging || true

  # ────────────────────────────────────────────────────────────────
  # Storage lifecycle smoke against REAL AWS S3.
  #
  # Closes #253. Same shape as the MinIO round-trip step inside the
  # `smoke` job above, but points at a real bucket in AWS. Catches
  # AWS-specific wire-format quirks that the MinIO smoke can't (S3
  # honors `AbortIncompleteMultipartUpload` where MinIO drops it,
  # returns real `NoSuchLifecycleConfiguration` codes, etc.).
  #
  # Credentials + bucket + region come from the `ci-aws` GitHub
  # Environment secrets (repo admin adds them once; the job pulls
  # them via the `environment:` binding below, which is what makes
  # them available to `${{ secrets.* }}`).
  #
  # Runs on the same `staging-smoke` label trigger as the MinIO smoke
  # so a PR that touches storage code exercises both backends in one
  # go. Skips silently on PRs without the label.
  # ────────────────────────────────────────────────────────────────
  smoke-storage-aws-s3:
    name: storage smoke (real AWS S3)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'staging-smoke'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci-aws
    env:
      # storage_backend + auth_kind wire the bootstrap subcommand into
      # its S3-compatible / static-keys paths against the real AWS
      # endpoint. Region + bucket come from the environment secrets so
      # the workflow file doesn't leak the account number.
      LOOM_SVC_STORAGE_BACKEND: s3
      LOOM_SVC_STORAGE_AUTH_KIND: static_keys
      LOOM_SVC_MINIO_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
      LOOM_SVC_MINIO_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      LOOM_SVC_MINIO_REGION: ${{ secrets.LOOM_CI_S3_REGION }}
      LOOM_CI_S3_BUCKET: ${{ secrets.LOOM_CI_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv + Python
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Sync project + sibling packages
        run: |
          uv sync --extra dev
          uv pip install -e packages/loom-launcher -e packages/loom-benchmarks

      - name: Compute AWS S3 endpoint
        # boto3 doesn't need endpoint_url for AWS S3 itself, but our
        # bootstrap subcommand takes --endpoint explicitly; use the
        # canonical regional S3 endpoint so we're exercising the exact
        # same code path an operator would.
        run: |
          echo "LOOM_SVC_MINIO_ENDPOINT=https://s3.${LOOM_SVC_MINIO_REGION}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Generate CI-specific storage-lifecycle.toml
        # The bundled example config targets three buckets
        # (trajectories / artifacts / atif). The CI account has one
        # shared bucket. Emit a minimal config that exercises the same
        # code paths (expire_after_days + keep_forever + multipart
        # cleanup wire) against just that bucket.
        run: |
          cat > /tmp/storage-lifecycle.ci.toml <<EOF
          backend = "s3"

          [[retention]]
          bucket = "${LOOM_CI_S3_BUCKET}"
          strategy = "expire_after_days"
          days = 30

          [[retention]]
          bucket = "${LOOM_CI_S3_BUCKET}"
          strategy = "cleanup_incomplete_uploads_after_hours"
          hours = 336
          EOF
          echo "::group::rendered CI config"
          cat /tmp/storage-lifecycle.ci.toml
          echo "::endgroup::"

      - name: Reset bucket lifecycle to start clean
        # If a previous smoke run failed mid-flight, leftover rules
        # might make the "no drift" check spuriously fail. Force a
        # clean slate before each run.
        run: |
          uv run python -c "
          import os
          from loom.storage_credentials import build_s3_client
          s3 = build_s3_client(
              endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              auth_kind='static_keys',
              access_key=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              secret_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region=os.environ['LOOM_SVC_MINIO_REGION'],
          )
          try:
              s3.delete_bucket_lifecycle(Bucket=os.environ['LOOM_CI_S3_BUCKET'])
              print('cleared existing lifecycle')
          except s3.exceptions.ClientError as e:
              if 'NoSuchLifecycleConfiguration' in str(e):
                  print('bucket already had no lifecycle')
              else:
                  raise
