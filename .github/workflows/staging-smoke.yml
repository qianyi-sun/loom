      - name: Dry-run apply
        run: |
          uv run loom cluster bootstrap-storage-lifecycle \
            --config /tmp/storage-lifecycle.ci.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}" --dry-run

      - name: Apply lifecycle
        run: |
          uv run loom cluster bootstrap-storage-lifecycle \
            --config /tmp/storage-lifecycle.ci.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"

      - name: Verify lifecycle drift check reports no drift
        # `loom cluster doctor` needs a working kubectl context for
        # its schema-reconciliation half; the CI runner has none.
        # Call the drift check function directly — same code path,
        # skips the cluster prerequisite that isn't relevant here.
        run: |
          uv run python -c "
          import os, sys
          from pathlib import Path
          from loom.storage_credentials import build_s3_client
          from loom.storage_retention_doctor import (
              check_lifecycle_drift, format_drift_report,
          )
          from loom.storage_retention_loader import load_retention_config
          cfg = load_retention_config(Path('/tmp/storage-lifecycle.ci.toml'))
          s3 = build_s3_client(
              endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              auth_kind='static_keys',
              access_key=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              secret_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region=os.environ['LOOM_SVC_MINIO_REGION'],
          )
          drifts = check_lifecycle_drift(s3, cfg)
          report = format_drift_report(drifts)
          if report:
              sys.stderr.write(f'FAIL — drift detected after apply:\n{report}\n')
              sys.exit(1)
          print('OK — live lifecycle matches rendered config')
          "

      - name: Second apply (idempotency)
        run: |
          uv run loom cluster bootstrap-storage-lifecycle \
            --config /tmp/storage-lifecycle.ci.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          uv run python -c "
          import os, sys
          from pathlib import Path
          from loom.storage_credentials import build_s3_client
          from loom.storage_retention_doctor import (
              check_lifecycle_drift, format_drift_report,
          )
          from loom.storage_retention_loader import load_retention_config
          cfg = load_retention_config(Path('/tmp/storage-lifecycle.ci.toml'))
          s3 = build_s3_client(
              endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              auth_kind='static_keys',
              access_key=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              secret_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region=os.environ['LOOM_SVC_MINIO_REGION'],
          )
          drifts = check_lifecycle_drift(s3, cfg)
          if format_drift_report(drifts):
              sys.exit('idempotency check failed')
          print('OK — re-apply is a no-op')
          "

      - name: Tamper - remove lifecycle, drift check must FAIL
        run: |
          uv run python -c "
          import os, sys
          from pathlib import Path
          from loom.storage_credentials import build_s3_client
          from loom.storage_retention_doctor import (
              check_lifecycle_drift, format_drift_report,
          )
          from loom.storage_retention_loader import load_retention_config
          s3 = build_s3_client(
              endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              auth_kind='static_keys',
              access_key=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              secret_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region=os.environ['LOOM_SVC_MINIO_REGION'],
          )
          s3.delete_bucket_lifecycle(Bucket=os.environ['LOOM_CI_S3_BUCKET'])
          cfg = load_retention_config(Path('/tmp/storage-lifecycle.ci.toml'))
          drifts = check_lifecycle_drift(s3, cfg)
          if not format_drift_report(drifts):
              sys.exit('drift check should have FAILED after tamper, but it reported clean')
          print('OK — drift check correctly reported drift after tamper')
          "

      - name: Heal - re-apply, drift check must clear
        run: |
          uv run loom cluster bootstrap-storage-lifecycle \
            --config /tmp/storage-lifecycle.ci.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          uv run python -c "
          import os, sys
          from pathlib import Path
          from loom.storage_credentials import build_s3_client
          from loom.storage_retention_doctor import (
              check_lifecycle_drift, format_drift_report,
          )
          from loom.storage_retention_loader import load_retention_config
          cfg = load_retention_config(Path('/tmp/storage-lifecycle.ci.toml'))
          s3 = build_s3_client(
              endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              auth_kind='static_keys',
              access_key=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              secret_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region=os.environ['LOOM_SVC_MINIO_REGION'],
          )
          drifts = check_lifecycle_drift(s3, cfg)
          if format_drift_report(drifts):
              sys.exit('heal failed — drift persists')
          print('OK — heal restored lifecycle')
          "

      - name: Reset bucket lifecycle on exit (always)
        # Leave the CI bucket in a clean state — no lifecycle rules
        # from our test lingering — so parallel/subsequent smoke runs
        # start from a known-empty state and the bucket isn't
        # accumulating "test" rules.
        if: always()
        run: |
          uv run python -c "
          import os
          from loom.storage_credentials import build_s3_client
          s3 = build_s3_client(
              endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              auth_kind='static_keys',
              access_key=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              secret_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region=os.environ['LOOM_SVC_MINIO_REGION'],
          )
          try:
              s3.delete_bucket_lifecycle(Bucket=os.environ['LOOM_CI_S3_BUCKET'])
              print('cleaned up lifecycle on exit')
          except s3.exceptions.ClientError:
              pass
          " || true
