name: staging-smoke

run-name: >-
  ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.base.sha == '28aa5257927a3468ebc35ec7f245fecaf3226dbf' &&
      ' ' ||
      github.event_name == 'workflow_dispatch' &&
      format('gate=manual / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.sha,
             github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft' ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base == null)) &&
      format('gate=filtered / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha,
             github.event.pull_request.base.sha,
             github.event.pull_request.updated_at,
             github.event.action,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      format('gate=full / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha,
             github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') }}

# Closes step 1-3 + 12 of the manual staging smoke gate in
# docs/runbooks/operator-runbook.md by automating the deploy-and-verify
# round-trip with REAL images. Where the kind smoke (#107) uses
# `loom cluster up --no-wait` against unbuilt images, this workflow
# builds the five loom images, loads them into kind, runs
# `loom cluster up` WITHOUT --no-wait, waits for every pod to
# reach Ready, and probes the /healthz + /metrics endpoints.
#
# Steps 4-11 (trial submission against a provider, trajectory +
# ATIF download) still require either a real provider key or a
# mock OpenAI server. Mock-server work is a follow-up — this
# automation closes the deploy-readiness gap, which is the
# longest-running and most-likely-to-regress part of the smoke.
#
# Trigger model:
#   - workflow_dispatch (manual)
#   - PRs selected by changed paths or the additive `staging-smoke` label
#
# Expected runtime: ~30-40 min (manifest-owned image builds + kind boot
# + apply + wait-for-ready).

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # Irrelevant metadata runs use a separate pending slot. Otherwise GitHub's
  # one-pending-run rule lets a filtered event evict the authoritative
  # replacement that must follow a canceled full run.
  group: >-
    staging-smoke-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base != null)) &&
      'authoritative' || 'background'
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
         (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
          contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
         (github.event.action == 'edited' && github.event.changes.base != null)) }}

jobs:
  plan:
    name: staging smoke plan
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.plan.outputs.staging_smoke }}
      gate_mode: ${{ steps.plan.outputs.gate_mode }}
      publisher_active: ${{ steps.plan.outputs.publisher_active }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan required staging smoke validation
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          TRUSTED_PROMOTION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            workflow_dispatch)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              PR_LABELS_JSON='["staging-smoke"]'
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --github-output "$GITHUB_OUTPUT"
          publisher_active=false
          if [[ "$TRUSTED_PROMOTION" == "true" ]]; then
            publisher_active=true
          elif [[ "$BASE_SHA" == "28aa5257927a3468ebc35ec7f245fecaf3226dbf" ]]; then
            # One-time bridge: this base has the publisher but predates its
            # dynamic run-name support. Whitespace run-name restores the fixed
            # workflow identity while the PR title carries the generation.
            publisher_active=true
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${BASE_SHA}^{tree}"
            if git show "${BASE_SHA}:.github/workflows/authoritative-gates.yml" \
                2>/dev/null | grep -Eq '^# publisher-contract: dynamic-run-name-v[123]$'; then
              publisher_active=true
            fi
          fi
          printf 'publisher_active=%s\n' "$publisher_active" >> "$GITHUB_OUTPUT"

  smoke:
    name: kind staging smoke (build images → cluster up → verify ready)
    needs: plan
    if: >-
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true'
    runs-on: >-
      ${{ fromJSON(vars.LOOM_CI_ACCELERATOR_RUNS_ON || '["ubuntu-latest"]') }}
    # Manifest-owned start-policy image builds (uncached) + kind boot +
    # ingress-nginx + apply + wait-for-ready can run 30-40 min on a cold
    # runner. 45 leaves headroom for the wait step's worst case.
    timeout-minutes: 45
    env:
      IMAGE_TAG: smoke-${{ github.run_id }}
      STAGING_IMAGE_MATRIX: /tmp/loom-staging-image-matrix.json
    steps:
      - name: Validate staging smoke inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|merge_group|workflow_dispatch) ;;
            *) echo "FAIL: invalid staging smoke event" >&2; exit 1 ;;
          esac
          [[ "$IMAGE_TAG" =~ ^smoke-[1-9][0-9]*$ ]] || {
            echo "FAIL: invalid staging smoke image tag" >&2
            exit 1
          }

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Resolve manifest-owned staging image matrix
        run: |
          set -euo pipefail
          python3 scripts/component_ownership.py \
            release-images --runtime-policy start \
            > "$STAGING_IMAGE_MATRIX"
          python3 - "$STAGING_IMAGE_MATRIX" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          matrix = json.loads(path.read_text(encoding="utf-8"))
          required = {"image_name", "dockerfile", "context"}
          if not isinstance(matrix, list) or not matrix:
              raise SystemExit("FAIL: staging image matrix must be a non-empty array")
          if any(not isinstance(row, dict) or set(row) != required for row in matrix):
              raise SystemExit("FAIL: staging image matrix row has invalid schema")
          PY
          matrix_sha256=$(sha256sum "$STAGING_IMAGE_MATRIX" | cut -d' ' -f1)
          echo "STAGING_IMAGE_MATRIX_SHA256=${matrix_sha256}" >> "$GITHUB_ENV"

      - name: Install kind + kubectl
        run: |
          curl -sSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl -sSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -s -L https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kind --version && kubectl version --client=true

      - name: Install exact uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Sync python deps (with [cluster] and [rollout] extras)
        # Pin Python 3.11 to match what the loom Dockerfiles use
        # (python:3.11-slim). ubuntu-latest defaults to Python 3.12,
        # which can hit "no wheel for current platform" on pinned
        # transitive deps that haven't shipped 3.12 wheels.
        run: |
          uv python install 3.11
          uv sync --locked --all-packages --extra cluster --extra rollout --python 3.11
          uv pip check --python .venv/bin/python

      - name: Build images (parallel)
        # Build every start-policy image in parallel. Each gets the smoke
        # run-id as its tag so concurrent runs on the same daemon
        # don't collide. Image names, Dockerfiles, and build contexts come
        # from the ownership manifest.
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=1
          echo "${STAGING_IMAGE_MATRIX_SHA256}  ${STAGING_IMAGE_MATRIX}" \
            | sha256sum --check --status
          checkout_sha=$(git rev-parse HEAD)
          [[ "$checkout_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid checkout SHA" >&2
            exit 1
          }
          build_rows=$(mktemp /tmp/loom-staging-builds.XXXXXX.tsv)
          python3 - "$STAGING_IMAGE_MATRIX" > "$build_rows" <<'PY'
          import json
          import sys
          from pathlib import Path

          for row in json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")):
              print(row["image_name"], row["dockerfile"], row["context"], sep="\t")
          PY
          pids=()
          while IFS=$'\t' read -r image_name dockerfile build_context; do
            image="${image_name}:${IMAGE_TAG}"
            (
              echo "::group::Build ${image}"
              build_args=()
              if [[ "$image_name" == "loom-service" ]]; then
                build_args+=(--build-arg "LOOM_BUILD_SHA=${checkout_sha}")
              fi
              docker build -f "${dockerfile}" \
                -t "${image}" "${build_args[@]}" "${build_context}" 2>&1 \
                | sed "s/^/[${image_name}] /"
              echo "::endgroup::"
            ) &
            pids+=($!)
          done < "$build_rows"
          rm -f "$build_rows"
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=$?
          done
          [[ "$rc" -eq 0 ]] || exit "$rc"
          service_revision=$(docker inspect --type=image --format \
            '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "loom-service:${IMAGE_TAG}")
          [[ "$service_revision" == "$checkout_sha" ]] || {
            echo "FAIL: service image revision does not match checkout" >&2
            exit 1
          }

      - name: Create kind cluster
        # The ingress-nginx kind manifest pins its controller pod to
        # nodes with `ingress-ready=true`. Without this kind config
        # the controller pod sits Pending forever. extraPortMappings
        # let the host reach the controller on 80/443.
        run: |
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - { containerPort: 80,  hostPort: 80,  protocol: TCP }
                - { containerPort: 443, hostPort: 443, protocol: TCP }
          EOF
          kind create cluster --name loom-staging \
            --config /tmp/kind-config.yaml --wait 60s
          kubectl --context kind-loom-staging cluster-info

      - name: Install ingress-nginx (so preflight's IngressClass check passes)
        # Kind doesn't ship with an ingress controller; preflight
        # would fail without one. Install the pinned repo-local
        # ingress-nginx manifest for kind so CI and live rollout do
        # not depend on raw.githubusercontent.com availability.
        # Wait for the controller pod + IngressClass to land before
        # continuing.
        run: |
          kubectl --context kind-loom-staging apply -f \
            deploy/k8s/ingress-nginx-kind.yaml
          # The kind manifest creates a Job + Deployment + IngressClass.
          # IngressClass appears almost immediately, but the controller
          # pod takes ~30s to become Ready.
          kubectl --context kind-loom-staging wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Load images into kind
        # `kind load docker-image` copies the image from the host's
        # Docker daemon into kind's containerd. Without this, pods
        # would fail to pull (kind has no registry config for
        # `loom-*:smoke-*` tags).
        run: |
          set -euo pipefail
          echo "${STAGING_IMAGE_MATRIX_SHA256}  ${STAGING_IMAGE_MATRIX}" \
            | sha256sum --check --status
          image_names=$(mktemp /tmp/loom-staging-images.XXXXXX.txt)
          python3 - "$STAGING_IMAGE_MATRIX" > "$image_names" <<'PY'
          import json
          import sys
          from pathlib import Path

          for row in json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")):
              print(row["image_name"])
          PY
          while IFS= read -r image_name; do
            kind load docker-image "${image_name}:${IMAGE_TAG}" \
              --name loom-staging
          done < "$image_names"
          rm -f "$image_names"

      - name: Bootstrap namespace + Secrets
        # Bootstrap loom-secrets from schema via `loom cluster bootstrap-secrets`.
        # --smoke-defaults covers every key declared in config/loom-schema.toml
        # with test-grade placeholders. kind sets the current kubeconfig context
        # to kind-loom-staging after cluster creation, so the generated kubectl
        # command targets the right cluster without an explicit --context flag.
        run: |
          set -euo pipefail
          admin_toml=/tmp/admin.toml
          cleanup_bootstrap_secret() {
            rm -f "$admin_toml"
          }
          trap cleanup_bootstrap_secret EXIT
          umask 077
          kubectl --context kind-loom-staging create namespace loom
          ADMIN_TOKEN="loom_admin_$(openssl rand -hex 24)"
          echo "::add-mask::${ADMIN_TOKEN}"

          eval "$(uv run --no-sync loom cluster bootstrap-secrets --namespace=loom --smoke-defaults)"

          printf '[admin]\ntoken="%s"\n' "${ADMIN_TOKEN}" > "$admin_toml"
          kubectl --context kind-loom-staging -n loom create secret generic loom-admin-secret \
            --from-file="secrets.toml=${admin_toml}"
          rm -f "$admin_toml"
          trap - EXIT

      - name: Generate cluster-config.toml
        # image_tag must match what we built + loaded above.
        # worker = 0 because the worker template needs hostPath
        # /var/run/docker.sock for the sandbox-Docker driver, and
        # kind nodes don't expose the host docker socket (kind runs
        # inside a container itself). Real worker readiness is a
        # production-only concern; the smoke verifies the other 4
        # components + gateway-router DaemonSet.
        run: |
          cat > /tmp/cluster-config.toml <<EOF
          namespace = "loom"
          image_tag = "${IMAGE_TAG}"
          runtime_environment = "development"
          ingress_host = "yylx.world"
          ingress_redirect_hosts = ["www.yylx.world"]
          frontend_environment = "development"
          frontend_environment_label = "Development / staging"
          frontend_route_path = "/dev"
          frontend_api_base_path = "/dev"
          [replicas]
          service = 1
          control_plane = 1
          gateway = 1
          web = 1
          worker = 0
          EOF

      - name: loom cluster preflight
        # All required secrets exist; storage + ingress class are
        # available via kind's default CNI + storage provisioner.
        run: |
          uv run --no-sync python -m loom_cli cluster preflight \
            --context kind-loom-staging --namespace loom

      - name: loom cluster audit
        # Boundary check on the rendered manifests before apply.
        run: |
          uv run --no-sync python -m loom_cli cluster audit \
            --config /tmp/cluster-config.toml

      - name: loom cluster up (apply, no-wait)
        # Apply manifests but return immediately. Postgres needs to
        # be Ready before we can apply migrations, and the long-
        # running services (CP, gateway, service) refuse to start
        # until Alembic head is reached. We orchestrate the sequence
        # explicitly below.
        run: |
          uv run --no-sync python -m loom_cli cluster up \
            --context kind-loom-staging --namespace loom \
            --config /tmp/cluster-config.toml \
            --skip-preflight --no-wait

      - name: Wait for Postgres + MinIO Ready
        # Infrastructure StatefulSets with no DB dependency of their
        # own; reach Ready within 1-2 min of cold-start.
        run: |
          set -euo pipefail
          kubectl --context kind-loom-staging -n loom wait \
            --for=condition=Ready pod/loom-postgres-0 --timeout=180s
          kubectl --context kind-loom-staging -n loom wait \
            --for=condition=Ready pod/loom-minio-0 --timeout=180s

      - name: Apply Alembic migrations
        # Services validate `schema at head` and refuse to start
        # otherwise (`loom.db.schema_startup`). `loom service up`
        # does dev auto-migration; `loom cluster up` doesn't because
        # production migration is an explicit operator action. We
        # run alembic against the live Postgres via port-forward;
        # each role-scoped DB URL (cp-db-url, gw-db-url, svc-db-url)
        # points at the same Postgres + a different database name
        # set by the smoke-defaults secrets.
        run: |
          set -euo pipefail
          kubectl --context kind-loom-staging -n loom port-forward \
            svc/loom-postgres 15432:5432 &
          PF_PID=$!
          trap 'kill ${PF_PID} 2>/dev/null || true' EXIT
          sleep 3

          for key in cp-db-url gw-db-url svc-db-url; do
            DB_URL=$(kubectl --context kind-loom-staging -n loom \
              get secret loom-secrets \
              -o jsonpath="{.data.${key}}" | base64 -d)
            # Rewrite host:port to localhost:15432 so local alembic
            # can reach the cluster Postgres via the port-forward.
            LOCAL_DB_URL=$(echo "${DB_URL}" \
              | sed -E 's#@[^/]+/#@localhost:15432/#')
            echo "::add-mask::${LOCAL_DB_URL}"
            echo "::group::alembic upgrade head for ${key}"
            LOOM_DB_URL="${LOCAL_DB_URL}" uv run --no-sync alembic \
              -c migrations/alembic.ini upgrade head
            echo "::endgroup::"
          done

      - name: loom cluster up (wait for components Ready)
        # Now that migrations are applied, the services come up
        # cleanly. Re-invoke `loom cluster up` to use its
        # wait-for-ready loop (apply is idempotent — kubectl apply
        # is a no-op when manifests are unchanged).
        run: |
          uv run --no-sync python -m loom_cli cluster up \
            --context kind-loom-staging --namespace loom \
            --config /tmp/cluster-config.toml \
            --skip-preflight \
            --timeout 600 --poll-interval 5

      - name: loom cluster status
        run: |
          uv run --no-sync python -m loom_cli cluster status \
            --context kind-loom-staging --namespace loom \
            --format table

      - name: Route kind ingress hosts to the local controller
        run: |
          printf '%s\n' '127.0.0.1 yylx.world www.yylx.world' \
            | sudo tee -a /etc/hosts
          getent hosts yylx.world www.yylx.world

      - name: Set up browser smoke Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned browser smoke dependencies
        working-directory: web
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      - name: Verify prefixed frontend routes through ingress-nginx
        run: |
          set -euo pipefail

          require_singleton_header() {
            local headers_file="$1"
            local header_name="$2"
            local comparison="$3"
            local expected="$4"
            uv run --no-sync python - "$headers_file" "$header_name" "$comparison" "$expected" <<'PY'
          import sys
          from pathlib import Path

          headers_path, wanted_name, comparison, expected = sys.argv[1:]
          values: list[str] = []
          for raw_line in Path(headers_path).read_bytes().splitlines():
              if raw_line.startswith((b" ", b"\t")):
                  raise SystemExit("folded response headers are not accepted")
              name, separator, value = raw_line.partition(b":")
              if separator and name.decode("ascii", errors="strict").lower() == wanted_name.lower():
                  values.append(value.strip().decode("latin-1"))
          if len(values) != 1:
              raise SystemExit(f"expected exactly one {wanted_name} header")
          observed = values[0]
          if comparison == "mime":
              observed = observed.split(";", 1)[0].strip().lower()
              expected = expected.lower()
          elif comparison != "exact":
              raise SystemExit("unsupported singleton-header comparison")
          if observed != expected:
              raise SystemExit(f"unexpected singleton {wanted_name} header")
          PY
          }

          # Wait for the pinned ingress-nginx controller to observe the newly
          # applied Ingress resources before running the authoritative report.
          ready=false
          for attempt in $(seq 1 30); do
            if curl --insecure --fail --silent --show-error --path-as-is \
                 --max-time 10 \
                 https://yylx.world/dev/loom-frontend-config.json \
                 >/dev/null; then
              ready=true
              break
            fi
            echo "Ingress route not ready (attempt ${attempt}/30)"
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::prefixed ingress route did not become ready"
            exit 1
          fi

          CI=true uv run --no-sync python scripts/ops/frontend_route_smoke.py \
            --insecure-for-kind \
            --route development=https://yylx.world/dev=https://yylx.world/dev/api \
            --json | tee /tmp/loom-frontend-route-smoke.json

          # Validate the exact combined web-origin + ingress browser policy on
          # shell/config 200s, the slash-canonical 308, and a wrong-asset 404.
          # The redacted report never records response headers or bodies.
          CI=true uv run --no-sync python scripts/ops/frontend_security_headers.py \
            --insecure-for-kind \
            --route development=https://yylx.world/dev \
            --json | tee /tmp/loom-frontend-security-headers.json

          # The report contains only requested URLs, methods, statuses, and
          # content types. Select one validated hashed route asset without
          # trusting arbitrary report data as a new request target.
          asset_path=$(
            uv run --no-sync python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          report = json.loads(
              Path("/tmp/loom-frontend-route-smoke.json").read_text(encoding="utf-8")
          )
          if report.get("status") != "pass":
              raise SystemExit("frontend route report did not pass")
          candidates: list[str] = []
          for route in report.get("routes", []):
              for response in route.get("responses", []):
                  parsed = urlsplit(response.get("url", ""))
                  path = parsed.path
                  content_type = response.get("content_type", "").lower()
                  expected_mime = (
                      "javascript" if path.endswith(".js") else "text/css"
                  )
                  if (
                      parsed.scheme == "https"
                      and parsed.hostname == "yylx.world"
                      and parsed.port is None
                      and not parsed.username
                      and not parsed.password
                      and not parsed.query
                      and not parsed.fragment
                      and response.get("method") == "GET"
                      and response.get("status") == 200
                      and expected_mime in content_type
                      and re.fullmatch(
                          r"/dev/assets/[A-Za-z0-9._-]+-[A-Za-z0-9_-]{6,}\.(?:js|css)",
                          path,
                      )
                  ):
                      candidates.append(path)
          if not candidates:
              raise SystemExit("route report contains no safe hashed asset path")
          print(sorted(set(candidates))[0])
          PY
          )
          root_asset_path="${asset_path#/dev}"
          root_asset_headers=$(mktemp)
          root_asset_status=$(curl --insecure --silent --show-error \
            --path-as-is --no-location --max-redirs 0 --max-time 10 \
            --dump-header "$root_asset_headers" --output /dev/null \
            --write-out '%{http_code}' \
            "https://yylx.world${root_asset_path}")
          if [[ "$root_asset_status" != "404" ]] \
             || grep -qi '^location:' "$root_asset_headers"; then
            echo "::error::root asset boundary failed: ${root_asset_path} (HTTP ${root_asset_status})"
            rm -f "$root_asset_headers"
            exit 1
          fi
          rm -f "$root_asset_headers"

          # Near-prefix and encoded-slash probes must not select either public
          # route. Redirects stay disabled so a cross-match cannot hide behind
          # a finite result.
          for path in \
              /devil \
              /devapi \
              /prodfoo \
              /DEV \
              /Dev/ \
              /dEv/monitor \
              /PROD \
              /Prod/api/v1/health \
              '/D%45V/monitor' \
              '/d%45v/api/v1/health' \
              '/d%65v/monitor' \
              '/PR%4fD/' \
              '/pr%4Fd/' \
              '/dev%2Fmonitor' \
              '/dev/%2Fmonitor' \
              '/dev%5Cmonitor' \
              '/dev/%5cmonitor' \
              '/dev\monitor' \
              '/dev/\monitor' \
              /dev//monitor \
              /dev/monitor//details \
              '/dev/api/v1/%2Fhealth' \
              '/dev/api/v1/%5Chealth' \
              '/dev/api/v1\health' \
              /dev/api/v1//health \
              /dev/api/v1/health//; do
            headers=$(mktemp)
            status=$(curl --insecure --silent --show-error --path-as-is \
              --no-location --max-redirs 0 --max-time 10 \
              --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}' "https://yylx.world${path}")
            if [[ "$status" != "404" ]] || grep -qi '^location:' "$headers"; then
              echo "::error::non-route path did not fail closed: ${path} (HTTP ${status})"
              rm -f "$headers"
              exit 1
            fi
            rm -f "$headers"
          done

          # Bypass ingress and probe the web Service directly so the pod-level
          # Nginx guard cannot regress behind a correct controller guard.
          web_pf_log=$(mktemp)
          kubectl --context kind-loom-staging -n loom port-forward \
            svc/loom-web 18081:80 >"$web_pf_log" 2>&1 &
          WEB_PF_PID=$!
          cleanup_web_port_forward() {
            kill "$WEB_PF_PID" 2>/dev/null || true
            wait "$WEB_PF_PID" 2>/dev/null || true
            rm -f "$web_pf_log"
          }
          trap cleanup_web_port_forward EXIT
          web_ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --path-as-is --max-time 5 \
                 http://127.0.0.1:18081/dev/loom-frontend-config.json \
                 >/dev/null; then
              web_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$web_ready" != "true" ]]; then
            echo "::error::direct loom-web port-forward did not become ready"
            exit 1
          fi
          for path in \
              /DEV \
              /Dev/monitor \
              /PROD \
              '/D%45V/monitor' \
              '/d%45v/monitor' \
              '/d%65v/monitor' \
              '/PR%4fD/' \
              '/pr%4Fd/' \
              '/dev%2Fmonitor' \
              '/dev/%2fmonitor' \
              '/dev%5Cmonitor' \
              '/dev/%5cmonitor' \
              '/dev\monitor' \
              '/dev/\monitor' \
              '/dev/api/v1\health' \
              /dev//monitor; do
            headers=$(mktemp)
            status=$(curl --silent --show-error --path-as-is \
              --no-location --max-redirs 0 --max-time 10 \
              --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}' "http://127.0.0.1:18081${path}")
            if [[ "$status" != "404" ]] || grep -qi '^location:' "$headers"; then
              echo "::error::direct web path did not fail closed: ${path} (HTTP ${status})"
              rm -f "$headers"
              exit 1
            fi
            rm -f "$headers"
          done
          cleanup_web_port_forward
          trap - EXIT

          # A JSON health response distinguishes loom-service routing from a
          # web SPA fallback that also happens to return HTTP 200.
          health_headers=$(mktemp)
          health_status=$(curl --insecure --silent --show-error --path-as-is \
            --no-location --max-redirs 0 --max-time 10 \
            --dump-header "$health_headers" \
            --output /tmp/loom-service-health.json \
            --write-out '%{http_code}' \
            https://yylx.world/dev/api/v1/health)
          if [[ "$health_status" != "200" ]] \
             || ! require_singleton_header \
                  "$health_headers" content-type mime application/json; then
            echo "::error::prefixed loom-service health route failed: HTTP ${health_status}"
            rm -f "$health_headers"
            exit 1
          fi
          uv run --no-sync python -m json.tool /tmp/loom-service-health.json >/dev/null
          rm -f "$health_headers"

          # Verify a finite www -> canonical host -> slash-canonical chain,
          # preserving the encoded query at both redirect boundaries.
          www_headers=$(mktemp)
          www_status=$(curl --insecure --silent --show-error --path-as-is \
            --no-location --max-redirs 0 --max-time 10 \
            --dump-header "$www_headers" --output /dev/null \
            --write-out '%{http_code}' \
            'https://www.yylx.world/dev?next=%2Fmonitor&x=1')
          if [[ "$www_status" != "308" ]] \
             || ! require_singleton_header "$www_headers" location exact \
                  'https://yylx.world/dev?next=%2Fmonitor&x=1'; then
            echo "::error::unexpected www redirect: HTTP ${www_status}"
            rm -f "$www_headers"
            exit 1
          fi
          rm -f "$www_headers"

          canonical_headers=$(mktemp)
          canonical_status=$(curl --insecure --silent --show-error --path-as-is \
            --no-location --max-redirs 0 --max-time 10 \
            --dump-header "$canonical_headers" --output /dev/null \
            --write-out '%{http_code}' \
            'https://yylx.world/dev?next=%2Fmonitor&x=1')
          if [[ "$canonical_status" != "308" ]] \
             || ! require_singleton_header "$canonical_headers" location exact \
                  '/dev/?next=%2Fmonitor&x=1'; then
            echo "::error::unexpected slash redirect: HTTP ${canonical_status}"
            rm -f "$canonical_headers"
            exit 1
          fi
          rm -f "$canonical_headers"

          final_status=$(curl --insecure --silent --show-error --path-as-is \
            --no-location --max-redirs 0 --max-time 10 \
            --output /dev/null --write-out '%{http_code}' \
            'https://yylx.world/dev/?next=%2Fmonitor&x=1')
          if [[ "$final_status" != "200" ]]; then
            echo "::error::finite canonical chain ended with HTTP ${final_status}"
            exit 1
          fi

          # Prove Nginx's `always` behavior on a real 500 without shipping a
          # test-only endpoint. Remove only the generated shell in this
          # ephemeral kind pod, probe the pod directly, and restore it under a
          # trap before any later smoke step runs. HSTS is intentionally not
          # required on this loopback probe because ingress owns TLS/HSTS.
          web_pod_count=$(
            kubectl --context kind-loom-staging -n loom get pods \
              -l app=loom-web --field-selector=status.phase=Running \
              -o name | wc -l | tr -d ' '
          )
          if [[ "$web_pod_count" != "1" ]]; then
            echo "::error::expected one running loom-web pod, found ${web_pod_count}"
            exit 1
          fi
          web_pod=$(
            kubectl --context kind-loom-staging -n loom get pods \
              -l app=loom-web --field-selector=status.phase=Running \
              -o jsonpath='{.items[0].metadata.name}'
          )
          security_pf_log=$(mktemp)
          kubectl --context kind-loom-staging -n loom port-forward \
            "pod/${web_pod}" 18082:8080 >"$security_pf_log" 2>&1 &
          SECURITY_PF_PID=$!
          security_restore_needed=false
          cleanup_security_5xx_probe() {
            if [[ "${security_restore_needed:-false}" == "true" ]]; then
              kubectl --context kind-loom-staging -n loom exec "$web_pod" -- \
                sh -c 'mv /usr/share/nginx/html/index.html.security-header-smoke /usr/share/nginx/html/index.html' \
                >/dev/null 2>&1 || true
            fi
            kill "$SECURITY_PF_PID" 2>/dev/null || true
            wait "$SECURITY_PF_PID" 2>/dev/null || true
            rm -f "$security_pf_log"
          }
          trap cleanup_security_5xx_probe EXIT
          security_web_ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --path-as-is --max-time 5 \
                 http://127.0.0.1:18082/dev/ >/dev/null; then
              security_web_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$security_web_ready" != "true" ]]; then
            echo "::error::direct loom-web security probe did not become ready"
            exit 1
          fi
          kubectl --context kind-loom-staging -n loom exec "$web_pod" -- \
            mv /usr/share/nginx/html/index.html \
               /usr/share/nginx/html/index.html.security-header-smoke
          security_restore_needed=true
          CI=true uv run --no-sync python scripts/ops/frontend_security_headers.py \
            --web-origin-only \
            --probe web_500=500=http://127.0.0.1:18082/dev/security-header-5xx-probe \
            --json | tee /tmp/loom-frontend-security-headers-500.json
          kubectl --context kind-loom-staging -n loom exec "$web_pod" -- \
            mv /usr/share/nginx/html/index.html.security-header-smoke \
               /usr/share/nginx/html/index.html
          security_restore_needed=false
          cleanup_security_5xx_probe
          trap - EXIT

      - name: Verify prefixed frontend routes mount in Chromium
        run: |
          CI=true npm --prefix web run smoke:routes -- \
            --route https://yylx.world/dev \
            --insecure-for-kind \
            --trace /tmp/loom-frontend-route-browser-trace.zip

      - name: Upload frontend route browser trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-route-browser-trace-${{ github.run_id }}
          path: /tmp/loom-frontend-route-browser-trace.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify staging admin exchange stays hidden in kind
        # This ephemeral cluster is deliberately non-protected development.
        # Positive staging-session acceptance belongs only to the candidate-
        # bound brokered staging rollout. This malformed, credential-free POST
        # proves the runtime guard returns 404 before auth or body validation.
        run: |
          set -euo pipefail
          response_headers=$(mktemp)
          response_body=$(mktemp)
          trap 'rm -f "$response_headers" "$response_body"' EXIT
          status=$(curl --insecure --silent --show-error --path-as-is \
            --request POST --header 'content-type: application/json' \
            --data-binary '{' --no-location --max-redirs 0 --max-time 10 \
            --dump-header "$response_headers" --output "$response_body" \
            --write-out '%{http_code}' \
            https://yylx.world/dev/api/v1/auth/staging-admin-browser-session)
          if [[ "$status" != "404" ]] \
             || [[ "$(<"$response_body")" != '{"detail":"not found"}' ]] \
             || grep -Eqi '^(location|set-cookie|x-loom-build-sha):' "$response_headers"; then
            echo "::error::staging admin exchange was exposed in kind: HTTP ${status}"
            exit 1
          fi

      - name: Verify /healthz on every service via port-forward
        # Probe each service's /healthz from a temporary port-forward.
        # If any returns non-200, dump pod logs + fail.
        run: |
          set -euo pipefail
          # local_port:svc:svc_port:path. Use local ports >= 18080 to
          # avoid colliding with host services bound by kind's
          # extraPortMappings (e.g. ingress-nginx on 80/443).
          for spec in \
              "18080:loom-control-plane:8080:/healthz" \
              "19100:loom-llm-gateway:9100:/healthz" \
              "18090:loom-service:8090:/api/v1/health" \
              "18000:loom-web:80:/" ; do
            local_port=$(echo "$spec" | cut -d: -f1)
            svc=$(echo "$spec" | cut -d: -f2)
            svc_port=$(echo "$spec" | cut -d: -f3)
            path=$(echo "$spec" | cut -d: -f4-)
            echo "::group::probe ${svc}${path}"
            kubectl --context kind-loom-staging -n loom port-forward \
              "svc/${svc}" "${local_port}:${svc_port}" &
            pf_pid=$!
            sleep 3
            if ! curl -fsS --max-time 10 "http://localhost:${local_port}${path}"; then
              echo "::error::probe failed for ${svc}${path}"
              kubectl --context kind-loom-staging -n loom logs \
                "-l" "app=${svc}" --tail=200
              kill $pf_pid 2>/dev/null || true
              exit 1
            fi
            kill $pf_pid 2>/dev/null || true
            wait $pf_pid 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Verify /metrics on every service
        # /metrics is the prometheus-client endpoint shipped in
        # #81 slice B-1..B-4. A successful scrape proves the
        # observability surface is wired end-to-end.
        run: |
          set -euo pipefail
          for spec in \
              "18080:loom-control-plane:8080" \
              "19100:loom-llm-gateway:9100" \
              "18090:loom-service:8090" ; do
            local_port=$(echo "$spec" | cut -d: -f1)
            svc=$(echo "$spec" | cut -d: -f2)
            svc_port=$(echo "$spec" | cut -d: -f3)
            echo "::group::scrape ${svc}/metrics"
            kubectl --context kind-loom-staging -n loom port-forward \
              "svc/${svc}" "${local_port}:${svc_port}" &
            pf_pid=$!
            sleep 3
            # `-L` to follow the 307 from prometheus_client's mounted
            # ASGI app (`/metrics` → `/metrics/`).
            body=$(curl -fsSL --max-time 10 "http://localhost:${local_port}/metrics" || echo "FAILED")
            if [ "$body" = "FAILED" ] || ! echo "$body" | grep -q "^# HELP "; then
              echo "::error::no prometheus output from ${svc}/metrics"
              echo "first 500 chars: ${body:0:500}"
              kill $pf_pid 2>/dev/null || true
              exit 1
            fi
            echo "OK — first metric: $(echo "$body" | grep '^# HELP' | head -1)"
            kill $pf_pid 2>/dev/null || true
            wait $pf_pid 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Verify storage lifecycle round-trip against real MinIO
        # Closes #230. Exercises the entire pipeline end-to-end:
        # CLI subcommand → boto3 → real MinIO → boto3 read-back → doctor
        # diff. The unit tests for the renderer pass against a stub S3
        # client; this step is the only thing that catches a wire-
        # format mismatch (boto3 vs MinIO).
        #
        # 1. Pull MinIO creds from the live Secret bootstrapped above
        #    (--smoke-defaults values, so deterministic).
        # 2. Pre-create the three reference buckets (MinIO doesn't
        #    auto-create on PUT; production buckets are created by
        #    loom_service at startup, but we want lifecycle apply to
        #    succeed even on a fresh cluster).
        # 3. Apply the example storage-lifecycle.toml.
        # 4. doctor --storage-lifecycle-config should exit 0.
        # 5. Re-apply (idempotency); doctor still exit 0.
        # 6. Tamper: drop a rule out-of-band; doctor should exit 1 and
        #    name the missing rule.
        run: |
          set -euo pipefail

          ACCESS_KEY=$(kubectl --context kind-loom-staging -n loom \
            get secret loom-secrets \
            -o jsonpath='{.data.minio-access-key}' | base64 -d)
          SECRET_KEY=$(kubectl --context kind-loom-staging -n loom \
            get secret loom-secrets \
            -o jsonpath='{.data.minio-secret-key}' | base64 -d)
          export LOOM_SVC_MINIO_ACCESS_KEY="${ACCESS_KEY}"
          export LOOM_SVC_MINIO_SECRET_KEY="${SECRET_KEY}"
          echo "::add-mask::${ACCESS_KEY}"
          echo "::add-mask::${SECRET_KEY}"

          kubectl --context kind-loom-staging -n loom port-forward \
            svc/loom-minio 19000:9000 &
          PF_PID=$!
          trap 'kill ${PF_PID} 2>/dev/null || true' EXIT
          sleep 3

          export LOOM_SVC_MINIO_ENDPOINT="http://localhost:19000"

          # Pre-create reference buckets so apply has somewhere to land.
          for bucket in trajectories artifacts atif; do
            uv run --no-sync python -c "
          import os, boto3
          from botocore.config import Config
          s3 = boto3.client(
              's3', endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region_name='us-east-1',
              config=Config(signature_version='s3v4'),
          )
          try:
              s3.create_bucket(Bucket='${bucket}')
          except s3.exceptions.BucketAlreadyOwnedByYou:
              pass
          "
          done

          echo "::group::dry-run apply"
          uv run --no-sync loom cluster bootstrap-storage-lifecycle \
            --config config/storage-lifecycle.example.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}" --dry-run
          echo "::endgroup::"

          echo "::group::first apply"
          uv run --no-sync loom cluster bootstrap-storage-lifecycle \
            --config config/storage-lifecycle.example.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          echo "::endgroup::"

          echo "::group::doctor after first apply (must exit 0)"
          uv run --no-sync loom cluster doctor \
            --context kind-loom-staging --namespace loom \
            --storage-lifecycle-config config/storage-lifecycle.example.toml \
            --storage-lifecycle-endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          echo "::endgroup::"

          echo "::group::second apply (idempotency check)"
          uv run --no-sync loom cluster bootstrap-storage-lifecycle \
            --config config/storage-lifecycle.example.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          uv run --no-sync loom cluster doctor \
            --context kind-loom-staging --namespace loom \
            --storage-lifecycle-config config/storage-lifecycle.example.toml \
            --storage-lifecycle-endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          echo "::endgroup::"

          echo "::group::tamper: remove trajectories lifecycle, doctor must fail"
          uv run --no-sync python -c "
          import os, boto3
          from botocore.config import Config
          s3 = boto3.client(
              's3', endpoint_url=os.environ['LOOM_SVC_MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['LOOM_SVC_MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['LOOM_SVC_MINIO_SECRET_KEY'],
              region_name='us-east-1',
              config=Config(signature_version='s3v4'),
          )
          s3.delete_bucket_lifecycle(Bucket='trajectories')
          "
          if uv run --no-sync loom cluster doctor \
               --context kind-loom-staging --namespace loom \
               --storage-lifecycle-config config/storage-lifecycle.example.toml \
               --storage-lifecycle-endpoint "${LOOM_SVC_MINIO_ENDPOINT}"; then
            echo "::error::doctor should have FAILED after removing lifecycle, but it passed"
            exit 1
          fi
          echo "doctor correctly reported drift after tamper"
          echo "::endgroup::"

          echo "::group::heal: re-apply, doctor should exit 0 again"
          uv run --no-sync loom cluster bootstrap-storage-lifecycle \
            --config config/storage-lifecycle.example.toml \
            --endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          uv run --no-sync loom cluster doctor \
            --context kind-loom-staging --namespace loom \
            --storage-lifecycle-config config/storage-lifecycle.example.toml \
            --storage-lifecycle-endpoint "${LOOM_SVC_MINIO_ENDPOINT}"
          echo "::endgroup::"

      - name: Capture pod state on success (for reference)
        if: success()
        run: |
          kubectl --context kind-loom-staging -n loom get all
          kubectl --context kind-loom-staging -n loom describe pods \
            | head -200

      - name: Capture pod state + logs on failure
        if: failure()
        run: |
          kubectl --context kind-loom-staging -n loom get all
          kubectl --context kind-loom-staging -n loom describe pods
          for component in control-plane llm-gateway service worker web; do
            echo "::group::logs ${component}"
            kubectl --context kind-loom-staging -n loom logs \
              "-l" "app=loom-${component}" --tail=200 --previous \
              2>/dev/null || true
            kubectl --context kind-loom-staging -n loom logs \
              "-l" "app=loom-${component}" --tail=200 \
              2>/dev/null || true
            echo "::endgroup::"
          done

      - name: loom cluster down --yes
        if: always()
        run: |
          uv run --no-sync python -m loom_cli cluster down \
            --context kind-loom-staging --namespace loom --yes \
            || true

      - name: Cleanup kind
        if: always()
        run: kind delete cluster --name loom-staging || true

  system-smoke:
    name: manifest-owned system smoke
    needs: plan
    if: >-
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true'
    runs-on: >-
      ${{ fromJSON(vars.LOOM_CI_ACCELERATOR_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Sync system-smoke dependencies
        run: |
          uv python install 3.11
          uv sync --locked --all-packages --extra dev --extra cluster --extra rollout --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned system smoke lane
        shell: bash
        env:
          LOOM_SYSTEM_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/system-smoke-compose.log
        run: |
          set -euo pipefail
          mapfile -t test_paths < <(
            uv run --no-sync python scripts/component_ownership.py test-paths --lane system-smoke
          )
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest --timeout=1200 "${test_paths[@]}"

      - name: Show system-smoke compose diagnostics
        if: failure()
        env:
          LOOM_SYSTEM_SMOKE_DIAGNOSTICS: ${{ runner.temp }}/system-smoke-compose.log
          LOOM_WORKER_TOKEN: unused-diagnostics-token
        run: |
          if [[ ! -s "${LOOM_SYSTEM_SMOKE_DIAGNOSTICS}" ]]; then
            echo "fixture diagnostics missing; capturing remaining Compose state" >&2
            # The helper captures the equivalent of
            # `--profile worker logs --no-color --tail=300` and redacts it
            # before writing to runner.temp.
            uv run --no-sync python -c \
              'from tests.system.docker_compose import preserve_compose_diagnostics; preserve_compose_diagnostics()' \
              || true
          fi
          if [[ -s "${LOOM_SYSTEM_SMOKE_DIAGNOSTICS}" ]]; then
            cat "${LOOM_SYSTEM_SMOKE_DIAGNOSTICS}"
          else
            echo "system-smoke diagnostics unavailable" >&2
          fi

      - name: Cleanup system-smoke compose stack
        if: always()
        env:
          LOOM_WORKER_TOKEN: unused-cleanup-token
        run: |
          timeout 60s docker compose -f deploy/docker-compose.test.yml \
            --profile worker down -v --remove-orphans

  staging-smoke-gate:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && 'staging-smoke-gate-manual' ||
          github.event_name == 'push' && 'staging-smoke-gate-push' ||
          needs.plan.outputs.gate_mode == 'full' &&
          needs.plan.outputs.publisher_active == 'false' &&
          'staging-smoke-gate' ||
          needs.plan.outputs.gate_mode == 'full' && 'staging-smoke-gate-attempt' ||
          'staging-smoke-gate-filtered' }}
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, smoke, system-smoke]
    steps:
      - name: Enforce selected staging smoke results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_MODE: ${{ needs.plan.outputs.gate_mode }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          SYSTEM_SMOKE_RESULT: ${{ needs.system-smoke.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          if [[ "$GATE_MODE" == "filtered" ]]; then
            [[ "$SMOKE_RESULT" == "skipped" ]] || exit 1
            exit 0
          fi
          case "$REQUIRED" in
            true|false) ;;
            *) echo "FAIL: invalid planner boolean required=${REQUIRED@Q}" >&2; exit 1 ;;
          esac
          if [[ "$REQUIRED" == "true" ]]; then
            [[ "$SMOKE_RESULT" == "success" ]] || exit 1
            [[ "$SYSTEM_SMOKE_RESULT" == "success" ]] || exit 1
          else
            [[ "$SMOKE_RESULT" == "skipped" || "$SMOKE_RESULT" == "success" ]] || exit 1
            [[ "$SYSTEM_SMOKE_RESULT" == "skipped" || "$SYSTEM_SMOKE_RESULT" == "success" ]] || exit 1
          fi
