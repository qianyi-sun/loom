# Publish benchmark bundles to HuggingFace Hub.
#
# Triggers:
#   - workflow_dispatch (manual): publish a single benchmark by slug,
#     or "all" to re-publish every adapter in REGISTRY.
#
# Requires a GitHub Environment named `huggingface-publish` with:
#   - secret HF_TOKEN - write-scope HF token for the configured org
#   - optional variable HF_ORG - defaults to "PRHW"
#   - deployment branches restricted to dev/main
#   - a maintainer approval gate before the token is exposed
#
# Publishing is a release/catalog gate. A selected benchmark that fails
# to publish must fail its matrix job so operators never mistake a green
# workflow for a published HF manifest. Each matrix job still writes a
# non-secret summary with the benchmark, target repo, and success/failure.

name: Publish benchmarks to HF Hub

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Benchmark slug (e.g. "humaneval"), or "all" for every adapter.'
        required: true
        default: "all"
      limit:
        description: "Per-benchmark task cap (blank = full set)."
        required: false
        default: ""

jobs:
  detect:
    name: Detect changed adapters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      benchmarks: ${{ steps.list.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 2
      - id: list
        name: Compute benchmark list (JSON for matrix)
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/list.json
          import json, os, pathlib, subprocess, sys
          adapter_dir = pathlib.Path(
              "packages/loom-benchmarks/loom_benchmarks/adapters",
          )
          all_slugs = sorted(
              p.stem.replace("_", "-")
              for p in adapter_dir.glob("*.py")
              if p.stem != "__init__"
          )
          ev_input = os.environ.get("EV_INPUT", "")
          if ev_input == "all":
              slugs = all_slugs
          elif ev_input:
              slugs = [ev_input]
          else:
              raise SystemExit("benchmark input is required")
          print(json.dumps(slugs))
          PY
          BENCHMARKS=$(cat /tmp/list.json)
          echo "Detected: $BENCHMARKS"
          echo "benchmarks=$BENCHMARKS" >> "$GITHUB_OUTPUT"
        env:
          EV_INPUT: ${{ github.event.inputs.benchmark || '' }}

  publish:
    name: Publish ${{ matrix.benchmark }}
    needs: detect
    if: needs.detect.outputs.benchmarks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: huggingface-publish
      url: https://huggingface.co/datasets/${{ vars.HF_ORG || 'PRHW' }}/loom-benchmark-${{ matrix.benchmark }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Fan out so each benchmark publishes in its own job — one
        # adapter's upstream failure doesn't drag the rest down.
        benchmark: ${{ fromJson(needs.detect.outputs.benchmarks) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install Python + deps
        run: |
          uv venv .venv --python 3.11
          uv pip install -e .
          uv pip install -e packages/loom-benchmarks
      - name: Validate publish gate configuration
        env:
          # Resolves from the `huggingface-publish` environment.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LOOM_HF_ORG: ${{ vars.HF_ORG || 'PRHW' }}
        run: |
          set -euo pipefail
          {
            echo "### HF benchmark publish gate"
            echo ""
            echo "- Benchmark: \`${{ matrix.benchmark }}\`"
            echo "- HF org: \`${LOOM_HF_ORG}\`"
            echo "- Target repo: https://huggingface.co/datasets/${LOOM_HF_ORG}/loom-benchmark-${{ matrix.benchmark }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "- HF_TOKEN: missing (secret value not printed)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing HF_TOKEN::Protected environment 'huggingface-publish' did not provide HF_TOKEN. Approve the environment and configure a PRHW-authorized write token, or pre-create the target dataset with write access for the token."
            exit 1
          fi

          echo "::add-mask::$HF_TOKEN"
          echo "- HF_TOKEN: configured (secret value not printed)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish ${{ matrix.benchmark }}
        env:
          # Resolves from the `huggingface-publish` environment.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LOOM_HF_ORG: ${{ vars.HF_ORG || 'PRHW' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '' }}
        run: |
          set -euo pipefail
          echo "::add-mask::$HF_TOKEN"
          args=("${{ matrix.benchmark }}" --hf-org "$LOOM_HF_ORG")
          if [ -n "$INPUT_LIMIT" ]; then
            args+=(--limit "$INPUT_LIMIT")
          fi

          if .venv/bin/python -m loom_benchmark_tool publish "${args[@]}"; then
            {
              echo ""
              echo "### Publish result"
              echo "- Status: success"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            {
              echo ""
              echo "### Publish result"
              echo "- Status: failed"
              echo "- Exit code: \`$rc\`"
              echo "- Next action: verify the \`huggingface-publish\` environment has a PRHW-authorized write token, or pre-create \`${LOOM_HF_ORG}/loom-benchmark-${{ matrix.benchmark }}\` with write access for the token."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=HF benchmark publish failed::${{ matrix.benchmark }} publish exited $rc. Check the non-secret logs above; common causes are missing HF_TOKEN, missing environment approval, or insufficient PRHW dataset write access."
            exit "$rc"
          fi
