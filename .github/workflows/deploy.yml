name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy-dev:
    if: github.event_name == 'push' || inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Dev deployment placeholder
        run: |
          echo "Deploy dev from branch: ${GITHUB_REF_NAME}"
          echo "Replace this with shared dev Docker Compose deployment after host credentials are configured."
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Production deployment placeholder
        run: |
          echo "Production deploys must come from main after a release PR from dev."
          echo "Replace this with the approved production deployment path."
