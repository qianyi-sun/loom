name: CI

run-name: CI / ${{ github.head_ref || github.ref_name }} / ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    # `labeled` is included so adding the `ci:integration` label to an
    # existing PR re-triggers CI and runs the gated `integration` job.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  merge_group:
    # Required if dev later enables GitHub merge queue: queued merge groups
    # need to emit the same required `repository-checks` context as PRs.
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      integration:
        description: "Run fast integration tier (testcontainers, no real Docker driver)"
        required: false
        type: boolean
        default: false
      coverage_summary:
        description: "Collect an optional Python coverage diagnostic report"
        required: false
        type: boolean
        default: false
      integration_docker:
        description: "Run docker-heavy integration tier (DockerDriver, trial-e2e, ~30 min)"
        required: false
        type: boolean
        default: false

# Authoritative PR events supersede older admission runs for that PR. Draft and
# unrelated metadata events use a unique slot so they cannot evict a running or
# pending head/base/selector validation when GitHub delivers events out of order.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft' ||
       (github.event.action == 'edited' && github.event.changes.base == null) ||
       ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name))) &&
      format('filtered-{0}', github.run_id) || 'authoritative' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # No pull-requests:write needed — coverage report is published via
  # the GitHub Actions step summary, not as a PR comment.

jobs:
  workflow-plan:
    name: workflow-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      event_relevant: ${{ steps.plan.outputs.event_relevant || steps.event.outputs.event_relevant }}
      full_gate: ${{ steps.plan.outputs.full_gate || steps.event.outputs.full_gate }}
      gate_mode: ${{ steps.plan.outputs.gate_mode || steps.event.outputs.gate_mode }}
      docs_only: ${{ steps.plan.outputs.docs_only || steps.event.outputs.docs_only }}
      integration: ${{ steps.plan.outputs.integration || steps.event.outputs.integration }}
      integration_docker: ${{ steps.plan.outputs.integration_docker || steps.event.outputs.integration_docker }}
      images: ${{ steps.image-plan.outputs.required || steps.event.outputs.images }}
      native_builds: ${{ steps.image-plan.outputs.native_builds || '[]' }}
      cluster_smoke: ${{ steps.plan.outputs.cluster_smoke || steps.event.outputs.cluster_smoke }}
      staging_smoke: ${{ steps.plan.outputs.staging_smoke || steps.event.outputs.staging_smoke }}
      coverage_summary: >-
        ${{ steps.plan.outputs.gate_mode == 'full' &&
            (contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') ||
             inputs.coverage_summary == true) && 'true' || 'false' }}
      web_checks: ${{ steps.plan.outputs.web_checks || steps.event.outputs.web_checks }}
    steps:
      - name: Classify filtered event before checkout
        id: event
        shell: bash
        env:
          FILTERED_EVENT: >-
            ${{ github.event_name == 'pull_request' &&
                (github.event.pull_request.draft ||
                 github.event.action == 'converted_to_draft' ||
                 (github.event.action == 'edited' &&
                  github.event.changes.base == null) ||
                 ((github.event.action == 'labeled' ||
                   github.event.action == 'unlabeled') &&
                  !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'),
                            github.event.label.name))) }}
        run: |
          set -euo pipefail
          if [[ "$FILTERED_EVENT" == "true" ]]; then
            {
              echo 'checkout_required=false'
              echo 'event_relevant=false'
              echo 'full_gate=false'
              echo 'gate_mode=filtered'
              echo 'docs_only=true'
              echo 'integration=false'
              echo 'integration_docker=false'
              echo 'images=false'
              echo 'cluster_smoke=false'
              echo 'staging_smoke=false'
              echo 'coverage_summary=false'
              echo 'web_checks=false'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'checkout_required=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.event.outputs.checkout_required == 'true'
        with:
          fetch-depth: 0

      - name: Enforce repository path policy
        if: steps.event.outputs.checkout_required == 'true'
        run: python3 scripts/check_repository_paths.py

      - name: Plan required validations
        id: plan
        if: steps.event.outputs.checkout_required == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          DISPATCH_INTEGRATION: ${{ inputs.integration }}
          DISPATCH_INTEGRATION_DOCKER: ${{ inputs.integration_docker }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              if [[ "$DISPATCH_INTEGRATION" == "true" && \
                    "$DISPATCH_INTEGRATION_DOCKER" == "true" ]]; then
                PR_LABELS_JSON='["ci:integration","ci:integration-docker"]'
              elif [[ "$DISPATCH_INTEGRATION" == "true" ]]; then
                PR_LABELS_JSON='["ci:integration"]'
              elif [[ "$DISPATCH_INTEGRATION_DOCKER" == "true" ]]; then
                PR_LABELS_JSON='["ci:integration-docker"]'
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --github-output "$GITHUB_OUTPUT"

      - name: Select affected native image builds
        id: image-plan
        if: steps.plan.outputs.gate_mode == 'full'
        env:
          CHANGED_FILES: /tmp/loom-changed-files.txt
          REQUIRED: ${{ steps.plan.outputs.images }}
          UNOWNED_RUNTIME: ${{ steps.plan.outputs.unowned_runtime }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for value in "$REQUIRED" "$UNOWNED_RUNTIME"; do
            [[ "$value" == "true" || "$value" == "false" ]] || {
              echo "FAIL: invalid image planner boolean: $value" >&2
              exit 1
            }
          done
          args=(
            plan-images
            --changed-files "$CHANGED_FILES"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$UNOWNED_RUNTIME" == "true" ]]; then
            args+=(--force-all)
          elif [[ "$REQUIRED" == "true" ]]; then
            args+=(--fallback-all)
          fi
          python3 scripts/component_ownership.py "${args[@]}"

      - name: Docs-only fast path
        if: steps.plan.outputs.docs_only == 'true'
        run: echo "Only docs/repo metadata changed; heavy checks skipped."

  images:
    needs: workflow-plan
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.images == 'true'
    uses: ./.github/workflows/images.yml
    with:
      native_builds: ${{ needs.workflow-plan.outputs.native_builds }}

  cluster-smoke:
    needs: workflow-plan
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.cluster_smoke == 'true'
    uses: ./.github/workflows/cluster-smoke.yml

  staging-smoke:
    needs: workflow-plan
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.staging_smoke == 'true'
    uses: ./.github/workflows/staging-smoke.yml

  locked-environments:
    name: locked-environment (${{ matrix.target }})
    needs: workflow-plan
    if: needs.workflow-plan.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            expected_system: Linux
            expected_machine: x86_64
            uv_checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install exact uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: ${{ matrix.uv_checksum }}
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Verify target and install locked workspace
        env:
          EXPECTED_SYSTEM: ${{ matrix.expected_system }}
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python
          uv run --no-sync python - <<'PY'
          import os
          import platform

          actual = (platform.system(), platform.machine())
          expected = (os.environ["EXPECTED_SYSTEM"], os.environ["EXPECTED_MACHINE"])
          if actual != expected:
              raise SystemExit(f"runner target mismatch: expected {expected}, got {actual}")

          import loom  # noqa: F401
          import loom_benchmark_terminal_bench_2  # noqa: F401
          import loom_benchmarks  # noqa: F401
          import loom_bundle_checksum  # noqa: F401
          import loom_launcher  # noqa: F401
          import terminalgen  # noqa: F401
          PY

  lint-and-static:
    name: lint-and-static
    runs-on: ubuntu-24.04
    needs: [workflow-plan]
    timeout-minutes: 12
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/component_ownership.py python-paths > /tmp/loom-lint-paths.txt
          mapfile -t lint_paths < /tmp/loom-lint-paths.txt
          [[ ${#lint_paths[@]} -gt 0 ]]
          uv run --no-sync ruff check "${lint_paths[@]}"

      - name: Ruff format (normalized integration suites)
        run: |
          uv run --no-sync ruff format --check \
            tests/integration/test_control_plane_client.py \
            tests/integration/test_state_patch_fenced.py \
            tests/integration/test_trajectory_index.py

      - name: Mypy (strict)
        run: uv run --no-sync mypy

      - name: Verify codegen up-to-date
        run: uv run --no-sync loom config codegen --check

      - name: Verify agent install_scripts are pinned (#317)
        run: uv run --no-sync python scripts/check_install_scripts_pinned.py

      - name: Verify GitHub Action SHA lock
        run: uv run --no-sync python scripts/check_ci_action_pins.py

      - name: Verify controlled CI upgrade policy
        run: uv run --no-sync python scripts/check_ci_upgrade_policy.py

  tests-root:
    name: tests-root (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: [workflow-plan]
    timeout-minutes: 30
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1-of-2
            shard_index: 0
          - shard: 2-of-2
            shard_index: 1
    env:
      COVERAGE_ENABLED: ${{ needs.workflow-plan.outputs.coverage_summary }}
      COVERAGE_FILE: .coverage.root-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned root shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: 2
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/tests-root-manifest.txt"
          uv run --no-sync python scripts/component_ownership.py test-paths --lane tests-root \
            --shard-index "${SHARD_INDEX}" --shard-count "${SHARD_COUNT}" \
            > "${manifest_paths_file}"
          mapfile -t test_paths < "${manifest_paths_file}"
          [[ ${#test_paths[@]} -gt 0 ]]
          coverage_args=(-p no:cov)
          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            coverage_args=(--cov=src --cov=packages --cov-report=)
          fi
          uv run --no-sync pytest -m "not legacy_pool" "${test_paths[@]}" \
            --durations=25 \
            "${coverage_args[@]}"

      - name: Build and exercise non-editable runtime wheel
        if: matrix.shard_index == 0
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="${RUNNER_TEMP}/loom-wheel"
          rm -rf "${wheel_dir}"
          uv build --wheel --out-dir "${wheel_dir}"
          wheels=("${wheel_dir}"/loom-*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "expected exactly one Loom wheel" >&2
            exit 1
          fi
          uv pip install \
            --python .venv/bin/python \
            --reinstall \
            --no-deps \
            "${wheels[0]}"
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/.venv/bin/python" -I -B - <<'PY'
          from __future__ import annotations

          import os
          from importlib import resources
          from pathlib import Path

          import loom_cli
          import loom_execution_actuator.kubernetes_api
          import loom.nebius_runtime_render

          repo_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          module_path = Path(loom_cli.__file__).resolve()
          assert not module_path.is_relative_to(repo_root / "src"), module_path
          runtime_assets = {
              Path("config/loom-schema.toml"): ("loom-schema.toml",),
              Path("deploy/grafana/dashboards/operator-overview.json"): (
                  "grafana",
                  "operator-overview.json",
              ),
              Path("deploy/grafana/dashboards/control-plane.json"): (
                  "grafana",
                  "control-plane.json",
              ),
              Path("deploy/grafana/dashboards/llm-gateway.json"): (
                  "grafana",
                  "llm-gateway.json",
              ),
              Path("deploy/grafana/dashboards/loom-service.json"): (
                  "grafana",
                  "loom-service.json",
              ),
              Path("deploy/grafana/dashboards/worker.json"): (
                  "grafana",
                  "worker.json",
              ),
              Path("deploy/envoy/egress-proxy.yaml"): (
                  "envoy",
                  "egress-proxy.yaml",
              ),
          }
          package_root = resources.files("loom_cli.data")
          for source_path, resource_parts in runtime_assets.items():
              assert package_root.joinpath(*resource_parts).read_bytes() == (
                  repo_root / source_path
              ).read_bytes()
          assert (
              resources.files("loom_cli.templates.k8s")
              .joinpath("_env.j2")
              .read_text(encoding="utf-8")
              .strip()
          )
          PY

      - name: Upload root coverage data
        if: success() && env.COVERAGE_ENABLED == 'true'
        # Optional telemetry transport never changes functional test admission.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-root-${{ matrix.shard }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error

  tests-packages:
    name: tests-packages
    runs-on: ubuntu-24.04
    needs: [workflow-plan]
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    env:
      COVERAGE_FILE: .coverage.packages
      COVERAGE_ENABLED: ${{ needs.workflow-plan.outputs.coverage_summary }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned package lane
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_paths < <(
            uv run --no-sync python scripts/component_ownership.py test-paths --lane tests-packages
          )
          [[ ${#test_paths[@]} -gt 0 ]]
          coverage_args=(-p no:cov)
          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            coverage_args=(--cov=src --cov=packages --cov-report=)
          fi
          uv run --no-sync pytest -m "not legacy_pool" "${test_paths[@]}" \
            "${coverage_args[@]}"

      - name: Upload package coverage data
        if: success() && env.COVERAGE_ENABLED == 'true'
        # Optional telemetry transport never changes functional test admission.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-packages
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: warn

  runtime-payload:
    name: runtime-payload
    runs-on: ubuntu-24.04
    needs: [workflow-plan]
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      (needs.workflow-plan.outputs.gate_mode == 'full' ||
       needs.workflow-plan.outputs.gate_mode == 'preflight')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Execute manifest-owned runtime payload conformance
        run: python3 scripts/runtime_payload_conformance.py

  nebius-iac:
    name: nebius-iac
    runs-on: ubuntu-latest
    needs: [workflow-plan]
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      (needs.workflow-plan.outputs.gate_mode == 'full' ||
       needs.workflow-plan.outputs.gate_mode == 'preflight')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate Nebius repository contract
        run: python3 scripts/check_nebius_iac.py

      - name: Install exact Terraform
        env:
          TERRAFORM_VERSION: "1.16.0"
          TERRAFORM_LINUX_AMD64_SHA256: 41d05b927aa174f15d1228c4eba832a323b716c68b415ef5a00179f46cc602d3
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          install_dir="${RUNNER_TEMP}/terraform-bin"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Validate pinned Nebius module and stack
        run: |
          set -euo pipefail
          terraform fmt -check -recursive deploy/terraform/nebius
          terraform -chdir=deploy/terraform/nebius/modules/execution-target init -backend=false -input=false
          # The reusable module requires an aliased provider configuration;
          # its mock-backed tests supply both provider instances explicitly.
          terraform -chdir=deploy/terraform/nebius/modules/execution-target test
          terraform -chdir=deploy/terraform/nebius/stack init -backend=false -input=false
          terraform -chdir=deploy/terraform/nebius/stack validate

  # Fail closed on all parallel functional checks; no report tooling needed.
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-latest
    needs:
      - workflow-plan
      - locked-environments
      - lint-and-static
      - runtime-payload
      - nebius-iac
      - tests-root
      - tests-packages
    timeout-minutes: 2
    if: >-
      always() &&
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.docs_only != 'true'
    steps:
      - name: Validate parallel check results
        env:
          PLAN_RESULT: ${{ needs.workflow-plan.result }}
          LOCKED_RESULT: ${{ needs.locked-environments.result }}
          LINT_RESULT: ${{ needs.lint-and-static.result }}
          RUNTIME_RESULT: ${{ needs.runtime-payload.result }}
          IAC_RESULT: ${{ needs.nebius-iac.result }}
          ROOT_RESULT: ${{ needs.tests-root.result }}
          PACKAGES_RESULT: ${{ needs.tests-packages.result }}
        run: |
          set -euo pipefail
          for result in \
            "$PLAN_RESULT" "$LOCKED_RESULT" "$LINT_RESULT" \
            "$RUNTIME_RESULT" "$IAC_RESULT" "$ROOT_RESULT" "$PACKAGES_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "Required parallel check result was ${result}" >&2
              exit 1
            fi
          done

  # Go binary checks (#78 Phase B). This stays separate from fast-checks
  # because Go is its own toolchain; the final repository-checks job waits
  # for both toolchains without increasing Python CI latency.
  go-checks:
    name: go-checks
    runs-on: ubuntu-24.04
    needs: [workflow-plan]
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.4'
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd/loom-execution-runtime ./cmd/loom-gateway-sandbox)
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found issues; run gofmt on the selected runtime packages to fix"
            exit 1
          fi
      - name: go vet
        run: go vet ./cmd/loom-execution-runtime/... ./cmd/loom-llm-gateway-sandbox/...
      - name: go test
        run: go test -race ./cmd/loom-execution-runtime/... ./cmd/loom-llm-gateway-sandbox/...

  # Required frontend gate. It builds and serves the production bundle under
  # a route prefix, then exercises logged-out, user, and admin paths at both
  # supported viewports with strict browser failure ledgers and axe.
  web-checks:
    name: web-checks
    runs-on: ubuntu-24.04
    needs: [workflow-plan]
    timeout-minutes: 20
    if: >-
      needs.workflow-plan.outputs.web_checks == 'true' &&
      (needs.workflow-plan.outputs.gate_mode == 'full' ||
       needs.workflow-plan.outputs.gate_mode == 'preflight')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen frontend dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript strict and ESLint
        working-directory: web
        run: |
          npm run typecheck
          npm run lint

      - name: Vitest coverage gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t owned_tests < <(
            python3 scripts/component_ownership.py test-paths --lane frontend
          )
          [[ ${#owned_tests[@]} -gt 0 ]]
          web_tests=()
          for test_path in "${owned_tests[@]}"; do
            [[ "$test_path" == web/* ]]
            web_tests+=("${test_path#web/}")
          done
          cd web
          npx --no-install vitest run --coverage \
            "${web_tests[@]}" \
            scripts/frontend-route-browser-smoke.test.mjs

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Prefix-route browser, axe, console, and network gate
        working-directory: web
        run: npm run test:e2e

  # Fast integration tier — testcontainers Postgres + MinIO only.
  # Excludes the `@pytest.mark.docker` tests (real DockerDriver,
  # network-policy, trial-e2e, subprocess-agent, gateway-with-litellm).
  # Issue #7: split into fast + docker tiers so the fast tier fits in
  # ~10 min and the planner selects each tier from paths or opt-in labels.
  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: [workflow-plan]
    timeout-minutes: 40
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1-of-2
            shard_index: 0
          - shard: 2-of-2
            shard_index: 1
    env:
      COVERAGE_ENABLED: ${{ needs.workflow-plan.outputs.coverage_summary }}
      COVERAGE_FILE: .coverage.integration-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — integration (fast tier, no docker)
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: 2
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/integration-manifest.txt"
          uv run --no-sync python scripts/component_ownership.py test-paths --lane integration \
            --shard-index "${SHARD_INDEX}" --shard-count "${SHARD_COUNT}" \
            > "${manifest_paths_file}"
          mapfile -t test_paths < "${manifest_paths_file}"
          [[ ${#test_paths[@]} -gt 0 ]]
          coverage_args=(-p no:cov)
          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            coverage_args=(--cov=src --cov=packages --cov-report=)
          fi
          uv run --no-sync pytest "${test_paths[@]}" \
            -m "not docker and not legacy_pool" \
            --durations=15 \
            "${coverage_args[@]}"

      # Upload instrumentation only for explicitly requested diagnostics.
      - name: Upload integration coverage data
        if: success() && env.COVERAGE_ENABLED == 'true'
        # Optional telemetry transport never changes functional test admission.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-integration-${{ matrix.shard }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error

  # Docker-heavy tier: real DockerDriver / network-policy / trial-e2e /
  # subprocess-agent / gateway-with-litellm. Cost ~15-25 min and
  # spins up dozens of containers, so the planner limits it to relevant
  # paths, the `ci:integration-docker` label, or a workflow_dispatch input.
  integration-docker:
    name: integration-docker
    runs-on: ubuntu-24.04
    needs: [workflow-plan]
    timeout-minutes: 40
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.integration_docker == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — integration (docker tier)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_paths < <(
            uv run --no-sync python scripts/component_ownership.py test-paths --lane integration-docker
          )
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest -m "not legacy_pool" "${test_paths[@]}" \
            --durations=15

  # Explicit diagnostics only. Reporting is outside required admission and does
  # not impose a repository-wide coverage percentage on the migrated scope.
  coverage-summary:
    name: coverage-summary
    runs-on: ubuntu-latest
    needs: [workflow-plan, tests-root, tests-packages, integration]
    if: >-
      always() &&
      needs.workflow-plan.outputs.coverage_summary == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.tests-root.result == 'success' &&
      needs.tests-packages.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked coverage tool
        run: uv sync --locked --only-group ci-coverage --python 3.11

      - name: Download root coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-root-*
          path: cov-inputs
          merge-multiple: true

      - name: Download package coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data-packages
          path: cov-inputs

      - name: Download integration coverage
        if: needs.integration.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-integration-*
          path: cov-inputs
          merge-multiple: true

      - name: Combine and report coverage diagnostics
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          uv run --no-sync coverage combine cov-inputs
          uv run --no-sync coverage xml
          uv run --no-sync coverage report > coverage-report.txt
          {
            echo "## Python coverage diagnostics"
            echo ""
            echo "Measured root and package tests; integration result: ${INTEGRATION_RESULT}."
            echo "This report is diagnostic and has no percentage threshold."
            echo '```'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-diagnostics
          path: |
            coverage.xml
            coverage-report.txt
          if-no-files-found: error

  repository-checks:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && 'repository-checks-manual' ||
          github.event_name == 'push' && 'repository-checks-push' ||
          needs.workflow-plan.outputs.gate_mode == 'full' && 'repository-checks' ||
          'repository-checks-filtered' }}
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.workflow-plan.outputs.gate_mode != 'filtered'
    needs:
      - workflow-plan
      - images
      - cluster-smoke
      - staging-smoke
      - fast-checks
      - go-checks
      - integration
      - integration-docker
      - web-checks
    steps:
      - name: Enforce selected validation results
        env:
          PLAN_RESULT: ${{ needs.workflow-plan.result }}
          GATE_MODE: ${{ needs.workflow-plan.outputs.gate_mode }}
          IMAGES_SELECTED: ${{ needs.workflow-plan.outputs.images }}
          IMAGES_RESULT: ${{ needs.images.result }}
          CLUSTER_SELECTED: ${{ needs.workflow-plan.outputs.cluster_smoke }}
          CLUSTER_RESULT: ${{ needs.cluster-smoke.result }}
          STAGING_SELECTED: ${{ needs.workflow-plan.outputs.staging_smoke }}
          STAGING_RESULT: ${{ needs.staging-smoke.result }}
          FAST_RESULT: ${{ needs.fast-checks.result }}
          GO_RESULT: ${{ needs.go-checks.result }}
          DOCS_ONLY: ${{ needs.workflow-plan.outputs.docs_only }}
          INTEGRATION_SELECTED: ${{ needs.workflow-plan.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DOCKER_SELECTED: ${{ needs.workflow-plan.outputs.integration_docker }}
          DOCKER_RESULT: ${{ needs.integration-docker.result }}
          WEB_SELECTED: ${{ needs.workflow-plan.outputs.web_checks }}
          WEB_RESULT: ${{ needs.web-checks.result }}
        run: |
          set -euo pipefail
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          if [[ "$GATE_MODE" == "filtered" ]]; then
            echo "Metadata-only event filtered."
            exit 0
          fi
          require_boolean() {
            local name="$1" value="$2"
            case "$value" in
              true|false) ;;
              *) echo "FAIL: invalid planner boolean ${name}=${value@Q}" >&2; exit 1 ;;
            esac
          }
          require_success() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "FAIL: ${name} result=${result}" >&2
              exit 1
            fi
          }
          require_selected() {
            local selected="$1" name="$2" result="$3"
            if [[ "$selected" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              echo "FAIL: unselected ${name} ended ${result}" >&2
              exit 1
            fi
          }
          require_boolean images "$IMAGES_SELECTED"
          require_boolean cluster_smoke "$CLUSTER_SELECTED"
          require_boolean staging_smoke "$STAGING_SELECTED"
          require_boolean docs_only "$DOCS_ONLY"
          require_boolean integration "$INTEGRATION_SELECTED"
          require_boolean integration_docker "$DOCKER_SELECTED"
          require_boolean web_checks "$WEB_SELECTED"
          require_success workflow-plan "$PLAN_RESULT"
          if [[ "$DOCS_ONLY" == "true" ]]; then
            require_selected false fast-checks "$FAST_RESULT"
            require_selected false go-checks "$GO_RESULT"
          else
            require_success fast-checks "$FAST_RESULT"
            require_success go-checks "$GO_RESULT"
          fi
          require_selected "$WEB_SELECTED" web-checks "$WEB_RESULT"
          require_selected "$INTEGRATION_SELECTED" integration "$INTEGRATION_RESULT"
          require_selected "$DOCKER_SELECTED" integration-docker "$DOCKER_RESULT"
          require_selected "$IMAGES_SELECTED" images "$IMAGES_RESULT"
          require_selected "$CLUSTER_SELECTED" cluster-smoke "$CLUSTER_RESULT"
          require_selected "$STAGING_SELECTED" staging-smoke "$STAGING_RESULT"
