name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    # `labeled` is included so adding the `ci:integration` label to an
    # existing PR re-triggers CI and runs the gated `integration` job.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      integration:
        description: "Run fast integration tier (testcontainers, no real Docker driver)"
        required: false
        type: boolean
        default: false
      integration_docker:
        description: "Run docker-heavy integration tier (DockerDriver, trial-e2e, ~30 min)"
        required: false
        type: boolean
        default: false

# Cancel in-flight PR runs when a newer push arrives. Pushes to dev/main
# still run the required fast gate to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # No pull-requests:write needed — coverage report is published via
  # the GitHub Actions step summary, not as a PR comment.

jobs:
  # Job name must stay `repository-checks` — the dev branch protection
  # rule lists this exact context as a required status check.
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
    # Skip on push to dev: every squash-merge to dev carries the same
    # content the PR CI just validated, so re-running burns minutes
    # for no signal. Push to main still runs (release-branch safety
    # net). All PRs still run.
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect docs-only PR
        id: docs_only
        shell: bash
        run: |
          set -euo pipefail
          docs_only=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            docs_only=true
            changed_files=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "$GITHUB_SHA")
            if [[ -z "$changed_files" ]]; then
              docs_only=false
            else
              while IFS= read -r path; do
                case "$path" in
                  *.md|docs/*|.gitignore|LICENSE|.editorconfig)
                    ;;
                  .github/CODEOWNERS)
                    ;;
                  .github/PULL_REQUEST_TEMPLATE.md)
                    ;;
                  .github/ISSUE_TEMPLATE/*)
                    ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done <<< "$changed_files"
            fi
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          {
            echo "## repository-checks input"
            echo ""
            echo "docs_only=${docs_only}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docs-only fast path
        if: steps.docs_only.outputs.docs_only == 'true'
        run: echo "Only docs/repo metadata changed; heavy checks skipped."

      - name: Install uv
        if: steps.docs_only.outputs.docs_only != 'true'
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        if: steps.docs_only.outputs.docs_only != 'true'
        run: uv python install 3.11

      - name: Cache .venv
        id: cache-venv
        if: steps.docs_only.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'packages/*/pyproject.toml', 'uv.lock') }}

      - name: Install project + dev deps + sibling packages
        if: steps.docs_only.outputs.docs_only != 'true'
        run: |
          if [[ ! -d .venv ]]; then
            uv venv --python 3.11
          fi
          uv pip install -e ".[dev]"
          uv pip install -e packages/loom-launcher
          uv pip install -e packages/loom-benchmarks
          uv pip install -e packages/loom-benchmark-terminal-bench-2

      - name: Ruff
        if: steps.docs_only.outputs.docs_only != 'true'
        run: uv run ruff check src tests

      - name: Mypy (strict)
        if: steps.docs_only.outputs.docs_only != 'true'
        run: uv run mypy

      - name: Verify codegen up-to-date
        if: steps.docs_only.outputs.docs_only != 'true'
        run: uv run loom config codegen --check

      - name: Verify agent install_scripts are pinned (#317)
        if: steps.docs_only.outputs.docs_only != 'true'
        run: uv run python scripts/check_install_scripts_pinned.py

      - name: Pytest — unit + contract + property + loom_cli
        if: steps.docs_only.outputs.docs_only != 'true'
        run: |
          uv run pytest \
            tests/unit tests/contract tests/property tests/loom_cli tests/ops \
            --cov=src --cov=packages \
            --cov-report=term --cov-report=xml

      - name: Pytest — sibling packages
        if: steps.docs_only.outputs.docs_only != 'true'
        run: |
          uv run pytest \
            packages/loom-launcher/tests \
            packages/loom-benchmarks/tests \
            packages/loom-benchmark-terminal-bench-2/tests \
            --cov=src --cov=packages --cov-append \
            --cov-report=term --cov-report=xml

      - name: Upload coverage.xml
        if: always() && steps.docs_only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-fast
          path: coverage.xml
          if-no-files-found: warn

      # Binary .coverage data file (SQLite) consumed by coverage-summary
      # job to combine with integration-tier coverage.
      - name: Upload fast-tier coverage data
        if: always() && steps.docs_only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-fast
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn

      # Phase 2 of #260: gate at 70 % (baseline ~72 % minus 2 pp
      # headroom). Runs on push AND PR — any drop below the floor
      # fails the job. Raise the floor in this step when baseline
      # grows. Combined-tier baseline collection (Phase 3) happens in
      # the `coverage-summary` job; no combined-tier gate yet.
      - name: Coverage gate (fast tier)
        if: steps.docs_only.outputs.docs_only != 'true'
        run: uv run coverage report --fail-under=70

  # Go binary checks (#78 Phase B). Separate from repository-checks
  # because Go is its own toolchain — running it here keeps Python CI
  # latency low and avoids cross-language contamination. Not required
  # by branch protection; signal-only until Phase B lands in earnest.
  go-checks:
    name: go-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd/)
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found issues; run \`gofmt -w ./cmd/\` to fix"
            exit 1
          fi
      - name: go vet
        run: go vet ./cmd/...
      - name: go test
        run: go test -race ./cmd/...

  # Fast integration tier — testcontainers Postgres + MinIO only.
  # Excludes the `@pytest.mark.docker` tests (real DockerDriver,
  # network-policy, trial-e2e, subprocess-agent, gateway-with-litellm).
  # Issue #7: split into fast + docker tiers so the fast tier fits in
  # ~10 min and the docker tier opts in.
  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: repository-checks
    timeout-minutes: 20
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:integration')) ||
      (github.event_name == 'workflow_dispatch' && inputs.integration)
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Cache .venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'packages/*/pyproject.toml', 'uv.lock') }}

      - name: Install project + dev deps + sibling packages
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
          uv pip install -e packages/loom-launcher
          uv pip install -e packages/loom-benchmarks

      - name: Pytest — integration (fast tier, no docker)
        run: |
          uv run pytest tests/integration \
            -m "not docker" \
            --durations=15 \
            --cov=src --cov=packages --cov-report=term

      # Binary .coverage data file consumed by coverage-summary to
      # combine with fast-tier coverage. No standalone gate yet —
      # collecting combined-tier baseline first (Phase 3 of #260).
      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn

  # Docker-heavy tier: real DockerDriver / network-policy / trial-e2e /
  # subprocess-agent / gateway-with-litellm. Cost ~15-25 min and
  # spins up dozens of containers, so this is opt-in via the
  # `ci:integration-docker` label or a workflow_dispatch input.
  integration-docker:
    name: integration-docker
    runs-on: ubuntu-latest
    needs: repository-checks
    timeout-minutes: 40
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:integration-docker')) ||
      (github.event_name == 'workflow_dispatch' && inputs.integration_docker)
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Cache .venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'packages/*/pyproject.toml', 'uv.lock') }}

      - name: Install project + dev deps + sibling packages
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
          uv pip install -e packages/loom-launcher
          uv pip install -e packages/loom-benchmarks

      - name: Pytest — integration (docker tier)
        run: |
          uv run pytest tests/integration \
            -m "docker" \
            --durations=15

  # Combines fast-tier + integration-tier coverage (when the
  # integration job ran) and writes the summary to the workflow
  # run's step-summary markdown. Was previously posting a PR
  # comment via `gh pr comment` — that triggered an email to PR
  # authors on every push, which is noise. Step summary surfaces
  # the same info at the workflow page + PR Checks tab.
  coverage-summary:
    name: coverage-summary
    runs-on: ubuntu-latest
    needs: [repository-checks, integration]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.repository-checks.result == 'success' &&
      needs.repository-checks.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install coverage
        run: |
          uv venv --python 3.11
          uv pip install 'coverage>=7'

      - name: Download fast-tier coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-fast
          path: cov-fast

      - name: Download integration coverage
        if: needs.integration.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-integration
          path: cov-integration

      # Writes the coverage summary to GitHub Actions' step-summary
      # markdown rather than posting a PR comment. The step summary
      # appears at the bottom of the workflow run page and at the top
      # of the PR's "Checks" tab — same info, no email spam to PR
      # authors on every push (was the case while we posted comments
      # via `gh pr comment`).
      - name: Combine + write step summary
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          fast_pct=$(uv run coverage report --data-file=cov-fast/.coverage --format=total)
          fast_summary=$(uv run coverage report --data-file=cov-fast/.coverage | tail -1)

          combined_block=""
          if [ "$INTEGRATION_RESULT" = "success" ] && [ -f cov-integration/.coverage ]; then
            cp cov-fast/.coverage .coverage.fast
            cp cov-integration/.coverage .coverage.integration
            uv run coverage combine
            combined_pct=$(uv run coverage report --format=total)
            combined_block="**Combined (fast + integration): ${combined_pct} %** (no gate yet — Phase 3 baseline)."
          elif [ "$INTEGRATION_RESULT" = "skipped" ]; then
            combined_block="_Combined coverage **not measured** this PR — apply the \`ci:integration\` label (or merge to dev) to run the integration tier._"
          else
            combined_block="_Combined coverage **not measured** — integration job result: \`${INTEGRATION_RESULT}\`._"
          fi

          {
            echo "## Coverage report"
            echo ""
            echo "**Fast tier: ${fast_pct} %** (gate ≥ 70 %)."
            echo ""
            echo "${combined_block}"
            echo ""
            echo '```'
            echo "${fast_summary}"
            echo '```'
            echo ""
            echo "Per-file XML attached as the \`coverage-xml-fast\` workflow artifact. Tracking #260."
          } >> "$GITHUB_STEP_SUMMARY"
