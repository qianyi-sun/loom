name: CI

run-name: >-
  ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.base.sha == '28aa5257927a3468ebc35ec7f245fecaf3226dbf' &&
      ' ' ||
      github.event_name == 'workflow_dispatch' &&
      format('gate=manual / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.sha,
             github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft' ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base == null)) &&
      format('gate=filtered / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha,
             github.event.pull_request.base.sha,
             github.event.pull_request.updated_at,
             github.event.action,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      format('gate=full / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha,
             github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') }}

on:
  push:
    branches: [dev, main]
  pull_request:
    # `labeled` is included so adding the `ci:integration` label to an
    # existing PR re-triggers CI and runs the gated `integration` job.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  merge_group:
    # Required if dev later enables GitHub merge queue: queued merge groups
    # need to emit the same required `repository-checks` context as PRs.
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      integration:
        description: "Run fast integration tier (testcontainers, no real Docker driver)"
        required: false
        type: boolean
        default: false
      integration_docker:
        description: "Run docker-heavy integration tier (DockerDriver, trial-e2e, ~30 min)"
        required: false
        type: boolean
        default: false

# Relevant PR authority changes cancel superseded runs. Non-PR runs are never
# canceled by this workflow.
concurrency:
  # Irrelevant metadata runs use a separate pending slot. Otherwise GitHub's
  # one-pending-run rule lets a filtered event evict the authoritative
  # replacement that must follow a canceled full run.
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base != null)) &&
      'authoritative' || 'background'
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
         (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
          contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
         (github.event.action == 'edited' && github.event.changes.base != null)) }}

permissions:
  contents: read
  # No pull-requests:write needed — coverage report is published via
  # the GitHub Actions step summary, not as a PR comment.

jobs:
  workflow-plan:
    name: workflow-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      event_relevant: ${{ steps.plan.outputs.event_relevant }}
      full_gate: ${{ steps.plan.outputs.full_gate }}
      gate_mode: ${{ steps.plan.outputs.gate_mode }}
      publisher_active: ${{ steps.plan.outputs.publisher_active }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      integration: ${{ steps.plan.outputs.integration }}
      integration_docker: ${{ steps.plan.outputs.integration_docker }}
      images: ${{ steps.plan.outputs.images }}
      cluster_smoke: ${{ steps.plan.outputs.cluster_smoke }}
      staging_smoke: ${{ steps.plan.outputs.staging_smoke }}
      coverage_summary: ${{ steps.plan.outputs.coverage_summary }}
      web_checks: ${{ steps.plan.outputs.web_checks }}
    # Skip on push to dev: every squash-merge to dev carries the same
    # content the PR CI just validated, so re-running burns minutes
    # for no signal. Push to main still runs (release-branch safety
    # net). All PRs still run.
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/dev'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Plan required validations
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          TRUSTED_PROMOTION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main' }}
          DISPATCH_INTEGRATION: ${{ inputs.integration }}
          DISPATCH_INTEGRATION_DOCKER: ${{ inputs.integration_docker }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              if [[ "$DISPATCH_INTEGRATION" == "true" && \
                    "$DISPATCH_INTEGRATION_DOCKER" == "true" ]]; then
                PR_LABELS_JSON='["ci:integration","ci:integration-docker"]'
              elif [[ "$DISPATCH_INTEGRATION" == "true" ]]; then
                PR_LABELS_JSON='["ci:integration"]'
              elif [[ "$DISPATCH_INTEGRATION_DOCKER" == "true" ]]; then
                PR_LABELS_JSON='["ci:integration-docker"]'
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --github-output "$GITHUB_OUTPUT"
          publisher_active=false
          if [[ "$TRUSTED_PROMOTION" == "true" ]]; then
            publisher_active=true
          elif [[ "$BASE_SHA" == "28aa5257927a3468ebc35ec7f245fecaf3226dbf" ]]; then
            # One-time bridge: this base has the publisher but predates its
            # dynamic run-name support. Whitespace run-name restores the fixed
            # workflow identity while the PR title carries the generation.
            publisher_active=true
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${BASE_SHA}^{tree}"
            if git show "${BASE_SHA}:.github/workflows/authoritative-gates.yml" \
                2>/dev/null | grep -Eq '^# publisher-contract: dynamic-run-name-v[12]$'; then
              publisher_active=true
            fi
          fi
          printf 'publisher_active=%s\n' "$publisher_active" >> "$GITHUB_OUTPUT"

      - name: Docs-only fast path
        if: steps.plan.outputs.docs_only == 'true'
        run: echo "Only docs/repo metadata changed; heavy checks skipped."

  locked-environments:
    name: locked-environment (${{ matrix.target }})
    needs: workflow-plan
    if: needs.workflow-plan.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            expected_system: Linux
            expected_machine: x86_64
            uv_checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            expected_system: Linux
            expected_machine: aarch64
            uv_checksum: befa1a59c91e96eb601b0fd9a97c03dd666f17baba644b2b4db9c59a767e387e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install exact uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: ${{ matrix.uv_checksum }}
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Verify target and install locked workspace
        env:
          EXPECTED_SYSTEM: ${{ matrix.expected_system }}
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python
          uv run --no-sync python - <<'PY'
          import os
          import platform

          actual = (platform.system(), platform.machine())
          expected = (os.environ["EXPECTED_SYSTEM"], os.environ["EXPECTED_MACHINE"])
          if actual != expected:
              raise SystemExit(f"runner target mismatch: expected {expected}, got {actual}")

          import loom  # noqa: F401
          import loom_benchmark_terminal_bench_2  # noqa: F401
          import loom_benchmarks  # noqa: F401
          import loom_launcher  # noqa: F401
          PY

  lint-and-static:
    name: lint-and-static
    runs-on: ubuntu-latest
    needs: workflow-plan
    timeout-minutes: 12
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Ruff
        run: uv run --no-sync ruff check src tests packages migrations

      - name: Mypy (strict)
        run: uv run --no-sync mypy

      - name: Verify codegen up-to-date
        run: uv run --no-sync loom config codegen --check

      - name: Verify agent install_scripts are pinned (#317)
        run: uv run --no-sync python scripts/check_install_scripts_pinned.py

      - name: Verify GitHub Action SHA lock
        run: uv run --no-sync python scripts/check_ci_action_pins.py

  tests-root:
    name: tests-root (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: workflow-plan
    timeout-minutes: 15
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1-of-2
            shard_index: 0
          - shard: 2-of-2
            shard_index: 1
    env:
      COVERAGE_FILE: .coverage.root-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned root shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: 2
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/tests-root-manifest.txt"
          uv run --no-sync python scripts/component_ownership.py test-paths --lane tests-root \
            --shard-index "${SHARD_INDEX}" --shard-count "${SHARD_COUNT}" \
            > "${manifest_paths_file}"
          mapfile -t test_paths < "${manifest_paths_file}"
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest "${test_paths[@]}" \
            --cov=src --cov=packages \
            --cov-report=term --cov-report=xml

      - name: Build and exercise non-editable runtime wheel
        if: matrix.shard_index == 0
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="${RUNNER_TEMP}/loom-wheel"
          rm -rf "${wheel_dir}"
          uv build --wheel --out-dir "${wheel_dir}"
          wheels=("${wheel_dir}"/loom-*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "expected exactly one Loom wheel" >&2
            exit 1
          fi
          uv pip install \
            --python .venv/bin/python \
            --reinstall \
            --no-deps \
            "${wheels[0]}"
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/.venv/bin/python" -I -B - <<'PY'
          from __future__ import annotations

          import os
          from importlib import resources
          from pathlib import Path

          import loom_cli
          import loom_cli.rollout.operator.broker
          from loom_cli.cluster_cmd import render_manifests
          from loom_cli.cluster_config import ClusterConfig

          repo_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          module_path = Path(loom_cli.__file__).resolve()
          assert not module_path.is_relative_to(repo_root / "src"), module_path
          runtime_assets = {
              Path("config/loom-schema.toml"): ("loom-schema.toml",),
              Path("deploy/grafana/dashboards/operator-overview.json"): (
                  "grafana",
                  "operator-overview.json",
              ),
              Path("deploy/grafana/dashboards/control-plane.json"): (
                  "grafana",
                  "control-plane.json",
              ),
              Path("deploy/grafana/dashboards/llm-gateway.json"): (
                  "grafana",
                  "llm-gateway.json",
              ),
              Path("deploy/grafana/dashboards/loom-service.json"): (
                  "grafana",
                  "loom-service.json",
              ),
              Path("deploy/grafana/dashboards/worker.json"): (
                  "grafana",
                  "worker.json",
              ),
              Path("deploy/envoy/egress-proxy.yaml"): (
                  "envoy",
                  "egress-proxy.yaml",
              ),
          }
          package_root = resources.files("loom_cli.data")
          for source_path, resource_parts in runtime_assets.items():
              assert package_root.joinpath(*resource_parts).read_bytes() == (
                  repo_root / source_path
              ).read_bytes()
          assert (
              resources.files("loom_cli.templates.k8s")
              .joinpath("_env.j2")
              .read_text(encoding="utf-8")
              .strip()
          )
          rendered = render_manifests(ClusterConfig())
          assert "kind: ConfigMap" in rendered
          assert "name: loom-grafana-dashboards" in rendered
          PY

      - name: Upload root coverage data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-root-${{ matrix.shard }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error

  tests-packages:
    name: tests-packages
    runs-on: ubuntu-latest
    needs: workflow-plan
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — manifest-owned package lane
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_paths < <(
            uv run --no-sync python scripts/component_ownership.py test-paths --lane tests-packages
          )
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest "${test_paths[@]}" \
            --cov=src --cov=packages \
            --cov-report=term --cov-report=xml

      - name: Upload package coverage data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-packages
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn

  runtime-payload:
    name: runtime-payload
    runs-on: ubuntu-latest
    needs: workflow-plan
    timeout-minutes: 10
    if: >-
      needs.workflow-plan.outputs.docs_only != 'true' &&
      (needs.workflow-plan.outputs.gate_mode == 'full' ||
       needs.workflow-plan.outputs.gate_mode == 'preflight')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Execute manifest-owned runtime payload conformance
        run: python3 scripts/runtime_payload_conformance.py

  # The fast Python checks run in parallel above; this aggregator owns
  # their result validation and the final fast-tier coverage gate.
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-latest
    needs:
      - workflow-plan
      - locked-environments
      - lint-and-static
      - runtime-payload
      - tests-root
      - tests-packages
    timeout-minutes: 10
    if: >-
      always() &&
      (github.event_name != 'push' || github.ref != 'refs/heads/dev') &&
      needs.workflow-plan.outputs.gate_mode == 'full'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate parallel check results
        run: |
          set -euo pipefail
          docs_only="${{ needs.workflow-plan.outputs.docs_only }}"
          if [[ "${docs_only}" == "true" ]]; then
            echo "Only docs/repo metadata changed; heavy checks skipped."
            exit 0
          fi
          for result in \
            "${{ needs.workflow-plan.result }}" \
            "${{ needs.locked-environments.result }}" \
            "${{ needs.lint-and-static.result }}" \
            "${{ needs.runtime-payload.result }}" \
            "${{ needs.tests-root.result }}" \
            "${{ needs.tests-packages.result }}"
          do
            if [[ "${result}" != "success" ]]; then
              echo "Required parallel check result was ${result}" >&2
              exit 1
            fi
          done

      - name: Install exact uv
        if: needs.workflow-plan.outputs.docs_only != 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Sync locked coverage tool
        if: needs.workflow-plan.outputs.docs_only != 'true'
        run: uv sync --locked --only-group ci-coverage --python 3.11

      - name: Download root coverage shards
        if: >-
          needs.workflow-plan.outputs.docs_only != 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-data-root-*
          path: cov-root
          merge-multiple: true

      - name: Download package coverage
        if: >-
          needs.workflow-plan.outputs.docs_only != 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-data-packages
          path: cov-packages

      - name: Combine fast-tier coverage
        if: >-
          needs.workflow-plan.outputs.docs_only != 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        run: |
          cp cov-packages/.coverage .coverage.packages
          cp .coverage.packages cov-root/.coverage.packages
          uv run --no-sync coverage combine cov-root
          uv run --no-sync coverage xml

      - name: Upload coverage.xml
        if: >-
          always() && needs.workflow-plan.outputs.docs_only != 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml-fast
          path: coverage.xml
          if-no-files-found: warn

      # Binary .coverage data file (SQLite) consumed by coverage-summary
      # job to combine with integration-tier coverage.
      - name: Upload fast-tier coverage data
        if: >-
          always() && needs.workflow-plan.outputs.docs_only != 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-fast
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn

      # Phase 2 of #260: gate at 70 % (baseline ~72 % minus 2 pp
      # headroom). Runs on push AND PR — any drop below the floor
      # fails the job. Raise the floor in this step when baseline
      # grows. Combined-tier baseline collection (Phase 3) remains
      # opt-in via the `coverage-summary` job; no combined-tier gate yet.
      - name: Coverage gate + summary (fast tier)
        if: >-
          needs.workflow-plan.outputs.docs_only != 'true' &&
          needs.workflow-plan.outputs.gate_mode == 'full'
        run: |
          set +e
          uv run --no-sync coverage report --fail-under=70 | tee coverage-report.txt
          status=${PIPESTATUS[0]}
          set -e
          fast_pct=$(uv run --no-sync coverage report --format=total)
          fast_summary=$(tail -1 coverage-report.txt)
          {
            echo "## Coverage report"
            echo ""
            echo "**Fast tier: ${fast_pct} %** (gate >= 70 %)."
            echo ""
            echo '```'
            echo "${fast_summary}"
            echo '```'
            echo ""
            echo "Per-file XML attached as the \`coverage-xml-fast\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Go binary checks (#78 Phase B). This stays separate from fast-checks
  # because Go is its own toolchain; the final repository-checks job waits
  # for both toolchains without increasing Python CI latency.
  go-checks:
    name: go-checks
    runs-on: ubuntu-latest
    needs: workflow-plan
    if: needs.workflow-plan.outputs.gate_mode == 'full'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd/)
          if [ -n "$out" ]; then
            echo "$out"
            echo "gofmt found issues; run \`gofmt -w ./cmd/\` to fix"
            exit 1
          fi
      - name: go vet
        run: go vet ./cmd/...
      - name: go test
        run: go test -race ./cmd/...

  # Required frontend gate. It builds and serves the production bundle under
  # a route prefix, then exercises logged-out, user, and admin paths at both
  # supported viewports with strict browser failure ledgers and axe.
  web-checks:
    name: web-checks
    runs-on: ubuntu-latest
    needs: workflow-plan
    timeout-minutes: 20
    if: >-
      needs.workflow-plan.outputs.web_checks == 'true' &&
      (needs.workflow-plan.outputs.gate_mode == 'full' ||
       needs.workflow-plan.outputs.gate_mode == 'preflight')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen frontend dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript strict and ESLint
        working-directory: web
        run: |
          npm run typecheck
          npm run lint

      - name: Vitest coverage gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f config/component-ownership.toml && \
                -f scripts/component_ownership.py ]] && \
             python3 scripts/component_ownership.py --help | grep -q -- 'test-paths'; then
            mapfile -t owned_tests < <(
              python3 scripts/component_ownership.py test-paths --lane frontend
            )
            [[ ${#owned_tests[@]} -gt 0 ]]
            web_tests=()
            for test_path in "${owned_tests[@]}"; do
              [[ "$test_path" == web/* ]]
              web_tests+=("${test_path#web/}")
            done
            cd web
            npx --no-install vitest run --coverage \
              "${web_tests[@]}" \
              scripts/frontend-route-browser-smoke.test.mjs \
              scripts/staging-admin-browser-smoke.test.mjs
          else
            cd web
            npm run test:coverage
          fi

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Prefix-route browser, axe, console, and network gate
        working-directory: web
        run: npm run test:e2e

  # Fast integration tier — testcontainers Postgres + MinIO only.
  # Excludes the `@pytest.mark.docker` tests (real DockerDriver,
  # network-policy, trial-e2e, subprocess-agent, gateway-with-litellm).
  # Issue #7: split into fast + docker tiers so the fast tier fits in
  # ~10 min and the planner selects each tier from paths or opt-in labels.
  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: workflow-plan
    timeout-minutes: 20
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1-of-2
            shard_index: 0
          - shard: 2-of-2
            shard_index: 1
    env:
      COVERAGE_FILE: .coverage.integration-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — integration (fast tier, no docker)
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_COUNT: 2
        run: |
          set -euo pipefail
          manifest_paths_file="${RUNNER_TEMP}/integration-manifest.txt"
          uv run --no-sync python scripts/component_ownership.py test-paths --lane integration \
            --shard-index "${SHARD_INDEX}" --shard-count "${SHARD_COUNT}" \
            --shard-strategy contiguous \
            > "${manifest_paths_file}"
          mapfile -t test_paths < "${manifest_paths_file}"
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest "${test_paths[@]}" \
            -m "not docker" \
            --durations=15 \
            --cov=src --cov=packages --cov-report=term

      # Binary .coverage data file consumed by coverage-summary to
      # combine with fast-tier coverage. No standalone gate yet —
      # collecting combined-tier baseline first (Phase 3 of #260).
      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-integration-${{ matrix.shard }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error

  # Docker-heavy tier: real DockerDriver / network-policy / trial-e2e /
  # subprocess-agent / gateway-with-litellm. Cost ~15-25 min and
  # spins up dozens of containers, so the planner limits it to relevant
  # paths, the `ci:integration-docker` label, or a workflow_dispatch input.
  integration-docker:
    name: integration-docker
    runs-on: ubuntu-latest
    needs: workflow-plan
    timeout-minutes: 40
    if: >-
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.workflow-plan.outputs.integration_docker == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked workspace
        run: |
          uv sync --locked --all-packages --extra dev --python 3.11
          uv pip check --python .venv/bin/python

      - name: Pytest — integration (docker tier)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_paths < <(
            uv run --no-sync python scripts/component_ownership.py test-paths --lane integration-docker
          )
          [[ ${#test_paths[@]} -gt 0 ]]
          uv run --no-sync pytest "${test_paths[@]}" \
            --durations=15

  # Optional PR-only combined coverage summary. The default fast-tier
  # summary is written by fast-checks so ordinary PRs do not
  # start another runner only for summary text. Apply ci:integration
  # or ci:coverage-summary when combined coverage details are useful.
  # This used to post a PR comment via `gh pr comment`; step summary
  # keeps the same information on the workflow page without email spam.
  coverage-summary:
    name: coverage-summary
    runs-on: ubuntu-latest
    needs: [workflow-plan, fast-checks, integration]
    if: >-
      always() &&
      needs.workflow-plan.outputs.coverage_summary == 'true' &&
      needs.workflow-plan.outputs.gate_mode == 'full' &&
      needs.fast-checks.result == 'success' &&
      needs.workflow-plan.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked coverage tool
        run: uv sync --locked --only-group ci-coverage --python 3.11

      - name: Download fast-tier coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-data-fast
          path: cov-fast

      - name: Download integration coverage
        if: needs.integration.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-data-integration-*
          path: cov-integration
          merge-multiple: true

      # Writes the coverage summary to GitHub Actions' step-summary
      # markdown rather than posting a PR comment. The step summary
      # appears at the bottom of the workflow run page and at the top
      # of the PR's "Checks" tab — same info, no email spam to PR
      # authors on every push (was the case while we posted comments
      # via `gh pr comment`).
      - name: Combine + write step summary
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          fast_pct=$(uv run --no-sync coverage report --data-file=cov-fast/.coverage --format=total)
          fast_summary=$(uv run --no-sync coverage report --data-file=cov-fast/.coverage | tail -1)

          combined_block=""
          if [ "$INTEGRATION_RESULT" = "success" ] && compgen -G 'cov-integration/.coverage.integration-*' >/dev/null; then
            cp cov-fast/.coverage .coverage.fast
            cp cov-integration/.coverage.integration-* .
            uv run --no-sync coverage combine
            combined_pct=$(uv run --no-sync coverage report --format=total)
            combined_block="**Combined (fast + integration): ${combined_pct} %** (no gate yet — Phase 3 baseline)."
          elif [ "$INTEGRATION_RESULT" = "skipped" ]; then
            combined_block="_Combined coverage **not measured** this PR — apply the \`ci:integration\` label (or merge to dev) to run the integration tier._"
          else
            combined_block="_Combined coverage **not measured** — integration job result: \`${INTEGRATION_RESULT}\`._"
          fi

          {
            echo "## Coverage report"
            echo ""
            echo "**Fast tier: ${fast_pct} %** (gate ≥ 70 %)."
            echo ""
            echo "${combined_block}"
            echo ""
            echo '```'
            echo "${fast_summary}"
            echo '```'
            echo ""
            echo "Per-file XML attached as the \`coverage-xml-fast\` workflow artifact. Tracking #260."
          } >> "$GITHUB_STEP_SUMMARY"

  # The bootstrap PR reports the protected context directly. Once the trusted
  # publisher exists on the base, source workflows report only attempt names.
  repository-checks:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && 'repository-checks-manual' ||
          github.event_name == 'push' && 'repository-checks-push' ||
          needs.workflow-plan.outputs.gate_mode == 'full' &&
          needs.workflow-plan.outputs.publisher_active == 'false' &&
          'repository-checks' ||
          needs.workflow-plan.outputs.gate_mode == 'full' && 'repository-checks-attempt' ||
          'repository-checks-filtered' }}
    runs-on: ubuntu-latest
    if: always() && (github.event_name != 'push' || github.ref != 'refs/heads/dev')
    needs:
      - workflow-plan
      - fast-checks
      - go-checks
      - integration
      - integration-docker
      - coverage-summary
      - web-checks
    steps:
      - name: Enforce selected validation results
        env:
          PLAN_RESULT: ${{ needs.workflow-plan.result }}
          GATE_MODE: ${{ needs.workflow-plan.outputs.gate_mode }}
          FAST_RESULT: ${{ needs.fast-checks.result }}
          GO_RESULT: ${{ needs.go-checks.result }}
          DOCS_ONLY: ${{ needs.workflow-plan.outputs.docs_only }}
          INTEGRATION_SELECTED: ${{ needs.workflow-plan.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DOCKER_SELECTED: ${{ needs.workflow-plan.outputs.integration_docker }}
          DOCKER_RESULT: ${{ needs.integration-docker.result }}
          COVERAGE_SELECTED: ${{ needs.workflow-plan.outputs.coverage_summary }}
          COVERAGE_RESULT: ${{ needs.coverage-summary.result }}
          WEB_SELECTED: ${{ needs.workflow-plan.outputs.web_checks }}
          WEB_RESULT: ${{ needs.web-checks.result }}
        run: |
          set -euo pipefail
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          if [[ "$GATE_MODE" == "filtered" ]]; then
            echo "Metadata-only event filtered."
            exit 0
          fi
          require_boolean() {
            local name="$1" value="$2"
            case "$value" in
              true|false) ;;
              *) echo "FAIL: invalid planner boolean ${name}=${value@Q}" >&2; exit 1 ;;
            esac
          }
          require_success() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "FAIL: ${name} result=${result}" >&2
              exit 1
            fi
          }
          require_selected() {
            local selected="$1" name="$2" result="$3"
            if [[ "$selected" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              echo "FAIL: unselected ${name} ended ${result}" >&2
              exit 1
            fi
          }
          require_boolean docs_only "$DOCS_ONLY"
          require_boolean integration "$INTEGRATION_SELECTED"
          require_boolean integration_docker "$DOCKER_SELECTED"
          require_boolean coverage_summary "$COVERAGE_SELECTED"
          require_boolean web_checks "$WEB_SELECTED"
          require_success workflow-plan "$PLAN_RESULT"
          require_success fast-checks "$FAST_RESULT"
          require_success go-checks "$GO_RESULT"
          require_selected "$WEB_SELECTED" web-checks "$WEB_RESULT"
          require_selected "$INTEGRATION_SELECTED" integration "$INTEGRATION_RESULT"
          require_selected "$DOCKER_SELECTED" integration-docker "$DOCKER_RESULT"
          require_selected "$COVERAGE_SELECTED" coverage-summary "$COVERAGE_RESULT"

  bootstrap-authoritative-v2:
    name: bootstrap authoritative repository-checks v2 repair
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      (contains(fromJSON('["opened","reopened","ready_for_review","synchronize"]'), github.event.action) ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base != null)) &&
      github.event.pull_request.base.sha == 'cfe71eddd9a8e768aa84d003bbf6a0bd0110f9ca' &&
      github.event.pull_request.head.ref == 'codex/833-authoritative-gates-acceptance' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [repository-checks]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish exact repair gate result
        env:
          AUTHORITATIVE_CONTEXT: repository-checks
          AUTHORITATIVE_BOOTSTRAP_GATE_RESULT: ${{ needs.repository-checks.result }}
          AUTHORITATIVE_BOOTSTRAP_WORKFLOW_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHORITATIVE_BOOTSTRAP_PULL_NUMBER: ${{ github.event.pull_request.number }}
          AUTHORITATIVE_BOOTSTRAP_DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/ops/authoritative_gate.py
          --event-path "$GITHUB_EVENT_PATH"
          --context "$AUTHORITATIVE_CONTEXT"
