name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check required files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f VERSION
          test -f docs/project-brief.md
          test -f docs/engineering/branching-and-releases.md
          test -f docs/development/docker-dev-environment.md
          test -f docs/engineering/github-setup.md
          test -f docs/engineering/release-and-environments.md
      - name: Check version format
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
      - name: Run Python unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Block common committed secrets
        run: |
          ! grep -RInE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|ghp_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' \
            --exclude-dir=.git \
            --exclude=ci.yml \
            .
