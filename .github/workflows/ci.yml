name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    # `labeled` is included so adding the `ci:integration` label to an
    # existing PR re-triggers CI and runs the gated `integration` job.
    types: [opened, synchronize, reopened, labeled]

# Cancel in-flight PR runs when a newer push arrives. Pushes to dev/main
# always run to completion (so the branch-protection gate has fresh status).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `pull-requests: write` is needed for the coverage-comment step on PRs.
  pull-requests: write

jobs:
  # Job name must stay `repository-checks` — the dev branch protection
  # rule lists this exact context as a required status check.
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project + dev deps + sibling packages
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
          uv pip install -e packages/loom-launcher
          uv pip install -e packages/loom-benchmarks
          uv pip install -e packages/loom-benchmark-terminal-bench-2

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest — unit + contract + property + loom_cli
        run: |
          uv run pytest \
            tests/unit tests/contract tests/property tests/loom_cli \
            --cov=src --cov=packages \
            --cov-report=term --cov-report=xml

      - name: Pytest — sibling packages
        run: |
          uv run pytest \
            packages/loom-launcher/tests \
            packages/loom-benchmarks/tests \
            packages/loom-benchmark-terminal-bench-2/tests \
            --cov=src --cov=packages --cov-append \
            --cov-report=term --cov-report=xml

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      # Phase 1 of #260: measurement only. No --cov-fail-under gate yet;
      # collecting baseline numbers across a few PRs first.
      - name: Coverage comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pct=$(uv run coverage report --format=total)
          summary=$(uv run coverage report | tail -1)
          {
            echo "## Coverage report"
            echo ""
            echo "**Total: ${pct}%** (fast tier only — integration tests not included)."
            echo ""
            echo '```'
            echo "$summary"
            echo '```'
            echo ""
            echo "Phase 1 of [#260](https://github.com/carinrc/loom/issues/260) — measurement only, no fail-under gate. Full per-file report attached as the \`coverage-xml\` workflow artifact."
          } > /tmp/cov-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/cov-comment.md

  # Integration suite needs Docker (testcontainers spins up Postgres +
  # MinIO). Runs on every push to dev/main; on PRs it's opt-in via the
  # `ci:integration` label so contributors can iterate without paying the
  # 5+ minute container-start cost on every push.
  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: repository-checks
    timeout-minutes: 30
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ci:integration'))
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project + dev deps + sibling packages
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
          uv pip install -e packages/loom-launcher
          uv pip install -e packages/loom-benchmarks

      - name: Pytest — integration (testcontainers)
        run: uv run pytest tests/integration
