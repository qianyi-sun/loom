name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/project-brief.md
