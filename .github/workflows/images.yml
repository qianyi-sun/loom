name: images

# Builds and (on push to dev/main) pushes multi-arch container images
# for the 5 cluster-deploy components: worker, service, control-plane,
# llm-gateway, web. Three more images (llm-gateway-sandbox,
# gateway-router, preflight) join the matrix when the corresponding
# Go binaries land in Phase 2/3.
#
# Why multi-arch: cluster-deploy target includes ASUS Ascent GX10
# (ARM v9.2-A). See docs/architecture/cluster-deploy.md.
#
# Implementation note: we don't use docker/setup-qemu-action +
# docker/setup-buildx-action + docker/build-push-action because the
# repo's GitHub Actions allowed-actions policy blocks the docker/*
# marketplace actions (confirmed via startup_failure when any of
# them is `uses:`-d — originally observed on the pre-2026-06-26
# carinrc/loom org, kept as a precaution on qianyi-sun/loom until
# the policy is re-audited). Instead we drive `docker buildx`
# directly via the CLI (built into ubuntu-latest runners since Docker
# 23) and pull `tonistiigi/binfmt` to install QEMU emulators — both
# are plain docker operations, not marketplace actions.

on:
  pull_request:
    # The workflow always reports its stable gate. The shared planner selects
    # image builds from changed paths or the additive `ci:images` label.
    types: [opened, synchronize, reopened, labeled, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev, main]
    paths:
      - "deploy/Dockerfile.*"
      - "deploy/nginx-spa.conf"
      - "deploy/web-runtime-config.sh"
      - "src/**"
      - "packages/**"
      - "pyproject.toml"
      - "web/index.html"
      - "web/package*.json"
      - "web/src/**"
      - "web/vite.config.ts"
      # Go source for the llm-gateway-sandbox binary (#547 item #3).
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
      # Markdown is never baked into the image; trailing negation
      # overrides any positive match above (e.g. packages/<x>/README.md).
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: image plan
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.required.outputs.images }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Plan required image validation
        id: required
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              PR_LABELS_JSON='["ci:images"]'
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          uv run python scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Select affected images
        id: plan
        env:
          REQUIRED: ${{ steps.required.outputs.images }}
          UNOWNED_RUNTIME: ${{ steps.required.outputs.unowned_runtime }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          images = {
              "worker": "deploy/Dockerfile.worker",
              "service": "deploy/Dockerfile.service",
              "control-plane": "deploy/Dockerfile.control-plane",
              "llm-gateway": "deploy/Dockerfile.gateway",
              "web": "deploy/Dockerfile.web",
              # #547 item #3: Go binary, distroless-static runtime.
              # NOT in python_images — built with Go toolchain.
              "llm-gateway-sandbox": "deploy/Dockerfile.gateway-sandbox",
          }
          python_images = {"worker", "service", "control-plane", "llm-gateway"}
          required = os.environ["REQUIRED"]
          unowned_runtime = os.environ["UNOWNED_RUNTIME"]
          for name, value in {
              "required": required,
              "unowned_runtime": unowned_runtime,
          }.items():
              if value not in {"true", "false"}:
                  raise SystemExit(
                      f"FAIL: invalid planner boolean {name}={value!r}"
                  )

          def all_images() -> set[str]:
              return set(images)

          def diff_names(base: str, head: str) -> list[str]:
              if not base or base.startswith("0000000"):
                  return []
              out = subprocess.check_output(
                  ["git", "diff", "--name-only", base, head],
                  text=True,
              )
              return [line.strip() for line in out.splitlines() if line.strip()]

          event = os.environ["EVENT_NAME"]
          selected: set[str] = set()
          if event in {"workflow_dispatch", "merge_group"}:
              selected = all_images()
          elif event in {"pull_request", "merge_group"}:
              changed = diff_names(os.environ["BASE_SHA"], os.environ["HEAD_SHA"])
          else:
              changed = diff_names(os.environ["BASE_SHA"], os.environ["HEAD_SHA"])

          if event not in {"workflow_dispatch", "merge_group"}:
              if not changed:
                  selected = all_images()
              for path in changed:
                  if path.endswith(".md"):
                      continue
                  if path in {
                      ".dockerignore",
                      ".github/workflows/images.yml",
                      "README.md",
                      "pyproject.toml",
                      "uv.lock",
                  }:
                      selected = all_images()
                      break
                  if path.startswith("src/"):
                      selected |= python_images
                  elif path.startswith("packages/"):
                      selected |= {"worker", "service"}
                  elif path.startswith("migrations/"):
                      selected |= {"service", "control-plane", "llm-gateway"}
                  elif path.startswith("web/") or path in {
                      "web/index.html",
                      "web/package.json",
                      "web/package-lock.json",
                      "web/vite.config.ts",
                      "deploy/nginx-spa.conf",
                      "deploy/web-runtime-config.sh",
                  }:
                      selected.add("web")
                  elif path == "deploy/Dockerfile.worker":
                      selected.add("worker")
                  elif path == "deploy/Dockerfile.service":
                      selected.add("service")
                  elif path == "deploy/Dockerfile.control-plane":
                      selected.add("control-plane")
                  elif path == "deploy/Dockerfile.gateway":
                      selected.add("llm-gateway")
                  elif path == "deploy/Dockerfile.gateway-sandbox":
                      selected.add("llm-gateway-sandbox")
                  elif path == "deploy/Dockerfile.web":
                      selected.add("web")
                  # #547 item #3: Go source or go.mod/go.sum touches
                  # rebuild the sandbox proxy image.
                  elif path.startswith("cmd/loom-llm-gateway-sandbox/") or path in {
                      "go.mod",
                      "go.sum",
                  }:
                      selected.add("llm-gateway-sandbox")
                  elif path.startswith("deploy/"):
                      selected = all_images()
                      break

          labels = set(json.loads(os.environ["PR_LABELS_JSON"] or "[]") or [])
          if "ci:images" in labels and not selected:
              selected = all_images()
          if unowned_runtime == "true":
              selected = all_images()
          elif required == "true" and not selected:
              selected = all_images()

          matrix = [
              {"image": image, "dockerfile": dockerfile}
              for image, dockerfile in images.items()
              if image in selected
          ]
          payload = json.dumps(matrix, separators=(",", ":"))
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              f"images={payload}\n"
          )
          print(f"selected_images={payload}")
          PY

  build:
    name: ${{ matrix.image }} (multi-arch)
    needs: plan
    if: >-
      github.event_name != 'push' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate image build inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "${IMAGE_NAME}:${DOCKERFILE}" in
            worker:deploy/Dockerfile.worker | \
            service:deploy/Dockerfile.service | \
            control-plane:deploy/Dockerfile.control-plane | \
            llm-gateway:deploy/Dockerfile.gateway | \
            web:deploy/Dockerfile.web | \
            llm-gateway-sandbox:deploy/Dockerfile.gateway-sandbox) ;;
            *)
              echo "FAIL: invalid image/dockerfile pair" >&2
              exit 1
              ;;
          esac
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid head SHA" >&2
            exit 1
          }
          [[ "$REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$ ]] \
            && [[ "$REF_NAME" != *..* ]] || {
            echo "FAIL: invalid ref name" >&2
            exit 1
          }
          case "$EVENT_NAME" in
            pull_request)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
                echo "FAIL: invalid pull request number" >&2
                exit 1
              }
              ;;
            merge_group | workflow_dispatch)
              [[ -z "$PR_NUMBER" ]] || {
                echo "FAIL: unexpected pull request number" >&2
                exit 1
              }
              ;;
            *)
              echo "FAIL: untrusted build event is not allowed" >&2
              exit 1
              ;;
          esac

      - name: Install QEMU + create buildx builder
        # tonistiigi/binfmt is what docker/setup-qemu-action wraps;
        # `docker buildx create --use` is what docker/setup-buildx-action
        # wraps. No marketplace actions needed.
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --name loom-builder --use --bootstrap
          docker buildx inspect

      - name: Build without registry or cache write authority
        # `docker buildx build` with explicit platforms. The buildx
        # builder created above is the default; --platform triggers
        # the cross-arch build via QEMU emulation.
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          sha_short="${HEAD_SHA:0:12}"
          case "$EVENT_NAME" in
            pull_request) image_tag="pr-${PR_NUMBER}" ;;
            merge_group) image_tag="merge-group-${sha_short}" ;;
            workflow_dispatch) image_tag="manual-${sha_short}" ;;
            *)
              echo "FAIL: untrusted build event is not allowed" >&2
              exit 1
              ;;
          esac
          build_args=(
            docker buildx build
            --platform "linux/amd64,linux/arm64"
            --file "$DOCKERFILE"
            --tag "loom-ci-${IMAGE_NAME}:${image_tag}"
            --provenance=false
            .
          )
          "${build_args[@]}"

  publish:
    name: publish ${{ matrix.image }} (multi-arch)
    needs: plan
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate image build inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          case "${IMAGE_NAME}:${DOCKERFILE}" in
            worker:deploy/Dockerfile.worker | \
            service:deploy/Dockerfile.service | \
            control-plane:deploy/Dockerfile.control-plane | \
            llm-gateway:deploy/Dockerfile.gateway | \
            web:deploy/Dockerfile.web | \
            llm-gateway-sandbox:deploy/Dockerfile.gateway-sandbox) ;;
            *)
              echo "FAIL: invalid image/dockerfile pair" >&2
              exit 1
              ;;
          esac
          [[ "$EVENT_NAME" == "push" ]] || {
            echo "FAIL: publishing requires a push event" >&2
            exit 1
          }
          [[ "$REF_NAME" == "dev" || "$REF_NAME" == "main" ]] || {
            echo "FAIL: publishing requires dev or main" >&2
            exit 1
          }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid head SHA" >&2
            exit 1
          }
          [[ "$REPOSITORY_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] || {
            echo "FAIL: invalid repository owner" >&2
            exit 1
          }
          [[ ${#GHCR_ACTOR} -le 100 \
            && "$GHCR_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\[bot\])?$ ]] || {
            echo "FAIL: invalid GHCR actor" >&2
            exit 1
          }

      - name: Install QEMU + create buildx builder
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --name loom-publisher --use --bootstrap
          docker buildx inspect

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin

      - name: Build and publish trusted image
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner_lower}/loom-${IMAGE_NAME}"
          sha_short="${HEAD_SHA:0:12}"
          build_args=(
            docker buildx build
            --platform "linux/amd64,linux/arm64"
            --file "$DOCKERFILE"
            --tag "${image}:${sha_short}"
            --tag "${image}:${REF_NAME}"
            --push
            --provenance=false
            .
          )
          "${build_args[@]}"

  images-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'images-gate-manual' || 'images-gate' }}
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, build, publish]
    steps:
      - name: Enforce selected image result
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.plan.result }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          case "$EVENT_NAME" in
            pull_request|merge_group|workflow_dispatch|push) ;;
            *) echo "FAIL: invalid event name" >&2; exit 1 ;;
          esac
          case "$REQUIRED" in
            true|false) ;;
            *) echo "FAIL: invalid planner boolean required=${REQUIRED@Q}" >&2; exit 1 ;;
          esac
          if [[ "$REQUIRED" == "true" ]]; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
              [[ "$PUBLISH_RESULT" == "success" ]] || exit 1
            else
              [[ "$BUILD_RESULT" == "success" ]] || exit 1
              [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            fi
          else
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
          fi
