      - name: Download exact service ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-service-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact web AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-web-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact web ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-web-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-builder AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-builder-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-builder ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-builder-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-activation-agent AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-activation-agent-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-activation-agent ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-activation-agent-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-native-builder-agent AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-native-builder-agent-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-native-builder-agent ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-native-builder-agent-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-scanner-cache AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-scanner-cache-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-scanner-cache ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-scanner-cache-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact scanner-cache assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-dev-scanner-cache-assets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-scanner-cache-assets

      - name: Read back nine immutable image indexes
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/loom-personal-dev-release-manifests
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for binding in \
            service=loom-service \
            web=loom-web \
            personal-dev-builder=loom-personal-dev-builder \
            personal-dev-activation-agent=loom-personal-dev-activation-agent \
            personal-dev-native-builder-agent=loom-personal-dev-native-builder-agent \
            personal-dev-scanner-cache=loom-personal-dev-scanner-cache; do
            component=${binding%%=*}
            image_name=${binding#*=}
            subject="ghcr.io/${owner_lower}/${image_name}"
            by_tag="/tmp/${component}-by-tag.json"
            by_digest="/tmp/${component}-by-digest.json"
            docker buildx imagetools inspect --raw \
              "${subject}:manifest-${HEAD_SHA}" > "$by_tag"
            digest="sha256:$(sha256sum "$by_tag" | awk '{print $1}')"
            docker buildx imagetools inspect --raw \
              "${subject}@${digest}" > "$by_digest"
            cmp --silent "$by_tag" "$by_digest"
            mv "$by_digest" \
              "/tmp/loom-personal-dev-release-manifests/${component}.json"
          done
          for key in postgres minio minio_client; do
            reference=$(jq -er --arg key "$key" \
              '.images[$key].reference' \
              deploy/dev-fleet/personal-dev-external-images.json)
            manifest="/tmp/loom-personal-dev-release-manifests/${key}.json"
            docker buildx imagetools inspect --raw "$reference" > "$manifest"
            observed="sha256:$(sha256sum "$manifest" | awk '{print $1}')"
            [[ "$reference" == *@"$observed" ]] || {
              echo "FAIL: external image index digest readback changed" >&2
              exit 1
            }
          done

      - name: Verify native builder release-management labels
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          pulled=()
          cleanup_native_builder_images() {
            for reference in "${pulled[@]}"; do
              docker image rm "$reference" >/dev/null 2>&1 || true
            done
          }
          trap cleanup_native_builder_images EXIT
          for binding in \
            personal-dev-builder=loom-personal-dev-builder \
            personal-dev-native-builder-agent=loom-personal-dev-native-builder-agent; do
            component=${binding%%=*}
            image_name=${binding#*=}
            for architecture in amd64 arm64; do
              record="/tmp/loom-personal-dev-release-records/${component}-${architecture}.json"
              digest=$(jq -er '.subject.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$record")
              reference="ghcr.io/${owner_lower}/${image_name}@${digest}"
              docker pull --quiet --platform "linux/${architecture}" "$reference" >/dev/null
              pulled+=("$reference")
              labels=$(docker image inspect --format '{{json .Config.Labels}}' "$reference")
              jq -e \
                --arg revision "$HEAD_SHA" \
                '."org.opencontainers.image.source" == "https://github.com/qianyi-sun/loom" and
                 ."org.opencontainers.image.revision" == $revision and
                 ."io.loom.personal-dev.native-builder.release-managed" == "true"' \
                <<< "$labels" >/dev/null
            done
          done

      - name: Read back exact scanner cache and service binaries
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          asset_root=/tmp/loom-personal-dev-scanner-cache-assets
          asset_evidence="$asset_root/scanner-cache-evidence.json"
          lock=deploy/dev-fleet/personal-dev-scanner-cache-lock.json
          expected_fingerprint=$(PYTHONPATH=src:. python3 \
            scripts/prepare_personal_dev_scanner_cache_assets.py \
            --lock "$lock" --verify-output "$asset_root")
          readback_root=/tmp/loom-personal-dev-scanner-readback
          mkdir -m 0700 "$readback_root"
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          service_subject="ghcr.io/${owner_lower}/loom-service"
          cache_subject="ghcr.io/${owner_lower}/loom-personal-dev-scanner-cache"
          containers=()
          images=()
          cleanup_scanner_readback() {
            for container in "${containers[@]}"; do
              docker rm -f "$container" >/dev/null 2>&1 || true
            done
            for image in "${images[@]}"; do
              docker image rm "$image" >/dev/null 2>&1 || true
            done
          }
          trap cleanup_scanner_readback EXIT
          for architecture in amd64 arm64; do
            platform="linux/${architecture}"
            service_record="/tmp/loom-personal-dev-release-records/service-${architecture}.json"
            cache_record="/tmp/loom-personal-dev-release-records/personal-dev-scanner-cache-${architecture}.json"
            service_digest=$(jq -er \
              '.subject.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
              "$service_record")
            cache_digest=$(jq -er \
              '.subject.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
              "$cache_record")
            service_reference="${service_subject}@${service_digest}"
            cache_reference="${cache_subject}@${cache_digest}"
            images+=("$service_reference" "$cache_reference")
            docker pull --quiet --platform "$platform" "$service_reference" >/dev/null
            docker pull --quiet --platform "$platform" "$cache_reference" >/dev/null

            service_container="loom-trivy-${architecture}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            cache_container="loom-scanner-cache-${architecture}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            containers+=("$service_container" "$cache_container")
            docker create --name "$service_container" "$service_reference" >/dev/null
            docker create --name "$cache_container" "$cache_reference" >/dev/null
            docker cp "${service_container}:/usr/local/bin/trivy" \
              "$readback_root/trivy-linux-${architecture}"
            cache_root="$readback_root/cache-linux-${architecture}"
            mkdir -m 0700 "$cache_root"
            docker cp \
              "${cache_container}:/opt/loom-personal-dev-scanner-cache/assets/." \
              "$cache_root"
            test "$(find "$cache_root" -mindepth 1 -printf '%P\n' | sort)" = "$(printf '%s\n' \
              db \
              db/metadata.json \
              db/trivy.db \
              java-db \
              java-db/metadata.json \
              java-db/trivy-java.db | sort)"
            test ! -e "$cache_root/scanner-cache-evidence.json"
            cp --no-preserve=mode,ownership -- "$asset_evidence" \
              "$cache_root/scanner-cache-evidence.json"
            chmod 0444 "$cache_root/scanner-cache-evidence.json"
            observed_fingerprint=$(PYTHONPATH=src:. python3 \
              scripts/prepare_personal_dev_scanner_cache_assets.py \
              --lock "$lock" --verify-output "$cache_root")
            test "$observed_fingerprint" = "$expected_fingerprint"
            docker rm "$service_container" "$cache_container" >/dev/null
          done
          for relative in \
            db/metadata.json \
            db/trivy.db \
            java-db/metadata.json \
            java-db/trivy-java.db; do
            cmp --silent \
              "$readback_root/cache-linux-amd64/$relative" \
              "$readback_root/cache-linux-arm64/$relative"
          done
          test "$(PYTHONPATH=src:. python3 \
            scripts/prepare_personal_dev_scanner_cache_assets.py \
            --lock "$lock" --verify-output "$asset_root")" = "$expected_fingerprint"

      - name: Assemble canonical personal-development release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          PYTHONPATH=src:. python3 scripts/ci_personal_dev_trusted_release.py assemble \
            --records-dir /tmp/loom-personal-dev-release-records \
            --manifests-dir /tmp/loom-personal-dev-release-manifests \
            --external-images-file deploy/dev-fleet/personal-dev-external-images.json \
            --scanner-cache-lock-file deploy/dev-fleet/personal-dev-scanner-cache-lock.json \
            --scanner-cache-evidence-file /tmp/loom-personal-dev-scanner-cache-assets/scanner-cache-evidence.json \
            --scanner-binary-amd64-file /tmp/loom-personal-dev-scanner-readback/trivy-linux-amd64 \
            --scanner-binary-arm64-file /tmp/loom-personal-dev-scanner-readback/trivy-linux-arm64 \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --source-sha "$HEAD_SHA" \
            --source-tree "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --output-dir /tmp/loom-personal-dev-trusted-release

      - name: Verify six protected Loom manifest attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          evidence=/tmp/loom-personal-dev-trusted-release/trusted-release-evidence.json
          for component in service web personal-dev-builder personal-dev-activation-agent personal-dev-native-builder-agent personal-dev-scanner-cache; do
            case "$component" in
              service)
                image_name=loom-service
                dockerfile=deploy/Dockerfile.service
                ;;
              web)
                image_name=loom-web
                dockerfile=deploy/Dockerfile.web
                ;;
              personal-dev-builder)
                image_name=loom-personal-dev-builder
                dockerfile=deploy/Dockerfile.personal-dev-builder
                ;;
              personal-dev-activation-agent)
                image_name=loom-personal-dev-activation-agent
                dockerfile=deploy/Dockerfile.personal-dev-activation-agent
                ;;
              personal-dev-native-builder-agent)
                image_name=loom-personal-dev-native-builder-agent
                dockerfile=deploy/Dockerfile.personal-dev-native-builder-agent
                ;;
              personal-dev-scanner-cache)
                image_name=loom-personal-dev-scanner-cache
                dockerfile=deploy/Dockerfile.personal-dev-scanner-cache
                ;;
              *) exit 1 ;;
            esac
            reference=$(jq -er --arg component "$component" \
              '.internal_images[$component].reference' "$evidence")
            subject_name=${reference%@*}
            subject_digest=${reference##*@}
            verification="/tmp/${component}-manifest.verified.json"
            gh attestation verify "oci://${reference}" \
              --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
              --source-digest "$HEAD_SHA" \
              --source-ref "refs/heads/${REF_NAME}" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json > "$verification"
            amd64_digest=$(jq -er --arg component "$component" \
              '.internal_images[$component].platforms["linux/amd64"].subject_digest' \
              "$evidence")
            arm64_digest=$(jq -er --arg component "$component" \
              '.internal_images[$component].platforms["linux/arm64"].subject_digest' \
              "$evidence")
            amd64_scan=$(jq -er --arg component "$component" \
              '.internal_images[$component].platforms["linux/amd64"].scan_report_sha256' \
              "$evidence")
            arm64_scan=$(jq -er --arg component "$component" \
              '.internal_images[$component].platforms["linux/arm64"].scan_report_sha256' \
              "$evidence")
            amd64_build=$(jq -cer --arg component "$component" \
              '.internal_images[$component].platforms["linux/amd64"].build' "$evidence")
            arm64_build=$(jq -cer --arg component "$component" \
              '.internal_images[$component].platforms["linux/arm64"].build' "$evidence")
            python3 scripts/ci_image_release_evidence.py verify-manifest \
              --verification "$verification" \
              --repository "$GITHUB_REPOSITORY" \
              --ref-name "$REF_NAME" \
              --head-sha "$HEAD_SHA" \
              --tree-sha "$tree_sha" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --event-name "$GITHUB_EVENT_NAME" \
              --repository-id "$GITHUB_REPOSITORY_ID" \
              --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
              --runner-environment "$RUNNER_ENVIRONMENT" \
              --image "$component" \
              --image-name "$image_name" \
              --dockerfile "$dockerfile" \
              --build-context . \
              --subject-name "$subject_name" \
              --subject-digest "$subject_digest" \
              --architecture-digest "linux/amd64=${amd64_digest}" \
              --architecture-digest "linux/arm64=${arm64_digest}" \
              --scan-report-digest "linux/amd64=${amd64_scan}" \
              --scan-report-digest "linux/arm64=${arm64_scan}" \
              --architecture-build "linux/amd64=${amd64_build}" \
              --architecture-build "linux/arm64=${arm64_build}"
          done

      - name: Revalidate canonical personal-development release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          output=/tmp/loom-personal-dev-trusted-release
          PYTHONPATH=src:. python3 scripts/ci_personal_dev_trusted_release.py validate \
            --records-dir /tmp/loom-personal-dev-release-records \
            --manifests-dir /tmp/loom-personal-dev-release-manifests \
            --external-images-file deploy/dev-fleet/personal-dev-external-images.json \
            --scanner-cache-lock-file deploy/dev-fleet/personal-dev-scanner-cache-lock.json \
            --scanner-cache-evidence-file /tmp/loom-personal-dev-scanner-cache-assets/scanner-cache-evidence.json \
            --scanner-binary-amd64-file /tmp/loom-personal-dev-scanner-readback/trivy-linux-amd64 \
            --scanner-binary-arm64-file /tmp/loom-personal-dev-scanner-readback/trivy-linux-arm64 \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --source-sha "$HEAD_SHA" \
            --source-tree "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --release-file "$output/trusted-release.json" \
            --evidence-file "$output/trusted-release-evidence.json" \
            --sha256-file "$output/trusted-release.sha256"

      - name: Upload protected personal-development trusted release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-dev-trusted-release-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/loom-personal-dev-trusted-release/trusted-release.json
            /tmp/loom-personal-dev-trusted-release/trusted-release-evidence.json
            /tmp/loom-personal-dev-trusted-release/trusted-release.sha256
          if-no-files-found: error
          retention-days: 90

  images-gate:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          needs.plan.outputs.trusted_publish == 'true' &&
          'images-gate-trusted-publish' ||
          github.event_name == 'workflow_dispatch' && 'images-gate-manual' ||
          github.event_name == 'push' && 'images-gate-push' ||
          needs.plan.outputs.gate_mode == 'full' && 'images-gate' ||
          'images-gate-filtered' }}
    runs-on: ubuntu-latest
    if: always() && needs.plan.outputs.gate_mode != 'filtered'
    needs: [plan, build, publish, publish-manifest, personal-dev-trusted-release]
    steps:
      - name: Enforce selected image result
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_PUBLISH: ${{ needs.plan.outputs.trusted_publish }}
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_MODE: ${{ needs.plan.outputs.gate_mode }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          MANIFEST_RESULT: ${{ needs.publish-manifest.result }}
          PERSONAL_DEV_RELEASE_RESULT: ${{ needs.personal-dev-trusted-release.result }}
          STANDARD_IMAGES: ${{ needs.plan.outputs.images }}
        run: |
          set -euo pipefail
          TRUSTED_PUBLISH=${TRUSTED_PUBLISH:-false}
          STANDARD_IMAGES=${STANDARD_IMAGES:-'[{}]'}
          PERSONAL_DEV_RELEASE_RESULT=${PERSONAL_DEV_RELEASE_RESULT:-skipped}
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          if [[ "$GATE_MODE" == "filtered" ]]; then
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request|merge_group|workflow_dispatch|push) ;;
            *) echo "FAIL: invalid event name" >&2; exit 1 ;;
          esac
          case "$REQUIRED" in
            true|false) ;;
            *) echo "FAIL: invalid planner boolean required=${REQUIRED@Q}" >&2; exit 1 ;;
          esac
          personal_dev_release_selected=$(python3 -c '
          import json, sys
          images = json.load(sys.stdin)
          selected = {item.get("image") for item in images if isinstance(item, dict)}
          required = {
              "service",
              "web",
              "personal-dev-builder",
              "personal-dev-activation-agent",
              "personal-dev-native-builder-agent",
              "personal-dev-scanner-cache",
          }
          print("true" if required <= selected else "false")
          ' <<< "$STANDARD_IMAGES")
          if [[ "$REQUIRED" == "true" \
                && ("$EVENT_NAME" == "push" || "$TRUSTED_PUBLISH" == "true") \
                && "$personal_dev_release_selected" == "true" ]]; then
            [[ "$PERSONAL_DEV_RELEASE_RESULT" == "success" ]] || exit 1
          else
            [[ "$PERSONAL_DEV_RELEASE_RESULT" == "skipped" ]] || exit 1
          fi
          if [[ "$REQUIRED" == "true" ]]; then
            if [[ "$EVENT_NAME" == "push" || "$TRUSTED_PUBLISH" == "true" ]]; then
              [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
              if [[ "$STANDARD_IMAGES" == "[]" ]]; then
                [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
                [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
              else
                [[ "$PUBLISH_RESULT" == "success" ]] || exit 1
                [[ "$MANIFEST_RESULT" == "success" ]] || exit 1
              fi
            else
              if [[ "$STANDARD_IMAGES" == "[]" ]]; then
                [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
              else
                [[ "$BUILD_RESULT" == "success" ]] || exit 1
              fi
              [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
              [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
            fi
          else
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
          fi
