name: images

run-name: >-
  ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.base.sha == '28aa5257927a3468ebc35ec7f245fecaf3226dbf' &&
      ' ' ||
      github.event_name == 'workflow_dispatch' &&
      format('gate=manual / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.sha,
             github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft' ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base == null)) &&
      format('gate=filtered / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha,
             github.event.pull_request.base.sha,
             github.event.pull_request.updated_at,
             github.event.action,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      format('gate=full / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha,
             github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') }}

# Builds and (on push to dev/main) publishes every release image declared
# in config/component-ownership.toml. The manifest owns image identity,
# Dockerfile, build context, and source-path selection; this workflow contains
# no editable image allowlist.
#
# Why multi-arch: cluster-deploy target includes ASUS Ascent GX10
# (ARM v9.2-A). See docs/architecture/cluster-deploy.md.
#
# Implementation note: we don't use docker/setup-qemu-action +
# docker/setup-buildx-action + docker/build-push-action because the
# repo's GitHub Actions allowed-actions policy blocks the docker/*
# marketplace actions (confirmed via startup_failure when any of
# them is `uses:`-d — originally observed on the pre-2026-06-26
# carinrc/loom org, kept as a precaution on qianyi-sun/loom until
# the policy is re-audited). Instead we drive `docker buildx`
# directly via the CLI (built into ubuntu-latest runners since Docker
# 23) and pull `tonistiigi/binfmt` to install QEMU emulators — both
# are plain docker operations, not marketplace actions.

on:
  pull_request:
    # Every relevant non-draft PR reports the protected gate name; drafts and
    # unrelated metadata events report a distinct filtered context.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Irrelevant metadata runs use a separate pending slot. Otherwise GitHub's
  # one-pending-run rule lets a filtered event evict the authoritative
  # replacement that must follow a canceled full run.
  group: >-
    images-${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base != null)) &&
      'authoritative' || 'background'
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
         (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
          contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
         (github.event.action == 'edited' && github.event.changes.base != null)) }}

jobs:
  plan:
    name: image plan
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.plan.outputs.required }}
      gate_mode: ${{ steps.required.outputs.gate_mode }}
      publisher_active: ${{ steps.required.outputs.publisher_active }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan required image validation
        id: required
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          TRUSTED_PROMOTION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              PR_LABELS_JSON='["ci:images"]'
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --github-output "$GITHUB_OUTPUT"
          publisher_active=false
          if [[ "$TRUSTED_PROMOTION" == "true" ]]; then
            publisher_active=true
          elif [[ "$BASE_SHA" == "28aa5257927a3468ebc35ec7f245fecaf3226dbf" ]]; then
            # One-time bridge: this base has the publisher but predates its
            # dynamic run-name support. Whitespace run-name restores the fixed
            # workflow identity while the PR title carries the generation.
            publisher_active=true
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${BASE_SHA}^{tree}"
            if git show "${BASE_SHA}:.github/workflows/authoritative-gates.yml" \
                2>/dev/null | grep -Fxq '# publisher-contract: dynamic-run-name-v1'; then
              publisher_active=true
            fi
          fi
          printf 'publisher_active=%s\n' "$publisher_active" >> "$GITHUB_OUTPUT"

      - name: Select affected images
        id: plan
        env:
          REQUIRED: ${{ steps.required.outputs.images }}
          UNOWNED_RUNTIME: ${{ steps.required.outputs.unowned_runtime }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: /tmp/loom-changed-files.txt
        run: |
          set -euo pipefail
          for value in "$REQUIRED" "$UNOWNED_RUNTIME"; do
            [[ "$value" == "true" || "$value" == "false" ]] || {
              echo "FAIL: invalid planner boolean: $value" >&2
              exit 1
            }
          done
          args=(
            plan-images
            --changed-files "$CHANGED_FILES"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$EVENT_NAME" == "workflow_dispatch" || \
                "$EVENT_NAME" == "merge_group" || \
                "$UNOWNED_RUNTIME" == "true" ]]; then
            args+=(--force-all)
          elif [[ "$REQUIRED" == "true" ]]; then
            args+=(--fallback-all)
          fi
          python3 scripts/component_ownership.py "${args[@]}"

  build:
    name: ${{ matrix.image }} (multi-arch)
    needs: plan
    if: >-
      github.event_name != 'push' &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate image build inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid head SHA" >&2
            exit 1
          }
          [[ "$REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$ ]] \
            && [[ "$REF_NAME" != *..* ]] || {
            echo "FAIL: invalid ref name" >&2
            exit 1
          }
          case "$EVENT_NAME" in
            pull_request)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
                echo "FAIL: invalid pull request number" >&2
                exit 1
              }
              ;;
            merge_group | workflow_dispatch)
              [[ -z "$PR_NUMBER" ]] || {
                echo "FAIL: unexpected pull request number" >&2
                exit 1
              }
              ;;
            *)
              echo "FAIL: untrusted build event is not allowed" >&2
              exit 1
              ;;
          esac

      - name: Install QEMU + create buildx builder
        # tonistiigi/binfmt is what docker/setup-qemu-action wraps;
        # `docker buildx create --use` is what docker/setup-buildx-action
        # wraps. No marketplace actions needed.
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --name loom-builder --use --bootstrap
          docker buildx inspect

      - name: Build without registry or cache write authority
        # `docker buildx build` with explicit platforms. The buildx
        # builder created above is the default; --platform triggers
        # the cross-arch build via QEMU emulation.
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          sha_short="${HEAD_SHA:0:12}"
          case "$EVENT_NAME" in
            pull_request) image_tag="pr-${PR_NUMBER}" ;;
            merge_group) image_tag="merge-group-${sha_short}" ;;
            workflow_dispatch) image_tag="manual-${sha_short}" ;;
            *)
              echo "FAIL: untrusted build event is not allowed" >&2
              exit 1
              ;;
          esac
          build_args=(
            docker buildx build
            --platform "linux/amd64,linux/arm64"
            --file "$DOCKERFILE"
            --tag "loom-ci-${IMAGE_DIGEST_NAME}:${image_tag}"
            --provenance=false
            --build-arg "LOOM_BUILD_SHA=${HEAD_SHA}"
          )
          build_args+=("$BUILD_CONTEXT")
          "${build_args[@]}"

  publish:
    name: publish ${{ matrix.image }} (multi-arch)
    needs: plan
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate image build inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT"
          [[ "$EVENT_NAME" == "push" ]] || {
            echo "FAIL: publishing requires a push event" >&2
            exit 1
          }
          [[ "$REF_NAME" == "dev" || "$REF_NAME" == "main" ]] || {
            echo "FAIL: publishing requires dev or main" >&2
            exit 1
          }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid head SHA" >&2
            exit 1
          }
          [[ "$REPOSITORY_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] || {
            echo "FAIL: invalid repository owner" >&2
            exit 1
          }
          [[ ${#GHCR_ACTOR} -le 100 \
            && "$GHCR_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\[bot\])?$ ]] || {
            echo "FAIL: invalid GHCR actor" >&2
            exit 1
          }

      - name: Install QEMU + create buildx builder
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt --install all
          docker buildx create --name loom-publisher --use --bootstrap
          docker buildx inspect

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin

      - name: Build and publish trusted image
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner_lower}/${IMAGE_DIGEST_NAME}"
          sha_short="${HEAD_SHA:0:12}"
          build_args=(
            docker buildx build
            --platform "linux/amd64,linux/arm64"
            --file "$DOCKERFILE"
            --tag "${image}:${sha_short}"
            --tag "${image}:${REF_NAME}"
            --push
            --provenance=false
            --build-arg "LOOM_BUILD_SHA=${HEAD_SHA}"
          )
          build_args+=("$BUILD_CONTEXT")
          "${build_args[@]}"

  images-gate:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && 'images-gate-manual' ||
          github.event_name == 'push' && 'images-gate-push' ||
          needs.plan.outputs.gate_mode == 'full' &&
          needs.plan.outputs.publisher_active == 'false' &&
          'images-gate' ||
          needs.plan.outputs.gate_mode == 'full' && 'images-gate-attempt' ||
          'images-gate-filtered' }}
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, build, publish]
    steps:
      - name: Enforce selected image result
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_MODE: ${{ needs.plan.outputs.gate_mode }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          if [[ "$GATE_MODE" == "filtered" ]]; then
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request|merge_group|workflow_dispatch|push) ;;
            *) echo "FAIL: invalid event name" >&2; exit 1 ;;
          esac
          case "$REQUIRED" in
            true|false) ;;
            *) echo "FAIL: invalid planner boolean required=${REQUIRED@Q}" >&2; exit 1 ;;
          esac
          if [[ "$REQUIRED" == "true" ]]; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
              [[ "$PUBLISH_RESULT" == "success" ]] || exit 1
            else
              [[ "$BUILD_RESULT" == "success" ]] || exit 1
              [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            fi
          else
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
          fi
