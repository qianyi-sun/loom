name: images

run-name: >-
  ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.base.sha == '28aa5257927a3468ebc35ec7f245fecaf3226dbf' &&
      ' ' ||
      github.event_name == 'workflow_dispatch' &&
      format('gate=manual / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.sha,
             github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft' ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base == null)) &&
      format('gate=filtered / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha,
             github.event.pull_request.base.sha,
             github.event.pull_request.updated_at,
             github.event.action,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      format('gate=full / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha,
             github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') }}

# Builds, scans, attests, verifies, and (on push to dev/main) publishes every release image declared
# in config/component-ownership.toml. The manifest owns image identity,
# Dockerfile, build context, and source-path selection; this workflow contains
# no editable image allowlist.
#
# Why native multi-arch: cluster-deploy target includes ASUS Ascent GX10
# (ARM v9.2-A). See docs/architecture/cluster-deploy.md. AMD64 and ARM64 are
# built on matching CPUs; trusted push jobs publish per-architecture tags and a
# separate job joins and verifies the manifest list.
#
# Implementation note: the workflow drives `docker buildx` directly through
# the CLI instead of depending on docker/* marketplace actions. Supported
# hosted images include the CLI; native scheduling removes binfmt/QEMU setup.

on:
  pull_request:
    # Every relevant non-draft PR reports the protected gate name; drafts and
    # unrelated metadata events report a distinct filtered context.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Irrelevant metadata runs use a separate pending slot. Otherwise GitHub's
  # one-pending-run rule lets a filtered event evict the authoritative
  # replacement that must follow a canceled full run.
  group: >-
    images-${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base != null)) &&
      'authoritative' || 'background'
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
         (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
          contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
         (github.event.action == 'edited' && github.event.changes.base != null)) }}

jobs:
  plan:
    name: image plan
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.plan.outputs.required || steps.event.outputs.required }}
      gate_mode: ${{ steps.required.outputs.gate_mode || steps.event.outputs.gate_mode }}
      publisher_active: ${{ steps.required.outputs.publisher_active || steps.event.outputs.publisher_active }}
      images: ${{ steps.plan.outputs.images || steps.event.outputs.images }}
      native_builds: ${{ steps.plan.outputs.native_builds || steps.event.outputs.native_builds }}
    steps:
      - name: Classify metadata event before checkout
        id: event
        shell: bash
        env:
          FILTERED_EVENT: >-
            ${{ github.event_name == 'pull_request' &&
                (github.event.pull_request.draft ||
                 github.event.action == 'converted_to_draft' ||
                 (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
                  !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
                 (github.event.action == 'edited' && github.event.changes.base == null)) }}
        run: |
          set -euo pipefail
          if [[ "$FILTERED_EVENT" == "true" ]]; then
            {
              echo 'checkout_required=false'
              echo 'gate_mode=filtered'
              echo 'publisher_active=false'
              echo 'required=false'
              echo 'images=[]'
              echo 'native_builds=[]'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'checkout_required=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.event.outputs.checkout_required == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan required image validation
        id: required
        if: steps.event.outputs.checkout_required == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          TRUSTED_PROMOTION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch)
              git show --pretty=format: --name-only "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              PR_LABELS_JSON='["ci:images"]'
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --github-output "$GITHUB_OUTPUT"
          publisher_active=false
          if [[ "$TRUSTED_PROMOTION" == "true" ]]; then
            publisher_active=true
          elif [[ "$BASE_SHA" == "28aa5257927a3468ebc35ec7f245fecaf3226dbf" ]]; then
            # One-time bridge: this base has the publisher but predates its
            # dynamic run-name support. Whitespace run-name restores the fixed
            # workflow identity while the PR title carries the generation.
            publisher_active=true
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${BASE_SHA}^{tree}"
            if git show "${BASE_SHA}:.github/workflows/authoritative-gates.yml" \
                2>/dev/null | grep -Eq '^# publisher-contract: dynamic-run-name-v[123]$'; then
              publisher_active=true
            fi
          fi
          printf 'publisher_active=%s\n' "$publisher_active" >> "$GITHUB_OUTPUT"

      - name: Select affected images
        id: plan
        if: steps.event.outputs.checkout_required == 'true'
        env:
          REQUIRED: ${{ steps.required.outputs.images }}
          UNOWNED_RUNTIME: ${{ steps.required.outputs.unowned_runtime }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: /tmp/loom-changed-files.txt
        run: |
          set -euo pipefail
          for value in "$REQUIRED" "$UNOWNED_RUNTIME"; do
            [[ "$value" == "true" || "$value" == "false" ]] || {
              echo "FAIL: invalid planner boolean: $value" >&2
              exit 1
            }
          done
          args=(
            plan-images
            --changed-files "$CHANGED_FILES"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$EVENT_NAME" == "workflow_dispatch" || \
                "$EVENT_NAME" == "merge_group" || \
                "$UNOWNED_RUNTIME" == "true" ]]; then
            args+=(--force-all)
          elif [[ "$REQUIRED" == "true" ]]; then
            args+=(--fallback-all)
          fi
          python3 scripts/component_ownership.py "${args[@]}"

  image-route:
    name: resolve oldlab-first image routes
    needs: plan
    if: >-
      github.event_name != 'push' &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    outputs:
      routes: ${{ steps.route.outputs.routes || '{}' }}
    steps:
      - name: Checkout trusted route action
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: qianyi-sun/loom
          ref: 119d9ffb20ef6ef9df8a224e384ca5e91721416b
          sparse-checkout: .github/actions/ci-runner-route
          path: .loom-ci-route-action
          persist-credentials: false

      - name: Select native AMD64 image keys
        id: keys
        shell: bash
        env:
          NATIVE_BUILDS: ${{ needs.plan.outputs.native_builds }}
        run: |
          python3 - <<'PY'
          import json
          import os

          builds = json.loads(os.environ["NATIVE_BUILDS"])
          # The live lease broker may still run the preceding merged contract.
          # Keep this new image on a hosted runner until that separately-owned
          # control-plane rollout has occurred.
          keys = [
              item["image"]
              for item in builds
              if item["architecture"] == "amd64"
              and item["image"] not in {
                  "capacity-manager",
                  "personal-dev-activation-agent",
                  "personal-dev-builder",
                  "pipeline-orchestrator",
              }
          ]
          if len(keys) != len(set(keys)):
              raise SystemExit("native AMD64 route keys are duplicated")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("job_keys=" + json.dumps(keys, separators=(",", ":")) + "\n")
              output.write("needs_route=" + ("true" if keys else "false") + "\n")
          PY

      - name: Resolve immutable assignments
        id: route
        if: steps.keys.outputs.needs_route == 'true'
        uses: ./.loom-ci-route-action/.github/actions/ci-runner-route
        with:
          route-mode: ${{ vars.LOOM_CI_ROUTE_MODE || 'disabled' }}
          repository: ${{ github.repository }}
          workflow-name: images
          workflow-id: '302898384'
          workflow-run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          job-keys-json: ${{ steps.keys.outputs.job_keys }}
          github-token: ${{ github.token }}

  build:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    needs: [plan, image-route]
    if: >-
      github.event_name != 'push' &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: >-
      ${{ matrix.architecture == 'arm64' && fromJSON('["ubuntu-24.04-arm"]') ||
          (matrix.image == 'capacity-manager' || matrix.image == 'personal-dev-activation-agent' || matrix.image == 'personal-dev-builder' || matrix.image == 'pipeline-orchestrator') && fromJSON('["ubuntu-24.04"]') ||
          fromJSON(needs.image-route.outputs.routes)[matrix.image] }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.native_builds) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate image build inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid head SHA" >&2
            exit 1
          }
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid base SHA" >&2
            exit 1
          }
          [[ "$REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$ ]] \
            && [[ "$REF_NAME" != *..* ]] || {
            echo "FAIL: invalid ref name" >&2
            exit 1
          }
          case "$EVENT_NAME" in
            pull_request)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
                echo "FAIL: invalid pull request number" >&2
                exit 1
              }
              ;;
            merge_group | workflow_dispatch)
              [[ -z "$PR_NUMBER" ]] || {
                echo "FAIL: unexpected pull request number" >&2
                exit 1
              }
              ;;
            *)
              echo "FAIL: untrusted build event is not allowed" >&2
              exit 1
              ;;
          esac
          case "$(uname -m):$ARCHITECTURE:$PLATFORM" in
            x86_64:amd64:linux/amd64 | aarch64:arm64:linux/arm64 | arm64:arm64:linux/arm64) ;;
            *) echo "FAIL: runner architecture does not match the build platform" >&2; exit 1 ;;
          esac

      - name: Create native buildx builder
        # `docker buildx create --use` is what docker/setup-buildx-action wraps.
        # No marketplace action, privileged binfmt container, or QEMU emulator
        # is needed because the runner CPU matches matrix.platform.
        run: |
          buildx_args=(
            docker buildx create
            --name loom-builder
            --use
            --bootstrap
          )
          if [[ -r /etc/buildkit/loom-ci.toml ]]; then
            buildx_args+=(
              --driver-opt network=host
              --buildkitd-config /etc/buildkit/loom-ci.toml
            )
          fi
          "${buildx_args[@]}"
          docker buildx inspect

      - name: Build without registry or cache write authority
        # Each job builds exactly one platform on matching native hardware and
        # always emits the exact local archive consumed by the vulnerability
        # gate. The untrusted job has no registry, cache, or secret authority.
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          sha_short="${HEAD_SHA:0:12}"
          case "$EVENT_NAME" in
            pull_request) image_tag="pr-${PR_NUMBER}" ;;
            merge_group) image_tag="merge-group-${sha_short}" ;;
            workflow_dispatch) image_tag="manual-${sha_short}" ;;
            *)
              echo "FAIL: untrusted build event is not allowed" >&2
              exit 1
              ;;
          esac
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_NUMBER" ]]; then
            image_tag="candidate-${HEAD_SHA}-${ARCHITECTURE}"
          fi
          archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.docker.tar"
          build_args=(
            docker buildx build
            --platform "$PLATFORM"
            --file "$DOCKERFILE"
            --tag "loom-ci-${IMAGE_DIGEST_NAME}:${image_tag}"
            --provenance=false
            --label "org.opencontainers.image.revision=${HEAD_SHA}"
            --build-arg "LOOM_BUILD_SHA=${HEAD_SHA}"
            --output "type=docker,dest=${archive}"
          )
          build_args+=("$BUILD_CONTEXT")
          "${build_args[@]}"

      - name: Scan native image archive
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.docker.tar
          format: json
          output: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.trivy.json
          scan-type: image
          vuln-type: os,library
          timeout: 10m0s
          exit-code: '1'
          ignore-unfixed: 'false'
          severity: CRITICAL
          scanners: vuln
          cache: 'false'

      - name: Record candidate archive provenance
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.docker.tar"
          test -s "$archive"
          archive_sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)
          archive_size=$(wc -c < "$archive" | tr -d ' ')
          artifact_name="image-candidate-archive-${IMAGE_NAME}-${ARCHITECTURE}-attempt-${RUN_ATTEMPT}"
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          python3 scripts/ci_image_candidate.py record \
            --repository "$REPOSITORY" \
            --pull-request "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --tree-sha "$tree_sha" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --context "$BUILD_CONTEXT" \
            --architecture "$ARCHITECTURE" \
            --platform "$PLATFORM" \
            --artifact-name "$artifact_name" \
            --archive-sha256 "$archive_sha256" \
            --archive-size "$archive_size" \
            --output "/tmp/${IMAGE_NAME}-${ARCHITECTURE}.json"

      - name: Upload reusable candidate archive
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-candidate-archive-${{ matrix.image }}-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.docker.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload candidate archive record
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-candidate-record-${{ matrix.image }}-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 1

  candidate-index:
    name: verify reusable image candidate index
    needs: [plan, build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download candidate archive records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-candidate-record-*-attempt-${{ github.run_attempt }}
          path: /tmp/loom-image-candidate-records
          merge-multiple: true

      - name: Aggregate exact candidate index
        shell: bash
        env:
          EXPECTED_MATRIX: ${{ needs.plan.outputs.native_builds }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 scripts/ci_image_candidate.py aggregate \
            --records-dir /tmp/loom-image-candidate-records \
            --expected-matrix-json "$EXPECTED_MATRIX" \
            --output /tmp/image-candidate-index.json

      - name: Upload reusable candidate index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-candidate-index-attempt-${{ github.run_attempt }}
          path: /tmp/image-candidate-index.json
          if-no-files-found: error
          retention-days: 1

  resolve-candidate:
    name: resolve exact merged image candidate
    needs: plan
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      available: ${{ steps.resolve.outputs.available }}
      source_head: ${{ steps.resolve.outputs.source_head }}
      source_base: ${{ steps.resolve.outputs.source_base }}
      source_tree: ${{ steps.resolve.outputs.source_tree }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_run_attempt: ${{ steps.resolve.outputs.source_run_attempt }}
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve exact successful PR candidate index
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          EXPECTED_MATRIX: ${{ needs.plan.outputs.native_builds }}
        run: |
          set -euo pipefail

          fallback() {
            builds=$(jq -cn --argjson matrix "$EXPECTED_MATRIX" \
              '$matrix | map(. + {candidate_artifact: "", archive_sha256: "", archive_size: 0})')
            {
              echo 'available=false'
              echo 'source_head='
              echo 'source_base='
              echo 'source_tree='
              echo 'source_run_id='
              echo 'source_run_attempt='
              echo "builds=$builds"
            } >> "$GITHUB_OUTPUT"
          }

          pulls=$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls")
          matches=$(jq -c \
            --arg repository "$REPOSITORY" \
            --arg ref "$REF_NAME" \
            --arg head "$HEAD_SHA" \
            '[.[] | select(.merged_at != null and .merge_commit_sha == $head and
                           .base.ref == $ref and .head.repo.full_name == $repository)]' \
            <<< "$pulls")
          if [[ "$(jq 'length' <<< "$matches")" != "1" ]]; then
            echo 'No unique same-repository merged PR; rebuilding on trusted push.'
            fallback
            exit 0
          fi

          pull_number=$(jq -r '.[0].number' <<< "$matches")
          source_head=$(jq -r '.[0].head.sha' <<< "$matches")
          source_base=$(jq -r '.[0].base.sha' <<< "$matches")
          source_tree=$(gh api "repos/${REPOSITORY}/git/commits/${source_head}" --jq .tree.sha)
          push_tree=$(git rev-parse "${HEAD_SHA}^{tree}")
          if [[ "$source_tree" != "$push_tree" ]]; then
            echo 'Merged tree differs from PR head tree; rebuilding on trusted push.'
            fallback
            exit 0
          fi

          runs=$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/actions/workflows/images.yml/runs?event=pull_request&head_sha=${source_head}&status=success&per_page=100")
          while IFS=$'\t' read -r run_id run_attempt; do
            [[ -n "$run_id" && -n "$run_attempt" ]] || continue
            candidate_dir="${RUNNER_TEMP}/image-candidate-${run_id}-${run_attempt}"
            if ! gh run download "$run_id" --repo "$REPOSITORY" \
                --name "image-candidate-index-attempt-${run_attempt}" \
                --dir "$candidate_dir" \
                >/dev/null 2>&1; then
              continue
            fi
            index_path="${candidate_dir}/image-candidate-index.json"
            candidate_output="${candidate_dir}/github-output"
            if python3 scripts/ci_image_candidate.py verify-index \
                --index "$index_path" \
                --expected-matrix-json "$EXPECTED_MATRIX" \
                --repository "$REPOSITORY" \
                --pull-request "$pull_number" \
                --head-sha "$source_head" \
                --base-sha "$source_base" \
                --tree-sha "$source_tree" \
                --run-id "$run_id" \
                --run-attempt "$run_attempt" \
                --github-output "$candidate_output"; then
              artifacts=$(gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                --jq '.artifacts[]' \
                "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                | jq -sc '.')
              required_artifacts=$(jq -c '[.builds[].candidate_artifact] | sort' \
                "$index_path")
              available_artifacts=$(jq -c \
                '[.[] | select(.expired == false) | .name] | unique | sort' \
                <<< "$artifacts")
              if ! jq -en --argjson required "$required_artifacts" \
                  --argjson available "$available_artifacts" \
                  '$required - $available | length == 0' >/dev/null; then
                echo "Candidate archives for run ${run_id} attempt ${run_attempt} are unavailable."
                continue
              fi
              cat "$candidate_output" >> "$GITHUB_OUTPUT"
              echo "Resolved candidate run ${run_id} attempt ${run_attempt}."
              exit 0
            fi
          done < <(jq -r \
            '.workflow_runs | sort_by(.created_at, .id) | reverse[] |
             [.id, .run_attempt] | @tsv' <<< "$runs")

          echo 'No exact successful candidate index; rebuilding on trusted push.'
          fallback

  publish:
    name: publish ${{ matrix.image }} (${{ matrix.platform }})
    needs: [plan, resolve-candidate]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]' &&
      needs.resolve-candidate.result == 'success'
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-candidate.outputs.builds) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate image build inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          CANDIDATE_ARTIFACT: ${{ matrix.candidate_artifact }}
          ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
          ARCHIVE_SIZE: ${{ matrix.archive_size }}
          CANDIDATE_AVAILABLE: ${{ needs.resolve-candidate.outputs.available }}
          CANDIDATE_SOURCE_HEAD: ${{ needs.resolve-candidate.outputs.source_head }}
          CANDIDATE_SOURCE_TREE: ${{ needs.resolve-candidate.outputs.source_tree }}
          CANDIDATE_SOURCE_RUN: ${{ needs.resolve-candidate.outputs.source_run_id }}
          CANDIDATE_SOURCE_ATTEMPT: ${{ needs.resolve-candidate.outputs.source_run_attempt }}
        run: |
          set -euo pipefail

          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT"
          [[ "$EVENT_NAME" == "push" ]] || {
            echo "FAIL: publishing requires a push event" >&2
            exit 1
          }
          [[ "$REF_NAME" == "dev" || "$REF_NAME" == "main" ]] || {
            echo "FAIL: publishing requires dev or main" >&2
            exit 1
          }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid head SHA" >&2
            exit 1
          }
          [[ "$REPOSITORY_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] || {
            echo "FAIL: invalid repository owner" >&2
            exit 1
          }
          [[ ${#GHCR_ACTOR} -le 100 \
            && "$GHCR_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\[bot\])?$ ]] || {
            echo "FAIL: invalid GHCR actor" >&2
            exit 1
          }
          case "$(uname -m):$ARCHITECTURE:$PLATFORM" in
            x86_64:amd64:linux/amd64 | aarch64:arm64:linux/arm64 | arm64:arm64:linux/arm64) ;;
            *) echo "FAIL: runner architecture does not match the publish platform" >&2; exit 1 ;;
          esac
          if [[ "$CANDIDATE_AVAILABLE" == "true" ]]; then
            [[ "$CANDIDATE_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$CANDIDATE_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$CANDIDATE_SOURCE_RUN" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$CANDIDATE_SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
            [[ "$CANDIDATE_ARTIFACT" == "image-candidate-archive-${IMAGE_NAME}-${ARCHITECTURE}-attempt-${CANDIDATE_SOURCE_ATTEMPT}" ]] || exit 1
            [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ "$ARCHIVE_SIZE" =~ ^[1-9][0-9]*$ ]] || exit 1
          else
            [[ -z "$CANDIDATE_SOURCE_HEAD" && -z "$CANDIDATE_SOURCE_TREE" ]] || exit 1
            [[ -z "$CANDIDATE_SOURCE_RUN" && -z "$CANDIDATE_SOURCE_ATTEMPT" ]] || exit 1
            [[ -z "$CANDIDATE_ARTIFACT" ]] || exit 1
            [[ -z "$ARCHIVE_SHA256" && "$ARCHIVE_SIZE" == "0" ]] || exit 1
          fi

      - name: Create native buildx builder
        if: matrix.candidate_artifact == ''
        run: |
          set -euo pipefail
          docker buildx create --name loom-publisher --use --bootstrap
          docker buildx inspect

      - name: Download exact PR candidate archive
        if: matrix.candidate_artifact != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ needs.resolve-candidate.outputs.source_run_id }}
          CANDIDATE_ARTIFACT: ${{ matrix.candidate_artifact }}
          IMAGE_NAME: ${{ matrix.image }}
          ARCHITECTURE: ${{ matrix.architecture }}
          ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
          ARCHIVE_SIZE: ${{ matrix.archive_size }}
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/loom-image-candidate"
          gh run download "$SOURCE_RUN_ID" --repo "$REPOSITORY" \
            --name "$CANDIDATE_ARTIFACT" --dir "$candidate_dir"
          archive="${candidate_dir}/${IMAGE_NAME}-${ARCHITECTURE}.docker.tar"
          release_archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.release.docker.tar"
          test -f "$archive"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$ARCHIVE_SIZE"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          cp "$archive" "$release_archive"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$release_archive" \
            | sha256sum --check --strict

      - name: Build trusted archive when PR candidate is unavailable
        if: matrix.candidate_artifact == ''
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          IMAGE_NAME: ${{ matrix.image }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.release.docker.tar"
          local_image="loom-ci-${IMAGE_DIGEST_NAME}:release-${HEAD_SHA}-${ARCHITECTURE}"
          docker buildx build \
            --platform "$PLATFORM" \
            --file "$DOCKERFILE" \
            --tag "$local_image" \
            --provenance=false \
            --label "org.opencontainers.image.revision=${HEAD_SHA}" \
            --build-arg "LOOM_BUILD_SHA=${HEAD_SHA}" \
            --output "type=docker,dest=${archive}" \
            "$BUILD_CONTEXT"

      - name: Scan trusted image archive
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.release.docker.tar
          format: json
          output: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.release.trivy.json
          scan-type: image
          vuln-type: os,library
          timeout: 10m0s
          exit-code: '1'
          ignore-unfixed: 'false'
          severity: CRITICAL
          scanners: vuln
          cache: 'false'

      - name: Record trusted scan digest
        id: scan
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          report="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.release.trivy.json"
          test -s "$report"
          digest=$(sha256sum "$report" | cut -d ' ' -f 1)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "report_sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin

      - name: Publish scanned architecture image
        id: architecture-publish
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ARCHITECTURE: ${{ matrix.architecture }}
          CANDIDATE_ARTIFACT: ${{ matrix.candidate_artifact }}
          CANDIDATE_SOURCE_HEAD: ${{ needs.resolve-candidate.outputs.source_head }}
        run: |
          set -euo pipefail

          archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.release.docker.tar"
          docker load --input "$archive"
          expected_revision="$HEAD_SHA"
          local_image="loom-ci-${IMAGE_DIGEST_NAME}:release-${HEAD_SHA}-${ARCHITECTURE}"
          if [[ -n "$CANDIDATE_ARTIFACT" ]]; then
            expected_revision="$CANDIDATE_SOURCE_HEAD"
            local_image="loom-ci-${IMAGE_DIGEST_NAME}:candidate-${CANDIDATE_SOURCE_HEAD}-${ARCHITECTURE}"
          fi
          inspected=$(docker image inspect "$local_image" --format '{{json .}}')
          jq -e --arg architecture "$ARCHITECTURE" --arg head "$expected_revision" \
            '.Architecture == $architecture and .Os == "linux" and
             .Config.Labels["org.opencontainers.image.revision"] == $head' \
            <<< "$inspected" >/dev/null
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner_lower}/${IMAGE_DIGEST_NAME}"
          target="${image}:build-${HEAD_SHA}-${ARCHITECTURE}"
          docker tag "$local_image" "$target"
          push_output=$(docker push "$target" 2>&1)
          printf '%s\n' "$push_output"
          mapfile -t push_digests < <(
            sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size: [0-9]+.*$/\1/p' \
              <<< "$push_output"
          )
          [[ ${#push_digests[@]} -eq 1 ]] || {
            echo "FAIL: docker push did not emit exactly one architecture digest" >&2
            exit 1
          }
          digest="${push_digests[0]}"
          registry_manifest="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.registry-manifest.json"
          docker buildx imagetools inspect --raw "${image}@${digest}" \
            > "$registry_manifest"
          jq -e \
            '.schemaVersion == 2 and
             (.config.digest | test("^sha256:[0-9a-f]{64}$")) and
             (.layers | type == "array")' \
            "$registry_manifest" >/dev/null
          {
            echo "subject_name=$image"
            echo "subject_digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare architecture release predicate
        id: architecture-evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          SCAN_REPORT_SHA256: ${{ steps.scan.outputs.report_sha256 }}
          SUBJECT_NAME: ${{ steps.architecture-publish.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.architecture-publish.outputs.subject_digest }}
          CANDIDATE_ARTIFACT: ${{ matrix.candidate_artifact }}
          CANDIDATE_SOURCE_HEAD: ${{ needs.resolve-candidate.outputs.source_head }}
          CANDIDATE_SOURCE_TREE: ${{ needs.resolve-candidate.outputs.source_tree }}
          CANDIDATE_SOURCE_RUN: ${{ needs.resolve-candidate.outputs.source_run_id }}
          CANDIDATE_SOURCE_ATTEMPT: ${{ needs.resolve-candidate.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          build_mode="trusted-rebuild"
          candidate_args=()
          if [[ -n "$CANDIDATE_ARTIFACT" ]]; then
            build_mode="verified-pr-candidate"
            candidate_args=(
              --candidate-head-sha "$CANDIDATE_SOURCE_HEAD"
              --candidate-tree-sha "$CANDIDATE_SOURCE_TREE"
              --candidate-run-id "$CANDIDATE_SOURCE_RUN"
              --candidate-run-attempt "$CANDIDATE_SOURCE_ATTEMPT"
            )
          fi
          predicate="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.slsa.json"
          python3 scripts/ci_image_release_evidence.py predicate-architecture \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --platform "$PLATFORM" \
            --architecture "$ARCHITECTURE" \
            --scan-report-sha256 "$SCAN_REPORT_SHA256" \
            --build-mode "$build_mode" \
            "${candidate_args[@]}" \
            --output "$predicate"
          {
            echo "subject_name=$SUBJECT_NAME"
            echo "subject_digest=$SUBJECT_DIGEST"
            echo "predicate=$predicate"
            echo "tree_sha=$tree_sha"
            echo "build_mode=$build_mode"
          } >> "$GITHUB_OUTPUT"

      - name: Attest published architecture digest
        id: architecture-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.architecture-evidence.outputs.subject_name }}
          subject-digest: ${{ steps.architecture-evidence.outputs.subject_digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.architecture-evidence.outputs.predicate }}
          push-to-registry: true

      - name: Verify published architecture attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.architecture-attestation.outputs.bundle-path }}
          SUBJECT_NAME: ${{ steps.architecture-evidence.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.architecture-evidence.outputs.subject_digest }}
          TREE_SHA: ${{ steps.architecture-evidence.outputs.tree_sha }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          SCAN_REPORT_SHA256: ${{ steps.scan.outputs.report_sha256 }}
          BUILD_MODE: ${{ steps.architecture-evidence.outputs.build_mode }}
          CANDIDATE_SOURCE_HEAD: ${{ needs.resolve-candidate.outputs.source_head }}
          CANDIDATE_SOURCE_TREE: ${{ needs.resolve-candidate.outputs.source_tree }}
          CANDIDATE_SOURCE_RUN: ${{ needs.resolve-candidate.outputs.source_run_id }}
          CANDIDATE_SOURCE_ATTEMPT: ${{ needs.resolve-candidate.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          candidate_args=()
          if [[ "$BUILD_MODE" == "verified-pr-candidate" ]]; then
            candidate_args=(
              --candidate-head-sha "$CANDIDATE_SOURCE_HEAD"
              --candidate-tree-sha "$CANDIDATE_SOURCE_TREE"
              --candidate-run-id "$CANDIDATE_SOURCE_RUN"
              --candidate-run-attempt "$CANDIDATE_SOURCE_ATTEMPT"
            )
          elif [[ "$BUILD_MODE" != "trusted-rebuild" ]]; then
            echo "FAIL: invalid architecture build mode" >&2
            exit 1
          fi
          verification="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.verified.json"
          gh attestation verify "oci://${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            --bundle "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
            --source-digest "$HEAD_SHA" \
            --source-ref "refs/heads/${REF_NAME}" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$verification"
          python3 scripts/ci_image_release_evidence.py verify-architecture \
            --verification "$verification" \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --platform "$PLATFORM" \
            --architecture "$ARCHITECTURE" \
            --scan-report-sha256 "$SCAN_REPORT_SHA256" \
            --build-mode "$BUILD_MODE" \
            "${candidate_args[@]}" \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --output "/tmp/${IMAGE_NAME}-${ARCHITECTURE}.verified-metadata.json"

      - name: Record verified architecture evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.architecture-evidence.outputs.tree_sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          SUBJECT_NAME: ${{ steps.architecture-evidence.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.architecture-evidence.outputs.subject_digest }}
          SCAN_REPORT_SHA256: ${{ steps.scan.outputs.report_sha256 }}
          BUILD_MODE: ${{ steps.architecture-evidence.outputs.build_mode }}
          CANDIDATE_SOURCE_HEAD: ${{ needs.resolve-candidate.outputs.source_head }}
          CANDIDATE_SOURCE_TREE: ${{ needs.resolve-candidate.outputs.source_tree }}
          CANDIDATE_SOURCE_RUN: ${{ needs.resolve-candidate.outputs.source_run_id }}
          CANDIDATE_SOURCE_ATTEMPT: ${{ needs.resolve-candidate.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          candidate_args=()
          if [[ "$BUILD_MODE" == "verified-pr-candidate" ]]; then
            candidate_args=(
              --candidate-head-sha "$CANDIDATE_SOURCE_HEAD"
              --candidate-tree-sha "$CANDIDATE_SOURCE_TREE"
              --candidate-run-id "$CANDIDATE_SOURCE_RUN"
              --candidate-run-attempt "$CANDIDATE_SOURCE_ATTEMPT"
            )
          elif [[ "$BUILD_MODE" != "trusted-rebuild" ]]; then
            echo "FAIL: invalid architecture build mode" >&2
            exit 1
          fi
          record_dir=/tmp/loom-image-release-records
          mkdir -p "$record_dir"
          python3 scripts/ci_image_release_evidence.py record-architecture \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --platform "$PLATFORM" \
            --architecture "$ARCHITECTURE" \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --scan-report-sha256 "$SCAN_REPORT_SHA256" \
            --build-mode "$BUILD_MODE" \
            "${candidate_args[@]}" \
            --output "${record_dir}/${IMAGE_NAME}-${ARCHITECTURE}.json"

      - name: Validate verified architecture evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.architecture-evidence.outputs.tree_sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python3 scripts/ci_image_release_evidence.py validate-architecture-record \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --platform "$PLATFORM" \
            --architecture "$ARCHITECTURE" \
            --record "/tmp/loom-image-release-records/${IMAGE_NAME}-${ARCHITECTURE}.json"

      - name: Upload verified architecture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-release-record-${{ matrix.image }}-${{ matrix.architecture }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-image-release-records/${{ matrix.image }}-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: publish ${{ matrix.image }} manifest
    needs: [plan, publish]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate manifest inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT"
          [[ "$REF_NAME" == "dev" || "$REF_NAME" == "main" ]] || exit 1
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$REPOSITORY_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] || exit 1
          [[ ${#GHCR_ACTOR} -le 100 \
            && "$GHCR_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\[bot\])?$ ]] || exit 1

      - name: Download exact architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-release-record-${{ matrix.image }}-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-image-release-records
          merge-multiple: true

      - name: Validate exact architecture evidence
        id: architecture-records
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          metadata="/tmp/${IMAGE_NAME}-architecture-records.json"
          python3 scripts/ci_image_release_evidence.py validate-architecture-records \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --records-dir /tmp/loom-image-release-records \
            --output "$metadata"
          {
            echo "metadata=$metadata"
            echo "subject_name=$(jq -er .subject_name "$metadata")"
            echo "tree_sha=$tree_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin

      - name: Verify architecture attestations
        id: architectures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.architecture-records.outputs.tree_sha }}
          SUBJECT_NAME: ${{ steps.architecture-records.outputs.subject_name }}
          RECORDS_METADATA: ${{ steps.architecture-records.outputs.metadata }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            platform="linux/${architecture}"
            record="/tmp/loom-image-release-records/${IMAGE_NAME}-${architecture}.json"
            subject_name=$(jq -er .subject.name "$record")
            digest=$(jq -er .subject.digest "$record")
            scan_digest=$(jq -er .scan.report_sha256 "$record")
            build_mode=$(jq -er .build.mode "$record")
            build=$(jq -cer .build "$record")
            [[ "$subject_name" == "$SUBJECT_NAME" ]] || exit 1
            candidate_args=()
            if [[ "$build_mode" == "verified-pr-candidate" ]]; then
              candidate_args=(
                --candidate-head-sha "$(jq -er .build.candidate_source.commit "$record")"
                --candidate-tree-sha "$(jq -er .build.candidate_source.tree "$record")"
                --candidate-run-id "$(jq -er .build.candidate_source.run_id "$record")"
                --candidate-run-attempt "$(jq -er .build.candidate_source.run_attempt "$record")"
              )
            elif [[ "$build_mode" != "trusted-rebuild" ]]; then
              echo "FAIL: invalid recorded architecture build mode" >&2
              exit 1
            fi
            verification="/tmp/${IMAGE_NAME}-${architecture}.registry-verified.json"
            gh attestation verify "oci://${subject_name}@${digest}" \
              --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
              --source-digest "$HEAD_SHA" \
              --source-ref "refs/heads/${REF_NAME}" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json > "$verification"
            metadata="/tmp/${IMAGE_NAME}-${architecture}.registry-metadata.json"
            python3 scripts/ci_image_release_evidence.py verify-architecture \
              --verification "$verification" \
              --repository "$GITHUB_REPOSITORY" \
              --ref-name "$REF_NAME" \
              --head-sha "$HEAD_SHA" \
              --tree-sha "$TREE_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --image "$IMAGE_NAME" \
              --image-name "$IMAGE_DIGEST_NAME" \
              --dockerfile "$DOCKERFILE" \
              --build-context "$BUILD_CONTEXT" \
              --platform "$platform" \
              --architecture "$architecture" \
              --scan-report-sha256 "$scan_digest" \
              --build-mode "$build_mode" \
              "${candidate_args[@]}" \
              --subject-name "$subject_name" \
              --subject-digest "$digest" \
              --output "$metadata"
            {
              echo "${architecture}_digest=$digest"
              echo "${architecture}_scan=$scan_digest"
              echo "${architecture}_build=$build"
            } >> "$GITHUB_OUTPUT"
          done
          echo "subject_name=$SUBJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"

      - name: Join verified native image manifest
        id: manifest-evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          AMD64_DIGEST: ${{ steps.architectures.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.architectures.outputs.arm64_digest }}
          AMD64_SCAN: ${{ steps.architectures.outputs.amd64_scan }}
          ARM64_SCAN: ${{ steps.architectures.outputs.arm64_scan }}
          AMD64_BUILD: ${{ steps.architectures.outputs.amd64_build }}
          ARM64_BUILD: ${{ steps.architectures.outputs.arm64_build }}
          TREE_SHA: ${{ steps.architectures.outputs.tree_sha }}
        run: |
          set -euo pipefail
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner_lower}/${IMAGE_DIGEST_NAME}"
          amd64_digest="$AMD64_DIGEST"
          arm64_digest="$ARM64_DIGEST"
          create_output=$(docker buildx imagetools create \
            --progress plain \
            --tag "${image}:manifest-${HEAD_SHA}" \
            "${image}@${amd64_digest}" \
            "${image}@${arm64_digest}" 2>&1)
          printf '%s\n' "$create_output"
          mapfile -t manifest_digests < <(
            sed -nE \
              's/^.*pushing manifest for .*@(sha256:[0-9a-f]{64}).*$/\1/p' \
              <<< "$create_output"
          )
          [[ ${#manifest_digests[@]} -eq 1 ]] || {
            echo "FAIL: manifest creation did not emit exactly one digest" >&2
            exit 1
          }
          manifest_digest="${manifest_digests[0]}"
          docker buildx imagetools inspect --raw "${image}@${manifest_digest}" \
            > /tmp/loom-image-manifest.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("/tmp/loom-image-manifest.json").read_text())
          subjects = {
              f"{platform['os']}/{platform['architecture']}": item.get("digest")
              for item in payload.get("manifests", [])
              if isinstance((platform := item.get("platform")), dict)
              and platform.get("os")
              and platform.get("architecture")
          }
          expected = {
              "linux/amd64": os.environ["AMD64_DIGEST"],
              "linux/arm64": os.environ["ARM64_DIGEST"],
          }
          if subjects != expected:
              raise SystemExit(
                  f"FAIL: manifest subjects {subjects!r} != {expected!r}"
              )
          PY
          predicate="/tmp/${IMAGE_NAME}-manifest.slsa.json"
          python3 scripts/ci_image_release_evidence.py predicate-manifest \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --architecture-digest "linux/amd64=${AMD64_DIGEST}" \
            --architecture-digest "linux/arm64=${ARM64_DIGEST}" \
            --scan-report-digest "linux/amd64=${AMD64_SCAN}" \
            --scan-report-digest "linux/arm64=${ARM64_SCAN}" \
            --architecture-build "linux/amd64=${AMD64_BUILD}" \
            --architecture-build "linux/arm64=${ARM64_BUILD}" \
            --output "$predicate"
          {
            echo "subject_name=$image"
            echo "subject_digest=$manifest_digest"
            echo "predicate=$predicate"
          } >> "$GITHUB_OUTPUT"

      - name: Attest published manifest digest
        id: manifest-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest-evidence.outputs.subject_name }}
          subject-digest: ${{ steps.manifest-evidence.outputs.subject_digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.manifest-evidence.outputs.predicate }}
          push-to-registry: true

      - name: Verify published manifest attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.manifest-attestation.outputs.bundle-path }}
          SUBJECT_NAME: ${{ steps.manifest-evidence.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.manifest-evidence.outputs.subject_digest }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.architectures.outputs.tree_sha }}
          AMD64_DIGEST: ${{ steps.architectures.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.architectures.outputs.arm64_digest }}
          AMD64_SCAN: ${{ steps.architectures.outputs.amd64_scan }}
          ARM64_SCAN: ${{ steps.architectures.outputs.arm64_scan }}
          AMD64_BUILD: ${{ steps.architectures.outputs.amd64_build }}
          ARM64_BUILD: ${{ steps.architectures.outputs.arm64_build }}
        run: |
          set -euo pipefail
          verification="/tmp/${IMAGE_NAME}-manifest.verified.json"
          gh attestation verify "oci://${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            --bundle "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
            --source-digest "$HEAD_SHA" \
            --source-ref "refs/heads/${REF_NAME}" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$verification"
          python3 scripts/ci_image_release_evidence.py verify-manifest \
            --verification "$verification" \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --architecture-digest "linux/amd64=${AMD64_DIGEST}" \
            --architecture-digest "linux/arm64=${ARM64_DIGEST}" \
            --scan-report-digest "linux/amd64=${AMD64_SCAN}" \
            --scan-report-digest "linux/arm64=${ARM64_SCAN}" \
            --architecture-build "linux/amd64=${AMD64_BUILD}" \
            --architecture-build "linux/arm64=${ARM64_BUILD}"

      - name: Publish verified manifest tags
        shell: bash
        env:
          SUBJECT_NAME: ${{ steps.manifest-evidence.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.manifest-evidence.outputs.subject_digest }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha_short="${HEAD_SHA:0:12}"
          docker buildx imagetools create \
            --tag "${SUBJECT_NAME}:${sha_short}" \
            --tag "${SUBJECT_NAME}:${REF_NAME}" \
            "${SUBJECT_NAME}@${SUBJECT_DIGEST}"
          for tag in "$sha_short" "$REF_NAME"; do
            published=$(docker buildx imagetools inspect "${SUBJECT_NAME}:${tag}" \
              | awk '$1 == "Digest:" {print $2; exit}')
            [[ "$published" == "$SUBJECT_DIGEST" ]] || {
              echo "FAIL: verified manifest tag ${tag} resolved to ${published}" >&2
              exit 1
            }
          done

  images-gate:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' && 'images-gate-manual' ||
          github.event_name == 'push' && 'images-gate-push' ||
          needs.plan.outputs.gate_mode == 'full' &&
          needs.plan.outputs.publisher_active == 'false' &&
          'images-gate' ||
          needs.plan.outputs.gate_mode == 'full' && 'images-gate-attempt' ||
          'images-gate-filtered' }}
    runs-on: ubuntu-latest
    if: always() && needs.plan.outputs.gate_mode != 'filtered'
    needs: [plan, build, candidate-index, resolve-candidate, publish, publish-manifest]
    steps:
      - name: Enforce selected image result
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_MODE: ${{ needs.plan.outputs.gate_mode }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          BUILD_RESULT: ${{ needs.build.result }}
          CANDIDATE_INDEX_RESULT: ${{ needs.candidate-index.result }}
          RESOLVE_RESULT: ${{ needs.resolve-candidate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          MANIFEST_RESULT: ${{ needs.publish-manifest.result }}
          INTERNAL_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          if [[ "$GATE_MODE" == "filtered" ]]; then
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request|merge_group|workflow_dispatch|push) ;;
            *) echo "FAIL: invalid event name" >&2; exit 1 ;;
          esac
          case "$REQUIRED" in
            true|false) ;;
            *) echo "FAIL: invalid planner boolean required=${REQUIRED@Q}" >&2; exit 1 ;;
          esac
          if [[ "$REQUIRED" == "true" ]]; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
              [[ "$CANDIDATE_INDEX_RESULT" == "skipped" ]] || exit 1
              [[ "$RESOLVE_RESULT" == "success" ]] || exit 1
              [[ "$PUBLISH_RESULT" == "success" ]] || exit 1
              [[ "$MANIFEST_RESULT" == "success" ]] || exit 1
            else
              [[ "$BUILD_RESULT" == "success" ]] || exit 1
              if [[ "$INTERNAL_PULL_REQUEST" == "true" ]]; then
                [[ "$CANDIDATE_INDEX_RESULT" == "success" ]] || exit 1
              else
                [[ "$CANDIDATE_INDEX_RESULT" == "skipped" ]] || exit 1
              fi
              [[ "$RESOLVE_RESULT" == "skipped" ]] || exit 1
              [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
              [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
            fi
          else
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$CANDIDATE_INDEX_RESULT" == "skipped" ]] || exit 1
            [[ "$RESOLVE_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
          fi
