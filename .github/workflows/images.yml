name: images

run-name: >-
  ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.base.sha == '28aa5257927a3468ebc35ec7f245fecaf3226dbf' &&
      ' ' ||
      github.event_name == 'workflow_dispatch' &&
      inputs.trusted_publish == true &&
      format('gate=trusted-publish / head={0} / base={1} / updated=none / action=workflow_dispatch / label=none / labels=000000 / pull=none',
             github.sha,
             inputs.trusted_base_sha) ||
      github.event_name == 'workflow_dispatch' &&
      format('gate=manual / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.sha,
             github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.draft ||
       github.event.action == 'converted_to_draft' ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base == null)) &&
      format('gate=filtered / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha,
             github.event.pull_request.base.sha,
             github.event.pull_request.updated_at,
             github.event.action,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') ||
      format('gate=full / head={0} / base={1} / updated={2} / action={3} / label={4} / labels={5} / pull={6}',
             github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha,
             github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha,
             github.event.pull_request.updated_at || 'none',
             github.event.action || github.event_name,
             github.event.label.name || 'none',
             format('{0}{1}{2}{3}{4}{5}',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:integration-docker') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:images') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'cluster-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'staging-smoke') && '1' || '0',
                    contains(github.event.pull_request.labels.*.name, 'ci:coverage-summary') && '1' || '0'),
             github.event.pull_request.number || 'none') }}

# Builds, scans, attests, verifies, and (on push to dev/main) publishes every release image declared
# in config/component-ownership.toml. The manifest owns image identity,
# Dockerfile, build context, and source-path selection; this workflow contains
# no editable image allowlist.
#
# Why native multi-arch: cluster-deploy target includes ASUS Ascent GX10
# (ARM v9.2-A). See docs/architecture/cluster-deploy.md. AMD64 and ARM64 are
# built on matching CPUs; trusted push jobs publish per-architecture tags and a
# separate job joins and verifies the manifest list.
#
# Implementation note: the workflow drives `docker buildx` directly through
# the CLI instead of depending on docker/* marketplace actions. Supported
# hosted images include the CLI; native scheduling removes binfmt/QEMU setup.

on:
  pull_request:
    # Every relevant non-draft PR reports the protected gate name; drafts and
    # unrelated metadata events report a distinct filtered context.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      trusted_publish:
        description: Reconcile an exact protected-branch image release
        required: false
        type: boolean
        default: false
      trusted_base_sha:
        description: Nearest successful trusted release ancestor
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Irrelevant metadata runs use a separate pending slot. Otherwise GitHub's
  # one-pending-run rule lets a filtered event evict the authoritative
  # replacement that must follow a canceled full run.
  group: >-
    images-${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
       (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
        contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
       (github.event.action == 'edited' && github.event.changes.base != null)) &&
      'authoritative' || 'background'
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        (contains(fromJSON('["opened","reopened","ready_for_review","synchronize","converted_to_draft"]'), github.event.action) ||
         (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
          contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
         (github.event.action == 'edited' && github.event.changes.base != null)) }}

jobs:
  plan:
    name: image plan
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.plan.outputs.required || steps.event.outputs.required }}
      gate_mode: ${{ steps.required.outputs.gate_mode || steps.event.outputs.gate_mode }}
      publisher_active: ${{ steps.required.outputs.publisher_active || steps.event.outputs.publisher_active }}
      images: ${{ steps.plan.outputs.images || steps.event.outputs.images }}
      native_builds: ${{ steps.plan.outputs.native_builds || steps.event.outputs.native_builds }}
      stage1_images: ${{ steps.plan.outputs.stage1_images || steps.event.outputs.stage1_images }}
      trusted_publish: ${{ steps.trust.outputs.trusted_publish || 'false' }}
    steps:
      - name: Classify metadata event before checkout
        id: event
        shell: bash
        env:
          FILTERED_EVENT: >-
            ${{ github.event_name == 'pull_request' &&
                (github.event.pull_request.draft ||
                 github.event.action == 'converted_to_draft' ||
                 (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
                  !contains(fromJSON('["ci:integration","ci:integration-docker","ci:images","cluster-smoke","staging-smoke","ci:coverage-summary"]'), github.event.label.name)) ||
                 (github.event.action == 'edited' && github.event.changes.base == null)) }}
        run: |
          set -euo pipefail
          if [[ "$FILTERED_EVENT" == "true" ]]; then
            {
              echo 'checkout_required=false'
              echo 'gate_mode=filtered'
              echo 'publisher_active=false'
              echo 'required=false'
              echo 'images=[]'
              echo 'native_builds=[]'
              echo 'stage1_images=[]'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'checkout_required=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.event.outputs.checkout_required == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted release reconciliation
        id: trust
        if: steps.event.outputs.checkout_required == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.trusted_publish || false }}
          BASE_SHA: ${{ inputs.trusted_base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          trusted_publish=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED" == "true" ]]; then
            [[ "$ACTOR" == "github-actions[bot]" ]] || {
              echo "FAIL: trusted publication requires the default-branch controller" >&2
              exit 1
            }
            [[ "$REF_NAME" == "dev" || "$REF_NAME" == "main" ]] || {
              echo "FAIL: trusted publication requires dev or main" >&2
              exit 1
            }
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FAIL: trusted publication requires exact lowercase commit SHAs" >&2
              exit 1
            }
            [[ "$BASE_SHA" != "$HEAD_SHA" ]] || {
              echo "FAIL: trusted publication range is empty" >&2
              exit 1
            }
            test "$(git rev-parse HEAD)" = "$HEAD_SHA"
            git cat-file -e "${BASE_SHA}^{commit}"
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || {
              echo "FAIL: trusted publication base is not an ancestor" >&2
              exit 1
            }
            trusted_publish=true
          elif [[ -n "$BASE_SHA" ]]; then
            echo "FAIL: trusted base SHA is forbidden outside reconciliation" >&2
            exit 1
          fi
          echo "trusted_publish=$trusted_publish" >> "$GITHUB_OUTPUT"

      - name: Plan required image validation
        id: required
        if: steps.event.outputs.checkout_required == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.trust.outputs.trusted_publish == 'true' && inputs.trusted_base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TRUSTED_PUBLISH: ${{ steps.trust.outputs.trusted_publish }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTION: ${{ github.event.action }}
          PR_ACTION_LABEL: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          TRUSTED_PROMOTION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            merge_group)
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                > /tmp/loom-changed-files.txt
              ;;
            push)
              if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
                git ls-tree -r --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              ;;
            workflow_dispatch)
              if [[ "$TRUSTED_PUBLISH" == "true" ]]; then
                git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              else
                git show --pretty=format: --name-only "$HEAD_SHA" \
                  > /tmp/loom-changed-files.txt
              fi
              PR_LABELS_JSON='["ci:images"]'
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          sort -u -o /tmp/loom-changed-files.txt /tmp/loom-changed-files.txt
          if [[ -z "$PR_LABELS_JSON" || "$PR_LABELS_JSON" == "null" ]]; then
            PR_LABELS_JSON='[]'
          fi
          python3 scripts/plan_ci_validations.py \
            --changed-files /tmp/loom-changed-files.txt \
            --labels-json "$PR_LABELS_JSON" \
            --event-name "$EVENT_NAME" \
            --pull-request-action "$PR_ACTION" \
            --pull-request-action-label "$PR_ACTION_LABEL" \
            --pull-request-draft "$PR_DRAFT" \
            --pull-request-base-changed "$PR_BASE_CHANGED" \
            --github-output "$GITHUB_OUTPUT"
          publisher_active=false
          if [[ "$TRUSTED_PROMOTION" == "true" ]]; then
            publisher_active=true
          elif [[ "$BASE_SHA" == "28aa5257927a3468ebc35ec7f245fecaf3226dbf" ]]; then
            # One-time bridge: this base has the publisher but predates its
            # dynamic run-name support. Whitespace run-name restores the fixed
            # workflow identity while the PR title carries the generation.
            publisher_active=true
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${BASE_SHA}^{tree}"
            if git show "${BASE_SHA}:.github/workflows/authoritative-gates.yml" \
                2>/dev/null | grep -Eq '^# publisher-contract: dynamic-run-name-v[123]$'; then
              publisher_active=true
            fi
          fi
          printf 'publisher_active=%s\n' "$publisher_active" >> "$GITHUB_OUTPUT"

      - name: Select affected images
        id: plan
        if: steps.event.outputs.checkout_required == 'true'
        env:
          REQUIRED: ${{ steps.required.outputs.images }}
          UNOWNED_RUNTIME: ${{ steps.required.outputs.unowned_runtime }}
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_PUBLISH: ${{ steps.trust.outputs.trusted_publish }}
          CHANGED_FILES: /tmp/loom-changed-files.txt
        run: |
          set -euo pipefail
          for value in "$REQUIRED" "$UNOWNED_RUNTIME"; do
            [[ "$value" == "true" || "$value" == "false" ]] || {
              echo "FAIL: invalid planner boolean: $value" >&2
              exit 1
            }
          done
          args=(
            plan-images
            --changed-files "$CHANGED_FILES"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$TRUSTED_PUBLISH" != "true" || \
                "$EVENT_NAME" == "merge_group" || \
                "$UNOWNED_RUNTIME" == "true" ]]; then
            args+=(--force-all)
          elif [[ "$REQUIRED" == "true" ]]; then
            args+=(--fallback-all)
          fi
          python3 scripts/component_ownership.py "${args[@]}"

  image-route:
    name: resolve oldlab-first image routes
    needs: plan
    if: >-
      github.event_name != 'push' &&
      needs.plan.outputs.trusted_publish != 'true' &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      (needs.plan.outputs.images != '[]' || needs.plan.outputs.stage1_images != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    outputs:
      routes: ${{ steps.route.outputs.routes || '{}' }}
    steps:
      - name: Checkout trusted route action
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: qianyi-sun/loom
          ref: 9a0df38f5cc4f9cf747efac3c4e37e9657e8eb34
          sparse-checkout: .github/actions/ci-runner-route
          path: .loom-ci-route-action
          persist-credentials: false

      - name: Select native AMD64 image keys
        id: keys
        shell: bash
        env:
          NATIVE_BUILDS: ${{ needs.plan.outputs.native_builds }}
          STAGE1_IMAGES: ${{ needs.plan.outputs.stage1_images }}
        run: |
          python3 - <<'PY'
          import json
          import os

          builds = json.loads(os.environ["NATIVE_BUILDS"])
          builds.extend(
              {**item, "architecture": "amd64", "platform": "linux/amd64"}
              for item in json.loads(os.environ.get("STAGE1_IMAGES", "[]"))
          )
          # The live lease broker may still run the preceding merged contract.
          # Keep this new image on a hosted runner until that separately-owned
          # control-plane rollout has occurred.
          keys = [
              item["image"]
              for item in builds
              if item["architecture"] == "amd64"
              and item["image"] not in {
                  "capacity-executor",
                  "capacity-manager",
                  "personal-dev-activation-agent",
                  "personal-dev-builder",
                  "pipeline-core-fixture",
                  "pipeline-orchestrator",
              }
          ]
          if len(keys) != len(set(keys)):
              raise SystemExit("native AMD64 route keys are duplicated")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("job_keys=" + json.dumps(keys, separators=(",", ":")) + "\n")
              output.write("needs_route=" + ("true" if keys else "false") + "\n")
          PY

      - name: Resolve immutable assignments
        id: route
        if: steps.keys.outputs.needs_route == 'true'
        uses: ./.loom-ci-route-action/.github/actions/ci-runner-route
        with:
          route-mode: ${{ vars.LOOM_CI_ROUTE_MODE || 'disabled' }}
          repository: ${{ github.repository }}
          workflow-name: images
          workflow-id: '302898384'
          workflow-run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          job-keys-json: ${{ steps.keys.outputs.job_keys }}
          github-token: ${{ github.token }}

  trivy-binary:
    name: prepare verified Trivy binaries
    needs: [plan]
    if: >-
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      (needs.plan.outputs.images != '[]' || needs.plan.outputs.stage1_images != '[]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false

      - name: Install and record pinned Trivy binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          for architecture in amd64 arm64; do
            artifact_dir="/tmp/loom-trivy-binaries/${architecture}"
            mkdir -p "$artifact_dir"
            trivy_bin=$(python3 scripts/install_trivy.py \
              --install-root "$RUNNER_TEMP" \
              --architecture "$architecture")
            cp "$trivy_bin" "$artifact_dir/trivy"
            chmod 0555 "$artifact_dir/trivy"
            (
              cd "$artifact_dir"
              sha256sum trivy > trivy.sha256
              sha256sum --check trivy.sha256
            )
          done

      - name: Upload exact verified Trivy binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-binaries-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-trivy-binaries
          if-no-files-found: error
          retention-days: 1

  personal-dev-scanner-cache-assets:
    name: prepare personal-dev scanner-cache assets
    needs: [plan, trivy-binary]
    if: >-
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: contains(needs.plan.outputs.images, '"image":"personal-dev-scanner-cache"')
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false

      - name: Download exact verified Trivy binary
        if: contains(needs.plan.outputs.images, '"image":"personal-dev-scanner-cache"')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-binaries-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-trivy-binaries

      - name: Materialize digest-pinned scanner-cache assets
        if: contains(needs.plan.outputs.images, '"image":"personal-dev-scanner-cache"')
        shell: bash
        run: |
          set -euo pipefail
          (
            cd /tmp/loom-trivy-binaries/amd64
            test -f trivy
            test -f trivy.sha256
            sha256sum --check trivy.sha256
            chmod 0555 trivy
          )
          PYTHONPATH=src:. python3 scripts/prepare_personal_dev_scanner_cache_assets.py \
            --lock deploy/dev-fleet/personal-dev-scanner-cache-lock.json \
            --trivy /tmp/loom-trivy-binaries/amd64/trivy \
            --output /tmp/loom-personal-dev-scanner-cache
          test "$(find /tmp/loom-personal-dev-scanner-cache -mindepth 1 -printf '%P\n' | sort)" = "$(printf '%s\n' \
            db \
            db/metadata.json \
            db/trivy.db \
            java-db \
            java-db/metadata.json \
            java-db/trivy-java.db \
            scanner-cache-evidence.json | sort)"

      - name: Upload exact scanner-cache assets
        if: contains(needs.plan.outputs.images, '"image":"personal-dev-scanner-cache"')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-dev-scanner-cache-assets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-scanner-cache
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    needs: [plan, image-route, trivy-binary, personal-dev-scanner-cache-assets]
    if: >-
      github.event_name != 'push' &&
      needs.plan.outputs.trusted_publish != 'true' &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: >-
      ${{ matrix.architecture == 'arm64' && fromJSON('["ubuntu-24.04-arm"]') ||
          (matrix.image == 'capacity-executor' || matrix.image == 'capacity-manager' || matrix.image == 'personal-dev-activation-agent' || matrix.image == 'personal-dev-builder' || matrix.image == 'personal-dev-scanner-cache' || matrix.image == 'pipeline-core-fixture' || matrix.image == 'pipeline-orchestrator') && fromJSON('["ubuntu-24.04"]') ||
          fromJSON(needs.image-route.outputs.routes)[matrix.image] }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.native_builds) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download exact verified Trivy binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-binaries-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-trivy-binaries

      - name: Download exact scanner-cache assets
        if: matrix.image == 'personal-dev-scanner-cache'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-dev-scanner-cache-assets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-scanner-cache

      - name: Verify distributed Trivy binary
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          (
            cd "/tmp/loom-trivy-binaries/${ARCHITECTURE}"
            test -f trivy
            test -f trivy.sha256
            sha256sum --check trivy.sha256
            chmod 0555 trivy
          )

      - name: Validate image build inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid head SHA" >&2
            exit 1
          }
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid base SHA" >&2
            exit 1
          }
          [[ "$REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$ ]] \
            && [[ "$REF_NAME" != *..* ]] || {
            echo "FAIL: invalid ref name" >&2
            exit 1
          }
          case "$EVENT_NAME" in
            pull_request)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
                echo "FAIL: invalid pull request number" >&2
                exit 1
              }
              ;;
            merge_group | workflow_dispatch)
              [[ -z "$PR_NUMBER" ]] || {
                echo "FAIL: unexpected pull request number" >&2
                exit 1
              }
              ;;
            *)
              echo "FAIL: untrusted build event is not allowed" >&2
              exit 1
              ;;
          esac
          case "$(uname -m):$ARCHITECTURE:$PLATFORM" in
            x86_64:amd64:linux/amd64 | aarch64:arm64:linux/arm64 | arm64:arm64:linux/arm64) ;;
            *) echo "FAIL: runner architecture does not match the build platform" >&2; exit 1 ;;
          esac

      - name: Create native buildx builder
        # `docker buildx create --use` is what docker/setup-buildx-action wraps.
        # No marketplace action, privileged binfmt container, or QEMU emulator
        # is needed because the runner CPU matches matrix.platform.
        run: |
          buildx_args=(
            docker buildx create
            --name loom-builder
            --use
            --bootstrap
          )
          if [[ -r /etc/buildkit/loom-ci.toml ]]; then
            buildx_args+=(
              --driver-opt network=host
              --buildkitd-config /etc/buildkit/loom-ci.toml
            )
          fi
          "${buildx_args[@]}"
          docker buildx inspect

      - name: Build without registry or cache write authority
        # Each job builds exactly one platform on matching native hardware and
        # always emits the exact local archive consumed by the vulnerability
        # gate. The untrusted job has no registry, cache, or secret authority.
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          verify_scanner_cache_assets() {
            PYTHONPATH=src:. python3 scripts/prepare_personal_dev_scanner_cache_assets.py \
              --lock deploy/dev-fleet/personal-dev-scanner-cache-lock.json \
              --verify-output /tmp/loom-personal-dev-scanner-cache
          }

          sha_short="${HEAD_SHA:0:12}"
          case "$EVENT_NAME" in
            pull_request) image_tag="pr-${PR_NUMBER}" ;;
            merge_group) image_tag="merge-group-${sha_short}" ;;
            workflow_dispatch) image_tag="manual-${sha_short}" ;;
            *)
              echo "FAIL: untrusted build event is not allowed" >&2
              exit 1
              ;;
          esac
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_NUMBER" ]]; then
            image_tag="candidate-${HEAD_SHA}-${ARCHITECTURE}"
          fi
          archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.docker.tar"
          build_args=(
            docker buildx build
            --platform "$PLATFORM"
            --file "$DOCKERFILE"
            --tag "loom-ci-${IMAGE_DIGEST_NAME}:${image_tag}"
            --provenance=false
            --label "org.opencontainers.image.revision=${HEAD_SHA}"
            --build-arg "LOOM_BUILD_SHA=${HEAD_SHA}"
            --output "type=docker,dest=${archive}"
          )
          scanner_cache_before=""
          if [[ "$IMAGE_NAME" == "personal-dev-scanner-cache" ]]; then
            scanner_cache_before=$(verify_scanner_cache_assets)
            build_args+=(
              --build-context
              "personal-dev-scanner-cache=/tmp/loom-personal-dev-scanner-cache"
            )
          fi
          build_args+=("$BUILD_CONTEXT")
          "${build_args[@]}"
          if [[ "$IMAGE_NAME" == "personal-dev-scanner-cache" ]]; then
            test "$(verify_scanner_cache_assets)" = "$scanner_cache_before"
          fi

      - name: Generate controlled Trivy policy
        run: |
          python3 scripts/write_trivy_release_policy.py \
            --config-file /tmp/loom-trivy-release.yaml \
            --ignore-file /tmp/loom-trivy-release.ignore.yaml

      - name: Scan native image archive
        shell: bash
        env:
          ARCHIVE: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.docker.tar
          REPORT: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.trivy.json
          IMAGE_NAME: ${{ matrix.image }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          trivy_bin="/tmp/loom-trivy-binaries/${ARCHITECTURE}/trivy"
          set +e
          "$trivy_bin" --config /tmp/loom-trivy-release.yaml image \
            --input "$ARCHIVE" \
            --format json \
            --output "$REPORT" \
            --ignorefile /tmp/loom-trivy-release.ignore.yaml \
            --show-suppressed \
            --cache-dir "$RUNNER_TEMP/loom-trivy-cache"
          scan_status=$?
          set -e
          if (( scan_status != 0 )); then
            python3 scripts/summarize_trivy_report.py "$REPORT" || true
            exit "$scan_status"
          fi
          python3 scripts/validate_trivy_release_report.py \
            --component "$IMAGE_NAME" \
            --architecture "$ARCHITECTURE" \
            --report "$REPORT" \
            --ignore-file /tmp/loom-trivy-release.ignore.yaml

      - name: Record candidate archive provenance
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.docker.tar"
          test -s "$archive"
          archive_sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)
          archive_size=$(wc -c < "$archive" | tr -d ' ')
          artifact_name="image-candidate-archive-${IMAGE_NAME}-${ARCHITECTURE}-attempt-${RUN_ATTEMPT}"
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          python3 scripts/ci_image_candidate.py record \
            --repository "$REPOSITORY" \
            --pull-request "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --tree-sha "$tree_sha" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --context "$BUILD_CONTEXT" \
            --architecture "$ARCHITECTURE" \
            --platform "$PLATFORM" \
            --artifact-name "$artifact_name" \
            --archive-sha256 "$archive_sha256" \
            --archive-size "$archive_size" \
            --output "/tmp/${IMAGE_NAME}-${ARCHITECTURE}.json"

      - name: Upload reusable candidate archive
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-candidate-archive-${{ matrix.image }}-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.docker.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload candidate archive record
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-candidate-record-${{ matrix.image }}-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 1

  stage1-build:
    name: ${{ matrix.image }} closed OLDLAB candidate
    needs: [plan, image-route, trivy-binary]
    if: >-
      github.event_name != 'push' &&
      needs.plan.outputs.trusted_publish != 'true' &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.stage1_images != '[]'
    runs-on: ${{ fromJSON(needs.image-route.outputs.routes)[matrix.image] }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage1_images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false

      - name: Download exact verified Trivy binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-binaries-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-trivy-binaries

      - name: Build closed Stage 1 candidate without registry authority
        id: candidate
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE" --image-name "$IMAGE_NAME" \
            --dockerfile "$DOCKERFILE" --build-context "$BUILD_CONTEXT"
          test "$(uname -m)" = x86_64
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          source_root="$RUNNER_TEMP/loom-stage1-sources-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence_root="$RUNNER_TEMP/loom-stage1-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_image="loom-ci-${IMAGE_NAME}:candidate-${HEAD_SHA}"
          python3 scripts/prepare_behavior_stage1_image_sources.py \
            --repo-root . prepare --output "$source_root"
          docker buildx build --load --platform linux/amd64 \
            --build-context "stage1-sources=${source_root}" \
            --build-arg "LOOM_BUILD_SHA=${HEAD_SHA}" \
            --build-arg "LOOM_BUILD_TREE_SHA=${tree_sha}" \
            --label "org.opencontainers.image.revision=${HEAD_SHA}" \
            --file "$DOCKERFILE" --tag "$local_image" "$BUILD_CONTEXT"
          mkdir -p "$evidence_root"
          {
            echo "local_image=$local_image"
            echo "tree_sha=$tree_sha"
            echo "source_root=$source_root"
            echo "evidence_root=$evidence_root"
          } >> "$GITHUB_OUTPUT"

      - name: Prove closed non-root runtimes
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.candidate.outputs.local_image }}
        run: |
          set -euo pipefail
          common=(
            --rm --network none --read-only --cap-drop ALL
            --security-opt no-new-privileges --user 65532:65532
            --env OMNIGIBSON_DATA_PATH=/scratch
            --tmpfs "/scratch:rw,nosuid,nodev,noexec,size=1g,uid=65532,gid=65532,mode=0700"
            --tmpfs "/tmp:rw,nosuid,nodev,noexec,size=256m,uid=65532,gid=65532,mode=0700"
          )
          docker run "${common[@]}" "$LOCAL_IMAGE" \
            /opt/loom/bin/sim-python -I -c \
            'from loom.integrations.behavior.stages.rollout_backend import _load_runtime; runtime=_load_runtime(); assert runtime.version == "3.8.0"'
          docker run "${common[@]}" "$LOCAL_IMAGE" \
            /opt/loom/venv-vla/bin/python -I -c \
            'from loom.integrations.behavior.vla.policy_backend import _load_runtime; runtime=_load_runtime(); assert runtime.version == "0.1.0"'
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Config.User}}')" = 65532:65532
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{json .Config.Entrypoint}}')" = null
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{json .Config.Cmd}}')" = null

      - name: Scan candidate and generate exact SPDX SBOM
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.candidate.outputs.local_image }}
          EVIDENCE_ROOT: ${{ steps.candidate.outputs.evidence_root }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          trivy_bin=/tmp/loom-trivy-binaries/amd64/trivy
          (cd /tmp/loom-trivy-binaries/amd64 && sha256sum --check trivy.sha256)
          chmod 0555 "$trivy_bin"
          python3 scripts/write_trivy_release_policy.py \
            --config-file /tmp/loom-stage1-trivy.yaml \
            --ignore-file /tmp/loom-stage1-trivy.ignore.yaml
          "$trivy_bin" --config /tmp/loom-stage1-trivy.yaml image \
            --format json --output "$EVIDENCE_ROOT/scan.json" \
            --ignorefile /tmp/loom-stage1-trivy.ignore.yaml \
            --show-suppressed --cache-dir "$RUNNER_TEMP/loom-trivy-cache" \
            "$LOCAL_IMAGE"
          python3 scripts/validate_trivy_release_report.py \
            --component "$IMAGE" --architecture amd64 \
            --report "$EVIDENCE_ROOT/scan.json" \
            --ignore-file /tmp/loom-stage1-trivy.ignore.yaml
          "$trivy_bin" image --format spdx-json \
            --output "$EVIDENCE_ROOT/sbom.spdx.json" \
            --cache-dir "$RUNNER_TEMP/loom-trivy-cache" "$LOCAL_IMAGE"

      - name: Seal candidate evidence
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.candidate.outputs.local_image }}
          EVIDENCE_ROOT: ${{ steps.candidate.outputs.evidence_root }}
          TREE_SHA: ${{ steps.candidate.outputs.tree_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          IMAGE: ${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          container=$(docker create "$LOCAL_IMAGE" /bin/true)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/opt/loom/contracts/compatibility-manifest.json" \
            "$EVIDENCE_ROOT/compatibility-manifest.json"
          docker cp "$container:/opt/loom/contracts/source-evidence.json" \
            "$EVIDENCE_ROOT/source-evidence.json"
          docker cp "$container:/opt/loom/bin/behavior_stage1_image_contract.py" \
            "$EVIDENCE_ROOT/preflight.py"
          subject_digest=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')
          python3 scripts/ci_behavior_stage1_image.py record-child \
            --mode candidate --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" --head-sha "$HEAD_SHA" --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" --image "$IMAGE" \
            --image-name "$IMAGE_NAME" --dockerfile "$DOCKERFILE" \
            --context "$BUILD_CONTEXT" --platform linux/amd64 \
            --subject-name "$LOCAL_IMAGE" --subject-digest "$subject_digest" \
            --scan-report "$EVIDENCE_ROOT/scan.json" \
            --sbom "$EVIDENCE_ROOT/sbom.spdx.json" \
            --source-evidence "$EVIDENCE_ROOT/source-evidence.json" \
            --compatibility-manifest "$EVIDENCE_ROOT/compatibility-manifest.json" \
            --preflight "$EVIDENCE_ROOT/preflight.py" \
            --output "$EVIDENCE_ROOT/child-record.json"
          python3 scripts/ci_behavior_stage1_image.py validate-child \
            --mode candidate --record "$EVIDENCE_ROOT/child-record.json"

      - name: Upload bounded Stage 1 candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage1-image-candidate-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove exact local Stage 1 candidate
        if: always()
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.candidate.outputs.local_image }}
        run: |
          set -euo pipefail
          if [[ -n "$LOCAL_IMAGE" ]]; then docker image rm "$LOCAL_IMAGE" || true; fi

  candidate-index:
    name: verify reusable image candidate index
    needs: [plan, build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download candidate archive records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-candidate-record-*-attempt-${{ github.run_attempt }}
          path: /tmp/loom-image-candidate-records
          merge-multiple: true

      - name: Aggregate exact candidate index
        shell: bash
        env:
          EXPECTED_MATRIX: ${{ needs.plan.outputs.native_builds }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 scripts/ci_image_candidate.py aggregate \
            --records-dir /tmp/loom-image-candidate-records \
            --expected-matrix-json "$EXPECTED_MATRIX" \
            --output /tmp/image-candidate-index.json

      - name: Upload reusable candidate index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-candidate-index-attempt-${{ github.run_attempt }}
          path: /tmp/image-candidate-index.json
          if-no-files-found: error
          retention-days: 1


  publish:
    name: publish ${{ matrix.image }} (${{ matrix.platform }})
    needs: [plan, trivy-binary, personal-dev-scanner-cache-assets]
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        needs.plan.outputs.trusted_publish == 'true')) &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]'
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.native_builds) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download exact verified Trivy binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-binaries-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-trivy-binaries

      - name: Download exact scanner-cache assets
        if: matrix.image == 'personal-dev-scanner-cache'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-dev-scanner-cache-assets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-scanner-cache

      - name: Verify distributed Trivy binary
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          (
            cd "/tmp/loom-trivy-binaries/${ARCHITECTURE}"
            test -f trivy
            test -f trivy.sha256
            sha256sum --check trivy.sha256
            chmod 0555 trivy
          )

      - name: Validate image build inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_PUBLISH: ${{ needs.plan.outputs.trusted_publish }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          TRUSTED_PUBLISH=${TRUSTED_PUBLISH:-false}

          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT"
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$TRUSTED_PUBLISH" == "false" ]]
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$TRUSTED_PUBLISH" == "true" ]] || {
              echo "FAIL: manual dispatch has no publication authority" >&2
              exit 1
            }
          else
            echo "FAIL: publishing requires a push or trusted reconciliation" >&2
            exit 1
          fi
          [[ "$REF_NAME" == "dev" || "$REF_NAME" == "main" ]] || {
            echo "FAIL: publishing requires dev or main" >&2
            exit 1
          }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL: invalid head SHA" >&2
            exit 1
          }
          [[ "$REPOSITORY_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] || {
            echo "FAIL: invalid repository owner" >&2
            exit 1
          }
          [[ ${#GHCR_ACTOR} -le 100 \
            && "$GHCR_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\[bot\])?$ ]] || {
            echo "FAIL: invalid GHCR actor" >&2
            exit 1
          }
          case "$(uname -m):$ARCHITECTURE:$PLATFORM" in
            x86_64:amd64:linux/amd64 | aarch64:arm64:linux/arm64 | arm64:arm64:linux/arm64) ;;
            *) echo "FAIL: runner architecture does not match the publish platform" >&2; exit 1 ;;
          esac

      - name: Create native buildx builder
        run: |
          set -euo pipefail
          docker buildx create --name loom-publisher --use --bootstrap
          docker buildx inspect

      - name: Build trusted image archive
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          IMAGE_NAME: ${{ matrix.image }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          verify_scanner_cache_assets() {
            PYTHONPATH=src:. python3 scripts/prepare_personal_dev_scanner_cache_assets.py \
              --lock deploy/dev-fleet/personal-dev-scanner-cache-lock.json \
              --verify-output /tmp/loom-personal-dev-scanner-cache
          }

          archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.release.docker.tar"
          local_image="loom-ci-${IMAGE_DIGEST_NAME}:release-${HEAD_SHA}-${ARCHITECTURE}"
          build_args=(
            docker buildx build
            --platform "$PLATFORM"
            --file "$DOCKERFILE"
            --tag "$local_image"
            --provenance=false
            --label "org.opencontainers.image.revision=${HEAD_SHA}"
            --build-arg "LOOM_BUILD_SHA=${HEAD_SHA}"
            --output "type=docker,dest=${archive}"
          )
          scanner_cache_before=""
          if [[ "$IMAGE_NAME" == "personal-dev-scanner-cache" ]]; then
            scanner_cache_before=$(verify_scanner_cache_assets)
            build_args+=(
              --build-context
              "personal-dev-scanner-cache=/tmp/loom-personal-dev-scanner-cache"
            )
          fi
          build_args+=("$BUILD_CONTEXT")
          "${build_args[@]}"
          if [[ "$IMAGE_NAME" == "personal-dev-scanner-cache" ]]; then
            test "$(verify_scanner_cache_assets)" = "$scanner_cache_before"
          fi

      - name: Generate controlled Trivy policy
        run: |
          python3 scripts/write_trivy_release_policy.py \
            --config-file /tmp/loom-trivy-release.yaml \
            --ignore-file /tmp/loom-trivy-release.ignore.yaml

      - name: Scan trusted image archive
        shell: bash
        env:
          ARCHIVE: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.release.docker.tar
          REPORT: /tmp/${{ matrix.image }}-${{ matrix.architecture }}.release.trivy.json
          IMAGE_NAME: ${{ matrix.image }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          trivy_bin="/tmp/loom-trivy-binaries/${ARCHITECTURE}/trivy"
          set +e
          "$trivy_bin" --config /tmp/loom-trivy-release.yaml image \
            --input "$ARCHIVE" \
            --format json \
            --output "$REPORT" \
            --ignorefile /tmp/loom-trivy-release.ignore.yaml \
            --show-suppressed \
            --cache-dir "$RUNNER_TEMP/loom-trivy-cache"
          scan_status=$?
          set -e
          if (( scan_status != 0 )); then
            python3 scripts/summarize_trivy_report.py "$REPORT" || true
            exit "$scan_status"
          fi
          python3 scripts/validate_trivy_release_report.py \
            --component "$IMAGE_NAME" \
            --architecture "$ARCHITECTURE" \
            --report "$REPORT" \
            --ignore-file /tmp/loom-trivy-release.ignore.yaml

      - name: Record trusted scan digest
        id: scan
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          report="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.release.trivy.json"
          test -s "$report"
          digest=$(sha256sum "$report" | cut -d ' ' -f 1)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "report_sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin

      - name: Publish scanned architecture image
        id: architecture-publish
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail

          archive="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.release.docker.tar"
          docker load --input "$archive"
          local_image="loom-ci-${IMAGE_DIGEST_NAME}:release-${HEAD_SHA}-${ARCHITECTURE}"
          inspected=$(docker image inspect "$local_image" --format '{{json .}}')
          jq -e --arg architecture "$ARCHITECTURE" --arg head "$HEAD_SHA" \
            '.Architecture == $architecture and .Os == "linux" and
             .Config.Labels["org.opencontainers.image.revision"] == $head' \
            <<< "$inspected" >/dev/null
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner_lower}/${IMAGE_DIGEST_NAME}"
          target="${image}:build-${HEAD_SHA}-${ARCHITECTURE}"
          docker tag "$local_image" "$target"
          push_output=$(docker push "$target" 2>&1)
          printf '%s\n' "$push_output"
          mapfile -t push_digests < <(
            sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size: [0-9]+.*$/\1/p' \
              <<< "$push_output"
          )
          [[ ${#push_digests[@]} -eq 1 ]] || {
            echo "FAIL: docker push did not emit exactly one architecture digest" >&2
            exit 1
          }
          digest="${push_digests[0]}"
          registry_manifest="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.registry-manifest.json"
          docker buildx imagetools inspect --raw "${image}@${digest}" \
            > "$registry_manifest"
          jq -e \
            '.schemaVersion == 2 and
             (.config.digest | test("^sha256:[0-9a-f]{64}$")) and
             (.layers | type == "array")' \
            "$registry_manifest" >/dev/null
          {
            echo "subject_name=$image"
            echo "subject_digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare architecture release predicate
        id: architecture-evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          SCAN_REPORT_SHA256: ${{ steps.scan.outputs.report_sha256 }}
          SUBJECT_NAME: ${{ steps.architecture-publish.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.architecture-publish.outputs.subject_digest }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          predicate="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.slsa.json"
          python3 scripts/ci_image_release_evidence.py predicate-architecture \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --platform "$PLATFORM" \
            --architecture "$ARCHITECTURE" \
            --scan-report-sha256 "$SCAN_REPORT_SHA256" \
            --build-mode trusted-rebuild \
            --output "$predicate"
          {
            echo "subject_name=$SUBJECT_NAME"
            echo "subject_digest=$SUBJECT_DIGEST"
            echo "predicate=$predicate"
            echo "tree_sha=$tree_sha"
            echo "build_mode=trusted-rebuild"
          } >> "$GITHUB_OUTPUT"

      - name: Attest published architecture digest
        id: architecture-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.architecture-evidence.outputs.subject_name }}
          subject-digest: ${{ steps.architecture-evidence.outputs.subject_digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.architecture-evidence.outputs.predicate }}
          push-to-registry: true

      - name: Verify published architecture attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.architecture-attestation.outputs.bundle-path }}
          SUBJECT_NAME: ${{ steps.architecture-evidence.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.architecture-evidence.outputs.subject_digest }}
          TREE_SHA: ${{ steps.architecture-evidence.outputs.tree_sha }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          SCAN_REPORT_SHA256: ${{ steps.scan.outputs.report_sha256 }}
          BUILD_MODE: ${{ steps.architecture-evidence.outputs.build_mode }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_MODE" != "trusted-rebuild" ]]; then
            echo "FAIL: invalid architecture build mode" >&2
            exit 1
          fi
          verification="/tmp/${IMAGE_NAME}-${ARCHITECTURE}.verified.json"
          gh attestation verify "oci://${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            --bundle "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
            --source-digest "$HEAD_SHA" \
            --source-ref "refs/heads/${REF_NAME}" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$verification"
          python3 scripts/ci_image_release_evidence.py verify-architecture \
            --verification "$verification" \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --platform "$PLATFORM" \
            --architecture "$ARCHITECTURE" \
            --scan-report-sha256 "$SCAN_REPORT_SHA256" \
            --build-mode "$BUILD_MODE" \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --output "/tmp/${IMAGE_NAME}-${ARCHITECTURE}.verified-metadata.json"

      - name: Record verified architecture evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.architecture-evidence.outputs.tree_sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          SUBJECT_NAME: ${{ steps.architecture-evidence.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.architecture-evidence.outputs.subject_digest }}
          SCAN_REPORT_SHA256: ${{ steps.scan.outputs.report_sha256 }}
          BUILD_MODE: ${{ steps.architecture-evidence.outputs.build_mode }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_MODE" != "trusted-rebuild" ]]; then
            echo "FAIL: invalid architecture build mode" >&2
            exit 1
          fi
          record_dir=/tmp/loom-image-release-records
          mkdir -p "$record_dir"
          python3 scripts/ci_image_release_evidence.py record-architecture \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --platform "$PLATFORM" \
            --architecture "$ARCHITECTURE" \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --scan-report-sha256 "$SCAN_REPORT_SHA256" \
            --build-mode "$BUILD_MODE" \
            --output "${record_dir}/${IMAGE_NAME}-${ARCHITECTURE}.json"

      - name: Validate verified architecture evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.architecture-evidence.outputs.tree_sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python3 scripts/ci_image_release_evidence.py validate-architecture-record \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --platform "$PLATFORM" \
            --architecture "$ARCHITECTURE" \
            --record "/tmp/loom-image-release-records/${IMAGE_NAME}-${ARCHITECTURE}.json"

      - name: Upload verified architecture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-release-record-${{ matrix.image }}-${{ matrix.architecture }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-image-release-records/${{ matrix.image }}-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: publish ${{ matrix.image }} manifest
    needs: [plan, publish]
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        needs.plan.outputs.trusted_publish == 'true')) &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.images != '[]' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate manifest inputs
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT"
          [[ "$REF_NAME" == "dev" || "$REF_NAME" == "main" ]] || exit 1
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$REPOSITORY_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]] || exit 1
          [[ ${#GHCR_ACTOR} -le 100 \
            && "$GHCR_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]*(\[bot\])?$ ]] || exit 1

      - name: Download exact AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-${{ matrix.image }}-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-image-release-artifacts/amd64

      - name: Download exact ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-${{ matrix.image }}-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-image-release-artifacts/arm64

      - name: Validate exact architecture evidence
        id: architecture-records
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          metadata="/tmp/${IMAGE_NAME}-architecture-records.json"
          python3 scripts/ci_image_release_evidence.py validate-architecture-records \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --records-dir /tmp/loom-image-release-artifacts \
            --output "$metadata"
          {
            echo "metadata=$metadata"
            echo "subject_name=$(jq -er .subject_name "$metadata")"
            echo "tree_sha=$tree_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin

      - name: Verify architecture attestations
        id: architectures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.architecture-records.outputs.tree_sha }}
          SUBJECT_NAME: ${{ steps.architecture-records.outputs.subject_name }}
          RECORDS_METADATA: ${{ steps.architecture-records.outputs.metadata }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            platform="linux/${architecture}"
            record="/tmp/loom-image-release-artifacts/${architecture}/${IMAGE_NAME}-${architecture}.json"
            subject_name=$(jq -er .subject.name "$record")
            digest=$(jq -er .subject.digest "$record")
            scan_digest=$(jq -er .scan.report_sha256 "$record")
            build_mode=$(jq -er .build.mode "$record")
            build=$(jq -cer .build "$record")
            [[ "$subject_name" == "$SUBJECT_NAME" ]] || exit 1
            if [[ "$build_mode" != "trusted-rebuild" ]]; then
              echo "FAIL: invalid recorded architecture build mode" >&2
              exit 1
            fi
            verification="/tmp/${IMAGE_NAME}-${architecture}.registry-verified.json"
            gh attestation verify "oci://${subject_name}@${digest}" \
              --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
              --source-digest "$HEAD_SHA" \
              --source-ref "refs/heads/${REF_NAME}" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json > "$verification"
            metadata="/tmp/${IMAGE_NAME}-${architecture}.registry-metadata.json"
            python3 scripts/ci_image_release_evidence.py verify-architecture \
              --verification "$verification" \
              --repository "$GITHUB_REPOSITORY" \
              --ref-name "$REF_NAME" \
              --head-sha "$HEAD_SHA" \
              --tree-sha "$TREE_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --event-name "$GITHUB_EVENT_NAME" \
              --repository-id "$GITHUB_REPOSITORY_ID" \
              --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
              --runner-environment "$RUNNER_ENVIRONMENT" \
              --image "$IMAGE_NAME" \
              --image-name "$IMAGE_DIGEST_NAME" \
              --dockerfile "$DOCKERFILE" \
              --build-context "$BUILD_CONTEXT" \
              --platform "$platform" \
              --architecture "$architecture" \
              --scan-report-sha256 "$scan_digest" \
              --build-mode "$build_mode" \
              --subject-name "$subject_name" \
              --subject-digest "$digest" \
              --output "$metadata"
            {
              echo "${architecture}_digest=$digest"
              echo "${architecture}_scan=$scan_digest"
              echo "${architecture}_build=$build"
            } >> "$GITHUB_OUTPUT"
          done
          echo "subject_name=$SUBJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"

      - name: Join verified native image manifest
        id: manifest-evidence
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          AMD64_DIGEST: ${{ steps.architectures.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.architectures.outputs.arm64_digest }}
          AMD64_SCAN: ${{ steps.architectures.outputs.amd64_scan }}
          ARM64_SCAN: ${{ steps.architectures.outputs.arm64_scan }}
          AMD64_BUILD: ${{ steps.architectures.outputs.amd64_build }}
          ARM64_BUILD: ${{ steps.architectures.outputs.arm64_build }}
          TREE_SHA: ${{ steps.architectures.outputs.tree_sha }}
        run: |
          set -euo pipefail
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner_lower}/${IMAGE_DIGEST_NAME}"
          amd64_digest="$AMD64_DIGEST"
          arm64_digest="$ARM64_DIGEST"
          docker buildx imagetools create \
            --progress plain \
            --tag "${image}:manifest-${HEAD_SHA}" \
            "${image}@${amd64_digest}" \
            "${image}@${arm64_digest}"
          tag_manifest=/tmp/loom-image-manifest-by-tag.json
          digest_manifest=/tmp/loom-image-manifest-by-digest.json
          docker buildx imagetools inspect --raw \
            "${image}:manifest-${HEAD_SHA}" > "$tag_manifest"
          manifest_digest="sha256:$(sha256sum "$tag_manifest" | awk '{print $1}')"
          docker buildx imagetools inspect --raw "${image}@${manifest_digest}" \
            > "$digest_manifest"
          cmp --silent "$tag_manifest" "$digest_manifest" || {
            echo "FAIL: manifest digest readback did not match the tagged bytes" >&2
            exit 1
          }
          mv "$digest_manifest" /tmp/loom-image-manifest.json
          python3 scripts/ci_image_release_evidence.py validate-manifest \
            --manifest "/tmp/loom-image-manifest.json" \
            --architecture-digest "linux/amd64=${AMD64_DIGEST}" \
            --architecture-digest "linux/arm64=${ARM64_DIGEST}"
          predicate="/tmp/${IMAGE_NAME}-manifest.slsa.json"
          python3 scripts/ci_image_release_evidence.py predicate-manifest \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --architecture-digest "linux/amd64=${AMD64_DIGEST}" \
            --architecture-digest "linux/arm64=${ARM64_DIGEST}" \
            --scan-report-digest "linux/amd64=${AMD64_SCAN}" \
            --scan-report-digest "linux/arm64=${ARM64_SCAN}" \
            --architecture-build "linux/amd64=${AMD64_BUILD}" \
            --architecture-build "linux/arm64=${ARM64_BUILD}" \
            --output "$predicate"
          {
            echo "subject_name=$image"
            echo "subject_digest=$manifest_digest"
            echo "predicate=$predicate"
          } >> "$GITHUB_OUTPUT"

      - name: Attest published manifest digest
        id: manifest-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.manifest-evidence.outputs.subject_name }}
          subject-digest: ${{ steps.manifest-evidence.outputs.subject_digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.manifest-evidence.outputs.predicate }}
          push-to-registry: true

      - name: Verify published manifest attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.manifest-attestation.outputs.bundle-path }}
          SUBJECT_NAME: ${{ steps.manifest-evidence.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.manifest-evidence.outputs.subject_digest }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          TREE_SHA: ${{ steps.architectures.outputs.tree_sha }}
          AMD64_DIGEST: ${{ steps.architectures.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.architectures.outputs.arm64_digest }}
          AMD64_SCAN: ${{ steps.architectures.outputs.amd64_scan }}
          ARM64_SCAN: ${{ steps.architectures.outputs.arm64_scan }}
          AMD64_BUILD: ${{ steps.architectures.outputs.amd64_build }}
          ARM64_BUILD: ${{ steps.architectures.outputs.arm64_build }}
        run: |
          set -euo pipefail
          verification="/tmp/${IMAGE_NAME}-manifest.verified.json"
          gh attestation verify "oci://${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            --bundle "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
            --source-digest "$HEAD_SHA" \
            --source-ref "refs/heads/${REF_NAME}" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$verification"
          python3 scripts/ci_image_release_evidence.py verify-manifest \
            --verification "$verification" \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --head-sha "$HEAD_SHA" \
            --tree-sha "$TREE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --image "$IMAGE_NAME" \
            --image-name "$IMAGE_DIGEST_NAME" \
            --dockerfile "$DOCKERFILE" \
            --build-context "$BUILD_CONTEXT" \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --architecture-digest "linux/amd64=${AMD64_DIGEST}" \
            --architecture-digest "linux/arm64=${ARM64_DIGEST}" \
            --scan-report-digest "linux/amd64=${AMD64_SCAN}" \
            --scan-report-digest "linux/arm64=${ARM64_SCAN}" \
            --architecture-build "linux/amd64=${AMD64_BUILD}" \
            --architecture-build "linux/arm64=${ARM64_BUILD}"

      - name: Publish verified manifest tags
        shell: bash
        env:
          SUBJECT_NAME: ${{ steps.manifest-evidence.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.manifest-evidence.outputs.subject_digest }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha_short="${HEAD_SHA:0:12}"
          docker buildx imagetools create \
            --tag "${SUBJECT_NAME}:${sha_short}" \
            --tag "${SUBJECT_NAME}:${REF_NAME}" \
            "${SUBJECT_NAME}@${SUBJECT_DIGEST}"
          for tag in "$sha_short" "$REF_NAME"; do
            python3 scripts/ci_registry_readback.py digest \
              --reference "${SUBJECT_NAME}:${tag}" \
              --expected-digest "$SUBJECT_DIGEST" \
              --attempts 6 --delay-seconds 2 >/dev/null
          done

  stage1-publish:
    name: publish Stage 1 linux/amd64 child
    needs: [plan, trivy-binary]
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        needs.plan.outputs.trusted_publish == 'true')) &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.stage1_images != '[]'
    runs-on: [self-hosted, linux, x64, loom-ci-image]
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage1_images) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download exact verified Trivy binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-binaries-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-trivy-binaries

      - name: Require bounded large-image workspace
        shell: bash
        run: |
          set -euo pipefail
          required_bytes=85899345920
          available_bytes=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          [[ "$available_bytes" =~ ^[0-9]+$ ]]
          (( available_bytes >= required_bytes )) || {
            echo "FAIL: Stage 1 publication requires at least 80 GiB free; observed ${available_bytes} bytes" >&2
            exit 1
          }
          df -h "$RUNNER_TEMP"
          docker system df

      - name: Build, inspect, scan, and prepare Stage 1 child
        id: child
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 scripts/component_ownership.py validate-image \
            --image "$IMAGE" --image-name "$IMAGE_NAME" \
            --dockerfile "$DOCKERFILE" --build-context "$BUILD_CONTEXT"
          test "$(uname -m)" = x86_64
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          source_root="$RUNNER_TEMP/loom-stage1-sources-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence_root="$RUNNER_TEMP/loom-stage1-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          builder="loom-stage1-${IMAGE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_image="loom-release-${IMAGE_NAME}:build-${HEAD_SHA}"
          python3 scripts/prepare_behavior_stage1_image_sources.py \
            --repo-root . prepare --output "$source_root"
          docker buildx create --name "$builder" --driver docker-container \
            --use --bootstrap
          docker buildx build --builder "$builder" --load --platform linux/amd64 \
            --build-context "stage1-sources=${source_root}" \
            --build-arg "LOOM_BUILD_SHA=${HEAD_SHA}" \
            --build-arg "LOOM_BUILD_TREE_SHA=${tree_sha}" \
            --label "org.opencontainers.image.revision=${HEAD_SHA}" \
            --file "$DOCKERFILE" --tag "$local_image" "$BUILD_CONTEXT"
          docker buildx rm "$builder"
          python3 scripts/prepare_behavior_stage1_image_sources.py \
            cleanup --output "$source_root"
          common=(
            --rm --network none --read-only --cap-drop ALL
            --security-opt no-new-privileges --user 65532:65532
            --env OMNIGIBSON_DATA_PATH=/scratch
            --tmpfs "/scratch:rw,nosuid,nodev,noexec,size=1g,uid=65532,gid=65532,mode=0700"
            --tmpfs "/tmp:rw,nosuid,nodev,noexec,size=256m,uid=65532,gid=65532,mode=0700"
          )
          docker run "${common[@]}" "$local_image" \
            /opt/loom/bin/sim-python -I -c \
            'from loom.integrations.behavior.stages.rollout_backend import _load_runtime; assert _load_runtime().version == "3.8.0"'
          docker run "${common[@]}" "$local_image" \
            /opt/loom/venv-vla/bin/python -I -c \
            'from loom.integrations.behavior.vla.policy_backend import _load_runtime; assert _load_runtime().version == "0.1.0"'
          mkdir -p "$evidence_root"
          trivy_bin=/tmp/loom-trivy-binaries/amd64/trivy
          (cd /tmp/loom-trivy-binaries/amd64 && sha256sum --check trivy.sha256)
          chmod 0555 "$trivy_bin"
          python3 scripts/write_trivy_release_policy.py \
            --config-file /tmp/loom-stage1-trivy.yaml \
            --ignore-file /tmp/loom-stage1-trivy.ignore.yaml
          "$trivy_bin" --config /tmp/loom-stage1-trivy.yaml image \
            --format json --output "$evidence_root/scan.json" \
            --ignorefile /tmp/loom-stage1-trivy.ignore.yaml \
            --show-suppressed --cache-dir "$RUNNER_TEMP/loom-trivy-cache" "$local_image"
          python3 scripts/validate_trivy_release_report.py \
            --component "$IMAGE" --architecture amd64 \
            --report "$evidence_root/scan.json" \
            --ignore-file /tmp/loom-stage1-trivy.ignore.yaml
          "$trivy_bin" image --format spdx-json \
            --output "$evidence_root/sbom.spdx.json" \
            --cache-dir "$RUNNER_TEMP/loom-trivy-cache" "$local_image"
          trivy_cache="$RUNNER_TEMP/loom-trivy-cache"
          case "$trivy_cache" in
            "$RUNNER_TEMP"/loom-trivy-cache) rm -rf -- "$trivy_cache" ;;
            *) echo 'FAIL: refusing unsafe Trivy cache cleanup' >&2; exit 1 ;;
          esac
          container=$(docker create "$local_image" /bin/true)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/opt/loom/contracts/compatibility-manifest.json" \
            "$evidence_root/compatibility-manifest.json"
          docker cp "$container:/opt/loom/contracts/source-evidence.json" \
            "$evidence_root/source-evidence.json"
          docker cp "$container:/opt/loom/bin/behavior_stage1_image_contract.py" \
            "$evidence_root/preflight.py"
          docker rm "$container"
          trap - EXIT
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          subject_name="ghcr.io/${owner_lower}/${IMAGE_NAME}"
          {
            echo "local_image=$local_image"
            echo "tree_sha=$tree_sha"
            echo "source_root=$source_root"
            echo "evidence_root=$evidence_root"
            echo "subject_name=$subject_name"
          } >> "$GITHUB_OUTPUT"

      - name: Log in and publish exact Stage 1 child
        id: push
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_IMAGE: ${{ steps.child.outputs.local_image }}
          SUBJECT_NAME: ${{ steps.child.outputs.subject_name }}
          EVIDENCE_ROOT: ${{ steps.child.outputs.evidence_root }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" --password-stdin
          target="${SUBJECT_NAME}:build-${HEAD_SHA}-amd64"
          docker tag "$LOCAL_IMAGE" "$target"
          push_output=$(docker push "$target" 2>&1)
          printf '%s\n' "$push_output"
          mapfile -t digests < <(sed -nE \
            's/^.*digest: (sha256:[0-9a-f]{64}) size: [0-9]+.*$/\1/p' <<< "$push_output")
          [[ ${#digests[@]} -eq 1 ]] || {
            echo 'FAIL: child push did not emit exactly one digest' >&2
            exit 1
          }
          python3 scripts/ci_registry_readback.py raw \
            --reference "${SUBJECT_NAME}@${digests[0]}" \
            --expected-digest "${digests[0]}" \
            --output "$EVIDENCE_ROOT/child-manifest.json" \
            --attempts 6 --delay-seconds 2
          {
            echo "subject_name=$SUBJECT_NAME"
            echo "subject_digest=${digests[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Seal trusted child record
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ steps.child.outputs.evidence_root }}
          TREE_SHA: ${{ steps.child.outputs.tree_sha }}
          SUBJECT_NAME: ${{ steps.push.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.push.outputs.subject_digest }}
          IMAGE: ${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          python3 scripts/ci_behavior_stage1_image.py record-child \
            --mode trusted-publish --repository "$GITHUB_REPOSITORY" \
            --ref-name "$GITHUB_REF_NAME" --head-sha "$GITHUB_SHA" \
            --tree-sha "$TREE_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --event-name "$GITHUB_EVENT_NAME" \
            --image "$IMAGE" --image-name "$IMAGE_NAME" --dockerfile "$DOCKERFILE" \
            --context "$BUILD_CONTEXT" --platform linux/amd64 \
            --subject-name "$SUBJECT_NAME" --subject-digest "$SUBJECT_DIGEST" \
            --scan-report "$EVIDENCE_ROOT/scan.json" \
            --sbom "$EVIDENCE_ROOT/sbom.spdx.json" \
            --source-evidence "$EVIDENCE_ROOT/source-evidence.json" \
            --compatibility-manifest "$EVIDENCE_ROOT/compatibility-manifest.json" \
            --preflight "$EVIDENCE_ROOT/preflight.py" \
            --output "$EVIDENCE_ROOT/child-record.json"

      - name: Attest Stage 1 child build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.subject_name }}
          subject-digest: ${{ steps.push.outputs.subject_digest }}
          push-to-registry: true

      - name: Attest exact Stage 1 SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.subject_name }}
          subject-digest: ${{ steps.push.outputs.subject_digest }}
          sbom-path: ${{ steps.child.outputs.evidence_root }}/sbom.spdx.json
          push-to-registry: true

      - name: Upload bounded trusted Stage 1 child evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage1-image-child-release-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.child.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove exact local Stage 1 release image
        if: always()
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_NAME: ${{ matrix.image_name }}
          LOCAL_IMAGE: ${{ steps.child.outputs.local_image }}
          SUBJECT_NAME: ${{ steps.child.outputs.subject_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          builder="loom-stage1-${IMAGE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx rm "$builder" >/dev/null 2>&1 || true
          local_image="${LOCAL_IMAGE:-loom-release-${IMAGE_NAME}:build-${HEAD_SHA}}"
          owner_lower=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          subject_name="${SUBJECT_NAME:-ghcr.io/${owner_lower}/${IMAGE_NAME}}"
          docker image rm "$local_image" >/dev/null 2>&1 || true
          docker image rm "${subject_name}:build-${HEAD_SHA}-amd64" >/dev/null 2>&1 || true
          source_root="$RUNNER_TEMP/loom-stage1-sources-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/prepare_behavior_stage1_image_sources.py \
            cleanup --output "$source_root"
          for path in \
            "$RUNNER_TEMP/loom-stage1-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/loom-trivy-cache"; do
            case "$path" in
              "$RUNNER_TEMP"/loom-stage1-release-*|\
              "$RUNNER_TEMP"/loom-trivy-cache) rm -rf -- "$path" ;;
              *) echo "FAIL: refusing unsafe cleanup path ${path}" >&2; exit 1 ;;
            esac
          done
          df -h "$RUNNER_TEMP"

  stage1-publish-index:
    name: verify and publish Stage 1 OCI index
    needs: [plan, stage1-publish]
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        needs.plan.outputs.trusted_publish == 'true')) &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.plan.outputs.stage1_images != '[]' &&
      needs.stage1-publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download exact Stage 1 child evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stage1-image-child-release-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-stage1-child

      - name: Validate and verify Stage 1 child attestations
        id: child
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          record=/tmp/loom-stage1-child/child-record.json
          python3 scripts/ci_behavior_stage1_image.py validate-child \
            --mode trusted-publish --record "$record"
          subject_name=$(jq -er .subject.name "$record")
          subject_digest=$(jq -er .subject.digest "$record")
          gh attestation verify "oci://${subject_name}@${subject_digest}" \
            --bundle-from-oci --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --predicate-type https://slsa.dev/provenance/v1 --format json \
            > /tmp/loom-stage1-child-provenance.json
          gh attestation verify "oci://${subject_name}@${subject_digest}" \
            --bundle-from-oci --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --predicate-type https://spdx.dev/Document/v2.3 --format json \
            > /tmp/loom-stage1-child-sbom.json
          {
            echo "subject_name=$subject_name"
            echo "subject_digest=$subject_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Log in and assemble exact one-child index
        id: index
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT_NAME: ${{ steps.child.outputs.subject_name }}
          CHILD_DIGEST: ${{ steps.child.outputs.subject_digest }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" --password-stdin
          index_tag="${SUBJECT_NAME}:manifest-${GITHUB_SHA}"
          docker buildx imagetools create --progress plain --tag "$index_tag" \
            "${SUBJECT_NAME}@${CHILD_DIGEST}"
          docker buildx imagetools inspect --raw "$index_tag" > /tmp/loom-stage1-index.json
          index_digest="sha256:$(sha256sum /tmp/loom-stage1-index.json | awk '{print $1}')"
          docker buildx imagetools inspect --raw "${SUBJECT_NAME}@${index_digest}" \
            > /tmp/loom-stage1-index-readback.json
          cmp --silent /tmp/loom-stage1-index.json /tmp/loom-stage1-index-readback.json
          jq -e --arg child "$CHILD_DIGEST" \
            '.mediaType == "application/vnd.oci.image.index.v1+json" and
             (.manifests | length == 1) and
             .manifests[0].digest == $child and
             .manifests[0].platform.os == "linux" and
             .manifests[0].platform.architecture == "amd64"' \
            /tmp/loom-stage1-index.json >/dev/null
          python3 scripts/ci_behavior_stage1_image.py record-index \
            --child-record /tmp/loom-stage1-child/child-record.json \
            --index-manifest /tmp/loom-stage1-index.json \
            --subject-name "$SUBJECT_NAME" --subject-digest "$index_digest" \
            --provenance-verification /tmp/loom-stage1-child-provenance.json \
            --sbom-verification /tmp/loom-stage1-child-sbom.json \
            --output /tmp/loom-stage1-index-release.json
          {
            echo "subject_name=$SUBJECT_NAME"
            echo "subject_digest=$index_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Attest canonical Stage 1 index release record
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.subject_name }}
          subject-digest: ${{ steps.index.outputs.subject_digest }}
          predicate-type: https://loom.dev/attestations/behavior-stage1-image-release/v1
          predicate-path: /tmp/loom-stage1-index-release.json
          push-to-registry: true

      - name: Verify release record and publish immutable tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_NAME: ${{ steps.index.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.index.outputs.subject_digest }}
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --predicate-type https://loom.dev/attestations/behavior-stage1-image-release/v1 \
            --deny-self-hosted-runners --format json \
            > /tmp/loom-stage1-index-verification.json
          sha_short="${GITHUB_SHA:0:12}"
          docker buildx imagetools create \
            --tag "${SUBJECT_NAME}:${sha_short}" --tag "${SUBJECT_NAME}:${GITHUB_REF_NAME}" \
            "${SUBJECT_NAME}@${SUBJECT_DIGEST}"
          for tag in "$sha_short" "$GITHUB_REF_NAME"; do
            python3 scripts/ci_registry_readback.py digest \
              --reference "${SUBJECT_NAME}:${tag}" \
              --expected-digest "$SUBJECT_DIGEST" \
              --attempts 6 --delay-seconds 2 >/dev/null
          done

      - name: Upload canonical final Stage 1 release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage1-image-index-release-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/loom-stage1-index-release.json
            /tmp/loom-stage1-index.json
            /tmp/loom-stage1-index-verification.json
            /tmp/loom-stage1-child-provenance.json
            /tmp/loom-stage1-child-sbom.json
          if-no-files-found: error
          retention-days: 90

  personal-dev-trusted-release:
    name: publish protected personal-development trusted release
    needs: [plan, publish-manifest]
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        needs.plan.outputs.trusted_publish == 'true')) &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.plan.outputs.gate_mode == 'full' &&
      needs.plan.outputs.required == 'true' &&
      needs.publish-manifest.result == 'success' &&
      contains(needs.plan.outputs.images, '"image":"service"') &&
      contains(needs.plan.outputs.images, '"image":"personal-dev-builder"') &&
      contains(needs.plan.outputs.images, '"image":"personal-dev-activation-agent"') &&
      contains(needs.plan.outputs.images, '"image":"personal-dev-scanner-cache"')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download exact service AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-service-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact service ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-service-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-builder AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-builder-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-builder ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-builder-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-activation-agent AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-activation-agent-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-activation-agent ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-activation-agent-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-scanner-cache AMD64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-scanner-cache-amd64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact personal-dev-scanner-cache ARM64 architecture evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-release-record-personal-dev-scanner-cache-arm64-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-release-records

      - name: Download exact scanner-cache assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-dev-scanner-cache-assets-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/loom-personal-dev-scanner-cache-assets

      - name: Read back seven immutable image indexes
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/loom-personal-dev-release-manifests
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for binding in \
            service=loom-service \
            personal-dev-builder=loom-personal-dev-builder \
            personal-dev-activation-agent=loom-personal-dev-activation-agent \
            personal-dev-scanner-cache=loom-personal-dev-scanner-cache; do
            component=${binding%%=*}
            image_name=${binding#*=}
            subject="ghcr.io/${owner_lower}/${image_name}"
            by_tag="/tmp/${component}-by-tag.json"
            by_digest="/tmp/${component}-by-digest.json"
            docker buildx imagetools inspect --raw \
              "${subject}:manifest-${HEAD_SHA}" > "$by_tag"
            digest="sha256:$(sha256sum "$by_tag" | awk '{print $1}')"
            docker buildx imagetools inspect --raw \
              "${subject}@${digest}" > "$by_digest"
            cmp --silent "$by_tag" "$by_digest"
            mv "$by_digest" \
              "/tmp/loom-personal-dev-release-manifests/${component}.json"
          done
          for key in postgres minio minio_client; do
            reference=$(jq -er --arg key "$key" \
              '.images[$key].reference' \
              deploy/dev-fleet/personal-dev-external-images.json)
            manifest="/tmp/loom-personal-dev-release-manifests/${key}.json"
            docker buildx imagetools inspect --raw "$reference" > "$manifest"
            observed="sha256:$(sha256sum "$manifest" | awk '{print $1}')"
            [[ "$reference" == *@"$observed" ]] || {
              echo "FAIL: external image index digest readback changed" >&2
              exit 1
            }
          done

      - name: Read back exact scanner cache and service binaries
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          asset_root=/tmp/loom-personal-dev-scanner-cache-assets
          asset_evidence="$asset_root/scanner-cache-evidence.json"
          lock=deploy/dev-fleet/personal-dev-scanner-cache-lock.json
          expected_fingerprint=$(PYTHONPATH=src:. python3 \
            scripts/prepare_personal_dev_scanner_cache_assets.py \
            --lock "$lock" --verify-output "$asset_root")
          readback_root=/tmp/loom-personal-dev-scanner-readback
          mkdir -m 0700 "$readback_root"
          owner_lower=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          service_subject="ghcr.io/${owner_lower}/loom-service"
          cache_subject="ghcr.io/${owner_lower}/loom-personal-dev-scanner-cache"
          containers=()
          images=()
          cleanup_scanner_readback() {
            for container in "${containers[@]}"; do
              docker rm -f "$container" >/dev/null 2>&1 || true
            done
            for image in "${images[@]}"; do
              docker image rm "$image" >/dev/null 2>&1 || true
            done
          }
          trap cleanup_scanner_readback EXIT
          for architecture in amd64 arm64; do
            platform="linux/${architecture}"
            service_record="/tmp/loom-personal-dev-release-records/service-${architecture}.json"
            cache_record="/tmp/loom-personal-dev-release-records/personal-dev-scanner-cache-${architecture}.json"
            service_digest=$(jq -er \
              '.subject.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
              "$service_record")
            cache_digest=$(jq -er \
              '.subject.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
              "$cache_record")
            service_reference="${service_subject}@${service_digest}"
            cache_reference="${cache_subject}@${cache_digest}"
            images+=("$service_reference" "$cache_reference")
            docker pull --quiet --platform "$platform" "$service_reference" >/dev/null
            docker pull --quiet --platform "$platform" "$cache_reference" >/dev/null

            service_container="loom-trivy-${architecture}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            cache_container="loom-scanner-cache-${architecture}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            containers+=("$service_container" "$cache_container")
            docker create --name "$service_container" "$service_reference" >/dev/null
            docker create --name "$cache_container" "$cache_reference" >/dev/null
            docker cp "${service_container}:/usr/local/bin/trivy" \
              "$readback_root/trivy-linux-${architecture}"
            cache_root="$readback_root/cache-linux-${architecture}"
            mkdir -m 0700 "$cache_root"
            docker cp \
              "${cache_container}:/opt/loom-personal-dev-scanner-cache/assets/." \
              "$cache_root"
            test "$(find "$cache_root" -mindepth 1 -printf '%P\n' | sort)" = "$(printf '%s\n' \
              db \
              db/metadata.json \
              db/trivy.db \
              java-db \
              java-db/metadata.json \
              java-db/trivy-java.db | sort)"
            test ! -e "$cache_root/scanner-cache-evidence.json"
            cp --no-preserve=mode,ownership -- "$asset_evidence" \
              "$cache_root/scanner-cache-evidence.json"
            chmod 0444 "$cache_root/scanner-cache-evidence.json"
            observed_fingerprint=$(PYTHONPATH=src:. python3 \
              scripts/prepare_personal_dev_scanner_cache_assets.py \
              --lock "$lock" --verify-output "$cache_root")
            test "$observed_fingerprint" = "$expected_fingerprint"
            docker rm "$service_container" "$cache_container" >/dev/null
          done
          for relative in \
            db/metadata.json \
            db/trivy.db \
            java-db/metadata.json \
            java-db/trivy-java.db; do
            cmp --silent \
              "$readback_root/cache-linux-amd64/$relative" \
              "$readback_root/cache-linux-arm64/$relative"
          done
          test "$(PYTHONPATH=src:. python3 \
            scripts/prepare_personal_dev_scanner_cache_assets.py \
            --lock "$lock" --verify-output "$asset_root")" = "$expected_fingerprint"

      - name: Assemble canonical personal-development release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          PYTHONPATH=src:. python3 scripts/ci_personal_dev_trusted_release.py assemble \
            --records-dir /tmp/loom-personal-dev-release-records \
            --manifests-dir /tmp/loom-personal-dev-release-manifests \
            --external-images-file deploy/dev-fleet/personal-dev-external-images.json \
            --scanner-cache-lock-file deploy/dev-fleet/personal-dev-scanner-cache-lock.json \
            --scanner-cache-evidence-file /tmp/loom-personal-dev-scanner-cache-assets/scanner-cache-evidence.json \
            --scanner-binary-amd64-file /tmp/loom-personal-dev-scanner-readback/trivy-linux-amd64 \
            --scanner-binary-arm64-file /tmp/loom-personal-dev-scanner-readback/trivy-linux-arm64 \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --source-sha "$HEAD_SHA" \
            --source-tree "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --output-dir /tmp/loom-personal-dev-trusted-release

      - name: Verify four protected Loom manifest attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          evidence=/tmp/loom-personal-dev-trusted-release/trusted-release-evidence.json
          for component in service personal-dev-builder personal-dev-activation-agent personal-dev-scanner-cache; do
            case "$component" in
              service)
                image_name=loom-service
                dockerfile=deploy/Dockerfile.service
                ;;
              personal-dev-builder)
                image_name=loom-personal-dev-builder
                dockerfile=deploy/Dockerfile.personal-dev-builder
                ;;
              personal-dev-activation-agent)
                image_name=loom-personal-dev-activation-agent
                dockerfile=deploy/Dockerfile.personal-dev-activation-agent
                ;;
              personal-dev-scanner-cache)
                image_name=loom-personal-dev-scanner-cache
                dockerfile=deploy/Dockerfile.personal-dev-scanner-cache
                ;;
              *) exit 1 ;;
            esac
            reference=$(jq -er --arg component "$component" \
              '.internal_images[$component].reference' "$evidence")
            subject_name=${reference%@*}
            subject_digest=${reference##*@}
            verification="/tmp/${component}-manifest.verified.json"
            gh attestation verify "oci://${reference}" \
              --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
              --source-digest "$HEAD_SHA" \
              --source-ref "refs/heads/${REF_NAME}" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json > "$verification"
            amd64_digest=$(jq -er --arg component "$component" \
              '.internal_images[$component].platforms["linux/amd64"].subject_digest' \
              "$evidence")
            arm64_digest=$(jq -er --arg component "$component" \
              '.internal_images[$component].platforms["linux/arm64"].subject_digest' \
              "$evidence")
            amd64_scan=$(jq -er --arg component "$component" \
              '.internal_images[$component].platforms["linux/amd64"].scan_report_sha256' \
              "$evidence")
            arm64_scan=$(jq -er --arg component "$component" \
              '.internal_images[$component].platforms["linux/arm64"].scan_report_sha256' \
              "$evidence")
            amd64_build=$(jq -cer --arg component "$component" \
              '.internal_images[$component].platforms["linux/amd64"].build' "$evidence")
            arm64_build=$(jq -cer --arg component "$component" \
              '.internal_images[$component].platforms["linux/arm64"].build' "$evidence")
            python3 scripts/ci_image_release_evidence.py verify-manifest \
              --verification "$verification" \
              --repository "$GITHUB_REPOSITORY" \
              --ref-name "$REF_NAME" \
              --head-sha "$HEAD_SHA" \
              --tree-sha "$tree_sha" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --event-name "$GITHUB_EVENT_NAME" \
              --repository-id "$GITHUB_REPOSITORY_ID" \
              --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
              --runner-environment "$RUNNER_ENVIRONMENT" \
              --image "$component" \
              --image-name "$image_name" \
              --dockerfile "$dockerfile" \
              --build-context . \
              --subject-name "$subject_name" \
              --subject-digest "$subject_digest" \
              --architecture-digest "linux/amd64=${amd64_digest}" \
              --architecture-digest "linux/arm64=${arm64_digest}" \
              --scan-report-digest "linux/amd64=${amd64_scan}" \
              --scan-report-digest "linux/arm64=${arm64_scan}" \
              --architecture-build "linux/amd64=${amd64_build}" \
              --architecture-build "linux/arm64=${arm64_build}"
          done

      - name: Revalidate canonical personal-development release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree_sha=$(git rev-parse "${HEAD_SHA}^{tree}")
          output=/tmp/loom-personal-dev-trusted-release
          PYTHONPATH=src:. python3 scripts/ci_personal_dev_trusted_release.py validate \
            --records-dir /tmp/loom-personal-dev-release-records \
            --manifests-dir /tmp/loom-personal-dev-release-manifests \
            --external-images-file deploy/dev-fleet/personal-dev-external-images.json \
            --scanner-cache-lock-file deploy/dev-fleet/personal-dev-scanner-cache-lock.json \
            --scanner-cache-evidence-file /tmp/loom-personal-dev-scanner-cache-assets/scanner-cache-evidence.json \
            --scanner-binary-amd64-file /tmp/loom-personal-dev-scanner-readback/trivy-linux-amd64 \
            --scanner-binary-arm64-file /tmp/loom-personal-dev-scanner-readback/trivy-linux-arm64 \
            --repository "$GITHUB_REPOSITORY" \
            --ref-name "$REF_NAME" \
            --source-sha "$HEAD_SHA" \
            --source-tree "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --runner-environment "$RUNNER_ENVIRONMENT" \
            --release-file "$output/trusted-release.json" \
            --evidence-file "$output/trusted-release-evidence.json" \
            --sha256-file "$output/trusted-release.sha256"

      - name: Upload protected personal-development trusted release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-dev-trusted-release-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/loom-personal-dev-trusted-release/trusted-release.json
            /tmp/loom-personal-dev-trusted-release/trusted-release-evidence.json
            /tmp/loom-personal-dev-trusted-release/trusted-release.sha256
          if-no-files-found: error
          retention-days: 90

  images-gate:
    name: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          needs.plan.outputs.trusted_publish == 'true' &&
          'images-gate-trusted-publish' ||
          github.event_name == 'workflow_dispatch' && 'images-gate-manual' ||
          github.event_name == 'push' && 'images-gate-push' ||
          needs.plan.outputs.gate_mode == 'full' &&
          needs.plan.outputs.publisher_active == 'false' &&
          'images-gate' ||
          needs.plan.outputs.gate_mode == 'full' && 'images-gate-attempt' ||
          'images-gate-filtered' }}
    runs-on: ubuntu-latest
    if: always() && needs.plan.outputs.gate_mode != 'filtered'
    needs: [plan, build, stage1-build, candidate-index, publish, publish-manifest, personal-dev-trusted-release, stage1-publish, stage1-publish-index]
    steps:
      - name: Enforce selected image result
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_PUBLISH: ${{ needs.plan.outputs.trusted_publish }}
          PLAN_RESULT: ${{ needs.plan.result }}
          GATE_MODE: ${{ needs.plan.outputs.gate_mode }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          BUILD_RESULT: ${{ needs.build.result }}
          CANDIDATE_INDEX_RESULT: ${{ needs.candidate-index.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          MANIFEST_RESULT: ${{ needs.publish-manifest.result }}
          PERSONAL_DEV_RELEASE_RESULT: ${{ needs.personal-dev-trusted-release.result }}
          STAGE1_IMAGES: ${{ needs.plan.outputs.stage1_images }}
          STAGE1_BUILD_RESULT: ${{ needs.stage1-build.result }}
          STAGE1_PUBLISH_RESULT: ${{ needs.stage1-publish.result }}
          STAGE1_INDEX_RESULT: ${{ needs.stage1-publish-index.result }}
          STANDARD_IMAGES: ${{ needs.plan.outputs.images }}
          INTERNAL_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          TRUSTED_PUBLISH=${TRUSTED_PUBLISH:-false}
          STANDARD_IMAGES=${STANDARD_IMAGES:-'[{}]'}
          STAGE1_IMAGES=${STAGE1_IMAGES:-'[]'}
          STAGE1_BUILD_RESULT=${STAGE1_BUILD_RESULT:-skipped}
          STAGE1_PUBLISH_RESULT=${STAGE1_PUBLISH_RESULT:-skipped}
          STAGE1_INDEX_RESULT=${STAGE1_INDEX_RESULT:-skipped}
          PERSONAL_DEV_RELEASE_RESULT=${PERSONAL_DEV_RELEASE_RESULT:-skipped}
          [[ "$PLAN_RESULT" == "success" ]] || exit 1
          case "$GATE_MODE" in
            full|filtered) ;;
            *) echo "FAIL: invalid gate mode ${GATE_MODE@Q}" >&2; exit 1 ;;
          esac
          if [[ "$GATE_MODE" == "filtered" ]]; then
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request|merge_group|workflow_dispatch|push) ;;
            *) echo "FAIL: invalid event name" >&2; exit 1 ;;
          esac
          case "$REQUIRED" in
            true|false) ;;
            *) echo "FAIL: invalid planner boolean required=${REQUIRED@Q}" >&2; exit 1 ;;
          esac
          personal_dev_release_selected=$(python3 -c '
          import json, sys
          images = json.load(sys.stdin)
          selected = {item.get("image") for item in images if isinstance(item, dict)}
          required = {
              "service",
              "personal-dev-builder",
              "personal-dev-activation-agent",
          }
          print("true" if required <= selected else "false")
          ' <<< "$STANDARD_IMAGES")
          if [[ "$REQUIRED" == "true" \
                && ("$EVENT_NAME" == "push" || "$TRUSTED_PUBLISH" == "true") \
                && "$personal_dev_release_selected" == "true" ]]; then
            [[ "$PERSONAL_DEV_RELEASE_RESULT" == "success" ]] || exit 1
          else
            [[ "$PERSONAL_DEV_RELEASE_RESULT" == "skipped" ]] || exit 1
          fi
          if [[ "$REQUIRED" == "true" ]]; then
            if [[ "$EVENT_NAME" == "push" || "$TRUSTED_PUBLISH" == "true" ]]; then
              [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
              [[ "$CANDIDATE_INDEX_RESULT" == "skipped" ]] || exit 1
              if [[ "$STANDARD_IMAGES" == "[]" ]]; then
                [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
                [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
              else
                [[ "$PUBLISH_RESULT" == "success" ]] || exit 1
                [[ "$MANIFEST_RESULT" == "success" ]] || exit 1
              fi
              [[ "$STAGE1_BUILD_RESULT" == "skipped" ]] || exit 1
              if [[ "$STAGE1_IMAGES" == "[]" ]]; then
                [[ "$STAGE1_PUBLISH_RESULT" == "skipped" ]] || exit 1
                [[ "$STAGE1_INDEX_RESULT" == "skipped" ]] || exit 1
              else
                [[ "$STAGE1_PUBLISH_RESULT" == "success" ]] || exit 1
                [[ "$STAGE1_INDEX_RESULT" == "success" ]] || exit 1
              fi
            else
              if [[ "$STANDARD_IMAGES" == "[]" ]]; then
                [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
                [[ "$CANDIDATE_INDEX_RESULT" == "skipped" ]] || exit 1
              else
                [[ "$BUILD_RESULT" == "success" ]] || exit 1
                if [[ "$INTERNAL_PULL_REQUEST" == "true" ]]; then
                  [[ "$CANDIDATE_INDEX_RESULT" == "success" ]] || exit 1
                else
                  [[ "$CANDIDATE_INDEX_RESULT" == "skipped" ]] || exit 1
                fi
              fi
              if [[ "$STAGE1_IMAGES" == "[]" ]]; then
                [[ "$STAGE1_BUILD_RESULT" == "skipped" ]] || exit 1
              else
                [[ "$STAGE1_BUILD_RESULT" == "success" ]] || exit 1
              fi
              [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
              [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
              [[ "$STAGE1_PUBLISH_RESULT" == "skipped" ]] || exit 1
              [[ "$STAGE1_INDEX_RESULT" == "skipped" ]] || exit 1
            fi
          else
            [[ "$BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$CANDIDATE_INDEX_RESULT" == "skipped" ]] || exit 1
            [[ "$PUBLISH_RESULT" == "skipped" ]] || exit 1
            [[ "$MANIFEST_RESULT" == "skipped" ]] || exit 1
            [[ "$STAGE1_BUILD_RESULT" == "skipped" ]] || exit 1
            [[ "$STAGE1_PUBLISH_RESULT" == "skipped" ]] || exit 1
            [[ "$STAGE1_INDEX_RESULT" == "skipped" ]] || exit 1
          fi
