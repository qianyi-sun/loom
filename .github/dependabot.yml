version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    target-branch: dev
    # Paused while the public repository is internal-development-first and
    # external/dependency PR intake is not open yet.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
      include: scope
