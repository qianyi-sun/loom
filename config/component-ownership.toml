[[test_suites]]
id = "python-root-fast"
language = "python"
lane = "tests-root"
include_paths = [
  "tests/*.py",
  "tests/contract/**/*.py",
  "tests/loom_cli/**/*.py",
  "tests/loom_config/**/*.py",
  "tests/loom_egress_xds/**/*.py",
  "tests/ops/**/*.py",
  "tests/property/**/*.py",
  "tests/unit/**/*.py",
]

[[test_suites]]
id = "python-integration-fast"
language = "python"
lane = "integration"
include_paths = ["tests/integration/**/*.py"]
exclude_paths = [
  "tests/integration/test_docker_driver_exec.py",
  "tests/integration/test_docker_driver_exec_streaming.py",
  "tests/integration/test_docker_driver_healthcheck.py",
  "tests/integration/test_docker_driver_io.py",
  "tests/integration/test_docker_driver_lifecycle.py",
  "tests/integration/test_docker_network_policy.py",
  "tests/integration/test_egress_xds_envoy.py",
  "tests/integration/test_gateway_with_litellm_agent.py",
  "tests/integration/test_sandbox_network_docker.py",
  "tests/integration/test_subprocess_agent_e2e.py",
  "tests/integration/test_trial_e2e_docker.py",
  "tests/integration/test_trial_inprocess_e2e.py",
  "tests/integration/test_verify_cmd_humaneval.py",
  "tests/integration/test_workspace_snapshot_docker.py",
]

[[test_suites]]
id = "python-integration-docker"
language = "python"
lane = "integration-docker"
include_paths = [
  "tests/integration/test_docker_driver_exec.py",
  "tests/integration/test_docker_driver_exec_streaming.py",
  "tests/integration/test_docker_driver_healthcheck.py",
  "tests/integration/test_docker_driver_io.py",
  "tests/integration/test_docker_driver_lifecycle.py",
  "tests/integration/test_docker_network_policy.py",
  "tests/integration/test_egress_xds_envoy.py",
  "tests/integration/test_gateway_with_litellm_agent.py",
  "tests/integration/test_sandbox_network_docker.py",
  "tests/integration/test_subprocess_agent_e2e.py",
  "tests/integration/test_trial_e2e_docker.py",
  "tests/integration/test_trial_inprocess_e2e.py",
