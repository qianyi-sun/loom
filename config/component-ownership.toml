schema_version = 1
ci_lanes = [
  "cluster-smoke",
  "frontend",
  "go-checks",
  "integration",
  "integration-docker",
  "system-smoke",
  "tests-packages",
  "tests-root",
]
smoke_owners = [
  "agent-runtime-conformance",
  "egress-conformance",
  "family-orchestrator-conformance",
  "frontend-smoke",
  "gb10-catalog-smoke",
  "sandbox-network-conformance",
  "staging-smoke",
  "task-fixture-conformance",
  "tb2-fixture-conformance",
  "worker-runtime-conformance",
]
scan_owners = [
  "images",
  "runtime-payload-scan",
]
attestation_owners = [
  "release-provenance",
  "runtime-payload-provenance",
]

# This file is the typed ownership authority. The images workflow derives its
# release matrix, build inputs, and changed-path selection from it. Planner,
# staging, rollout, release, and test-lane consumers migrate in later slices;
# the validator already rejects any missing or ambiguous Dockerfile/test owner.

[[components]]
id = "agent-sandbox"
kind = "release-image"
dockerfile = "deploy/Dockerfile.agent-sandbox"
build_context = "."
source_paths = [
  ".dockerignore",
  "deploy/Dockerfile.agent-sandbox",
  "deploy/agent-sandbox/**",
  "packages/loom-launcher/**",
]
smoke_owner = "agent-runtime-conformance"
scan_owner = "images"
attestation_owner = "release-provenance"
release_digest = "loom-agent-sandbox"
runtime_policy = "conformance"

[[components]]
id = "control-plane"
kind = "release-image"
dockerfile = "deploy/Dockerfile.control-plane"
build_context = "."
source_paths = [
