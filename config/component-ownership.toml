  "deploy/Dockerfile.control-plane",
  "migrations/**",
  "pyproject.toml",
  "src/**",
]
smoke_owner = "staging-smoke"
scan_owner = "images"
attestation_owner = "release-provenance"
release_digest = "loom-control-plane"
runtime_policy = "start"

