]

[[test_suites]]
id = "python-cluster-smoke"
language = "python"
lane = "cluster-smoke"
include_paths = ["tests/cluster/**/*.py"]

[[test_suites]]
id = "python-system-smoke"
language = "python"
lane = "system-smoke"
include_paths = ["tests/system/**/*.py"]

[[test_suites]]
id = "python-task-runtime-payload"
language = "python"
runtime_payload = true
include_paths = ["tests/fixtures/**/*.py"]

[[test_suites]]
id = "python-catalog-runtime-payload"
language = "python"
runtime_payload = true
include_paths = ["deploy/catalog/**/tests/**/*.py"]

[[test_suites]]
id = "python-package-fast"
language = "python"
lane = "tests-packages"
include_paths = ["packages/*/tests/**/*.py"]
exclude_paths = ["packages/loom-benchmark-terminal-bench-2/tests/fixtures/**/*.py"]

[[test_suites]]
id = "python-tb2-runtime-payload"
language = "python"
runtime_payload = true
include_paths = ["packages/loom-benchmark-terminal-bench-2/tests/fixtures/**/*.py"]

[[test_suites]]
id = "go-gateway-sandbox"
language = "go"
lane = "go-checks"
include_paths = ["cmd/**/*_test.go"]

[[test_suites]]
id = "web-unit"
language = "web"
lane = "frontend"
include_paths = [
  "web/**/*.test.ts",
  "web/**/*.test.tsx",
]
