[meta]
version = 1

[service_prefix]
control-plane = "CP"
llm-gateway   = "GW"
loom-service  = "SVC"
worker        = "WORKER"

# ─── service_config: shared fields first ───

[service_config.db_url]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "PostgresDsn"
required    = true
secret      = { key_per_service = { control-plane = "cp-db-url", llm-gateway = "gw-db-url", loom-service = "svc-db-url" } }
description = "Postgres connection string. Per-service Secret keys so DB credentials rotate independently."

[service_config.db_pool_size]
used_by     = ["control-plane"]
python_type = "int"
default     = 20
description = "Control Plane SQLAlchemy DB connection pool size. Size this for concurrent worker heartbeats, claims, state patches, and trajectory index writes."

[service_config.db_max_overflow]
used_by     = ["control-plane"]
python_type = "int"
default     = 40
description = "Control Plane SQLAlchemy DB overflow connections above db_pool_size for short writeback bursts."

[service_config.db_pool_timeout_sec]
used_by     = ["control-plane"]
python_type = "float"
default     = 30.0
description = "Control Plane SQLAlchemy timeout in seconds when waiting for a DB connection from the pool."

[service_config.step_jwt_signing_key]
used_by     = ["control-plane", "llm-gateway"]
python_type = "SecretStr"
required    = true
secret      = { key = "step-jwt-signing-key", generate = "openssl rand -hex 64" }
description = "HS256 step-JWT key. CP mints, gateway verifies; mismatch → 401 on every facade call."

[service_config.storage_backend]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "str"
default     = "minio"
description = "Object-store backend. S3-compatible: minio (default), s3, r2, b2, wasabi. Non-S3 (renderers TBD): gcs (#254). Drives `bootstrap-storage-lifecycle` renderer selection and informs the credentials provider chain."

[service_config.storage_auth_kind]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "str"
default     = "static_keys"
description = "Credentials resolution strategy. static_keys (default): read minio-access-key + minio-secret-key from loom-secrets — works for MinIO + every S3-compatible provider. irsa: boto3 discovers the AWS IAM role from the pod's projected serviceAccountToken (EKS); no static keys needed. workload_identity / sa_json: GCS analogues, available once #254 lands."

[service_config.minio_endpoint]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "str"
default     = "http://loom-minio:9000"

[service_config.minio_access_key]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "SecretStr"
required    = true
secret      = { key = "minio-access-key" }

[service_config.minio_secret_key]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "SecretStr"
required    = true
secret      = { key = "minio-secret-key" }

[service_config.minio_region]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "str"
default     = "us-east-1"

[service_config.minio_max_pool_connections]
used_by     = ["worker"]
python_type = "int"
default     = 256
description = "Worker-side boto3 S3 connection pool size. Size this with worker concurrency because task materialization, artifact upload, and trajectory upload can overlap heavily during benchmark sweeps."

[service_config.minio_connect_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 5.0
description = "Worker-side boto3 S3 connect timeout in seconds."

[service_config.minio_read_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 120.0
description = "Worker-side boto3 S3 socket read timeout in seconds. Keep above transient MinIO latency under high-concurrency materialization/upload pressure."

[service_config.minio_operation_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 300.0
description = "Worker-side wall-clock timeout for each S3 operation wrapper such as download_prefix, put_object, multipart part upload, and presign."

[service_config.minio_operation_attempts]
used_by     = ["worker"]
python_type = "int"
default     = 3
description = "Worker-side S3 operation attempts after timeout/reconnect. Each attempt uses minio_operation_timeout_sec."

[service_config.llm_gateway_url]
used_by     = ["control-plane"]
python_type = "HttpUrl"
default     = "http://loom-llm-gateway:9100"

[service_config.control_plane_url]
used_by     = ["loom-service", "worker"]
python_type = "HttpUrl"
default     = "http://loom-control-plane:8080"

[service_config.gateway_url]
used_by     = ["loom-service", "worker"]
python_type = "HttpUrl"
default     = "http://loom-llm-gateway:9100"

[service_config.subprocess_gateway_url]
used_by     = ["worker"]
python_type = "HttpUrl"
description = "Optional OpenAI-compatible facade base URL as seen from trial sandbox subprocess agents. Use when the worker's own gateway_url is not resolvable from Docker sandboxes, e.g. http://host.docker.internal:30443/openai/v1 on k8s nodes with gateway-router hostPort."

[service_config.admin_secret_file]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "Path"
# no required, no default → `Path | None = None`
# k8s templates inject a template-local literal after the env_block macro

[service_config.log_level]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "LogLevel"
default     = "info"

[service_config.dev_reload]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "bool"
default     = false

[service_config.bind_host]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "str"
default     = "0.0.0.0"

[service_config.bind_port]
used_by             = ["control-plane", "llm-gateway", "loom-service"]
python_type         = "int"
default_per_service = { control-plane = 8080, llm-gateway = 9100, loom-service = 8090 }

[service_config.metrics_port]
used_by             = ["control-plane", "llm-gateway", "worker"]
python_type         = "int"
default_per_service = { control-plane = 9090, llm-gateway = 9101, worker = 9090 }

# ─── control-plane only ───

[service_config.worker_heartbeat_expiry_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 120

[service_config.worker_reclaim_sweep_interval_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 30

[service_config.claimed_without_start_expiry_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 300
description = "Seconds before the crash detector reclaims a trial stuck in claimed with no started_at while the owning worker is still fresh."

[service_config.signed_url_expiry_sec]
used_by     = ["control-plane", "loom-service"]
python_type = "int"
default     = 3600

[service_config.slurm_worker_controller_enabled]
used_by     = ["control-plane"]
python_type = "bool"
default     = false
description = "Enable the Control Plane elastic Slurm worker controller loop."

[service_config.slurm_worker_controller_environment]
used_by     = ["control-plane"]
python_type = "str"
default     = "development"
description = "Environment label written to slurm_worker_jobs for elastic worker jobs."

[service_config.slurm_worker_controller_pool_name]
used_by     = ["control-plane"]
python_type = "str"
default     = "oldlab"
description = "Slurm worker pool label written to slurm_worker_jobs."

[service_config.slurm_worker_controller_allowed_nodes]
used_by     = ["control-plane"]
python_type = "str"
default     = ""
description = "Comma-separated Slurm nodes the controller may target."

[service_config.slurm_worker_controller_env_file]
used_by     = ["control-plane"]
python_type = "str"
default     = ""
description = "Remote-worker env file path exported into elastic Slurm jobs."

[service_config.slurm_worker_controller_repo_dir]
used_by     = ["control-plane"]
python_type = "str"
default     = ""
description = "Repository directory path used by elastic Slurm worker jobs."

[service_config.slurm_worker_controller_partition]
used_by     = ["control-plane"]
python_type = "str"
default     = ""
description = "Optional Slurm partition for elastic worker jobs."

[service_config.slurm_worker_controller_time_limit]
used_by     = ["control-plane"]
python_type = "str"
default     = "7-00:00:00"
description = "Slurm --time value for elastic worker jobs."

[service_config.slurm_worker_controller_requested_cpus]
used_by     = ["control-plane"]
python_type = "int"
default     = 12
description = "CPU count requested per elastic Slurm worker job."

[service_config.slurm_worker_controller_requested_memory_mib]
used_by     = ["control-plane"]
python_type = "int"
default     = 58000
description = "Memory requested per elastic Slurm worker job, in MiB."

[service_config.slurm_worker_controller_requested_concurrency]
used_by     = ["control-plane"]
python_type = "int"
default     = 6
description = "LOOM_WORKER_MAX_CONCURRENT value requested per elastic worker job."

[service_config.slurm_worker_controller_max_jobs]
used_by     = ["control-plane"]
python_type = "int"
default     = 0
description = "Maximum running plus pending elastic Slurm worker jobs."

[service_config.slurm_worker_controller_pending_job_cap]
used_by     = ["control-plane"]
python_type = "int"
default     = 1
description = "Maximum pending elastic Slurm worker jobs allowed at once."

[service_config.slurm_worker_controller_min_queued_trials]
used_by     = ["control-plane"]
python_type = "int"
default     = 1
description = "Queued trial threshold before the elastic Slurm controller submits jobs."

[service_config.slurm_worker_controller_stale_after_seconds]
used_by     = ["control-plane"]
python_type = "int"
default     = 300
description = "Seconds before an unobserved active Slurm worker job is marked stale."

[service_config.slurm_worker_controller_sbatch_path]
used_by     = ["control-plane"]
python_type = "str"
default     = "sbatch"
description = "Path to sbatch for the elastic Slurm controller."

[service_config.slurm_worker_controller_squeue_path]
used_by     = ["control-plane"]
python_type = "str"
default     = "squeue"
description = "Path to squeue for the elastic Slurm controller."

[service_config.slurm_worker_controller_sacct_path]
used_by     = ["control-plane"]
python_type = "str"
default     = "sacct"
description = "Path to sacct for the elastic Slurm controller."

[service_config.slurm_worker_controller_scancel_path]
used_by     = ["control-plane"]
python_type = "str"
default     = "scancel"
description = "Path to scancel for the elastic Slurm controller."

[service_config.slurm_worker_controller_command_timeout_seconds]
used_by     = ["control-plane"]
python_type = "float"
default     = 20.0
description = "Timeout for each Slurm command invoked by the elastic controller."

