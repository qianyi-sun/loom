[meta]
version = 1

[service_prefix]
control-plane = "CP"
llm-gateway   = "GW"
loom-service  = "SVC"
worker        = "WORKER"

# ─── service_config: shared fields first ───

[service_config.db_url]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "PostgresDsn"
required    = true
secret      = { key_per_service = { control-plane = "cp-db-url", llm-gateway = "gw-db-url", loom-service = "svc-db-url" } }
description = "Postgres connection string. Per-service Secret keys so DB credentials rotate independently."

[service_config.step_jwt_signing_key]
used_by     = ["control-plane", "llm-gateway"]
python_type = "SecretStr"
required    = true
secret      = { key = "step-jwt-signing-key", generate = "openssl rand -hex 64" }
description = "HS256 step-JWT key. CP mints, gateway verifies; mismatch → 401 on every facade call."

[service_config.minio_endpoint]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "str"
default     = "http://loom-minio:9000"

[service_config.minio_access_key]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "SecretStr"
required    = true
secret      = { key = "minio-access-key" }

[service_config.minio_secret_key]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "SecretStr"
required    = true
secret      = { key = "minio-secret-key" }

[service_config.minio_region]
used_by     = ["control-plane", "loom-service", "worker"]
python_type = "str"
default     = "us-east-1"

[service_config.llm_gateway_url]
used_by     = ["control-plane"]
python_type = "HttpUrl"
default     = "http://loom-llm-gateway:9100"

[service_config.control_plane_url]
used_by     = ["loom-service", "worker"]
python_type = "HttpUrl"
default     = "http://loom-control-plane:8080"

[service_config.gateway_url]
used_by     = ["loom-service", "worker"]
python_type = "HttpUrl"
default     = "http://loom-llm-gateway:9100"

[service_config.admin_secret_file]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "Path"
# no required, no default → `Path | None = None`
# k8s templates inject a template-local literal after the env_block macro

[service_config.log_level]
used_by     = ["control-plane", "llm-gateway", "loom-service", "worker"]
python_type = "LogLevel"
default     = "info"

[service_config.dev_reload]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "bool"
default     = false

[service_config.bind_host]
used_by     = ["control-plane", "llm-gateway", "loom-service"]
python_type = "str"
default     = "0.0.0.0"

[service_config.bind_port]
used_by             = ["control-plane", "llm-gateway", "loom-service"]
python_type         = "int"
default_per_service = { control-plane = 8080, llm-gateway = 9100, loom-service = 8090 }

[service_config.metrics_port]
used_by             = ["control-plane", "llm-gateway", "worker"]
python_type         = "int"
default_per_service = { control-plane = 9090, llm-gateway = 9101, worker = 9090 }

# ─── control-plane only ───

[service_config.worker_heartbeat_expiry_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 15

[service_config.worker_reclaim_sweep_interval_sec]
used_by     = ["control-plane"]
python_type = "int"
default     = 30

[service_config.signed_url_expiry_sec]
used_by     = ["control-plane", "loom-service"]
python_type = "int"
default     = 3600

# ─── llm-gateway only ───

[service_config.anthropic_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "anthropic-api-key" }

[service_config.openai_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "openai-api-key" }

[service_config.google_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "google-api-key" }

[service_config.together_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "together-api-key" }

[service_config.huggingface_api_key]
used_by     = ["llm-gateway"]
python_type = "SecretStr"
secret      = { key = "huggingface-api-key" }

[service_config.rate_card_cache_ttl_sec]
used_by     = ["llm-gateway"]
python_type = "int"
default     = 300

[service_config.upstream_timeout_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 120.0

# ─── Per-request retry on transient upstream failures (#298 Slice A) ───
# Retry classification + budget live in `loom_llm_gateway/retry.py`.
# Defaults are conservative (worst-case ~4s of waits before exhausting
# 3 attempts) to fit inside subprocess agent client timeouts (60-120s).

[service_config.llm_retry_max_attempts]
used_by     = ["llm-gateway"]
python_type = "int"
default     = 3
description = "Max attempts per upstream LLM request including the initial call. 1 disables retry (#298 Slice A)."

[service_config.llm_retry_base_backoff_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 0.5
description = "Exponential-backoff base. Attempt N waits min(base * 2^(N-1) + jitter, max_backoff_sec)."

[service_config.llm_retry_jitter_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 0.25
description = "Uniform jitter ±this many seconds added to each backoff wait. Reduces thundering-herd against the upstream."

[service_config.llm_retry_max_backoff_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 4.0
description = "Per-attempt backoff ceiling. Stops exponential growth before subprocess agent timeouts kick in."

[service_config.llm_retry_budget_sec]
used_by     = ["llm-gateway"]
python_type = "float"
default     = 30.0
description = "Total wall-clock retry budget per request. We stop retrying once cumulative wait + elapsed exceeds this, even if attempts remain. Sized to leave room within the typical 60-120s subprocess agent timeout for the actual upstream call."

[service_config.egress_proxy_url]
used_by     = ["llm-gateway"]
python_type = "str"
default     = ""
description = "Envoy egress-proxy URL (#190 PR-C2). Empty disables proxy mode → upstream HTTP goes direct. Set to e.g. `http://loom-egress-proxy:30443` to route every facade/native passthrough through the Envoy egress chain."

# ─── loom-service only ───

[service_config.team_registration_open]
used_by     = ["loom-service"]
python_type = "bool"
default     = false

[service_config.auth_session_cookie_name]
used_by     = ["loom-service"]
python_type = "str"
default     = "loom_session"
description = "Browser auth HttpOnly session cookie name for invite-only public Loom (#326)."

[service_config.auth_csrf_header_name]
used_by     = ["loom-service"]
python_type = "str"
default     = "X-Loom-CSRF"
description = "Header required on unsafe browser session requests. The SPA gets this token from auth JSON responses and keeps it in memory; bearer-token service/CLI requests are not CSRF-gated (#326)."

[service_config.auth_csrf_cookie_name]
used_by     = ["loom-service"]
python_type = "str"
default     = "loom_csrf"
description = "Legacy CSRF cookie name to clear during logout; current SPA keeps CSRF tokens in memory."

[service_config.auth_session_ttl_sec]
used_by     = ["loom-service"]
python_type = "int"
default     = 604800
description = "Browser session lifetime in seconds. Default is 7 days (#326)."

[service_config.auth_login_challenge_ttl_sec]
used_by     = ["loom-service"]
python_type = "int"
default     = 900
description = "Existing-user login challenge lifetime in seconds. Default is 15 minutes (#326)."

[service_config.auth_return_login_token]
used_by     = ["loom-service"]
python_type = "bool"
default     = false
description = "When true, POST /auth/login/start includes the raw login token for local/dev/testing. Keep false in production (#326)."

[service_config.trajectories_bucket]
used_by     = ["loom-service"]
python_type = "str"
default     = "trajectories"

[service_config.minio_public_endpoint]
used_by     = ["loom-service"]
python_type = "str"
# no required, no default → `str | None = None` (codegen rule 4)
description = "Public-facing MinIO endpoint for presigned URLs. When unset, falls back to minio_endpoint (works for in-cluster clients only)."

[service_config.artifacts_bucket]
used_by     = ["loom-service"]
python_type = "str"
default     = "artifacts"

[service_config.batch_runner_batch_size]
used_by     = ["loom-service"]
python_type = "int"
default     = 50

[service_config.batch_runner_submit_rate_per_sec]
used_by     = ["loom-service"]
python_type = "int"
default     = 100

[service_config.batch_runner_poll_interval_sec]
used_by     = ["loom-service"]
python_type = "int"
default     = 5

[service_config.batch_runner_cp_token]
used_by     = ["loom-service"]
python_type = "SecretStr"
secret      = { key = "batch-runner-cp-token" }
# no required, no default → `SecretStr | None = None`

[service_config.local_servers_json]
used_by     = ["loom-service"]
python_type = "str"
default     = "{}"

# Secret-store master-key rotation (closes #80).
# LOOM_SECRET_STORE_MASTER_KEYS (plural): comma-separated base64 AES-256 keys.
#   First key = PRIMARY (new encrypts + rewrap target).
#   Remaining keys = FALLBACKS (decrypt-only for rows encrypted under an older key).
# LOOM_SECRET_STORE_MASTER_KEY (singular, legacy): single key at version 1.
# Both set simultaneously → startup error. Loaded directly via
# load_master_keys_from_env() rather than as a Pydantic field (keeps them
# out of settings validation errors that could log values). The bootstrap-
# secrets flow generates the singular key for new clusters; operators switch
# to the plural form during online rotation.
#
# [service_config.secret_store_master_keys]
# used_by     = ["loom-service"]
# python_type = "str"
# required    = true
# secret      = { key = "secret-store-master-keys" }
# description = "Comma-separated base64 AES-256 keys. First=PRIMARY; rest=FALLBACKS."
# NOTE: not yet emitted by codegen (env-only field, see secret_store.py).

# ─── worker only ───

[service_config.token]
used_by     = ["worker"]
python_type = "SecretStr"
required    = true
secret      = { key = "worker-token" }
description = "Worker bearer token, minted by `loom admin tokens worker mint`."

[service_config.max_concurrent]
used_by     = ["worker"]
python_type = "int"
default     = 5

[service_config.blocking_io_max_workers]
used_by     = ["worker"]
python_type = "int"
description = "Maximum threads for the worker event-loop default executor used by blocking Docker, S3, HF, and filesystem calls. Leave unset to derive from max_concurrent."

[service_config.task_image_build_max_files]
used_by      = ["worker"]
python_type  = "int"
default      = 2000
env_override = { worker = "LOOM_TASK_IMAGE_BUILD_MAX_FILES" }
description  = "Maximum file count allowed in a task-bundle Dockerfile build context before the worker rejects the build."

[service_config.task_image_build_max_bytes]
used_by      = ["worker"]
python_type  = "int"
default      = 536870912
env_override = { worker = "LOOM_TASK_IMAGE_BUILD_MAX_BYTES" }
description  = "Maximum byte size allowed in a task-bundle Dockerfile build context before the worker rejects the build."

[service_config.sandbox_isolation]
used_by     = ["worker"]
python_type = "bool"
default     = false
description = "Enable #78 Phase B sandbox isolation: per-trial --internal docker bridge + per-node loom-llm-gateway-sandbox singleton. Default off → pre-Phase-B behavior. When true, the worker needs a writable singleton-secrets dir + the loom-llm-gateway-sandbox image pulled."

[service_config.sandbox_singleton_image]
used_by     = ["worker"]
python_type = "str"
default     = "loom-llm-gateway-sandbox:dev"
description = "Container image for the per-node CONNECT proxy singleton (Phase B PR-B1)."

[service_config.sandbox_singleton_secrets_dir]
used_by     = ["worker"]
python_type = "str"
default     = "/var/lib/loom/sandbox-secrets"
description = "Host directory mounted into the singleton container at /run/loom. Contains the loom-ca cert + step-JWT signing key. Operator-provisioned."

[service_config.sandbox_worker_index]
used_by     = ["worker"]
python_type = "int"
default     = 0
description = "Partitions the per-trial subnet pool when multiple workers run on the same host (see #189). 0..15."

[service_config.sandbox_step_jwt_ttl_sec]
used_by     = ["worker"]
python_type = "int"
default     = 600
description = "Step-JWT TTL the worker requests when minting tokens for rotation (Phase D PR-D1). Rotation cadence is TTL/2 — so a 600s TTL rotates every 5 minutes."

[service_config.drain_timeout_sec]
used_by     = ["worker"]
python_type = "int"
default     = 600

[service_config.claim_poll_interval_sec]
used_by     = ["worker"]
python_type = "float"
default     = 1.0

[service_config.heartbeat_interval_sec]
used_by     = ["worker"]
python_type = "float"
default     = 5.0

[service_config.trajectory_cache_dir]
used_by     = ["worker"]
python_type = "Path"
default     = "/var/lib/loom/trajectories"

[service_config.docker_socket]
used_by     = ["worker"]
python_type = "Path"
default     = "/var/run/docker.sock"

[service_config.fixtures_root]
used_by     = ["worker"]
python_type = "Path"
# no default → `Path | None = None`

[service_config.benchmark_cache]
used_by     = ["worker"]
python_type = "Path"
# no default → `Path | None = None`

[service_config.enable_worker_vllm]
used_by     = ["worker"]
python_type = "bool"
default     = false

[service_config.vllm_gpu_memory_utilization]
used_by     = ["worker"]
python_type = "float"
default     = 0.90

[service_config.vllm_tensor_parallel_size]
used_by     = ["worker"]
python_type = "int"
default     = 1

# ─── Per-trial agent install + cache (#317 Phase 1) ────────────────
# Worker builds a content-addressed image per (task_image_digest,
# install_script) combo the first time it's encountered. Cluster-wide
# coordination via the active_trial_cache_builds table (CP-owned;
# workers reach it via /api/v1/internal/trial-cache/*). Optional
# shared registry sharing for cross-worker cache hits.

[service_config.trial_cache_registry_repo]
used_by     = ["worker"]
python_type = "str"
default     = ""
description = "Full repo path for the shared trial-image cache (#317). Works with any registry the worker can authenticate to: Docker Hub (`docker.io/<org>/<repo>`), GHCR (`ghcr.io/<org>/<repo>`), ECR (`<acct>.dkr.ecr.<region>.amazonaws.com/<repo>`), or self-hosted (`registry.cluster.local:5000/<repo>`). Empty = per-worker local cache only. Workers need pull+push perms via mounted docker-config Secret. Cached images are tagged as `<this>:<cache_key>`."

[service_config.trial_cache_registry_pull_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 15.0
description = "Max wait for shared-registry pull of a cached agent-installed image before falling back to local build. Keeps registry outage from slowing trial start. Distinct from `trial_cache_base_image_pull_timeout_sec` which controls the slower task-base-image pull."

[service_config.trial_cache_base_image_pull_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 1800.0
description = "Max wait for the task base image pull (e.g. `python:3.11-slim`, `swebench/sweb.eval...`). SWE-Bench instance images are 1-2GB; on slow networks the pull can take 10-20 min. 30-min default."

[service_config.trial_cache_ttl_hours]
used_by     = ["worker"]
python_type = "int"
default     = 168
description = "TTL on cached trial images before `docker image prune --filter until=<ttl>h` evicts them. 7 days default. Docker tracks creation age, not last-access — operators size for cache-warmth horizon."

[service_config.trial_cache_min_free_gb]
used_by     = ["worker"]
python_type = "int"
default     = 20
description = "Capacity-pressure backstop: when worker disk free drops below this, delete oldest-by-creation trial-cache images regardless of TTL."

[service_config.trial_cache_build_lock_timeout_sec]
used_by     = ["worker"]
python_type = "float"
default     = 1800.0
description = "TTL on the builder slot in active_trial_cache_builds (30-min default). Sized for worst-case base-image-pull + install + push budget. Builder refreshes TTL every 60s during long operations; on crash, the heartbeat dies and the slot expires within ~60s."

# ─── non-codegen secrets: keys mounted from loom-secrets without Settings fields ───
# Not Pydantic fields — bootstrap-secrets covers them, doctor verifies them,
# but no codegen Settings field is emitted. Use this for third-party containers
# and env-only secrets that must not appear in Settings validation errors.
#
# Note: minio uses the same minio-access-key / minio-secret-key as the loom
# services (declared in service_config above), so they need no entry here.

[infra_secrets.postgres-user]
description = "Postgres superuser (POSTGRES_USER in postgres.yaml.j2)"

[infra_secrets.postgres-password]
description = "Postgres superuser password (POSTGRES_PASSWORD in postgres.yaml.j2)"
generate    = "openssl rand -hex 16"

[infra_secrets.secret-store-master-key]
description = "Base64 AES-256 key for LocalEncryptedSecretStore (LOOM_SECRET_STORE_MASTER_KEY)."
generate    = "python -c 'import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode().rstrip(\"=\"))'"

# ─── render_config ───

[render_config.namespace]
python_type = "str"
default     = "loom"

[render_config.image_tag]
python_type = "str"
default     = "0.7"
description = "Image tag applied to every loom-* image."

[render_config.ingress_host]
python_type = "str"
default     = "loom.example.com"

[render_config.ingress_class_name]
python_type = "str"
default     = "nginx"
description = "Kubernetes IngressClass used by the public Web/API ingress."

[render_config.ingress_tls_secret_name]
python_type = "str"
default     = "loom-tls"
description = "TLS Secret name referenced by the public Web/API ingress."

[render_config.ingress_cert_manager_cluster_issuer]
python_type = "str"
default     = ""
description = "Optional cert-manager ClusterIssuer name for automatic TLS."

[render_config.postgres_image]
python_type = "str"
default     = "postgres:16"

[render_config.postgres_storage_gi]
python_type = "int"
default     = 50

[render_config.minio_image]
python_type = "str"
default     = "minio/minio"

[render_config.minio_storage_gi]
python_type = "int"
default     = 500

[render_config.worker_trajectory_storage_gi]
python_type = "int"
default     = 100

[render_config.replicas]
python_type = "table"
# egress_xds + egress_proxy default 0 — Phase C is not yet wired
# into gateway-router (PR-C2), so by default the components stay
# scaled to zero. Operators flip both to 1+ when enabling sandbox-
# isolated egress.
fields      = { service = 2, control_plane = 2, gateway = 2, web = 0, worker = 3, egress_xds = 0, egress_proxy = 0 }
