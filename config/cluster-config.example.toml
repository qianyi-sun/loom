# AUTOGENERATED — do not edit by hand. Regenerate with `loom config codegen`.
# Operator-tunable knobs for `loom cluster render --config <FILE>`.
# Each value below is the default; uncomment + edit to override.

# Object-store bucket for trial artifacts. Rendered into control-plane, worker, and loom-service env. Set per environment when deployments share an object-store endpoint.
artifacts_bucket = "artifacts"
# Optional container registry prefix applied to every locally-built loom-* image reference in the rendered manifest (no trailing slash). Empty (default) keeps the historical unprefixed shape that kind's in-cluster load-images path depends on. For multi-node k3s / production, set to the registry host+port (e.g. 192.168.50.13:5000) and point each node's /etc/rancher/k3s/registries.yaml at the same endpoint so containerd can pull without side-channel image imports.
container_registry = ""
# Optional environment-state TOML profile used by protected rollout steps. Relative paths resolve from the cluster-config file directory.
env_state_profile = ""
# Public path prefix prepended by the SPA API client before /api/v1. Must match frontend_route_path for protected dev/staging/prod routes.
frontend_api_base_path = ""
# Public SPA environment identity written to the runtime frontend config.
frontend_environment = "local"
# Human-readable public SPA environment label shown in the UI chrome.
frontend_environment_label = "Local development"
# Public SPA path prefix on ingress_host. Empty means host root; canonical hosted environments use /dev, /staging, and /prod.
frontend_route_path = ""
# Predecessor SPA route prefix during a route migration (e.g. "/dev" while migrating to "/staging"). When set and different from frontend_route_path, the rollout preflight probes the live service at this predecessor route (the live env has not moved yet) while the driver moves the route to frontend_route_path and the post-deploy final gate validates the target. Empty (default) means no route transition. Preflight-only: not consumed by the manifest templates.
frontend_route_path_from = ""
# OpenAI-compatible upstreams the llm-gateway exposes as `local/<name>/<model>` routes, one `<name>|<base_url>|<secret_key>` entry each, e.g. ["yibu|https://yibuapi.com/v1|qa-relay-api-key"]. Renders LOOM_GW_LOCAL_<NAME>_BASE_URL (literal) + LOOM_GW_LOCAL_<NAME>_API_KEY (from loom-secrets/<secret_key>, optional) onto the gateway. Env-scoped: set on environments that carry an operator relay; leave empty on production.
gateway_local_providers = []
# Image tag applied to every loom-* image.
image_tag = "0.7"
# Optional cert-manager ClusterIssuer name for automatic TLS.
ingress_cert_manager_cluster_issuer = ""
# Kubernetes IngressClass used by the public Web/API ingress.
ingress_class_name = "nginx"
ingress_host = "loom.example.com"
# Optional www/non-www HTTPS counterpart hostnames that bind the public ingress TLS secret and redirect to ingress_host. They must not serve separate frontend/API routes.
ingress_redirect_hosts = []
# TLS Secret name referenced by the public Web/API ingress.
ingress_tls_secret_name = "loom-tls"
minio_image = "minio/minio"
minio_storage_gi = 500
namespace = "loom"
# Persistent storage binding mode for Postgres, MinIO, and worker trajectories. Use "dynamic" for the cluster default StorageClass, or "static-host-path" for explicit host-managed Retain PVs.
persistent_storage_backend = "dynamic"
# Absolute host path root used when persistent_storage_backend is "static-host-path", for example /data/loom-staging. Loom renders postgres, minio, and trajectories subdirectories under this root.
persistent_storage_host_path_root = ""
postgres_image = "postgres:16"
postgres_storage_gi = 50
# Approved BYO provider egress targets as IP-or-CIDR:TCP-port entries, e.g. ["202.78.161.51:18001"]. Hostnames must be resolved by the operator before rendering because Kubernetes NetworkPolicy enforces CIDRs, not DNS names.
provider_egress_allowlist = []
# Backend runtime identity written to LOOM_ENV for service/control-plane/gateway pods. Staging profiles must set this to staging; production profiles set production.
runtime_environment = "production"
# Object-store bucket for trial trajectories. Rendered into control-plane, worker, and loom-service env. Set per environment when deployments share an object-store endpoint.
trajectories_bucket = "trajectories"
# Registry repo path for the shared trial-image cache (#547 item #2). Enables cross-node build sharing so workers on node B can pull layered images built on node A instead of rebuilding. Empty (default) = per-worker local cache only. Set to e.g. `ghcr.io/qianyi-sun/loom-trial-cache` on staging/production to activate. Workers need push+pull credentials via a mounted docker-config secret; without them the pull-fail case falls back cleanly to a local build (harmless).
trial_cache_registry_repo = ""
# Sandbox-facing OpenAI-compatible gateway URL injected into k8s workers as LOOM_WORKER_SUBPROCESS_GATEWAY_URL. The default targets the rendered gateway-router hostPort; kind-on-host deployments with another host service on 30443 should override this, for example to http://host.docker.internal:30444/openai/v1 with a durable host port-forward.
worker_subprocess_gateway_url = "http://host.docker.internal:30443/openai/v1"
worker_trajectory_storage_gi = 100

[gateway_hpa]
enabled = false
min_replicas = 2
max_replicas = 8
cpu_target_pct = 60
# GB10 hosts managed by protected rollout steps 11-12. ssh_config optionally points at an operator SSH config file used for every host; ssh_identity_file and ssh_certificate_file point at platform-dev-local deploy auth material for detached rollout runners; each host entry is an inline TOML table with ssh_target, repo_path, env_file_path, optional repo_url, and optional node_agent_service. node_agent_service must be a simple .service basename; step 12 derives the matching .timer, requires Linger=yes, installs both candidate units, starts the oneshot, enables the timer, and verifies both units fail closed.

[gb10_pool]
ssh_config = ""
ssh_identity_file = ""
ssh_certificate_file = ""
hosts = []

[k8s_worker]
enabled = false

[llm_gateway_sandbox]
enabled = false
# PgBouncer connection multiplexer (#609). When enabled, renders a Deployment (2 replicas), Service (loom-pgbouncer:6432), PodDisruptionBudget, and NetworkPolicy; bootstrap populates *-db-url-pool secrets by deriving from the direct DSN. Rollback: enabled=false, re-render, redeploy — services fall back to db_url (direct). See docs/architecture/pgbouncer-transaction-mode-design.md.

[pgbouncer]
enabled = true
default_pool_size = 25
max_client_conn = 500
min_pool_size = 5
# Postgres runtime tuning knobs. max_connections bumped from Postgres default 100 to leave room for pgbouncer backend pool (default_pool_size × pgbouncer.replicas) + LISTEN watchers + Alembic + admin slack.

[postgres]
max_connections = 150

[replicas]
service = 2
control_plane = 2
gateway = 2
web = 0
worker = 3
egress_xds = 0
egress_proxy = 0
pgbouncer = 2
# Cluster topology (#637). `multi_node=true` opts into HA-shaped resources: Postgres replicas via CloudNativePG, distributed MinIO, cross-node anti-affinity, PDBs with minAvailable≥1, and Longhorn-backed persistent storage. `multi_node=false` renders single-pod stateful services with hostPath storage — the current pilot-cluster shape. Currently schema-default `false`; production will flip to `true` once the k3s multi-node cluster is provisioned. Profile overrides pin explicit values so a schema-default flip cannot silently break existing deployments. Storage backend `host_path` matches today; `longhorn` is the target for the multi-node production cluster; `nfs`/`csi` are unimplemented placeholders.

[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
min_available = 1
anti_affinity = "preferred"
# Production worker Deployment capacity knobs. One worker pod handles max_concurrent trials; replicas.worker multiplies total in-cluster trial slots.

[worker_capacity]
max_concurrent = 16
cpu_request = "500m"
cpu_limit = "8"
memory_request = "1Gi"
memory_limit = "16Gi"
# Canonical v1 workload-trust contract injected into loom-service.

[workload_contract]
workload_trust_mode = "internal_trusted"
taskset_transforms_enabled = false
taskset_transform_network_isolated = false
untrusted_workload_isolation = false
