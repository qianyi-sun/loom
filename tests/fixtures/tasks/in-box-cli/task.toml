schema_version = "1"

[task]
id = "in-box-cli"
name = "In-box CLI agent canary"
description = "Exercises the ClaudeCodeAgent in-box runtime contract. Stub solution shipped as a placeholder until a real in-box agent runs the trial body."

[environment]
os = "linux"
docker_image = "python:3.11-alpine"

[agent]
# `claude-code` is the in-box ClaudeCodeAgent runtime; mode is fixed by
# the runtime class and not configurable per-task in v1.
name = "claude-code"

[verifier]
name = "pytest"

[[steps]]
name = "main"
artifacts = ["out.txt"]
