schema_version = 1
pool_name = "gb10"
slot_budget = 120
pending_slot_budget = 24
job_pids_max = 65536

[policy]
actuator = "slurm"
enabled = true
min_slots = 0
max_slots = 120
scale_up_threshold_slots = 1
scale_down_idle_seconds = 600
scale_up_cooldown_seconds = 60
scale_down_cooldown_seconds = 300
drain_timeout_seconds = 600
force = false

[policy.actuator_config]
backend = "docker"
cpu_arch = "arm64"
partition = "gb10"
allowed_nodes = [
  "trt-gb10-1",
  "trt-gb10-2",
  "trt-gb10-3",
  "trt-gb10-4",
  "trt-gb10-5",
  "trt-gb10-6",
  "trt-gb10-7",
  "trt-gb10-8",
  "trt-gb10-9",
  "trt-gb10-10",
  "trt-gb10-11",
  "trt-gb10-12",
  "trt-gb10-13",
  "trt-gb10-14",
  "trt-gb10-15",
]
env_file = "${RUNTIME_ROOT}/${CANDIDATE_SHA}/worker-gb10.env"
repo_dir = "${CANDIDATE_ROOT}/${CANDIDATE_SHA}"
requested_cpus = 16
requested_memory_mib = 92000
requested_concurrency = 8
max_jobs = 15
pending_job_cap = 3
time_limit = "02:00:00"
exclusive = false
external_runner = true
shared_capacity_managed = true
slurm_account = "${SLURM_ACCOUNT}"
qos_normal = "${SLURM_QOS}"
container_cpus = 2
container_memory_mib = 11500
container_pids = 4096
job_pids_max = 65536
candidate_sha = "${CANDIDATE_SHA}"
gpu_tres = "gpu:1"
