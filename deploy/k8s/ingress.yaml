apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loom-ingress
  annotations:
    # Adjust to match your cluster's ingress controller (nginx, traefik,
    # gke-ingress, alb, etc.). Defaults assume nginx.
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  rules:
    - host: loom.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loom-control-plane
                port:
                  number: 8080
    - host: gateway.loom.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loom-llm-gateway
                port:
                  number: 9100
