apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: loom
  name: loom-pipeline-orchestrator
spec:
  replicas: 0
  selector:
    matchLabels:
      app: loom-pipeline-orchestrator
  template:
    metadata:
      labels:
        app: loom-pipeline-orchestrator
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8092'
    spec:
      containers:
      - name: pipeline-orchestrator
        image: loom-pipeline-orchestrator:0.7
        env:
        - name: LOOM_PIPELINE_ORCHESTRATOR_DB_URL
          valueFrom:
            secretKeyRef:
              name: loom-secrets
              key: cp-db-url
        - name: LOOM_PIPELINE_ORCHESTRATOR_CONTROLLER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: LOOM_PIPELINE_ORCHESTRATOR_POLL_SECONDS
          value: "2"
        - name: LOOM_PIPELINE_ORCHESTRATOR_PICKER_BATCH
          value: "50"
        - name: LOOM_PIPELINE_ORCHESTRATOR_LEASE_SECONDS
          value: "60"
        - name: LOOM_PIPELINE_ORCHESTRATOR_RENEW_SECONDS
          value: "10"
        - name: LOOM_PIPELINE_ORCHESTRATOR_ARTIFACTS_BUCKET
          value: artifacts
        - name: LOOM_PIPELINE_ORCHESTRATOR_MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: loom-secrets
              key: minio-access-key
        - name: LOOM_PIPELINE_ORCHESTRATOR_MINIO_ENDPOINT
          value: http://loom-minio:9000
        - name: LOOM_PIPELINE_ORCHESTRATOR_MINIO_REGION
          value: us-east-1
        - name: LOOM_PIPELINE_ORCHESTRATOR_MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: loom-secrets
              key: minio-secret-key
        ports:
        - name: health
          containerPort: 8092
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
