data:
  control-plane.json: "{\n  \"uid\": \"loom-control-plane\",\n  \"title\": \"Loom\
    \ — Control Plane Deep Dive\",\n  \"tags\": [\"loom\"],\n  \"timezone\": \"browser\"\
    ,\n  \"schemaVersion\": 39,\n  \"time\": { \"from\": \"now-1h\", \"to\": \"now\"\
    \ },\n  \"refresh\": \"30s\",\n  \"templating\": { \"list\": [] },\n  \"panels\"\
    : [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Active\
    \ Workers\",\n      \"gridPos\": { \"x\": 0, \"y\": 0, \"w\": 4, \"h\": 4 },\n\
    \      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"\
    ] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\"\
    ,\n        \"textMode\": \"auto\"\n      },\n      \"fieldConfig\": {\n      \
    \  \"defaults\": {\n          \"thresholds\": {\n            \"mode\": \"absolute\"\
    ,\n            \"steps\": [\n              { \"value\": null, \"color\": \"red\"\
    \ },\n              { \"value\": 1, \"color\": \"yellow\" },\n              {\
    \ \"value\": 3, \"color\": \"green\" }\n            ]\n          }\n        }\n\
    \      },\n      \"targets\": [\n        {\n          \"expr\": \"loom_workers_active\"\
    ,\n          \"legendFormat\": \"active workers\",\n          \"refId\": \"A\"\
    \n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Trial State Transitions (rate 5m)\",\n      \"gridPos\"\
    : { \"x\": 4, \"y\": 0, \"w\": 20, \"h\": 8 },\n      \"fieldConfig\": {\n   \
    \     \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\
    \ \"lineWidth\": 2 }\n        }\n      },\n      \"targets\": [\n        {\n \
    \         \"expr\": \"sum by (to_state) (rate(loom_trials_state_total[5m]))\"\
    ,\n          \"legendFormat\": \"→ {{to_state}}\",\n          \"refId\": \"A\"\
    \n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Queue Depth — Top 10 Teams\",\n      \"gridPos\": { \"x\"\
    : 0, \"y\": 8, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"custom\": { \"lineWidth\": 2 },\n          \"thresholds\": {\n\
    \            \"mode\": \"absolute\",\n            \"steps\": [\n             \
    \ { \"value\": null, \"color\": \"green\" },\n              { \"value\": 50, \"\
    color\": \"yellow\" },\n              { \"value\": 100, \"color\": \"red\" }\n\
    \            ]\n          }\n        }\n      },\n      \"targets\": [\n     \
    \   {\n          \"expr\": \"topk(10, sum by (team_id) (loom_queue_depth))\",\n\
    \          \"legendFormat\": \"{{team_id}}\",\n          \"refId\": \"A\"\n  \
    \      }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"In-flight Trials per Team × State\",\n      \"gridPos\"\
    : { \"x\": 12, \"y\": 8, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n  \
    \      \"defaults\": {\n          \"custom\": { \"lineWidth\": 2 }\n        }\n\
    \      },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (team_id,\
    \ state) (loom_trials_inflight)\",\n          \"legendFormat\": \"{{team_id}}\
    \ / {{state}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n   \
    \ {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Claim\
    \ Latency P50 / P95 / P99\",\n      \"gridPos\": { \"x\": 0, \"y\": 16, \"w\"\
    : 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\": {\n       \
    \   \"unit\": \"s\",\n          \"custom\": { \"lineWidth\": 2 },\n          \"\
    thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n\
    \              { \"value\": null, \"color\": \"green\" },\n              { \"\
    value\": 0.5, \"color\": \"yellow\" },\n              { \"value\": 1.0, \"color\"\
    : \"red\" }\n            ]\n          }\n        }\n      },\n      \"targets\"\
    : [\n        {\n          \"expr\": \"histogram_quantile(0.50, sum by (le) (rate(loom_claim_latency_sec_bucket[5m])))\"\
    ,\n          \"legendFormat\": \"p50\",\n          \"refId\": \"A\"\n        },\n\
    \        {\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(loom_claim_latency_sec_bucket[5m])))\"\
    ,\n          \"legendFormat\": \"p95\",\n          \"refId\": \"B\"\n        },\n\
    \        {\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(loom_claim_latency_sec_bucket[5m])))\"\
    ,\n          \"legendFormat\": \"p99\",\n          \"refId\": \"C\"\n        }\n\
    \      ]\n    },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\",\n \
    \     \"title\": \"Claim Hit / Miss Ratio\",\n      \"gridPos\": { \"x\": 12,\
    \ \"y\": 16, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"reqps\",\n          \"custom\": { \"lineWidth\": 2\
    \ }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\"\
    : \"sum by (result) (rate(loom_claim_latency_sec_count[5m]))\",\n          \"\
    legendFormat\": \"{{result}}\",\n          \"refId\": \"A\"\n        }\n     \
    \ ]\n    },\n    {\n      \"id\": 7,\n      \"type\": \"timeseries\",\n      \"\
    title\": \"State PATCH Outcomes (ok / fenced / timeout)\",\n      \"gridPos\"\
    : { \"x\": 0, \"y\": 24, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n  \
    \      \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\":\
    \ { \"lineWidth\": 2 }\n        }\n      },\n      \"targets\": [\n        {\n\
    \          \"expr\": \"sum by (result) (rate(loom_state_patch_total[5m]))\",\n\
    \          \"legendFormat\": \"{{result}}\",\n          \"refId\": \"A\"\n   \
    \     }\n      ]\n    },\n    {\n      \"id\": 8,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Worker Reclaim Rate\",\n      \"gridPos\": { \"x\": 12,\
    \ \"y\": 24, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"reqps\",\n          \"custom\": { \"lineWidth\": 2\
    \ },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n     \
    \       \"steps\": [\n              { \"value\": null, \"color\": \"green\" },\n\
    \              { \"value\": 0.1, \"color\": \"yellow\" },\n              { \"\
    value\": 0.5, \"color\": \"red\" }\n            ]\n          }\n        }\n  \
    \    },\n      \"targets\": [\n        {\n          \"expr\": \"rate(loom_worker_reclaim_total[5m])\"\
    ,\n          \"legendFormat\": \"reclaim rate\",\n          \"refId\": \"A\"\n\
    \        }\n      ]\n    }\n  ]\n}\n"
  llm-gateway.json: "{\n  \"uid\": \"loom-llm-gateway\",\n  \"title\": \"Loom — LLM\
    \ Gateway Deep Dive\",\n  \"tags\": [\"loom\"],\n  \"timezone\": \"browser\",\n\
    \  \"schemaVersion\": 39,\n  \"time\": { \"from\": \"now-1h\", \"to\": \"now\"\
    \ },\n  \"refresh\": \"30s\",\n  \"templating\": { \"list\": [] },\n  \"panels\"\
    : [\n    {\n      \"id\": 1,\n      \"type\": \"timeseries\",\n      \"title\"\
    : \"Call Rate by Provider (stacked)\",\n      \"gridPos\": { \"x\": 0, \"y\":\
    \ 0, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\": {\n\
    \          \"unit\": \"reqps\",\n          \"custom\": {\n            \"lineWidth\"\
    : 2,\n            \"fillOpacity\": 20,\n            \"stacking\": { \"mode\":\
    \ \"normal\" }\n          }\n        }\n      },\n      \"options\": {\n     \
    \   \"tooltip\": { \"mode\": \"multi\" }\n      },\n      \"targets\": [\n   \
    \     {\n          \"expr\": \"sum by (provider) (rate(loom_gateway_llm_calls_total[5m]))\"\
    ,\n          \"legendFormat\": \"{{provider}}\",\n          \"refId\": \"A\"\n\
    \        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Call Rate by Result (stacked — highlight non-ok)\",\n  \
    \    \"gridPos\": { \"x\": 12, \"y\": 0, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\"\
    : {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 20,\n       \
    \     \"stacking\": { \"mode\": \"normal\" }\n          }\n        },\n      \
    \  \"overrides\": [\n          {\n            \"matcher\": { \"id\": \"byName\"\
    , \"options\": \"ok\" },\n            \"properties\": [{ \"id\": \"color\", \"\
    value\": { \"mode\": \"fixed\", \"fixedColor\": \"green\" } }]\n          },\n\
    \          {\n            \"matcher\": { \"id\": \"byName\", \"options\": \"upstream_error\"\
    \ },\n            \"properties\": [{ \"id\": \"color\", \"value\": { \"mode\"\
    : \"fixed\", \"fixedColor\": \"red\" } }]\n          },\n          {\n       \
    \     \"matcher\": { \"id\": \"byName\", \"options\": \"auth_error\" },\n    \
    \        \"properties\": [{ \"id\": \"color\", \"value\": { \"mode\": \"fixed\"\
    , \"fixedColor\": \"orange\" } }]\n          },\n          {\n            \"matcher\"\
    : { \"id\": \"byName\", \"options\": \"ssrf_blocked\" },\n            \"properties\"\
    : [{ \"id\": \"color\", \"value\": { \"mode\": \"fixed\", \"fixedColor\": \"purple\"\
    \ } }]\n          },\n          {\n            \"matcher\": { \"id\": \"byName\"\
    , \"options\": \"rate_limited\" },\n            \"properties\": [{ \"id\": \"\
    color\", \"value\": { \"mode\": \"fixed\", \"fixedColor\": \"yellow\" } }]\n \
    \         },\n          {\n            \"matcher\": { \"id\": \"byName\", \"options\"\
    : \"timeout\" },\n            \"properties\": [{ \"id\": \"color\", \"value\"\
    : { \"mode\": \"fixed\", \"fixedColor\": \"dark-red\" } }]\n          }\n    \
    \    ]\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"multi\"\
    \ }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (result)\
    \ (rate(loom_gateway_llm_calls_total[5m]))\",\n          \"legendFormat\": \"\
    {{result}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n\
    \      \"id\": 3,\n      \"type\": \"timeseries\",\n      \"title\": \"Latency\
    \ P50 / P95 / P99 by Provider\",\n      \"gridPos\": { \"x\": 0, \"y\": 8, \"\
    w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\": {\n    \
    \      \"unit\": \"s\",\n          \"custom\": { \"lineWidth\": 2 }\n        }\n\
    \      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.50,\
    \ sum by (le, provider) (rate(loom_gateway_llm_call_latency_sec_bucket[5m])))\"\
    ,\n          \"legendFormat\": \"{{provider}} p50\",\n          \"refId\": \"\
    A\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.95, sum\
    \ by (le, provider) (rate(loom_gateway_llm_call_latency_sec_bucket[5m])))\",\n\
    \          \"legendFormat\": \"{{provider}} p95\",\n          \"refId\": \"B\"\
    \n        },\n        {\n          \"expr\": \"histogram_quantile(0.99, sum by\
    \ (le, provider) (rate(loom_gateway_llm_call_latency_sec_bucket[5m])))\",\n  \
    \        \"legendFormat\": \"{{provider}} p99\",\n          \"refId\": \"C\"\n\
    \        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Latency P95 by Dialect (comparison)\",\n      \"gridPos\"\
    : { \"x\": 12, \"y\": 8, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n  \
    \      \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": { \"\
    lineWidth\": 2 }\n        }\n      },\n      \"targets\": [\n        {\n     \
    \     \"expr\": \"histogram_quantile(0.95, sum by (le, dialect) (rate(loom_gateway_llm_call_latency_sec_bucket[5m])))\"\
    ,\n          \"legendFormat\": \"{{dialect}} p95\",\n          \"refId\": \"A\"\
    \n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Provider Error Rate (% non-ok) per Provider\",\n      \"\
    gridPos\": { \"x\": 0, \"y\": 16, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n         \
    \ \"custom\": { \"lineWidth\": 2 },\n          \"thresholds\": {\n           \
    \ \"mode\": \"absolute\",\n            \"steps\": [\n              { \"value\"\
    : null, \"color\": \"green\" },\n              { \"value\": 0.02, \"color\": \"\
    yellow\" },\n              { \"value\": 0.05, \"color\": \"red\" }\n         \
    \   ]\n          }\n        }\n      },\n      \"targets\": [\n        {\n   \
    \       \"expr\": \"sum by (provider) (rate(loom_gateway_llm_calls_total{result!=\\\
    \"ok\\\"}[5m])) / sum by (provider) (rate(loom_gateway_llm_calls_total[5m]))\"\
    ,\n          \"legendFormat\": \"{{provider}}\",\n          \"refId\": \"A\"\n\
    \        }\n      ]\n    },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Cost Rate (USD/min) by Provider\",\n      \"gridPos\": {\
    \ \"x\": 12, \"y\": 16, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n   \
    \     \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"custom\"\
    : { \"lineWidth\": 2 }\n        }\n      },\n      \"targets\": [\n        {\n\
    \          \"expr\": \"sum by (provider) (rate(loom_gateway_cost_usd_total[5m]))\
    \ * 60\",\n          \"legendFormat\": \"{{provider}}\",\n          \"refId\"\
    : \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 7,\n      \"type\":\
    \ \"table\",\n      \"title\": \"Cumulative Cost by Team — Top 10\",\n      \"\
    gridPos\": { \"x\": 0, \"y\": 24, \"w\": 24, \"h\": 8 },\n      \"options\": {\n\
    \        \"sortBy\": [{ \"displayName\": \"Cost (USD)\", \"desc\": true }]\n \
    \     },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\"\
    : \"currencyUSD\"\n        }\n      },\n      \"targets\": [\n        {\n    \
    \      \"expr\": \"topk(10, sum by (team_id) (loom_gateway_cost_usd_total))\"\
    ,\n          \"legendFormat\": \"{{team_id}}\",\n          \"refId\": \"A\",\n\
    \          \"instant\": true\n        }\n      ],\n      \"transformations\":\
    \ [\n        { \"id\": \"labelsToFields\", \"options\": { \"mode\": \"columns\"\
    \ } },\n        { \"id\": \"sortBy\", \"options\": { \"fields\": [{ \"displayName\"\
    : \"Value\", \"desc\": true }] } }\n      ]\n    }\n  ]\n}\n"
  loom-service.json: "{\n  \"uid\": \"loom-service\",\n  \"title\": \"Loom — Service\
    \ Deep Dive\",\n  \"tags\": [\"loom\"],\n  \"timezone\": \"browser\",\n  \"schemaVersion\"\
    : 39,\n  \"time\": { \"from\": \"now-1h\", \"to\": \"now\" },\n  \"refresh\":\
    \ \"30s\",\n  \"templating\": { \"list\": [] },\n  \"panels\": [\n    {\n    \
    \  \"id\": 1,\n      \"type\": \"timeseries\",\n      \"title\": \"HTTP Request\
    \ Rate by Status Class (stacked)\",\n      \"gridPos\": { \"x\": 0, \"y\": 0,\
    \ \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\": {\n\
    \          \"unit\": \"reqps\",\n          \"custom\": {\n            \"lineWidth\"\
    : 2,\n            \"fillOpacity\": 20,\n            \"stacking\": { \"mode\":\
    \ \"normal\" }\n          }\n        },\n        \"overrides\": [\n          {\n\
    \            \"matcher\": { \"id\": \"byName\", \"options\": \"2xx\" },\n    \
    \        \"properties\": [{ \"id\": \"color\", \"value\": { \"mode\": \"fixed\"\
    , \"fixedColor\": \"green\" } }]\n          },\n          {\n            \"matcher\"\
    : { \"id\": \"byName\", \"options\": \"4xx\" },\n            \"properties\": [{\
    \ \"id\": \"color\", \"value\": { \"mode\": \"fixed\", \"fixedColor\": \"yellow\"\
    \ } }]\n          },\n          {\n            \"matcher\": { \"id\": \"byName\"\
    , \"options\": \"5xx\" },\n            \"properties\": [{ \"id\": \"color\", \"\
    value\": { \"mode\": \"fixed\", \"fixedColor\": \"red\" } }]\n          }\n  \
    \      ]\n      },\n      \"options\": {\n        \"tooltip\": { \"mode\": \"\
    multi\" }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum\
    \ by (status_class) (rate(loom_svc_http_requests_total[5m]))\",\n          \"\
    legendFormat\": \"{{status_class}}\",\n          \"refId\": \"A\"\n        }\n\
    \      ]\n    },\n    {\n      \"id\": 2,\n      \"type\": \"timeseries\",\n \
    \     \"title\": \"HTTP Request Latency P50 / P95 / P99\",\n      \"gridPos\"\
    : { \"x\": 12, \"y\": 0, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n  \
    \      \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": { \"\
    lineWidth\": 2 },\n          \"thresholds\": {\n            \"mode\": \"absolute\"\
    ,\n            \"steps\": [\n              { \"value\": null, \"color\": \"green\"\
    \ },\n              { \"value\": 0.5, \"color\": \"yellow\" },\n             \
    \ { \"value\": 2.0, \"color\": \"red\" }\n            ]\n          }\n       \
    \ }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.50,\
    \ sum by (le) (rate(loom_svc_http_request_latency_sec_bucket[5m])))\",\n     \
    \     \"legendFormat\": \"p50\",\n          \"refId\": \"A\"\n        },\n   \
    \     {\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(loom_svc_http_request_latency_sec_bucket[5m])))\"\
    ,\n          \"legendFormat\": \"p95\",\n          \"refId\": \"B\"\n        },\n\
    \        {\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(loom_svc_http_request_latency_sec_bucket[5m])))\"\
    ,\n          \"legendFormat\": \"p99\",\n          \"refId\": \"C\"\n        }\n\
    \      ]\n    },\n    {\n      \"id\": 3,\n      \"type\": \"table\",\n      \"\
    title\": \"Top 10 Routes by Request Rate\",\n      \"gridPos\": { \"x\": 0, \"\
    y\": 8, \"w\": 12, \"h\": 8 },\n      \"options\": {\n        \"sortBy\": [{ \"\
    displayName\": \"Rate (req/s)\", \"desc\": true }]\n      },\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        }\n     \
    \ },\n      \"targets\": [\n        {\n          \"expr\": \"topk(10, sum by (route,\
    \ method) (rate(loom_svc_http_requests_total[5m])))\",\n          \"legendFormat\"\
    : \"{{method}} {{route}}\",\n          \"refId\": \"A\",\n          \"instant\"\
    : true\n        }\n      ],\n      \"transformations\": [\n        { \"id\": \"\
    labelsToFields\", \"options\": { \"mode\": \"columns\" } },\n        { \"id\"\
    : \"sortBy\", \"options\": { \"fields\": [{ \"displayName\": \"Value\", \"desc\"\
    : true }] } }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"table\"\
    ,\n      \"title\": \"Top 10 Routes by P95 Latency\",\n      \"gridPos\": { \"\
    x\": 12, \"y\": 8, \"w\": 12, \"h\": 8 },\n      \"options\": {\n        \"sortBy\"\
    : [{ \"displayName\": \"P95 Latency (s)\", \"desc\": true }]\n      },\n     \
    \ \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n   \
    \     }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"topk(10,\
    \ histogram_quantile(0.95, sum by (le, route, method) (rate(loom_svc_http_request_latency_sec_bucket[5m]))))\"\
    ,\n          \"legendFormat\": \"{{method}} {{route}}\",\n          \"refId\"\
    : \"A\",\n          \"instant\": true\n        }\n      ],\n      \"transformations\"\
    : [\n        { \"id\": \"labelsToFields\", \"options\": { \"mode\": \"columns\"\
    \ } },\n        { \"id\": \"sortBy\", \"options\": { \"fields\": [{ \"displayName\"\
    : \"Value\", \"desc\": true }] } }\n      ]\n    },\n    {\n      \"id\": 5,\n\
    \      \"type\": \"timeseries\",\n      \"title\": \"Batch Runner Tick Rate by\
    \ Result\",\n      \"gridPos\": { \"x\": 0, \"y\": 16, \"w\": 12, \"h\": 8 },\n\
    \      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\
    ,\n          \"custom\": { \"lineWidth\": 2 }\n        }\n      },\n      \"targets\"\
    : [\n        {\n          \"expr\": \"sum by (result) (rate(loom_svc_batch_runner_ticks_total[5m]))\"\
    ,\n          \"legendFormat\": \"{{result}}\",\n          \"refId\": \"A\"\n \
    \       }\n      ]\n    },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Batch Runner Trials Dispatched Rate\",\n      \"gridPos\"\
    : { \"x\": 12, \"y\": 16, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n \
    \       \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\"\
    : { \"lineWidth\": 2 }\n        }\n      },\n      \"targets\": [\n        {\n\
    \          \"expr\": \"rate(loom_svc_batch_runner_trials_dispatched_total[5m])\"\
    ,\n          \"legendFormat\": \"dispatched/s\",\n          \"refId\": \"A\"\n\
    \        }\n      ]\n    },\n    {\n      \"id\": 7,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Tokens Issued Rate by Type\",\n      \"gridPos\": { \"x\"\
    : 0, \"y\": 24, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"reqps\",\n          \"custom\": { \"lineWidth\": 2\
    \ }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\"\
    : \"sum by (token_type) (rate(loom_svc_tokens_issued_total[5m]))\",\n        \
    \  \"legendFormat\": \"{{token_type}}\",\n          \"refId\": \"A\"\n       \
    \ }\n      ]\n    },\n    {\n      \"id\": 8,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Tokens Revoked Rate\",\n      \"gridPos\": { \"x\": 12,\
    \ \"y\": 24, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"reqps\",\n          \"custom\": { \"lineWidth\": 2\
    \ }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\"\
    : \"rate(loom_svc_tokens_revoked_total[5m])\",\n          \"legendFormat\": \"\
    revoked/s\",\n          \"refId\": \"A\"\n        }\n      ]\n    }\n  ]\n}\n"
  operator-overview.json: "{\n  \"uid\": \"loom-operator-overview\",\n  \"title\"\
    : \"Loom — Operator Overview\",\n  \"tags\": [\"loom\"],\n  \"timezone\": \"browser\"\
    ,\n  \"schemaVersion\": 39,\n  \"time\": { \"from\": \"now-1h\", \"to\": \"now\"\
    \ },\n  \"refresh\": \"30s\",\n  \"templating\": { \"list\": [] },\n  \"panels\"\
    : [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Control\
    \ Plane Up\",\n      \"gridPos\": { \"x\": 0, \"y\": 0, \"w\": 3, \"h\": 4 },\n\
    \      \"options\": {\n        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"\
    ] },\n        \"colorMode\": \"background\",\n        \"graphMode\": \"none\"\
    ,\n        \"textMode\": \"auto\"\n      },\n      \"fieldConfig\": {\n      \
    \  \"defaults\": {\n          \"mappings\": [\n            { \"type\": \"value\"\
    , \"options\": { \"0\": { \"text\": \"DOWN\", \"color\": \"red\" }, \"1\": { \"\
