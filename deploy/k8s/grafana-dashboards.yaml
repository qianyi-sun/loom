    \ ],\n          \"thresholds\": { \"mode\": \"absolute\", \"steps\": [{ \"value\"\
    : null, \"color\": \"red\" }, { \"value\": 1, \"color\": \"green\" }] }\n    \
    \    }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"up{job=~\\\
    \".*loom-control-plane.*\\\"}\",\n          \"legendFormat\": \"control-plane\"\
    ,\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\"\
    : 2,\n      \"type\": \"stat\",\n      \"title\": \"LLM Gateway Up\",\n      \"\
    gridPos\": { \"x\": 3, \"y\": 0, \"w\": 3, \"h\": 4 },\n      \"options\": {\n\
    \        \"reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\"\
    : \"background\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"\
    auto\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n        \
    \  \"mappings\": [\n            { \"type\": \"value\", \"options\": { \"0\": {\
