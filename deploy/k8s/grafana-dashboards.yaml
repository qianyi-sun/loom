    \      ]\n    },\n    {\n      \"id\": 9,\n      \"type\": \"timeseries\",\n \
    \     \"title\": \"Gateway Call Rate by Result\",\n      \"gridPos\": { \"x\"\
    : 12, \"y\": 8, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"reqps\",\n          \"custom\": { \"lineWidth\": 2\
    \ }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\"\
    : \"sum by (result) (rate(loom_gateway_llm_calls_total[5m]))\",\n          \"\
    legendFormat\": \"{{result}}\",\n          \"refId\": \"A\"\n        }\n     \
    \ ]\n    },\n    {\n      \"id\": 10,\n      \"type\": \"timeseries\",\n     \
    \ \"title\": \"Service HTTP 5xx Rate\",\n      \"gridPos\": { \"x\": 12, \"y\"\
    : 16, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\":\
    \ {\n          \"unit\": \"percentunit\",\n          \"custom\": { \"lineWidth\"\
    : 2 },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n   \
    \         \"steps\": [\n              { \"value\": null, \"color\": \"green\"\
    \ },\n              { \"value\": 0.01, \"color\": \"yellow\" },\n            \
    \  { \"value\": 0.05, \"color\": \"red\" }\n            ]\n          }\n     \
    \   }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(loom_svc_http_requests_total{status_class=\\\
