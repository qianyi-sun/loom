    : \"green\" } } }\n          ],\n          \"thresholds\": { \"mode\": \"absolute\"\
    , \"steps\": [{ \"value\": null, \"color\": \"red\" }, { \"value\": 1, \"color\"\
    : \"green\" }] }\n        }\n      },\n      \"targets\": [\n        {\n     \
    \     \"expr\": \"up{job=~\\\".*loom-llm-gateway.*\\\"}\",\n          \"legendFormat\"\
