    reduceOptions\": { \"calcs\": [\"lastNotNull\"] },\n        \"colorMode\": \"\
    background\",\n        \"graphMode\": \"none\",\n        \"textMode\": \"auto\"\
    \n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"thresholds\"\
