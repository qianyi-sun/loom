    \ 20, \"w\": 12, \"h\": 8 },\n      \"fieldConfig\": {\n        \"defaults\":\
    \ {\n          \"unit\": \"reqps\",\n          \"custom\": { \"lineWidth\": 2\
    \ }\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\"\
    : \"sum by (result) (rate(loom_worker_trials_completed_total[5m]))\",\n      \
    \    \"legendFormat\": \"{{result}}\",\n          \"refId\": \"A\"\n        }\n\
    \      ]\n    },\n    {\n      \"id\": 12,\n      \"type\": \"table\",\n     \
    \ \"title\": \"Cumulative LLM Cost \u2014 Top 5 Teams\",\n      \"gridPos\": {\
    \ \"x\": 12, \"y\": 24, \"w\": 12, \"h\": 8 },\n      \"options\": {\n       \
    \ \"sortBy\": [{ \"displayName\": \"Cost (USD)\", \"desc\": true }]\n      },\n\
    \      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\"\
    \n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"\
    topk(5, sum by (team_id) (loom_gateway_cost_usd_total))\",\n          \"legendFormat\"\
    : \"{{team_id}}\",\n          \"refId\": \"A\",\n          \"instant\": true\n\
