    options\": { \"0\": { \"text\": \"DOWN\", \"color\": \"red\" }, \"1\": { \"text\"\
    : \"UP\", \"color\": \"green\" } } }\n          ],\n          \"thresholds\":\
    \ { \"mode\": \"absolute\", \"steps\": [{ \"value\": null, \"color\": \"red\"\
    \ }, { \"value\": 1, \"color\": \"green\" }] }\n        }\n      },\n      \"\
    targets\": [\n        {\n          \"expr\": \"up{job=~\\\".*loom-service.*\\\"\
    }\",\n          \"legendFormat\": \"loom-service\",\n          \"refId\": \"A\"\
    \n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"stat\"\
