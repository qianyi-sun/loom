    : \"browser\",\n  \"schemaVersion\": 39,\n  \"time\": { \"from\": \"now-1h\",\
    \ \"to\": \"now\" },\n  \"refresh\": \"30s\",\n  \"templating\": { \"list\": []\
    \ },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n  \
    \    \"title\": \"Control Plane Up\",\n      \"gridPos\": { \"x\": 0, \"y\": 0,\
