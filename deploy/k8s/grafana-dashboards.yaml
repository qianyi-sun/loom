    : [\"lastNotNull\"] },\n        \"colorMode\": \"background\",\n        \"graphMode\"\
    : \"none\",\n        \"textMode\": \"auto\"\n      },\n      \"fieldConfig\":\
    \ {\n        \"defaults\": {\n          \"mappings\": [\n            { \"type\"\
    : \"value\", \"options\": { \"0\": { \"text\": \"DOWN\", \"color\": \"red\" },\
    \ \"1\": { \"text\": \"UP\", \"color\": \"green\" } } }\n          ],\n      \
    \    \"thresholds\": { \"mode\": \"absolute\", \"steps\": [{ \"value\": null,\
    \ \"color\": \"red\" }, { \"value\": 1, \"color\": \"green\" }] }\n        }\n\
    \      },\n      \"targets\": [\n        {\n          \"expr\": \"up{job=~\\\"\
    .*loom-worker.*\\\"}\",\n          \"legendFormat\": \"worker\",\n          \"\
    refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"\
