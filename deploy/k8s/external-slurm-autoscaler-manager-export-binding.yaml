# This fail-closed static form supplies the exact deletion identity used by the
# publisher. After the admission policy is compiled without warnings, the
# publisher applies the same binding with an ownerReference to the verified Pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loom-external-slurm-autoscaler-manager-export
  namespace: loom-dev
subjects:
  - kind: ServiceAccount
    name: loom-external-slurm-autoscaler
    namespace: loom-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loom-external-slurm-autoscaler-manager-export
