apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: loom-llm-gateway }
  template:
    metadata:
      labels: { app: loom-llm-gateway }
    spec:
      containers:
        - name: gateway
          image: loom-llm-gateway:0.7
          env:
            - name: LOOM_ENV
              value: production
            - name: LOOM_GW_DB_URL
              valueFrom: { secretKeyRef: { name: loom-secrets, key: gw-db-url } }
            - name: LOOM_GW_ADMIN_SECRET_FILE
              value: /var/run/loom/admin/secrets.toml
            - name: LOOM_GW_ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: loom-secrets, key: anthropic-api-key } }
            - name: LOOM_GW_OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: loom-secrets, key: openai-api-key } }
          ports:
            - containerPort: 9100
          readinessProbe:
            httpGet: { path: /healthz, port: 9100 }
            periodSeconds: 5
          volumeMounts:
            - name: loom-admin-secret
              mountPath: /var/run/loom/admin
              readOnly: true
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
      volumes:
        - name: loom-admin-secret
          secret:
            secretName: loom-admin-secret
            defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: loom-llm-gateway
spec:
  selector: { app: loom-llm-gateway }
  ports:
    - port: 9100
      targetPort: 9100
