          value: app
        - name: LOOM_SVC_PERSONAL_DEV_CAPACITY_DATABASE_PORT
          value: '5432'
        - name: LOOM_SVC_PERSONAL_DEV_CAPACITY_DNS_NAMESPACE
          value: kube-system
        - name: LOOM_SVC_PERSONAL_DEV_CAPACITY_DNS_POD_LABEL
          value: kube-dns
        - name: LOOM_SVC_PERSONAL_DEV_CAPACITY_DNS_POD_LABEL_KEY
