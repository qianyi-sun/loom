        - name: LOOM_SVC_PERSONAL_DEV_CAPACITY_DNS_PORT
          value: '53'
        - name: LOOM_SVC_PERSONAL_DEV_CAPACITY_LIFECYCLE_BEARER_TOKEN_FILE
          value: /var/run/loom-personal-dev-capacity/lifecycle-token
        - name: LOOM_SVC_PERSONAL_DEV_CAPACITY_LIFECYCLE_CA_FILE
