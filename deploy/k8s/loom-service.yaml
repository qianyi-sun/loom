        - name: LOOM_ENV
          value: production
        - name: LOOM_NAMESPACE
          value: loom
        volumeMounts:
        - name: loom-admin-secret
          mountPath: /var/run/loom/secrets/admin
          readOnly: true
        ports:
        - containerPort: 8090
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8090
          periodSeconds: 5
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi
      volumes:
      - name: loom-admin-secret
        secret:
          secretName: loom-admin-secret
          defaultMode: 256
---
apiVersion: v1
kind: Service
metadata:
  namespace: loom
  name: loom-service
spec:
  selector:
    app: loom-service
  ports:
  - port: 8090
    targetPort: 8090
