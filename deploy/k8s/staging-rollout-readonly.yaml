apiVersion: v1
kind: ServiceAccount
metadata:
  name: loom-rollout-readonly
  namespace: loom-staging
  labels:
    app.kubernetes.io/name: loom-staging-rollout
    app.kubernetes.io/component: readonly-preflight
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loom-rollout-readonly
  namespace: loom-staging
  labels:
    app.kubernetes.io/name: loom-staging-rollout
    app.kubernetes.io/component: readonly-preflight
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - persistentvolumeclaims
      - pods
      - pods/log
      - services
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  # A TokenRequest bearer may open only the exact PostgreSQL pod transport.
  # Database authorization is independently SELECT-only; this subresource
  # permission cannot create or update a Kubernetes object.
  - apiGroups: [""]
    resources: [pods/portforward]
    resourceNames: [loom-postgres-0]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loom-rollout-readonly
  namespace: loom-staging
  labels:
    app.kubernetes.io/name: loom-staging-rollout
    app.kubernetes.io/component: readonly-preflight
subjects:
  - kind: ServiceAccount
    name: loom-rollout-readonly
    namespace: loom-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loom-rollout-readonly
