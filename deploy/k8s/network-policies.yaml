apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loom-postgres
spec:
  podSelector:
    matchLabels:
      app: loom-postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: loom-control-plane
    - podSelector:
        matchLabels:
          app: loom-llm-gateway
    - podSelector:
        matchLabels:
          app: loom-service
    - podSelector:
        matchLabels:
          app: loom-migration
    ports:
    - port: 5432
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
