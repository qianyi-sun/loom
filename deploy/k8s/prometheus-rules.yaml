# Prometheus alert rules for Loom (#81 slice A).
#
# Targets the metrics emitted by loom_control_plane, loom_llm_gateway,
# loom_service, and loom_worker. Keep docs/runbooks/operator-runbook.md's
# production alert table in sync with every `alert:` entry below.
#
# Requires prometheus-operator (the PrometheusRule CRD), or the
# kube-prometheus-stack chart. If you ship prometheus differently,
# extract the `groups` block into your `prometheus.yml` /
# `rules.yml` directly — the rule expressions are stack-agnostic.
#
# Thresholds are starting points, not finals. Tune per your team's
# trial volume + workload shape. The "for:" durations are picked to
# avoid paging on transient blips; cut them in half for staging.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loom-alerts
  labels:
    # If your prometheus-operator instance uses ruleSelector with
    # `prometheus: kube-prometheus`, add the corresponding label here.
    app: loom
    component: alerts
spec:
  groups:
    - name: loom.platform.health
      interval: 30s
      rules:
        # No worker is heartbeating. Platform is dead — no trial can
        # progress. Pages immediately.
        - alert: LoomNoWorkersActive
          expr: loom_workers_active == 0
          for: 2m
          labels:
            severity: critical
            component: worker
          annotations:
            summary: "No active workers — platform cannot run trials"
            description: |
              `loom_workers_active` has been 0 for 2 minutes. Every queued
              trial is blocked.

              Triage:
                kubectl get pods -n loom -l app=loom-worker
                kubectl logs -n loom -l app=loom-worker --tail=200 --previous

              If pods are CrashLoopBackOff, check worker-token in
              `loom-secrets` and the upstream CP/Postgres reachability.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/runbooks/operator-runbook.md#production-alerts"

        # Queue is growing without trials advancing. Either workers
        # are saturated or trials are arriving faster than workers
        # can claim.
        - alert: LoomQueueBacklog
          expr: sum(loom_queue_depth) > 100
          for: 10m
          labels:
            severity: warning
            component: control-plane
          annotations:
            summary: "Loom queue depth > 100 for 10m"
            description: |
              Pending trials exceed 100 for 10 minutes.

              Triage:
                - Check loom_workers_active — if low, scale workers.
                - Check loom_claim_latency_sec_bucket p95 — if high, DRF
                  scan is slow (postgres tuning).
                - Inspect per-team breakdown:
                    sum by (team_id) (loom_queue_depth)

        # Trials enter `claimed` but never `running` — worker crashed
        # mid-spawn, or the agent runtime image is broken.
        - alert: LoomTrialsStuckClaimed
          expr: |
            sum by (team_id) (
              loom_trials_inflight{state="claimed"}
            ) > 5
          for: 15m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "Trials stuck in claimed state"
            description: |
              At least 5 trials per team have been claimed but not
              advanced to running for 15 minutes.

              Triage:
                - kubectl logs -n loom -l app=loom-worker --since=20m
                  | grep -i "claim\|spawn\|runtime"
                - Check if a recent image push broke the agent runtime.

        # Crash detector is reclaiming trials. Workers are dying.
        - alert: LoomWorkerReclaimsSpiking
          expr: rate(loom_worker_reclaim_total[5m]) > 0.5
          for: 10m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "Worker reclaim rate > 0.5/sec for 10m"
            description: |
              The crash detector is reclaiming > 30 trials/min. Workers
              are dying mid-trial — OOMs, host losses, or worker code
              regressions.

              Triage:
                kubectl describe pod -n loom -l app=loom-worker \
                  | grep -A2 "Last State\|OOMKilled\|Reason"
                kubectl logs -n loom -l app=loom-worker --previous

        # Retry budget exhausted at high rate — something is structurally
        # wrong (broken benchmark, too-low max_attempts, or a provider
        # outage burning retries fast).
        - alert: LoomRetryExhaustedSpiking
          expr: rate(loom_retry_exhausted_total[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
            component: control-plane
          annotations:
            summary: "Retry-exhausted rate > 0.1/sec for 10m"
            description: |
              More than 6 trials/min are exhausting their retry budget and
              being moved to failed='retry_exhausted' for 10 minutes.

              Triage:
                - Inspect recent batch results:
                    loom batch ls --state running
                - Check loom_gateway_llm_calls_total for provider errors;
                  a provider outage burns retries fast.
                - Look at trial failure_reason distribution in the DB:
                    SELECT failure_reason, count(*) FROM trials
                     WHERE state='failed' GROUP BY 1 ORDER BY 2 DESC;
                - Consider raising max_attempts on the affected batch or
                  switching to a healthy provider connection.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/runbooks/operator-runbook.md#production-alerts"

        # Worker tokens that have either been unused for 30+ days (likely
        # belong to a decommissioned worker pool) or are 90+ days old
        # since mint (rotation overdue per SOC2-equivalent cadence).
        # Soft signal — never auto-revokes, because pulling a live
        # pool's token 401s in-flight claims.
        - alert: LoomWorkerTokenStaleness
          expr: loom_worker_tokens_stale_count > 0
          for: 1h
          labels:
            severity: warning
            component: control-plane
          annotations:
            summary: "Worker tokens flagged by the staleness audit ({{ $labels.reason }})"
            description: |
              One or more live worker tokens are flagged as stale.

              reason="unused_30d": last_seen_at (or issued_at, for
                tokens that were never presented) is older than 30 days.
                Most common cause: a worker pool was decommissioned but
                its token was never revoked. Slurm pools that batch
                infrequently can also trip this — silence the alert via
                alertmanager once you've confirmed the pool is intended.

              reason="aged_90d": issued_at is older than 90 days.
                Rotation is overdue. Rotate per the operator runbook.

              Triage:
                - List candidate tokens (no raw value exposed):
                    SELECT encode(token_hash, 'hex') AS hash_prefix,
                           name, issued_at, last_seen_at, expires_at
                      FROM tokens
                     WHERE type = 'worker'
                       AND revoked_at IS NULL
                       AND (expires_at IS NULL OR expires_at > NOW())
                       AND (COALESCE(last_seen_at, issued_at)
                              < NOW() - INTERVAL '30 days'
                            OR issued_at < NOW() - INTERVAL '90 days')
                     ORDER BY COALESCE(last_seen_at, issued_at) ASC;
                - If a pool is genuinely retired: `loom admin tokens
                  worker revoke <prefix>`.
                - If a pool is alive but long-cycle (Slurm batch): add
                  an alertmanager silence keyed by that prefix.
                - If overdue for rotation: see the rotation section in
                  the operator runbook.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/runbooks/operator-runbook.md#worker-token-staleness"

        # MinIO PVC fullness. Without a retention policy the disk fills
        # silently and trial uploads start failing with "no space left
        # on device." 80% warns; 95% pages.
        #
        # The PVC name is deterministic from the StatefulSet's
        # volumeClaimTemplates[0].metadata.name = "data" plus the pod
        # ordinal "0" (single replica). If the StatefulSet name or
        # volume name changes, update both selectors.
        - alert: LoomMinioPVCUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{persistentvolumeclaim="data-loom-minio-0"}
              /
              kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="data-loom-minio-0"}
            ) > 0.80
          for: 15m
          labels:
            severity: warning
            component: minio
          annotations:
            summary: "MinIO PVC > 80% used"
            description: |
              MinIO storage utilization has been above 80% for 15
              minutes. Without intervention the PVC will fill and
              worker trial uploads will start failing with
              "no space left on device."

              Triage:
                kubectl exec -n loom loom-minio-0 -- df -h /data
                mc du loom-minio/trajectories \
                      loom-minio/artifacts \
                      loom-minio/atif

              Remediation paths:
                - If retention rules are missing or stale: re-run
                  `loom cluster bootstrap-storage-lifecycle`.
                - If retention is in place but disk grew faster than
                  expected: expand the PVC (StorageClass must support
                  resize) and/or tighten the retention windows in
                  storage-lifecycle.toml.
                - If long-term durable storage matters: migrate to
                  external object store via `loom cluster
                  --storage external`.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/runbooks/operator-runbook.md#minio-pvc-usage"

        # Trial uploads will start failing within minutes to hours.
        # Page on-call.
        - alert: LoomMinioPVCUsageCritical
          expr: |
            (
              kubelet_volume_stats_used_bytes{persistentvolumeclaim="data-loom-minio-0"}
              /
              kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="data-loom-minio-0"}
            ) > 0.95
          for: 5m
          labels:
            severity: critical
            component: minio
          annotations:
            summary: "MinIO PVC > 95% used — trial uploads will fail soon"
            description: |
              MinIO storage utilization > 95%. Trial uploads will
              start failing within minutes to hours depending on
              incoming volume. Page on-call.

              Emergency response:
                - Expand the PVC immediately if StorageClass allows
                  it.
                - Manually expire old trajectories:
                    mc rm --recursive --older-than 14d \
                      loom-minio/trajectories
                - Stop accepting new trials until the disk clears.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/runbooks/operator-runbook.md#minio-pvc-usage"

    - name: loom.platform.latency
      interval: 30s
      rules:
        # State-PATCH timeouts surface a slow CP or a DB lock storm.
        - alert: LoomStatePatchTimeouts
          expr: |
            sum(rate(
              loom_state_patch_total{result="timeout"}[5m]
            )) > 0
          for: 5m
          labels:
            severity: warning
            component: control-plane
          annotations:
            summary: "State PATCH timeouts > 0 for 5m"
            description: |
              The fenced state-PATCH path is timing out. Workers see
              409/504 and retry; eventually they give up + the crash
              detector reclaims.

              Triage:
                - kubectl exec deploy/loom-control-plane -- \
                    pg_isready -h loom-postgres
                - Check postgres connections + active queries.
                - Roll back any recent CP image.

        # Claim path is slow → workers spend their time spinning on
        # claim instead of running trials.
        - alert: LoomClaimLatencyP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(loom_claim_latency_sec_bucket[5m]))
            ) > 1.0
          for: 15m
          labels:
            severity: warning
            component: control-plane
          annotations:
            summary: "Claim latency p95 > 1s for 15m"
            description: |
              POST /trials/claim p95 latency exceeds 1 second. The
              DRF scan is slow, usually a postgres-side issue.

              Triage:
                - Verify the trials(state, submitted_at) index is hot.
                - Check pg_stat_statements for the claim query.

    - name: loom.deploy.health
      interval: 60s
      rules:
        # If the CP scrape itself goes down for 5+ minutes, every
        # other alert is silently inert. Page on the scrape itself.
        - alert: LoomControlPlaneDown
          expr: up{job=~".*loom-control-plane.*"} == 0
          for: 5m
          labels:
            severity: critical
            component: control-plane
          annotations:
            summary: "Control Plane scrape down"
            description: |
              Prometheus has been unable to scrape loom-control-plane
              for 5 minutes. Every other loom alert is inert until
              this clears.

              Triage:
                kubectl get pods -n loom -l app=loom-control-plane
                kubectl describe svc -n loom loom-control-plane
                Check ServiceMonitor / PodMonitor label selectors.

    - name: loom.gateway.health
      interval: 30s
      rules:
        - alert: LoomLLMGatewayDown
          expr: up{job=~".*loom-llm-gateway.*"} == 0
          for: 5m
          labels:
            severity: critical
            component: llm-gateway
          annotations:
            summary: "LLM Gateway scrape down"
            description: |
              Prometheus can't scrape loom-llm-gateway for 5 minutes.
              Provider-call metrics are unobserved.

              Triage:
                kubectl get pods -n loom -l app=loom-llm-gateway
                kubectl logs -n loom -l app=loom-llm-gateway --tail=200

        # Per-provider failure rate. Triggers when a single provider
        # is returning errors faster than 5% of total traffic for
        # 10 minutes.
        - alert: LoomGatewayProviderErrorRate
          expr: |
            (
              sum by (provider) (
                rate(loom_gateway_llm_calls_total{
                  result!="ok"
                }[5m])
              )
              /
              sum by (provider) (
                rate(loom_gateway_llm_calls_total[5m])
              )
            ) > 0.05
          for: 10m
          labels:
            severity: warning
            component: llm-gateway
          annotations:
            summary: "Provider error rate > 5% for 10m"
            description: |
              A specific provider is failing > 5% of calls for 10
              minutes. Could be the provider itself, an expired API
              key, or a regional outage.

              Triage:
                kubectl logs -n loom -l app=loom-llm-gateway --since=15m \
                  | grep -i "provider=$LABEL\|upstream"
                loom providers test <connection-name>
                Check provider status page.

        - alert: LoomGatewayCostSpike
          expr: |
            sum by (team_id) (
              increase(loom_gateway_cost_usd_total[30m])
            ) > 10
          for: 10m
          labels:
            severity: warning
            component: llm-gateway
          annotations:
            summary: "Per-team gateway spend increased by > $10 in 30m"
            description: |
              One team accumulated more than $10 of provider-attributed
              gateway cost in 30 minutes. This is not quota enforcement;
              it is an operator signal to inspect traffic and provider
              configuration.

              Triage:
                - Inspect the Gateway cost dashboard by team_id.
                - Check recent batches for the affected team.
                - If spend is unintended, disable the team or rotate the
                  provider connection secret from the staging runbook.

    - name: loom.service.health
      interval: 30s
      rules:
        - alert: LoomServiceDown
          expr: up{job=~".*loom-service.*"} == 0
          for: 5m
          labels:
            severity: critical
            component: service
          annotations:
            summary: "loom-service scrape down"
            description: |
              Prometheus can't scrape loom-service for 5 minutes.
              Public API is silent.

              Triage:
                kubectl get pods -n loom -l app=loom-service
                kubectl describe svc -n loom loom-service
                Check ServiceMonitor / PodMonitor label selectors.

        - alert: LoomServiceHighErrorRate
          expr: |
            (
              sum(rate(loom_svc_http_requests_total{
                status_class="5xx"
              }[5m]))
              /
              sum(rate(loom_svc_http_requests_total[5m]))
            ) > 0.02
          for: 10m
          labels:
            severity: warning
            component: service
          annotations:
            summary: "Service 5xx rate > 2% for 10m"
            description: |
              The public API is returning > 2% 5xx for 10 minutes.

              Triage:
                kubectl logs -n loom -l app=loom-service --since=15m \
                  | grep -i "500\|exception\|traceback"
                Check upstream control-plane and gateway dependencies.

        - alert: LoomServiceAuthFailureSpike
          expr: |
            sum(rate(loom_svc_auth_failures_total[5m])) > 1
          for: 10m
          labels:
            severity: warning
            component: service
          annotations:
            summary: "Service auth failures > 1/sec for 10m"
            description: |
              Browser sessions or bearer tokens are failing service auth
              at more than 60 failures/min for 10 minutes. Could be a
              leaked stale token, broken CLI config, expired sessions, or
              probing.

              Triage:
                - Inspect auth_kind/reason on the service dashboard.
                - Check public ingress logs for source concentration.
                - Revoke affected API tokens or disable the team if the
                  pattern looks abusive.

        - alert: LoomServiceSubmissionRejectSpike
          expr: |
            sum(rate(loom_svc_submission_rejects_total[5m])) > 0.2
          for: 10m
          labels:
            severity: warning
            component: service
          annotations:
            summary: "Submission rejects > 0.2/sec for 10m"
            description: |
              Batch submissions are being rejected before fan-out at more
              than 12/min for 10 minutes. Common reasons include no live
              workers, invalid task/provider input, missing submit scope,
              team isolation, or an operator-paused team.

              Triage:
                - Inspect rejection reasons on the service dashboard.
                - If reason=no_workers, check LoomNoWorkersActive.
                - If reason=team_paused, confirm the incident hold is
                  intentional before resuming submissions.

    - name: loom.worker.health
      interval: 30s
      rules:
        - alert: LoomWorkerProcessDown
          expr: up{job=~".*loom-worker.*"} == 0
          for: 5m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "Worker scrape down"
            description: |
              Prometheus can't scrape a worker instance for 5 minutes.
              The CP's loom_workers_active gauge is the source of truth
              for "no workers can take trials"; this alert catches the
              narrower case where one specific worker is silent.

              Triage:
                kubectl get pod -n loom -l app=loom-worker
                kubectl logs -n loom -l app=loom-worker --previous

        - alert: LoomWorkerHeartbeatFailing
          expr: |
            rate(loom_worker_heartbeat_failures_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "Worker heartbeat failures > 0 for 10m"
            description: |
              A worker's heartbeat thread is failing to PATCH the CP
              for 10 minutes. The CP crash detector will reclaim
              this worker's trials in 1-2 expiry windows.

              Triage:
                - Verify control-plane reachability from the worker pod.
                - Check loom_worker_claim_loop_iterations_total{result="error"}
                  for related connectivity issues.

        - alert: LoomWorkerTrialFailureRateHigh
          expr: |
            (
              sum(rate(loom_worker_trials_completed_total{result!="succeeded"}[5m]))
              /
              sum(rate(loom_worker_trials_completed_total[5m]))
            ) > 0.2
          for: 15m
          labels:
            severity: warning
            component: worker
          annotations:
            summary: "Worker trial failure rate > 20% for 15m"
            description: |
              More than 20% of completed trials are failing/cancelling/
              crashing for 15 minutes. Could be an upstream provider
              outage, a broken agent runtime image, or worker-side bugs.

              Triage:
                - Inspect per-result breakdown:
                    sum by (result) (rate(loom_worker_trials_completed_total[5m]))
                - Check recent trial trajectories for common failure
                  reasons.

    - name: loom.pgbouncer.health
      interval: 30s
      rules:
        # pgbouncer's backend pool is saturated — clients are queueing
        # for a free Postgres backend. Under continuous autoscaling to
        # 100+ concurrent trials this signals that `default_pool_size`
        # needs bumping (schema field, no code change). Metric emitted
        # by prometheuscommunity/pgbouncer-exporter sidecar.
        - alert: LoomPgbouncerClientWaiting
          expr: sum(pgbouncer_pool_client_waiting_connections) > 0
          for: 1m
          labels:
            severity: warning
            component: pgbouncer
          annotations:
            summary: "pgbouncer clients waiting for a backend > 60s"
            description: |
              At least one client has been queued waiting for a free
              Postgres backend from pgbouncer's pool for more than 60s.
              Every additional waiting client is a request stalling in
              SQLAlchemy pool_pre_ping or in the app's DB call path.

              Triage:
                kubectl exec deploy/loom-pgbouncer -c pgbouncer -- \
                  psql -h localhost -p 6432 -U loom pgbouncer -c 'SHOW POOLS'

              Fix: bump `pgbouncer.default_pool_size` in the environment
              profile (currently 25) and re-render + apply. Verify
              Postgres `max_connections` (currently 150) has headroom
              for `pgbouncer.replicas × default_pool_size + LISTEN
              watchers + admin slack`.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/architecture/pgbouncer-transaction-mode-design.md"

        # pgbouncer pod is unreachable. Under normal operation, kind's
        # Service should route between the 2 replicas; both being
        # scrape-unreachable means the whole path is down. Same tier
        # as Postgres SPOF — every SQLAlchemy engine returns 5xx until
        # a pod recovers.
        - alert: LoomPgbouncerScrapeDown
          expr: up{job="pgbouncer-exporter"} == 0
          for: 3m
          labels:
            severity: critical
            component: pgbouncer
          annotations:
            summary: "pgbouncer-exporter unreachable — pgbouncer may be down"
            description: |
              Prometheus can't reach pgbouncer-exporter on port 9127.
              Either the pgbouncer pod is down, or the sidecar exporter
              is stuck. Every service SQLAlchemy engine routes through
              pgbouncer.

              Triage:
                kubectl get pods -n loom -l app=loom-pgbouncer
                kubectl logs -n loom -l app=loom-pgbouncer -c pgbouncer --tail=200
                kubectl logs -n loom -l app=loom-pgbouncer -c exporter --tail=100

              Rollback path if pgbouncer is broken: set
              `pgbouncer.enabled=false` in the profile, re-render,
              apply. Services fall back to db_url (direct-to-Postgres).

    - name: loom.listen.health
      interval: 30s
      rules:
        # LISTEN watcher fell back to poll-only mode at boot. Its
        # NOTIFY self-test round-trip didn't complete within 1s,
        # meaning the connection likely routes through pgbouncer
        # transaction mode (which silently drops NOTIFY delivery).
        # Not a correctness failure — the poll fallback keeps the
        # snapshot fresh — but latency degrades from <100ms to poll-
        # interval seconds. Emitted by src/loom_listen/self_test.py.
        - alert: LoomListenWatcherPollFallback
          expr: loom_listen_watcher_push_mode == 0
          for: 2m
          labels:
            severity: warning
            component: listen-watcher
          annotations:
            summary: "LISTEN watcher {{ $labels.watcher }} in poll-only mode"
            description: |
              The LISTEN watcher labeled `{{ $labels.watcher }}` failed
              its boot-time NOTIFY round-trip probe and is now serving
              from the poll timer instead of NOTIFY push. Push-mode
              latency (~100ms) has degraded to poll-interval latency
              (5-10s).

              Root cause: the watcher's DSN routes through pgbouncer
              transaction mode. Watcher connections MUST be direct-to-
              Postgres. Check that `LOOM_EGRESS_XDS_DB_URL` and
              `svc-db-url` in `loom-secrets` point at `loom-postgres:5432`
              (direct), not `loom-pgbouncer:6432`.

              Verify with:
                loom cluster doctor
              which enforces the direct/pool DSN invariants when
              pgbouncer.enabled=true.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/architecture/pgbouncer-transaction-mode-design.md"

    - name: loom.minio.health
      interval: 30s
      rules:
        # MinIO write-path latency degradation. p95 write duration
        # spiking indicates disk contention (single-node MinIO) or
        # erasure recovery in progress (distributed MinIO). Trial
        # finalize latency inherits this — long-running trials block
        # on trajectory + artifact uploads at the end.
        - alert: LoomMinioWriteLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, api) (
                rate(minio_s3_requests_duration_seconds_bucket{
                  api=~"PutObject|CompleteMultipartUpload"
                }[5m])
              )
            ) > 2.0
          for: 10m
          labels:
            severity: warning
            component: minio
          annotations:
            summary: "MinIO PutObject/CompleteMultipartUpload p95 > 2s"
            description: |
              Trial finalize latency is inheriting slow MinIO writes.
              Under single-node MinIO this signals disk saturation
              (see LoomMinioPVCUsageHigh) or CPU/network throttling.
              Under distributed MinIO this can indicate erasure
              recovery from a degraded disk/node.

              Triage:
                kubectl exec -it deploy/loom-service -- \
                  mc admin info local
                kubectl top pod -n loom -l app=loom-minio

              Fix: if single-node, plan cutover to distributed mode
              (#610). If distributed, check `mc admin heal --scan` for
              in-progress heal operations and let them finish.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/architecture/multi-node-topology.md"

        # MinIO server-side errors. 5xx from PutObject/GetObject means
        # trial artifacts and trajectories are outright failing to
        # persist — not just slow. Every 5xx is a lost audit trail.
        - alert: LoomMinioRequestErrorRateHigh
          expr: |
            sum by (api) (
              rate(minio_s3_requests_errors_total{api=~"PutObject|GetObject|CompleteMultipartUpload"}[5m])
            )
            /
            sum by (api) (
              rate(minio_s3_requests_total{api=~"PutObject|GetObject|CompleteMultipartUpload"}[5m])
            )
            > 0.01
          for: 5m
          labels:
            severity: critical
            component: minio
          annotations:
            summary: "MinIO server errors > 1% on write/read paths"
            description: |
              MinIO is returning server-side errors on more than 1% of
              write/read requests over 5m. Trial finalize is lossy or
              broken. On single-node MinIO check disk / process
              health; on distributed MinIO check per-drive status.

              Triage:
                kubectl logs -n loom -l app=loom-minio --tail=200 \
                  | grep -Ei 'error|WARN'
                kubectl exec -it deploy/loom-service -- \
                  mc admin info local

              Rollback path if the distributed pool is misbehaving and
              the pre-#610 single-node MinIO was kept online for 24h
              after cutover: flip `MINIO_ENDPOINT` back to the
              single-node service; write path recovers immediately.
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/architecture/multi-node-topology.md"

        # Distributed MinIO cluster health. `minio_cluster_nodes_online_total`
        # falling below expected means one of the erasure peers is
        # unreachable — MinIO can serve reads/writes with one node
        # down (given N-parity ≥ 1) but every additional loss narrows
        # the safety margin. Fires only when the topology.multi_node
        # StatefulSet actually deploys — single-node MinIO has no
        # such metric.
        - alert: LoomMinioNodeOffline
          expr: minio_cluster_nodes_offline_total > 0
          for: 5m
          labels:
            severity: warning
            component: minio
          annotations:
            summary: "One or more MinIO distributed nodes offline"
            description: |
              At least one MinIO pod in the distributed pool is
              unreachable from its peers. Erasure quorum is still met
              (pool tolerates N-parity failures) but every additional
              loss narrows the margin.

              Triage:
                kubectl get pods -n loom -l app=loom-minio
                kubectl describe pod -n loom -l app=loom-minio \
                  | grep -A5 Events

              If the pod restarted cleanly, `minio_cluster_nodes_offline_total`
              returns to 0 within 60s. If it stays > 0, inspect the pod's
              logs for peer-discovery failures (headless service DNS,
              NetworkPolicy).
            runbook_url: "https://github.com/qianyi-sun/loom/blob/dev/docs/architecture/multi-node-topology.md"
