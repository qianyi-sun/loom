# Remote worker-only compose file.
#
# Use this on a worker host that should join an existing Loom control
# plane. It intentionally starts no Postgres, MinIO, Gateway, API, or Web
# services. Provide endpoints and credentials through an env file such as
# deploy/remote-worker.env.example copied outside git.

services:
  worker:
    image: loom-worker:${LOOM_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      - LOOM_WORKER_CONTROL_PLANE_URL=${LOOM_WORKER_CONTROL_PLANE_URL:?set LOOM_WORKER_CONTROL_PLANE_URL}
      - LOOM_WORKER_GATEWAY_URL=${LOOM_WORKER_GATEWAY_URL:?set LOOM_WORKER_GATEWAY_URL}
      - LOOM_WORKER_SUBPROCESS_GATEWAY_URL
      - LOOM_WORKER_TOKEN=${LOOM_WORKER_TOKEN:?set LOOM_WORKER_TOKEN}
      - LOOM_WORKER_MINIO_ENDPOINT=${LOOM_WORKER_MINIO_ENDPOINT:?set LOOM_WORKER_MINIO_ENDPOINT}
      - LOOM_WORKER_MINIO_ACCESS_KEY=${LOOM_WORKER_MINIO_ACCESS_KEY:?set LOOM_WORKER_MINIO_ACCESS_KEY}
      - LOOM_WORKER_MINIO_SECRET_KEY=${LOOM_WORKER_MINIO_SECRET_KEY:?set LOOM_WORKER_MINIO_SECRET_KEY}
      - LOOM_WORKER_MINIO_MAX_POOL_CONNECTIONS=${LOOM_WORKER_MINIO_MAX_POOL_CONNECTIONS:-256}
      - LOOM_WORKER_MINIO_CONNECT_TIMEOUT_SEC=${LOOM_WORKER_MINIO_CONNECT_TIMEOUT_SEC:-5}
      - LOOM_WORKER_MINIO_READ_TIMEOUT_SEC=${LOOM_WORKER_MINIO_READ_TIMEOUT_SEC:-120}
      - LOOM_WORKER_MINIO_OPERATION_TIMEOUT_SEC=${LOOM_WORKER_MINIO_OPERATION_TIMEOUT_SEC:-300}
      - LOOM_WORKER_MINIO_OPERATION_ATTEMPTS=${LOOM_WORKER_MINIO_OPERATION_ATTEMPTS:-3}
      - LOOM_WORKER_TASK_MATERIALIZE_TIMEOUT_SEC=${LOOM_WORKER_TASK_MATERIALIZE_TIMEOUT_SEC:-300}
      - LOOM_WORKER_DOCKER_API_TIMEOUT_SEC=${LOOM_WORKER_DOCKER_API_TIMEOUT_SEC:-1800}
      - LOOM_WORKER_TRIAL_CACHE_BUILD_MAX_CONCURRENT=${LOOM_WORKER_TRIAL_CACHE_BUILD_MAX_CONCURRENT:-1}
      - LOOM_WORKER_MAX_CONCURRENT=${LOOM_WORKER_MAX_CONCURRENT:-5}
      - LOOM_WORKER_POOL_NAME=${LOOM_WORKER_POOL_NAME:-remote-worker}
      - LOOM_WORKER_HOSTNAME=${LOOM_WORKER_HOSTNAME:-}
      - LOOM_WORKER_IDLE_EXIT_AFTER_SECONDS=${LOOM_WORKER_IDLE_EXIT_AFTER_SECONDS:-}
      - LOOM_TASK_IMAGE_BUILD_MAX_FILES=${LOOM_TASK_IMAGE_BUILD_MAX_FILES:-2000}
      - LOOM_TASK_IMAGE_BUILD_MAX_BYTES=${LOOM_TASK_IMAGE_BUILD_MAX_BYTES:-536870912}
      - LOOM_WORKER_BLOCKING_IO_MAX_WORKERS
      - LOOM_WORKER_LOG_LEVEL=${LOOM_WORKER_LOG_LEVEL:-info}
      - LOOM_WORKER_TRAJECTORY_CACHE_DIR=/var/lib/loom/trajectories
      - LOOM_WORKER_BENCHMARK_CACHE=/var/lib/loom/benchmarks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - remote_worker_trajectories:/var/lib/loom/trajectories
      - remote_worker_benchmarks:/var/lib/loom/benchmarks
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: on-failure

volumes:
  remote_worker_trajectories:
  remote_worker_benchmarks:
