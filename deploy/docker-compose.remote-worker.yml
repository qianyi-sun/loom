# Remote worker-only compose file.
#
# Use this on a worker host that should join an existing Loom control
# plane. It intentionally starts no Postgres, MinIO, Gateway, API, or Web
# services. Provide endpoints and credentials through an env file such as
# deploy/remote-worker.env.example copied outside git.

services:
  worker:
    # Registry-backed distributed workers use the Docker config ID, not a
    # mutable tag or a local build fallback.  The controller verifies this
    # exact ID, OS/architecture, and revision label before startup and reads
    # the running container's `.Image` back afterwards.
    image: ${LOOM_WORKER_IMAGE_ID:?set exact loom-worker image config ID}
    environment:
      - LOOM_WORKER_CONTROL_PLANE_URL=${LOOM_WORKER_CONTROL_PLANE_URL:?set LOOM_WORKER_CONTROL_PLANE_URL}
      - LOOM_WORKER_GATEWAY_URL=${LOOM_WORKER_GATEWAY_URL:?set LOOM_WORKER_GATEWAY_URL}
      - LOOM_WORKER_SUBPROCESS_GATEWAY_URL
      # Exactly one source is resolved inside the worker. The sandbox Slurm
      # overlay mounts a root-installed token file and leaves the inline value
      # empty so `docker compose config` and process metadata never contain it.
      - LOOM_WORKER_TOKEN=${LOOM_WORKER_TOKEN:-}
      - LOOM_WORKER_TOKEN_FILE
      - LOOM_WORKER_MINIO_ENDPOINT=${LOOM_WORKER_MINIO_ENDPOINT:?set LOOM_WORKER_MINIO_ENDPOINT}
      # As with the worker token, sandbox Slurm jobs use root-installed files.
      # Existing fixed remote workers may keep using the inline pair.
      - LOOM_WORKER_MINIO_ACCESS_KEY=${LOOM_WORKER_MINIO_ACCESS_KEY:-}
      - LOOM_WORKER_MINIO_ACCESS_KEY_FILE
      - LOOM_WORKER_MINIO_SECRET_KEY=${LOOM_WORKER_MINIO_SECRET_KEY:-}
      - LOOM_WORKER_MINIO_SECRET_KEY_FILE
      - LOOM_WORKER_MINIO_MAX_POOL_CONNECTIONS=${LOOM_WORKER_MINIO_MAX_POOL_CONNECTIONS:-256}
      - LOOM_WORKER_MINIO_CONNECT_TIMEOUT_SEC=${LOOM_WORKER_MINIO_CONNECT_TIMEOUT_SEC:-5}
      - LOOM_WORKER_MINIO_READ_TIMEOUT_SEC=${LOOM_WORKER_MINIO_READ_TIMEOUT_SEC:-120}
      - LOOM_WORKER_MINIO_OPERATION_TIMEOUT_SEC=${LOOM_WORKER_MINIO_OPERATION_TIMEOUT_SEC:-300}
      - LOOM_WORKER_MINIO_OPERATION_ATTEMPTS=${LOOM_WORKER_MINIO_OPERATION_ATTEMPTS:-3}
      - LOOM_WORKER_TASK_MATERIALIZE_TIMEOUT_SEC=${LOOM_WORKER_TASK_MATERIALIZE_TIMEOUT_SEC:-300}
      - LOOM_WORKER_DOCKER_API_TIMEOUT_SEC=${LOOM_WORKER_DOCKER_API_TIMEOUT_SEC:-1800}
      - LOOM_WORKER_TRIAL_CACHE_BUILD_MAX_CONCURRENT=${LOOM_WORKER_TRIAL_CACHE_BUILD_MAX_CONCURRENT:-1}
      - LOOM_WORKER_MAX_CONCURRENT=${LOOM_WORKER_MAX_CONCURRENT:-5}
      - LOOM_WORKER_POOL_NAME=${LOOM_WORKER_POOL_NAME:-remote-worker}
      - LOOM_WORKER_HOSTNAME=${LOOM_WORKER_HOSTNAME:-}
      - LOOM_WORKER_IDLE_EXIT_AFTER_SECONDS=${LOOM_WORKER_IDLE_EXIT_AFTER_SECONDS:-}
      - LOOM_TASK_IMAGE_BUILD_MAX_FILES=${LOOM_TASK_IMAGE_BUILD_MAX_FILES:-2000}
      - LOOM_TASK_IMAGE_BUILD_MAX_BYTES=${LOOM_TASK_IMAGE_BUILD_MAX_BYTES:-536870912}
      - LOOM_WORKER_BLOCKING_IO_MAX_WORKERS
      - LOOM_WORKER_LOG_LEVEL=${LOOM_WORKER_LOG_LEVEL:-info}
      - LOOM_WORKER_TRAJECTORY_CACHE_DIR=/var/lib/loom/trajectories
      - LOOM_WORKER_BENCHMARK_CACHE=/var/lib/loom/benchmarks
      # #896: pass the per-container caps into the worker PROCESS so
      # WorkerSettings picks them up and re-applies them to the trial +
      # setup-sidecar containers it creates. Default 0 == the schema
      # default (unbounded); it must be numeric, not empty, because the
      # WorkerSettings float/int fields cannot parse an empty string. This
      # is separate from the compose-level cpus/mem_limit/pids_limit that
      # bound THIS container.
      - LOOM_WORKER_CONTAINER_CPUS=${LOOM_WORKER_CONTAINER_CPUS:-0}
      - LOOM_WORKER_CONTAINER_MEMORY_MIB=${LOOM_WORKER_CONTAINER_MEMORY_MIB:-0}
      - LOOM_WORKER_CONTAINER_PIDS=${LOOM_WORKER_CONTAINER_PIDS:-0}
      # Non-exclusive Slurm jobs add the strict cgroup-parent Compose overlay.
      # These values let the worker fail closed and place every container it
      # creates under that same allocation-owned parent.
      - LOOM_WORKER_REQUIRE_CGROUP_PARENT=${LOOM_WORKER_REQUIRE_CGROUP_PARENT:-false}
      - LOOM_WORKER_CGROUP_PARENT=${LOOM_WORKER_CGROUP_PARENT:-}
      # #1023: Slurm jobs set these from the admission-bound sandbox/candidate
      # plus runtime allocation identity. They are forwarded so every child
      # trial/sidecar gets the same cleanup and GPU-allocation boundary.
      - LOOM_WORKER_SANDBOX_IDENTITY=${LOOM_WORKER_SANDBOX_IDENTITY:-manual}
      - LOOM_WORKER_CANDIDATE_SHA=${LOOM_WORKER_CANDIDATE_SHA:-legacy}
      - LOOM_WORKER_SLURM_JOB_ID=${LOOM_WORKER_SLURM_JOB_ID:-none}
      - LOOM_WORKER_COMPOSE_PROJECT=${LOOM_WORKER_COMPOSE_PROJECT:-manual}
      - LOOM_WORKER_IMAGE_ID=${LOOM_WORKER_IMAGE_ID:?set exact loom-worker image config ID}
      - LOOM_WORKER_SLURM_ALLOCATED_GPUS=${LOOM_WORKER_SLURM_ALLOCATED_GPUS:--1}
      - LOOM_WORKER_SLURM_GPU_DEVICE_IDS=${LOOM_WORKER_SLURM_GPU_DEVICE_IDS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - remote_worker_trajectories:/var/lib/loom/trajectories
      - remote_worker_benchmarks:/var/lib/loom/benchmarks
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # #896: per-container hard caps for non-exclusive (packed) workers. Defaults
    # are unbounded (cpus 0 / mem 0m / pids -1 all mean "no limit" to Docker), so
    # exclusive pools that never set LOOM_WORKER_CONTAINER_* are unchanged.
    cpus: ${LOOM_WORKER_CONTAINER_CPUS:-0}
    mem_limit: ${LOOM_WORKER_CONTAINER_MEMORY_MIB:-0}m
    pids_limit: ${LOOM_WORKER_CONTAINER_PIDS:--1}
    labels:
      loom.sandbox: ${LOOM_WORKER_SANDBOX_IDENTITY:-manual}
      loom.candidate_sha: ${LOOM_WORKER_CANDIDATE_SHA:-legacy}
      loom.slurm_job_id: ${LOOM_WORKER_SLURM_JOB_ID:-none}
      loom.compose_project: ${LOOM_WORKER_COMPOSE_PROJECT:-manual}
      loom.worker_image_id: ${LOOM_WORKER_IMAGE_ID:?set exact loom-worker image config ID}
    # Slurm jobs export "no" so dockerd cannot restart a worker outside the
    # allocation after a host/daemon restart. Fixed remote workers retain the
    # historical on-failure policy.
    restart: ${LOOM_WORKER_RESTART_POLICY:-on-failure}

volumes:
  remote_worker_trajectories:
  remote_worker_benchmarks:
