schema_version = "1"

[task]
id = "loom-smoke/gb10-direct-completion-hello-world"
name = "GB10 direct-completion hello-world smoke"
description = "Tiny release-gate task used to verify direct-completion batch submission on GB10."

[environment]
os = "linux"
cpu_arch = "any"
dockerfile = "environment/Dockerfile"

[agent]
name = "direct-completion"

[verifier]
name = "pytest"

[[steps]]
name = "main"
artifacts = ["answer.txt"]
