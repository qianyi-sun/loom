namespace = "loom-dev"
runtime_environment = "development"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-dev-tls"
frontend_environment = "development"
frontend_environment_label = "Development"
frontend_route_path = "/dev"
frontend_api_base_path = "/dev"
trajectories_bucket = "loom-dev-trajectories"
artifacts_bucket = "loom-dev-artifacts"
env_state_profile = "../environment-state/development.toml"

# Shared development is not a laptop cluster: it co-locates with the other environments on
# the shared fleet (a `loom-dev` namespace alongside `loom-staging`/`loom-prod`)
# and runs trial execution on the SAME external Slurm workers (OLDLAB + GB10),
# so the in-cluster loom-worker Deployment is disabled. The worker-pool autoscaler
# arbitrates shared capacity per environment: development
# soaks up spare capacity and yields under prod pressure. The self-contained
# per-developer LOCAL path is separate — deploy/local/local.example.cluster.toml
# opts into an in-cluster k8s_worker so a laptop needs no Slurm/autoscaler.
[k8s_worker]
enabled = false

# Shared dev is a lightweight, low-resource env (just enough for post-merge
# integration), so its backends are single-node-shaped BY CHOICE — not because
# it is a single-node kind cluster. PgBouncer is disabled because one development Postgres has no
# realistic connection-count pressure and the extra Deployment isn't worth it.
# Staging/production use the schema default (enabled=true).
[pgbouncer]
enabled = false

# Single-node-shaped backends by choice: one Postgres and one MinIO on
# host_path, no distributed CNPG/MinIO/Longhorn — dev doesn't need HA. This is
# the backend shape, NOT the cluster: dev is a namespace on the shared k3s
# fleet. Kept explicit so the shape can't silently flip if the schema default
# changes.
[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
