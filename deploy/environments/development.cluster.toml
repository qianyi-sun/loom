namespace = "loom-dev"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-dev-tls"
frontend_environment = "development"
frontend_environment_label = "Development / staging"
frontend_route_path = "/dev"
frontend_api_base_path = "/dev"
trajectories_bucket = "loom-dev-trajectories"
artifacts_bucket = "loom-dev-artifacts"

# Local dev / kind clusters have no external Slurm capacity, so the
# in-cluster loom-worker Deployment IS the trial execution path here.
# See #383 for the OLDLAB-hosted-profile rationale that makes this
# the odd one out.
[k8s_worker]
enabled = true

# Development kind clusters don't need pgbouncer (#609):
# - Single-node kind has no realistic connection-count pressure.
# - Extra Deployment slows kind boot with no upside.
# - Staging/production use the schema default (enabled=true).
[pgbouncer]
enabled = false
