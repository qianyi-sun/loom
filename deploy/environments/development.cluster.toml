namespace = "loom-dev"
runtime_environment = "development"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-dev-tls"
frontend_environment = "development"
frontend_environment_label = "Development"
frontend_route_path = "/dev"
frontend_api_base_path = "/dev"
trajectories_bucket = "loom-dev-trajectories"
artifacts_bucket = "loom-dev-artifacts"
env_state_profile = "../environment-state/development.toml"

# Shared dev runs trial execution on external Slurm (OLDLAB + GB10), the
# same as staging/prod, so the in-cluster loom-worker Deployment is disabled
# here (#857/#873). Per-developer LOCAL dev (laptop) uses
# deploy/local/local.example.cluster.toml, which can opt into k8s_worker for
# offline / no-Slurm use.
[k8s_worker]
enabled = false

# Development kind clusters don't need pgbouncer (#609):
# - Single-node kind has no realistic connection-count pressure.
# - Extra Deployment slows kind boot with no upside.
# - Staging/production use the schema default (enabled=true).
[pgbouncer]
enabled = false

# Development kind clusters are single-node by construction (#637).
# Kept explicit to avoid a silent shape change if the schema default
# ever flips.
[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
