namespace = "loom-local"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-local-tls"
frontend_environment = "local"
frontend_environment_label = "Local"
frontend_route_path = "/local"
frontend_api_base_path = "/local"
trajectories_bucket = "loom-local-trajectories"
artifacts_bucket = "loom-local-artifacts"

# The `local` env is the self-contained kind-on-laptop deployment (was
# `development` pre-#857). It runs the whole loom stack on a single
# node with in-cluster worker pods — no external Slurm dependency —
# so it stays deployable on a developer's machine or a CI runner.
#
# For a Slurm-backed dev/staging/prod environment, see `dev.cluster.toml`.
[k8s_worker]
enabled = true

# Single-node local runs don't need pgbouncer (#609):
# - No realistic connection-count pressure with only one dev per cluster.
# - Extra Deployment slows kind boot with no upside.
# - Slurm-backed envs (dev/staging/prod) use the schema default.
[pgbouncer]
enabled = false

# Single-node by construction (#637). Kept explicit to avoid a silent
# shape change if the schema default ever flips.
[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
