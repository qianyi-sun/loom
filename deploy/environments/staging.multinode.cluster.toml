# Staging on the multi-node OLDLAB k3s cluster (the live staging as of the
# 2026-07 cutover). This is the version-controlled desired state for the
# sanctioned k3s deploy path — see docs/runbooks/deploy-staging-k3s.md.
#
# Kept as a SEPARATE file from staging.cluster.toml (which still describes the
# single-node kind rollback anchor) until the kind cluster is wiped under #881;
# at that point this becomes the canonical staging config.
#
# `image_tag` is a default; the deploy script overrides it with the freshly
# built candidate sha (staging-<shortsha>). `container_registry` is the on-host
# registry; k3s rewrites 192.168.50.13:5000 -> the loom-registry container via
# /etc/rancher/k3s/registries.yaml.
namespace = "loom-staging"
container_registry = "192.168.50.13:5000"
image_tag = "staging-5eeed714"
runtime_environment = "staging"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-staging-tls"
frontend_environment = "staging"
frontend_environment_label = "Staging"
frontend_route_path = "/staging"
frontend_api_base_path = "/staging"
trajectories_bucket = "loom-staging-trajectories"
artifacts_bucket = "loom-staging-artifacts"
env_state_profile = "../environment-state/staging.toml"
# Dynamic (Longhorn) provisioning for the multi-node distributed backends.
persistent_storage_backend = "dynamic"
persistent_storage_host_path_root = "/data/loom-staging"

# Shared trial-image cache (#547 item #2): workers on any node pull a layered
# image built on any other node. Falls back to local build without push creds.
trial_cache_registry_repo = "ghcr.io/qianyi-sun/loom-trial-cache"

# Trial execution capacity comes from the release-managed external worker pools
# (GB10 + OLDLAB), wired on the worker substrate itself — not defined here, so
# this deploy config carries no per-host worker paths.
[replicas]
web = 1

[k8s_worker]
enabled = false

[workload_contract]
workload_trust_mode = "internal_trusted"
taskset_transforms_enabled = false
taskset_transform_network_isolated = false
untrusted_workload_isolation = false

# Multi-node distributed backends on the 5-node OLDLAB k3s cluster: 4-pod
# distributed MinIO (Longhorn PVCs, required hostname anti-affinity, PDB
# min_available=3) + CNPG 3-replica Postgres.
[topology]
multi_node = true
storage_backend = "longhorn"
postgres_replicas = 3
minio_replicas = 4
anti_affinity = "required"
min_available = 3
