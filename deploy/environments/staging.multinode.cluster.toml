# Multi-node distributed backends on the 5-node OLDLAB k3s cluster: 4-pod
# distributed MinIO (Longhorn PVCs, required hostname anti-affinity, PDB
# min_available=3) + CNPG 3-replica Postgres.
[topology]
multi_node = true
storage_backend = "longhorn"
postgres_replicas = 3
minio_replicas = 4
anti_affinity = "required"
min_available = 3
