namespace = "loom-dev"
runtime_environment = "dev"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-dev-tls"
frontend_environment = "dev"
frontend_environment_label = "Development"
frontend_route_path = "/dev"
frontend_api_base_path = "/dev"
trajectories_bucket = "loom-dev-trajectories"
artifacts_bucket = "loom-dev-artifacts"
persistent_storage_backend = "static-host-path"
persistent_storage_host_path_root = "/data/loom-dev"

# Shared team-iteration environment (3-dev team on OLDLAB). Runs on the
# k3s cluster as `loom-dev` namespace. Trial capacity comes from the
# same Slurm pools as staging/prod (small allocations), so dev exercises
# the same execution path — bugs surface here before staging.

[k8s_worker]
enabled = false

[workload_contract]
workload_trust_mode = "internal_trusted"
taskset_transforms_enabled = false
taskset_transform_network_isolated = false
untrusted_workload_isolation = false

# Single-node topology (#857): dev iteration doesn't need distributed-
# system fidelity every day; staging catches multi-node bugs. Saves ~3×
# standing overhead on the shared k3s cluster.
[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1

# pgbouncer stays enabled: 3 devs + Slurm workers = enough concurrent
# connections that the pool pays for itself.
[pgbouncer]
enabled = true

