namespace = "loom-staging"
runtime_environment = "staging"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-staging-tls"
frontend_environment = "staging"
frontend_environment_label = "Staging"
frontend_route_path = "/staging"
frontend_api_base_path = "/staging"
trajectories_bucket = "loom-staging-trajectories"
artifacts_bucket = "loom-staging-artifacts"
env_state_profile = "../environment-state/staging.toml"
persistent_storage_backend = "static-host-path"
persistent_storage_host_path_root = "/data/loom-staging"

# #547 item #2: shared trial-image cache. Workers on any node can pull
# a layered image built on any other node, unlocking OLDLAB's paper
# 40-slot capacity in practice (without this, cold-cache misses queue
# behind the per-daemon build slot from #275). Workers need GHCR
# push credentials mounted for the cache to actually populate; without
# them the pull-fail path falls back to local build (harmless — same
# behavior as today).
trial_cache_registry_repo = "ghcr.io/qianyi-sun/loom-trial-cache"

# v1.0 staging validation uses GB10 only. The in-cluster loom-worker
# Deployment is omitted so trial execution capacity comes from the
# release-managed external GB10 pool.
[replicas]
web = 1

[k8s_worker]
enabled = false

[workload_contract]
workload_trust_mode = "internal_trusted"
taskset_transforms_enabled = false
taskset_transform_network_isolated = false
untrusted_workload_isolation = false

[gb10_pool]
# #822: trt-gb10-7 remains in the fixed SSH inventory but is not an active
# rollout target. Re-admission requires a separate merged change and evidence.
ssh_config = "../worker-pools/gb10/ssh_config"
ssh_identity_file = "/var/lib/loom-staging-rollout/gb10-deploy-ed25519"
hosts = [
  { ssh_target = "trt-gb10-1", repo_path = "/home/qianyi/loom-worker-build-staging", env_file_path = "/home/qianyi/loom-worker-build-staging/.env", repo_url = "https://github.com/qianyi-sun/loom.git", node_agent_service = "loom-gb10-node-agent.service" },
