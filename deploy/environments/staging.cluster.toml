namespace = "loom-staging"
runtime_environment = "staging"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-staging-tls"
frontend_environment = "staging"
frontend_environment_label = "Staging"
frontend_route_path = "/staging"
frontend_api_base_path = "/staging"
# This profile serves staging at its canonical `/staging` route.
trajectories_bucket = "loom-staging-trajectories"
artifacts_bucket = "loom-staging-artifacts"
# Keep rehearsal lifecycle coverage equal to shared staging while legacy
# worker objects remain in the logical-name buckets.
lifecycle_legacy_buckets = ["artifacts", "trajectories"]
persistent_storage_backend = "static-host-path"
persistent_storage_host_path_root = "/data/loom-staging"

# Shared trial-image cache. Workers can pull a layered image built on another
# node. Workers need GHCR push credentials to populate the cache; failed pulls
# fall back to a local build.
trial_cache_registry_repo = "ghcr.io/qianyi-sun/loom-trial-cache"

# Trial execution capacity comes from the release-managed external worker pools,
# not an in-cluster loom-worker Deployment (omitted here). The GB10 pool is
# configured through the environment-state profile rather than this render
# profile.
[replicas]
web = 1

[k8s_worker]
enabled = false

[workload_contract]
workload_trust_mode = "internal_trusted"
taskset_transforms_enabled = false
taskset_transform_network_isolated = false
untrusted_workload_isolation = false

[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
