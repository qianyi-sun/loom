namespace = "loom-staging"
runtime_environment = "staging"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-staging-tls"
frontend_environment = "staging"
frontend_environment_label = "Staging"
frontend_route_path = "/staging"
frontend_api_base_path = "/staging"
# This profile serves staging at its canonical `/staging` route.
trajectories_bucket = "loom-staging-trajectories"
artifacts_bucket = "loom-staging-artifacts"
env_state_profile = "../environment-state/staging.toml"
persistent_storage_backend = "static-host-path"
persistent_storage_host_path_root = "/data/loom-staging"

# Shared trial-image cache. Workers can pull a layered image built on another
# node. Workers need GHCR push credentials to populate the cache; failed pulls
# fall back to a local build.
trial_cache_registry_repo = "ghcr.io/qianyi-sun/loom-trial-cache"

# Trial execution capacity comes from the release-managed external worker pools,
# not an in-cluster loom-worker Deployment (omitted here). The GB10 pool is
# configured through the environment-state profile rather than this render
# profile.
[replicas]
web = 1

[k8s_worker]
enabled = false

[workload_contract]
workload_trust_mode = "internal_trusted"
taskset_transforms_enabled = false
taskset_transform_network_isolated = false
untrusted_workload_isolation = false

[gb10_pool]
ssh_config = "../worker-pools/gb10/ssh_config"
ssh_identity_file = "/var/lib/loom-staging-rollout/gb10-deploy-ed25519"
hosts = [
  { ssh_target = "trt-gb10-1", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-2", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-3", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-4", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-5", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-6", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-7", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-8", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-9", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-10", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-11", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-12", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-13", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-14", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-15", node_agent_service = "loom-gb10-node-agent.service" },
]

# Single-node staging profile used by local and rehearsal renders. Shared
# staging uses `staging.multinode.cluster.toml`.
[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
