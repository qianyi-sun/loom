  { ssh_target = "trt-gb10-6", repo_path = "/shared_work/loom/loom-worker-build-staging", env_file_path = "/shared_work/loom/loom-worker-build-staging/.env", repo_url = "https://github.com/qianyi-sun/loom.git", node_agent_service = "loom-gb10-node-agent.service" },
  { ssh_target = "trt-gb10-8", repo_path = "/shared_work/loom/loom-worker-build-staging", env_file_path = "/shared_work/loom/loom-worker-build-staging/.env", repo_url = "https://github.com/qianyi-sun/loom.git", node_agent_service = "loom-gb10-node-agent.service" },
