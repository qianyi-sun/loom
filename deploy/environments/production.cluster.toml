namespace = "loom-prod"
runtime_environment = "production"
ingress_host = "yylx.world"
ingress_redirect_hosts = ["www.yylx.world"]
ingress_tls_secret_name = "loom-prod-tls"
frontend_environment = "production"
frontend_environment_label = "Production"
frontend_route_path = "/prod"
frontend_api_base_path = "/prod"
trajectories_bucket = "loom-prod-trajectories"
artifacts_bucket = "loom-prod-artifacts"
persistent_storage_backend = "static-host-path"
persistent_storage_host_path_root = "/data/loom-prod"

# Trial execution capacity comes from Slurm-managed pools (`oldlab`
# via on-demand controller + `gb10` via persistent node-agent ssh
# rollouts). In-cluster loom-worker Deployment is omitted so workers
# don't double-schedule the OLDLAB host Docker daemon. See #383.
[k8s_worker]
enabled = false

[workload_contract]
workload_trust_mode = "internal_trusted"
taskset_transforms_enabled = false
taskset_transform_network_isolated = false
untrusted_workload_isolation = false

# Multi-node k3s HA (#642 validated). Distributed CNPG postgres (3
# replicas) + erasure-coded MinIO (3 replicas with anti_affinity so
# each replica lands on a distinct node).
[topology]
multi_node = true
storage_backend = "longhorn"
postgres_replicas = 3
minio_replicas = 3
anti_affinity = "preferred"

# Slurm on-demand dispatch to oldlab (large scale). GB10 capacity comes
# from persistent node-agent rollouts under a separate `[gb10_pool]`
# section (see staging.cluster.toml for the shape). After deploy, set
# the multi-controller JSON via `kubectl set env` (cluster-render doesn't
# ingest this field yet — follow-up to #857):
#
#   kubectl -n loom-prod set env deploy/loom-control-plane deploy/loom-family-orchestrator \
#     LOOM_CP_SLURM_WORKER_CONTROLLERS_JSON='[
#       {"enabled":true,"environment":"production","pool_name":"oldlab",
#        "allowed_nodes":["TRT-EAI-OLDLAB-1","trt-EAI-OLDLAB-2","trt-eai-oldlab-3","trt-eai-oldlab-4","trt-eai-oldlab-5"],
#        "env_file":"/shared_work/loom/loom-worker-capacity/production-oldlab.env",
#        "repo_dir":"/shared_work/loom/loom-remote-worker",
#        "time_limit":"7-00:00:00","requested_cpus":12,"requested_memory_mib":58000,
#        "requested_concurrency":6,"max_jobs":15,"pending_job_cap":4,
#        "min_queued_trials":5,"stale_after_seconds":300,"command_timeout_seconds":20.0}]'
