schema_version = 1
service_user = "loom-rollout"
operator_group = "loom-staging-operators"
remote_url = "https://github.com/qianyi-sun/loom.git"
target_ref = "refs/heads/dev"
runner_repo = "/opt/loom-staging-runner/candidates/__SOURCE_SHA__/repo"
state_root = "/var/lib/loom-staging-rollout"
runtime_root = "/run/loom-staging-rollout"
rollout_root = "/data/loom-staging"
kubeconfig_path = "/var/lib/loom-staging-rollout/kubeconfig"
cluster_config_path = "/opt/loom-staging-runner/candidates/__SOURCE_SHA__/repo/deploy/environments/staging.multinode.cluster.toml"
admin_token_source = "file:/shared_work/qianyi/loom-worker-capacity/staging-admin-token"
worker_token_source = "file:/shared_work/qianyi/loom-worker-capacity/staging-worker-token"
service_token_source = "file:/shared_work/qianyi/loom-worker-capacity/staging-service-token"
expect_admin_token_fingerprint = "__ADMIN_TOKEN_FINGERPRINT__"
cluster_name = "loom-staging"
namespace = "loom-staging"
environment = "staging"
cp_url = "http://127.0.0.1:18081"
smoke_on_behalf_username = "devansh"
smoke_on_behalf_team_id = "__SMOKE_ON_BEHALF_TEAM_ID__"
scope = "current-gb10"
# Small so the fleet observe does not overwhelm the single GB10 SSH bastion
# (trt-gb10-1 via the public IP; internal hosts ProxyJump through it, and it
# also runs a worker + node-agent). See #1011.
gb10_prep_concurrency = 2
backup_max_objects = 1000000
backup_max_entries = 16000000
