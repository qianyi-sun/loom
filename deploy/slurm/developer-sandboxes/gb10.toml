trt-gb10-13 = "gx10-fc5d"
trt-gb10-14 = "gx10-0a49"
trt-gb10-15 = "gx10-0152"

[capacity]
slot_budget = 120
pending_slot_budget = 24
cpus_per_slot = 2
memory_mib_per_slot = 11500
gpu_tres_per_slot = 0.125
job_pids_max = 65536

[slurm]
proctrack_type = "proctrack/cgroup"
task_plugin = "task/cgroup,task/affinity"
jobacct_gather_type = "jobacct_gather/cgroup"
accounting_storage_enforce = "associations,limits,qos,safe"
priority_type = "priority/multifactor"
priority_weight_fairshare = 10000
prolog_flags = "Contain"

[cgroup]
plugin = "autodetect"
constrain_cores = true
constrain_ram_space = true
constrain_swap_space = true
constrain_devices = true
enable_controllers = true

[docker]
cgroup_driver = "systemd"

[accounting]
parent_account = "loom-dev"
child_accounts = [
  "loom-dev-qianyi",
  "loom-dev-hongjian",
  "loom-dev-devansh",
]
users = [
  "loom-sandbox-qianyi",
  "loom-sandbox-hongjian",
  "loom-sandbox-devansh",
]
fairshare = 1
qos = "loom-dev"
qos_priority = 0
qos_max_wall = "02:00:00"
qos_max_jobs_per_user = 15
qos_max_submit_jobs_per_user = 30
parent_group_tres = ["cpu=240", "mem=1380G", "gres/gpu=15"]
