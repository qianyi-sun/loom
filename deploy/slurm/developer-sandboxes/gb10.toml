[host_aliases]
trt-gb10-1 = "gx10-01c7"
trt-gb10-2 = "gx10-0fca"
trt-gb10-3 = "gx10-0f0d"
trt-gb10-4 = "gx10-0d93"
trt-gb10-5 = "gx10-1036"
trt-gb10-6 = "gx10-1000"
trt-gb10-7 = "gx10-0faf"
trt-gb10-8 = "gx10-db22"
trt-gb10-9 = "gx10-16f6"
