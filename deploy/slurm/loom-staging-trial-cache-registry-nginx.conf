user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    map $request_method $registry_auth_file {
        default /run/loom-registry-auth/builder.htpasswd;
        DELETE /run/loom-registry-auth/gc.htpasswd;
    }

    upstream registry_backend {
        server registry:5000;
        keepalive 16;
    }

    server {
        listen 5000 ssl;
        server_name _;

        ssl_certificate /run/loom-registry-tls/server.crt;
        ssl_certificate_key /run/loom-registry-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 0;
        chunked_transfer_encoding on;

        location /v2/ {
            limit_except GET HEAD {
                auth_basic "Loom staging registry mutation";
                auth_basic_user_file $registry_auth_file;
            }

            proxy_pass http://registry_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 900;
            proxy_send_timeout 900;
            proxy_request_buffering off;
        }

        location / {
            return 404;
        }
    }
}
