# Development DB-backed environment desired state.
#
# Both external Slurm policies and supervisors are disabled. Applying this
# profile writes desired state but allocates no GB10 or OLDLAB capacity.
#
# Apply after image rollout with:
#   loom admin environment-state apply \
#     --environment development \
#     --file deploy/environment-state/development.toml \
#     --var IMAGE_TAG="$IMAGE_TAG" \
#     --var ENV_CONFIG_VERSION="$ENV_CONFIG_VERSION"

environment = "development"

# --- GB10 pool (ARM, Slurm-only nodes, shared across envs) -------------------
# This row is fail-closed: enabled=false with exclusive=false. Applying it does
# not activate GB10, and Loom does not fall back to whole-node exclusivity.
# min_slots=0 provides no warm floor or development-priority guarantee.
[[worker_pool_autoscaler_policies]]
pool_name = "gb10"
actuator = "slurm"
enabled = false
disabled_reason = "development GB10 allocation is disabled; no authorized external allocation and containment boundary is configured"
min_slots = 0
max_slots = 5
scale_up_threshold_slots = 1
scale_down_idle_seconds = 600
scale_up_cooldown_seconds = 60
scale_down_cooldown_seconds = 300
drain_timeout_seconds = 600
force = false

[worker_pool_autoscaler_policies.actuator_config]
backend = "docker"
cpu_arch = "arm64"
slurm_cluster_name = "trt-gb10"
slurm_controller_host = "gx10-01c7"
partition = "gb10"
allowed_nodes = [
  "trt-gb10-1",
  "trt-gb10-2",
  "trt-gb10-3",
  "trt-gb10-4",
  "trt-gb10-5",
  "trt-gb10-6",
  "trt-gb10-8",
  "trt-gb10-9",
  "trt-gb10-10",
  "trt-gb10-11",
  "trt-gb10-12",
  "trt-gb10-13",
  "trt-gb10-14",
  "trt-gb10-15",
]
# Candidate and environment-file paths use the service-owned publisher root.
env_file = "/shared_work/loom/candidates/development/env/development-gb10-worker-${IMAGE_TAG}.env"
repo_dir = "/shared_work/loom/candidates/development/${IMAGE_TAG}"
requested_cpus = 10
requested_memory_mib = 57500
requested_concurrency = 5
# Per-trial container caps: concurrency times each cap equals the Slurm
# allocation above, so trials cannot exceed the lease. job_pids_max is
# the job cgroup PID ceiling (>= container_pids * concurrency).
container_cpus = 2.0
container_memory_mib = 11500
container_pids = 512
job_pids_max = 2560
max_jobs = 1
pending_job_cap = 1
# The physical gb10 partition advertises MaxTime=1-00:00:00.
time_limit = "1-00:00:00"
# Non-exclusive is the only supported Loom Slurm contract; this policy is
# disabled in the checked-in development state.
exclusive = false
external_runner = true

# --- OLDLAB pool (x86_64, DOUBLE-DUTY nodes: k3s + MinIO + slurmd) ------------
# This policy is disabled. OLDLAB nodes also run k3s and storage services, so
# any worker allocation is non-exclusive and must preserve their headroom. The
# resource values below are inert while enabled=false.
[[worker_pool_autoscaler_policies]]
pool_name = "oldlab"
actuator = "slurm"
enabled = false
disabled_reason = "development OLDLAB allocation is disabled; double-duty node containment and headroom are not authorized in this profile"
min_slots = 0
max_slots = 4
scale_up_threshold_slots = 1
scale_down_idle_seconds = 600
scale_up_cooldown_seconds = 60
scale_down_cooldown_seconds = 300
drain_timeout_seconds = 600
force = false

[worker_pool_autoscaler_policies.actuator_config]
backend = "docker"
cpu_arch = "x86_64"
slurm_cluster_name = "trt-oldlab"
slurm_controller_host = "TRT-EAI-OLDLAB-1"
# OLDLAB jobs target the default partition and select nodes by name.
partition = ""
allowed_nodes = [
  "TRT-EAI-OLDLAB-1",
  "trt-EAI-OLDLAB-2",
  "trt-eai-oldlab-3",
  "trt-eai-oldlab-4",
  "trt-eai-oldlab-5",
]
env_file = "/shared_work/loom/candidates/development/env/development-oldlab-worker-${IMAGE_TAG}.env"
repo_dir = "/shared_work/loom/candidates/development/${IMAGE_TAG}"
# These inert limits preserve headroom for k3s and MinIO if inspected.
requested_cpus = 4
requested_memory_mib = 16000
requested_concurrency = 2
# Per-trial container caps: concurrency times each cap equals the Slurm
# allocation above, so trials cannot exceed the lease. job_pids_max is
# the job cgroup PID ceiling (>= container_pids * concurrency).
container_cpus = 2.0
container_memory_mib = 8000
container_pids = 512
job_pids_max = 1024
max_jobs = 2
pending_job_cap = 1
time_limit = "2-00:00:00"
# Double-duty: cannot own the whole node — MinIO/k8s share it.
exclusive = false
external_runner = true

# --- External autoscaler supervisors (systemd --user timers) -----------------
# Each entry renders a `systemctl --user` service+timer that periodically runs
# scripts/ops/worker_pool_autoscaler_external_once.py for one pool. The
# --db-local-port values follow the reserved per-env/per-pool scheme so no two
# supervisors on the same host collide:
#   oldlab  dev/staging/prod = 15447 / 15448 / 15449
#   gb10    dev/staging/prod = 15450 / 15451 / 15452
# Both development supervisors are enabled=false and active=false. Applying the
# profile writes unit definitions but does not enable or start either timer.
[[external_slurm_autoscaler_supervisors]]
name = "oldlab-development"
pool_name = "oldlab"
execution_host = "TRT-EAI-OLDLAB-1"
service_name = "loom-autoscaler-oldlab-dev.service"
timer_name = "loom-autoscaler-oldlab-dev.timer"
working_directory = "/opt/loom-development-runner/repo"
python_path = "/opt/loom-development-runner/venv/bin/python"
script_path = "scripts/ops/worker_pool_autoscaler_external_once.py"
args = ["--environment", "development", "--pool-name", "oldlab", "--expected-slurm-cluster-name", "trt-oldlab", "--expected-slurm-controller-host", "TRT-EAI-OLDLAB-1", "--namespace", "loom-dev", "--kubeconfig", "/etc/loom/kubeconfig/development.yaml", "--db-local-port", "15447", "--freshness-sec", "120", "--global-execution-witness-json", "/etc/loom/credentials/global-execution/oldlab-witness.json", "--manager-public-key", "/etc/loom/credentials/global-execution/manager-ed25519.pub", "--expected-manager-public-key-sha256-file", "/etc/loom/credentials/global-execution/manager-ed25519.pub.sha256"]
enabled = false
active = false

[[external_slurm_autoscaler_supervisors]]
name = "gb10-development"
pool_name = "gb10"
execution_host = "gx10-01c7"
service_name = "loom-autoscaler-gb10-dev.service"
timer_name = "loom-autoscaler-gb10-dev.timer"
working_directory = "/opt/loom-development-runner/repo"
python_path = "/opt/loom-development-runner/venv/bin/python"
script_path = "scripts/ops/worker_pool_autoscaler_external_once.py"
args = ["--environment", "development", "--pool-name", "gb10", "--expected-slurm-cluster-name", "trt-gb10", "--expected-slurm-controller-host", "gx10-01c7", "--namespace", "loom-dev", "--kubeconfig", "/etc/loom/kubeconfig/development.yaml", "--db-local-port", "15450", "--freshness-sec", "120", "--global-execution-witness-json", "/etc/loom/credentials/global-execution/gb10-witness.json", "--manager-public-key", "/etc/loom/credentials/global-execution/manager-ed25519.pub", "--expected-manager-public-key-sha256-file", "/etc/loom/credentials/global-execution/manager-ed25519.pub.sha256"]
enabled = false
active = false
