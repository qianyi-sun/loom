# Staging DB-backed environment desired state.
#
# Apply after image rollout with:
#   loom admin environment-state apply \
#     --environment staging \
#     --file deploy/environment-state/staging.toml \
#     --var IMAGE_TAG="$IMAGE_TAG" \
#     --var ENV_CONFIG_VERSION="$ENV_CONFIG_VERSION"

environment = "staging"

[[worker_pool_autoscaler_policies]]
# #822: active capacity is 14 hosts / 140 slots; node 7 remains stopped below.
pool_name = "gb10"
actuator = "slurm"
enabled = true
min_slots = 0
max_slots = 140
scale_up_threshold_slots = 1
scale_down_idle_seconds = 600
scale_up_cooldown_seconds = 60
scale_down_cooldown_seconds = 300
drain_timeout_seconds = 600
force = false

[worker_pool_autoscaler_policies.actuator_config]
backend = "docker"
cpu_arch = "arm64"
partition = "gb10"
allowed_nodes = [
  "trt-gb10-1",
  "trt-gb10-2",
  "trt-gb10-3",
  "trt-gb10-4",
  "trt-gb10-5",
  "trt-gb10-6",
  "trt-gb10-8",
  "trt-gb10-9",
  "trt-gb10-10",
  "trt-gb10-11",
  "trt-gb10-12",
  "trt-gb10-13",
  "trt-gb10-14",
  "trt-gb10-15",
]
env_file = "/var/lib/loom-staging-rollout/generated/staging-gb10-worker-${IMAGE_TAG}.env"
repo_dir = "/shared_work2/qianyi/.loom-staging-rollout/worker-repos/loom-remote-worker-${IMAGE_TAG}"
requested_cpus = 20
requested_memory_mib = 115000
requested_concurrency = 10
max_jobs = 14
pending_job_cap = 2
time_limit = "2-00:00:00"
exclusive = true
external_runner = true

# GATED: enabled=false until #896 lands. OLDLAB nodes (trt-eai-oldlab-1..5) also
# run the k3s control plane + MinIO/Longhorn, so workers must be non-exclusive
# (cannot claim a whole node) and capped with headroom for k8s/MinIO. The
# resource values below are PROVISIONAL placeholders reduced from the historical
# single-tenant profile; #896 must measure real double-duty headroom and set the
# final values before flipping enabled=true.
[[worker_pool_autoscaler_policies]]
pool_name = "oldlab"
actuator = "slurm"
enabled = false
disabled_reason = "gated on #896 container isolation + double-duty headroom measurement; exclusive=true is not viable on nodes shared with k3s/MinIO, so the disable IS the safety gate"
min_slots = 0
max_slots = 4
scale_up_threshold_slots = 1
scale_down_idle_seconds = 600
scale_up_cooldown_seconds = 60
scale_down_cooldown_seconds = 300
drain_timeout_seconds = 600
force = false

[worker_pool_autoscaler_policies.actuator_config]
backend = "docker"
cpu_arch = "x86_64"
# OLDLAB jobs target the default partition (addressed by --nodelist), matching
# the validated 2026-06-24 dry-run which passed no --partition.
partition = ""
allowed_nodes = [
  "trt-eai-oldlab-1",
  "trt-eai-oldlab-2",
  "trt-eai-oldlab-3",
  "trt-eai-oldlab-4",
  "trt-eai-oldlab-5",
]
env_file = "/var/lib/loom-staging-rollout/generated/staging-oldlab-worker-${IMAGE_TAG}.env"
repo_dir = "/shared_work2/qianyi/.loom-staging-rollout/worker-repos/loom-remote-worker-${IMAGE_TAG}"
# PROVISIONAL (pending #896 headroom measurement): leave CPU/mem for k3s+MinIO.
requested_cpus = 4
requested_memory_mib = 16000
requested_concurrency = 2
max_jobs = 2
pending_job_cap = 1
time_limit = "2-00:00:00"
# Double-duty: cannot own the whole node — MinIO/k8s share it.
exclusive = false
external_runner = true

[[gb10_worker_pool_desired_states]]
pool_name = "gb10"
image_tag = "${IMAGE_TAG}"
max_concurrent = 10
env_config_version = "${ENV_CONFIG_VERSION}"
source_git_commit = "${GIT_SHA}"
target_slots = 140

[gb10_worker_pool_desired_states.host_intents]
trt-gb10-1 = "active"
trt-gb10-2 = "active"
trt-gb10-3 = "active"
trt-gb10-4 = "active"
trt-gb10-5 = "active"
trt-gb10-6 = "active"
trt-gb10-7 = "stopped"
trt-gb10-8 = "active"
trt-gb10-9 = "active"
trt-gb10-10 = "active"
trt-gb10-11 = "active"
trt-gb10-12 = "active"
trt-gb10-13 = "active"
trt-gb10-14 = "active"
trt-gb10-15 = "active"

[gb10_worker_pool_desired_states.rollout_policy]
mode = "all"

[gb10_worker_pool_desired_states.env]
LOOM_WORKER_IDLE_EXIT_AFTER_SECONDS = "7200"

[catalog_provisioning]
required = true
command = "loom datasets register skilllearnbench --hf-org PRHW --revision \"$PUBLISHED_SHA\" --mirror-to-object-store --bucket loom-benchmarks --registered-by catalog-provision && loom datasets publish-local deploy/catalog/gb10-smoke --bucket loom-benchmarks --imported-by catalog-provision && loom datasets audit --all --verify-bundles"
env_file = "/shared_work/qianyi/loom-worker-capacity/staging-catalog-provisioning.env"
required_env = [
  "PUBLISHED_SHA",
  "HF_TOKEN",
  "LOOM_SVC_DB_URL",
  "LOOM_SVC_MINIO_ENDPOINT",
  "LOOM_SVC_MINIO_ACCESS_KEY",
  "LOOM_SVC_MINIO_SECRET_KEY",
]

[catalog_provisioning.env]
PUBLISHED_SHA = "79087002d62bb22169a704bc941c8d614082d880"

[catalog_provisioning.kubernetes_port_forward]
enabled = true
postgres_service = "service/loom-postgres"
postgres_remote_port = 5432
minio_service = "service/loom-minio"
minio_remote_port = 9000

[rate_card_sync.yibuapi]
enabled = true
group = "default"

[[hosted_provider_pricing_defaults]]
name = "mz_tn_canada_qianyi"
pricing_source = "rate-card"
rate_card_provider = "yibuapi"
required = true

[external_slurm_runner_prerequisites]
pools = ["gb10"]
expected_repo_ref = "${IMAGE_TAG}"
require_clean_repo = true
require_worker_token_parity = true
materialize = true
env_template_glob = "/var/lib/loom-staging-rollout/generated/staging-gb10-worker-staging-*.env"

# --- External autoscaler supervisor (systemd --user timer) -------------------
# Renders a `systemctl --user` service+timer that periodically runs
# scripts/ops/worker_pool_autoscaler_external_once.py for the GB10 pool. The
# --db-local-port values follow the reserved per-env/per-pool scheme so no two
# supervisors on the same host collide:
#   oldlab  dev/staging/prod = 15447 / 15448 / 15449
#   gb10    dev/staging/prod = 15450 / 15451 / 15452
# Staging is a live environment, so this ships enabled=true + active=true:
# applying the profile installs, enables (for boot) and starts the timer.
[[external_slurm_autoscaler_supervisors]]
name = "gb10-staging"
pool_name = "gb10"
service_name = "loom-autoscaler-gb10-staging.service"
timer_name = "loom-autoscaler-gb10-staging.timer"
working_directory = "/opt/loom-staging-runner/candidates/${GIT_SHA}/repo"
python_path = "/opt/loom-staging-runner/candidates/${GIT_SHA}/venv/bin/python"
script_path = "/opt/loom-staging-runner/candidates/${GIT_SHA}/repo/scripts/ops/worker_pool_autoscaler_external_once.py"
args = [
  "--environment", "staging",
  "--pool-name", "gb10",
  "--namespace", "loom-staging",
  "--kubeconfig", "/var/lib/loom-staging-rollout/kubeconfig",
  "--db-local-host", "127.0.0.1",
  "--db-local-port", "15451",
  "--db-service", "service/loom-postgres",
  "--db-remote-port", "5432",
  "--db-port-forward-ready-timeout-sec", "10",
  "--db-port-forward-stop-timeout-sec", "5",
  "--db-connect-timeout-sec", "10",
  "--freshness-sec", "120",
]
enabled = true
active = true

# OLDLAB staging autoscaler supervisor — GATED enabled=false/active=false until
# #896 (container isolation) + #827 (external-Slurm acceptance), mirroring the
# oldlab pool's own disable above. Applying writes the unit files but does NOT
# enable or start the timer. Port 15448 per the reserved oldlab-staging slot.
[[external_slurm_autoscaler_supervisors]]
name = "oldlab-staging"
pool_name = "oldlab"
service_name = "loom-autoscaler-oldlab-staging.service"
timer_name = "loom-autoscaler-oldlab-staging.timer"
working_directory = "/opt/loom-staging-runner/candidates/${GIT_SHA}/repo"
python_path = "/opt/loom-staging-runner/candidates/${GIT_SHA}/venv/bin/python"
script_path = "/opt/loom-staging-runner/candidates/${GIT_SHA}/repo/scripts/ops/worker_pool_autoscaler_external_once.py"
args = [
  "--environment", "staging",
  "--pool-name", "oldlab",
  "--namespace", "loom-staging",
  "--kubeconfig", "/var/lib/loom-staging-rollout/kubeconfig",
  "--db-local-host", "127.0.0.1",
  "--db-local-port", "15448",
  "--db-service", "service/loom-postgres",
  "--db-remote-port", "5432",
  "--db-port-forward-ready-timeout-sec", "10",
  "--db-port-forward-stop-timeout-sec", "5",
  "--db-connect-timeout-sec", "10",
  "--freshness-sec", "120",
]
enabled = false
active = false
