# Staging DB-backed environment desired state.
#
# Apply after image rollout with:
#   loom admin environment-state apply \
#     --environment staging \
#     --file deploy/environment-state/staging.toml \
#     --var IMAGE_TAG="$IMAGE_TAG" \
#     --var ENV_CONFIG_VERSION="$ENV_CONFIG_VERSION"

environment = "staging"

[[worker_pool_autoscaler_policies]]
# #827: external Slurm is fail-closed until the submit-domain service identity
# and exact-candidate allocation attestation cover every allowed GB10 node.
pool_name = "gb10"
actuator = "slurm"
enabled = false
disabled_reason = "#827: service identity and exact-candidate allocation attestation are not yet proven for every allowed GB10 node"
min_slots = 0
max_slots = 150
scale_up_threshold_slots = 1
scale_down_idle_seconds = 600
scale_up_cooldown_seconds = 60
scale_down_cooldown_seconds = 300
drain_timeout_seconds = 600
force = false

[worker_pool_autoscaler_policies.actuator_config]
backend = "docker"
cpu_arch = "arm64"
slurm_cluster_name = "trt-gb10"
slurm_controller_host = "gx10-01c7"
partition = "gb10"
allowed_nodes = [
  "trt-gb10-1",
  "trt-gb10-2",
  "trt-gb10-3",
  "trt-gb10-4",
  "trt-gb10-5",
  "trt-gb10-6",
  "trt-gb10-7",
  "trt-gb10-8",
  "trt-gb10-9",
  "trt-gb10-10",
  "trt-gb10-11",
  "trt-gb10-12",
  "trt-gb10-13",
  "trt-gb10-14",
  "trt-gb10-15",
]
env_file = "/var/lib/loom-staging-rollout/generated/staging-gb10-worker-${IMAGE_TAG}.env"
repo_dir = "/shared_work2/loom-staging-rollout/worker-repos/loom-remote-worker-${IMAGE_TAG}"
requested_cpus = 20
requested_memory_mib = 115000
requested_concurrency = 10
# Per-trial container caps (#896): concurrency * cap == the Slurm
# allocation above, so trials cannot exceed the lease. job_pids_max is
# the job cgroup PID ceiling (>= container_pids * concurrency).
container_cpus = 2.0
container_memory_mib = 11500
container_pids = 512
job_pids_max = 5120
max_jobs = 15
pending_job_cap = 2
time_limit = "2-00:00:00"
# Non-exclusive is the only supported Loom Slurm contract. The disabled policy
# is the safety gate until #827 and #896 acceptance is complete.
exclusive = false
external_runner = true

# ACTIVE, bounded OLDLAB staging lane. Four fixed workers provide 24 slots on
# OLDLAB-1..4; the external Slurm controller may add exactly one isolated slot
# on OLDLAB-5. The worker payload stays pinned to the service-owned candidate
# accepted for #906 so a later control-plane release cannot silently retarget
# this lane to an unpublished checkout. OLDLAB uses /shared_work because that is
# the filesystem mounted by every OLDLAB node; /shared_work2 is the GB10 mount.
[[worker_pool_autoscaler_policies]]
pool_name = "oldlab"
actuator = "slurm"
enabled = true
min_slots = 24
max_slots = 25
scale_up_threshold_slots = 1
scale_down_idle_seconds = 300
scale_up_cooldown_seconds = 0
scale_down_cooldown_seconds = 0
drain_timeout_seconds = 300
force = false

[worker_pool_autoscaler_policies.actuator_config]
backend = "docker"
cpu_arch = "x86_64"
slurm_cluster_name = "trt-oldlab"
slurm_controller_host = "TRT-EAI-OLDLAB-1"
# The cluster's OLDLAB nodes are in the `all` partition. Restrict the initial
# activation to OLDLAB-5 so it cannot overlap the four fixed workers.
partition = "all"
allowed_nodes = [
  "trt-eai-oldlab-5",
]
env_file = "/shared_work/loom/staging-rollout/worker-envs/staging-oldlab-worker-staging-4742696.env"
repo_dir = "/shared_work/loom/staging-rollout/worker-repos/loom-remote-worker-staging-4742696"
candidate_sha = "47426964e55b436bc9edc8ef7d66aec6db7ed8f0"
job_output_dir = "/shared_work/loom/staging-rollout/job-output"
requested_cpus = 2
requested_memory_mib = 8192
requested_concurrency = 1
container_cpus = 2.0
container_memory_mib = 4096
container_pids = 512
job_pids_max = 4096
max_jobs = 1
pending_job_cap = 1
time_limit = "00:30:00"
# Resource-aware admission preserves headroom for k3s, MinIO, Longhorn, and the
# isolated CI runner pool before it asks Slurm for the single dynamic lease.
resource_aware = true
cpu_per_slot = 2
memory_mib_per_slot = 8192
reserved_cpus = 4
reserved_memory_mib = 20480
max_concurrency_per_node = 8
max_cpu_load_ratio = 1.0
# Double-duty nodes cannot be claimed exclusively.
exclusive = false
external_runner = true

[[gb10_worker_pool_desired_states]]
pool_name = "gb10"
image_tag = "${IMAGE_TAG}"
max_concurrent = 10
env_config_version = "${ENV_CONFIG_VERSION}"
source_git_commit = "${GIT_SHA}"
target_slots = 150

[gb10_worker_pool_desired_states.host_intents]
trt-gb10-1 = "active"
trt-gb10-2 = "active"
trt-gb10-3 = "active"
trt-gb10-4 = "active"
trt-gb10-5 = "active"
trt-gb10-6 = "active"
trt-gb10-7 = "active"
trt-gb10-8 = "active"
trt-gb10-9 = "active"
trt-gb10-10 = "active"
trt-gb10-11 = "active"
trt-gb10-12 = "active"
trt-gb10-13 = "active"
trt-gb10-14 = "active"
trt-gb10-15 = "active"

[gb10_worker_pool_desired_states.rollout_policy]
mode = "all"

[gb10_worker_pool_desired_states.env]
LOOM_WORKER_IDLE_EXIT_AFTER_SECONDS = "7200"

[catalog_provisioning]
required = true
command = "loom datasets register skilllearnbench --hf-org PRHW --revision \"$PUBLISHED_SHA\" --mirror-to-object-store --bucket loom-benchmarks --registered-by catalog-provision && loom datasets publish-local deploy/catalog/gb10-smoke --bucket loom-benchmarks --imported-by catalog-provision && loom datasets audit --all --verify-bundles"
env_file = "/shared_work/qianyi/loom-worker-capacity/staging-catalog-provisioning.env"
required_env = [
  "PUBLISHED_SHA",
  "HF_TOKEN",
  "LOOM_SVC_DB_URL",
  "LOOM_SVC_MINIO_ENDPOINT",
  "LOOM_SVC_MINIO_ACCESS_KEY",
  "LOOM_SVC_MINIO_SECRET_KEY",
]

[catalog_provisioning.env]
PUBLISHED_SHA = "79087002d62bb22169a704bc941c8d614082d880"

[catalog_provisioning.kubernetes_port_forward]
enabled = true
postgres_service = "service/loom-postgres"
postgres_remote_port = 5432
minio_service = "service/loom-minio"
minio_remote_port = 9000

[rate_card_sync.yibuapi]
enabled = true
group = "default"

[[hosted_provider_pricing_defaults]]
name = "mz_tn_canada_qianyi"
pricing_source = "rate-card"
rate_card_provider = "yibuapi"
required = true

[external_slurm_runner_prerequisites]
pools = ["gb10"]
expected_repo_ref = "${IMAGE_TAG}"
require_clean_repo = true
require_worker_token_parity = true
# #827: do not materialize candidate env/repo inputs for a disabled actuator.
materialize = false
env_template_glob = "/var/lib/loom-staging-rollout/generated/staging-gb10-worker-staging-*.env"

# --- External autoscaler supervisor (systemd --user timer) -------------------
# Renders a `systemctl --user` service+timer that periodically runs
# scripts/ops/worker_pool_autoscaler_external_once.py for the GB10 pool. The
# --db-local-port values follow the reserved per-env/per-pool scheme so no two
# supervisors on the same host collide:
#   oldlab  dev/staging/prod = 15447 / 15448 / 15449
#   gb10    dev/staging/prod = 15450 / 15451 / 15452
# #827: keep the GB10 timer stopped and disabled until the same service identity
# and allocation attestation required by the policy gate are candidate-bound.
[[external_slurm_autoscaler_supervisors]]
name = "gb10-staging"
pool_name = "gb10"
service_name = "loom-autoscaler-gb10-staging.service"
timer_name = "loom-autoscaler-gb10-staging.timer"
working_directory = "/opt/loom-staging-runner/candidates/${GIT_SHA}/repo"
python_path = "/opt/loom-staging-runner/candidates/${GIT_SHA}/venv/bin/python"
script_path = "/opt/loom-staging-runner/candidates/${GIT_SHA}/repo/scripts/ops/worker_pool_autoscaler_external_once.py"
args = [
  "--environment", "staging",
  "--pool-name", "gb10",
  "--expected-slurm-cluster-name", "trt-gb10",
  "--expected-slurm-controller-host", "gx10-01c7",
  "--namespace", "loom-staging",
  "--kubeconfig", "/var/lib/loom-staging-rollout/kubeconfig",
  "--db-local-host", "127.0.0.1",
  "--db-local-port", "15451",
  "--db-service", "service/loom-postgres-rw",
  "--db-remote-port", "5432",
  "--db-port-forward-ready-timeout-sec", "10",
  "--db-port-forward-stop-timeout-sec", "5",
  "--db-connect-timeout-sec", "10",
  "--freshness-sec", "120",
]
enabled = false
active = false

# OLDLAB staging autoscaler supervisor. The shared working directory exists on
# every Slurm execution node, and the `-rw` service supports kubectl
# port-forward (the stable ExternalName service does not).
[[external_slurm_autoscaler_supervisors]]
name = "oldlab-staging"
pool_name = "oldlab"
service_name = "loom-autoscaler-oldlab-staging.service"
timer_name = "loom-autoscaler-oldlab-staging.timer"
working_directory = "/opt/loom-staging-runner/candidates/${GIT_SHA}/repo"
python_path = "/opt/loom-staging-runner/candidates/${GIT_SHA}/venv/bin/python"
script_path = "/opt/loom-staging-runner/candidates/${GIT_SHA}/repo/scripts/ops/worker_pool_autoscaler_external_once.py"
args = [
  "--environment", "staging",
  "--pool-name", "oldlab",
  "--expected-slurm-cluster-name", "trt-oldlab",
  "--expected-slurm-controller-host", "TRT-EAI-OLDLAB-1",
  "--namespace", "loom-staging",
  "--kubeconfig", "/var/lib/loom-staging-rollout/kubeconfig",
  "--db-local-host", "127.0.0.1",
  "--db-local-port", "15448",
  "--db-service", "service/loom-postgres-rw",
  "--db-remote-port", "5432",
  "--db-port-forward-ready-timeout-sec", "10",
  "--db-port-forward-stop-timeout-sec", "5",
  "--db-connect-timeout-sec", "10",
  "--freshness-sec", "120",
]
enabled = true
active = true
