# Staging DB-backed environment desired state.
#
# Apply after image rollout with:
#   loom admin environment-state apply \
#     --environment staging \
#     --file deploy/environment-state/staging.toml \
#     --var IMAGE_TAG="$IMAGE_TAG" \
#     --var ENV_CONFIG_VERSION="$ENV_CONFIG_VERSION"

environment = "staging"

# The protected manager now exports authenticated execution witnesses. Core
# OLDLAB and GB10 supervisors consume those witnesses. Both proven exclusive
# task-image builders are enabled as transitional native-architecture capacity
# while the allocation-scoped rootless backend remains fail-closed.
[[worker_pool_autoscaler_policies]]
# GB10 is managed only by the controller-local Slurm supervisor. Per-node
# worker agents below remain stopped so there is one capacity authority. Node
# 2 is reserved for the separate exclusive task-image-builder pool, so normal
# workers use node 1 and nodes 3-15 while full-host readiness still covers 1-15.
pool_name = "gb10"
actuator = "slurm"
enabled = true
min_slots = 0
max_slots = 140
scale_up_threshold_slots = 1
scale_down_idle_seconds = 600
scale_up_cooldown_seconds = 60
scale_down_cooldown_seconds = 300
drain_timeout_seconds = 600
force = false

[worker_pool_autoscaler_policies.actuator_config]
backend = "docker"
cpu_arch = "arm64"
slurm_cluster_name = "trt-gb10"
slurm_controller_host = "gx10-01c7"
partition = "loom-staging"
allowed_nodes = [
  "trt-gb10-1",
  "trt-gb10-3",
  "trt-gb10-4",
  "trt-gb10-5",
  "trt-gb10-6",
  "trt-gb10-7",
  "trt-gb10-8",
  "trt-gb10-9",
  "trt-gb10-10",
  "trt-gb10-11",
  "trt-gb10-12",
  "trt-gb10-13",
  "trt-gb10-14",
  "trt-gb10-15",
]
env_file = "/shared_work2/loom-staging-rollout/worker-envs/staging-gb10-worker-${IMAGE_TAG}.env"
repo_dir = "/shared_work2/loom-staging-rollout/worker-repos/loom-remote-worker-${IMAGE_TAG}"
candidate_sha = "${GIT_SHA}"
job_output_dir = "/shared_work2/loom-staging-rollout/job-output"
slurm_account = "loom-staging"
qos_normal = "loom-staging"
requested_cpus = 20
requested_memory_mib = 115000
requested_concurrency = 10
# Per-trial container caps: concurrency times each cap equals the Slurm
# allocation above, so trials cannot exceed the lease. job_pids_max is
# the job cgroup PID ceiling (>= container_pids * concurrency).
container_cpus = 2.0
container_memory_mib = 11500
container_pids = 512
job_pids_max = 5120
max_jobs = 14
pending_job_cap = 2
# The dedicated GB10 staging partition advertises MaxTime=1-00:00:00. Slurm rejects
# longer requests before allocation, so keep every autoscaled worker lease at
# that exact ceiling.
time_limit = "1-00:00:00"
# Resource-aware admission keeps Loom within each node's currently free Slurm
# CPU/memory envelope while sharing the institution's GB10 nodes. Slurm exposes
# 19 effective CPUs on each 20-CPU GB10 node, so keep that one-CPU difference
# out of Loom worker allocations.
resource_aware = true
cpu_per_slot = 2
memory_mib_per_slot = 11500
reserved_cpus = 1
reserved_memory_mib = 0
max_concurrency_per_node = 10
max_cpu_load_ratio = 1.0
exclusive = false
external_runner = true

# OLDLAB also scales from zero. Nodes 1 and 2 are excluded because they carry
# year-long third-party Slurm reservations; nodes 3-5 are the safely schedulable
# dynamic inventory. OLDLAB uses /shared_work, which is mounted on those nodes.
[[worker_pool_autoscaler_policies]]
pool_name = "oldlab"
actuator = "slurm"
enabled = true
min_slots = 0
max_slots = 18
scale_up_threshold_slots = 1
scale_down_idle_seconds = 300
scale_up_cooldown_seconds = 0
scale_down_cooldown_seconds = 0
drain_timeout_seconds = 300
force = false

[worker_pool_autoscaler_policies.actuator_config]
backend = "docker"
cpu_arch = "x86_64"
slurm_cluster_name = "trt-oldlab"
slurm_controller_host = "TRT-EAI-OLDLAB-1"
partition = "loom-staging"
allowed_nodes = [
  "trt-eai-oldlab-3",
  "trt-eai-oldlab-4",
  "trt-eai-oldlab-5",
]
env_file = "/shared_work/loom/staging-rollout/worker-envs/staging-oldlab-worker-${IMAGE_TAG}.env"
repo_dir = "/shared_work/loom/staging-rollout/worker-repos/loom-remote-worker-${IMAGE_TAG}"
candidate_sha = "${GIT_SHA}"
job_output_dir = "/shared_work/loom/staging-rollout/job-output"
requested_cpus = 12
requested_memory_mib = 49152
requested_concurrency = 6
container_cpus = 2.0
container_memory_mib = 4096
container_pids = 512
job_pids_max = 4096
max_jobs = 3
pending_job_cap = 1
time_limit = "2-00:00:00"
# Resource-aware admission preserves headroom for k3s, MinIO, Longhorn, and the
# isolated CI runner pool before it asks Slurm for up to three dynamic leases.
resource_aware = true
cpu_per_slot = 2
memory_mib_per_slot = 8192
reserved_cpus = 4
reserved_memory_mib = 20480
max_concurrency_per_node = 6
max_cpu_load_ratio = 1.0
# Slurm FreeMem excludes reclaimable page cache on these double-duty hosts.
# Probe Linux MemAvailable through a tiny immediate Slurm allocation while
# sizing inactive, otherwise-safe nodes; probe failure remains closed.
probe_mem_available = true
# Double-duty nodes cannot be claimed exclusively.
exclusive = false
external_runner = true

# Task-image builders are a separate capacity class. Each architecture stays
# inert until its dedicated token, registry credentials/retention, builder QoS,
# and exclusive-node authority are provisioned and its blockers removed.
[[task_image_builder_policies]]
pool_name = "task-image-builder-gb10"
enabled = true
slurm_cluster_id = "gb10"
cpu_arch = "arm64"
allowed_nodes = [
  "trt-gb10-2",
]
env_file = "/shared_work2/loom-staging-rollout/worker-envs/staging-task-image-builder-gb10-${IMAGE_TAG}.env"
env_template_file = "/shared_work2/loom-staging-rollout/worker-envs/staging-gb10-worker-${IMAGE_TAG}.env"
builder_token_file = "/shared_work2/loom-staging-rollout/credentials/task-image-builder-token"
repo_dir = "/shared_work2/loom-staging-rollout/worker-repos/loom-remote-worker-${IMAGE_TAG}"
registry_docker_config_dir = "/shared_work2/loom-staging-rollout/credentials/task-image-builder-docker"
partition = "gb10"
time_limit = "04:00:00"
# Every managed GB10 node advertises 19 schedulable CPUs and 110000 MiB to
# Slurm (CfgTRES=cpu=19,mem=110000M). The exclusive builder request must fit
# that schedulable boundary or sbatch --test-only rejects reconciliation.
requested_cpus = 19
requested_memory_mib = 110000
requested_concurrency = 1
max_jobs = 1
pending_job_cap = 1
idle_exit_after_seconds = 120
failure_backoff_seconds = 300
exclusive = true
slurm_account = "loom-staging"
slurm_qos = "loom-task-image-builder"
slurm_reservation = "loom-task-image-builder"
job_output_dir = "/shared_work2/loom-staging-rollout/job-output"
activation_blockers = []

[[task_image_builder_policies]]
pool_name = "task-image-builder-oldlab"
enabled = true
slurm_cluster_id = "oldlab"
cpu_arch = "x86_64"
allowed_nodes = [
  "trt-eai-oldlab-6",
]
env_file = "/shared_work/loom/staging-rollout/worker-envs/staging-task-image-builder-oldlab-${IMAGE_TAG}.env"
env_template_file = "/shared_work/loom/staging-rollout/worker-envs/staging-oldlab-worker-${IMAGE_TAG}.env"
builder_token_file = "/shared_work/loom/staging-rollout/credentials/task-image-builder-token"
repo_dir = "/shared_work/loom/staging-rollout/worker-repos/loom-remote-worker-${IMAGE_TAG}"
registry_docker_config_dir = "/shared_work/loom/staging-rollout/credentials/task-image-builder-docker"
partition = "all"
time_limit = "04:00:00"
requested_cpus = 12
requested_memory_mib = 49152
requested_concurrency = 1
max_jobs = 1
pending_job_cap = 1
idle_exit_after_seconds = 120
failure_backoff_seconds = 300
exclusive = true
slurm_account = "loom-staging"
slurm_qos = "loom-task-image-builder"
slurm_reservation = "loom-task-image-builder"
job_output_dir = "/shared_work/loom/staging-rollout/job-output"
activation_blockers = []

