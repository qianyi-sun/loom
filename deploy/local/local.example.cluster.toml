# ─────────────────────────────────────────────────────────────────────────────
# Loom LOCAL developer cluster config — EXAMPLE TEMPLATE
#
# Copy this file to a git-ignored path and fill in the placeholders:
#
#     cp deploy/local/local.example.cluster.toml deploy/local/local.cluster.toml
#
# `deploy/local/local.cluster.toml` is for pre-push testing on your own
# laptop. Local is NOT a formal Loom environment: it is not in the env
# identity contract, it is not routed on yylx.world, and nothing here is
# deployed by the operator rollout. Shared `dev`/`staging`/`production`
# live under deploy/environments/ and are the only real deploy targets.
#
# See docs/runbooks/local-dev-workflow.md for the full walkthrough (kind
# bootstrap; the default in-cluster k8s_worker path; and the advanced-optional
# external-Slurm path). The whole stack runs IN the cluster — do not also start
# the control plane/service as local processes.
#
# Every value below with a <PLACEHOLDER> or a "CHANGE ME" note is
# developer-specific. Localhost routing only — do NOT point this at
# yylx.world.
# ─────────────────────────────────────────────────────────────────────────────

# Kubernetes namespace for your local single-node kind/k3s cluster.
namespace = "loom-local"
runtime_environment = "local"

# Localhost routing. A local kind/k3s cluster has no public DNS or TLS;
# reach the API and web through `kubectl port-forward` (see the runbook).
# Keep this as `localhost` — never a yylx.world host.
ingress_host = "localhost"
ingress_redirect_hosts = []
ingress_tls_secret_name = "loom-local-tls"

frontend_environment = "local"
frontend_environment_label = "Local dev"
frontend_route_path = "/"
frontend_api_base_path = "/"

# Local buckets in your standalone MinIO. Any name works as long as it is
# unique within your local MinIO instance.
trajectories_bucket = "loom-local-trajectories"
artifacts_bucket = "loom-local-artifacts"

# Local single-node cluster: pgbouncer adds a Deployment and slows kind
# boot with no upside at single-developer connection counts. Keep it off.
[pgbouncer]
enabled = false

# ─── Worker execution ────────────────────────────────────────────────────────
#
# DEFAULT PATH: in-cluster k8s_worker.
#
# On a laptop the safe default is to run trials IN the local cluster: the
# loom-worker Deployment is the trial execution path and `POST /api/v1/batches`
# accepts the `k8s-worker` pool. This needs nothing beyond the local cluster —
# no Slurm, no shared filesystem, no submit host.
[k8s_worker]
enabled = true

# ─── ADVANCED OPTIONAL: external Slurm ────────────────────────────────────────
#
# Use ONLY if you have a submit host that can BOTH reach the shared Slurm
# cluster AND make your candidate + worker env-file visible on the allocated
# COMPUTE nodes. `env_file` and
# `repo_dir` are read inside the sbatch script ON THE COMPUTE NODE, so
# laptop-absolute paths and an SSH-forwarded login shell do NOT make them
# compute-visible. Do not use this path until a tested candidate-bound
# submit-host path (shared filesystem visible to the compute nodes) exists for
# your setup.
#
# The elastic Slurm worker controller is configured on the control-plane
# PROCESS (env vars), not in this file, and runs sbatch/squeue as local
# subprocesses on the host running loom-control-plane. To use it: set
# `[k8s_worker] enabled = false` above (pick exactly ONE path) and set the
# following on the control-plane process, using the `LOOM_CP_` prefix — the
# real control-plane setting prefix; `LOOM_CONTROL_PLANE_` is NOT recognized:
#
#     LOOM_CP_SLURM_WORKER_CONTROLLER_ENABLED=true
#     LOOM_CP_SLURM_WORKER_CONTROLLER_ENVIRONMENT=local-<your-name>
#     LOOM_CP_SLURM_WORKER_CONTROLLER_POOL_NAME=<your-slurm-pool>            # CHANGE ME
#     LOOM_CP_SLURM_WORKER_CONTROLLER_PARTITION=<slurm-partition>            # CHANGE ME, if required
#     # env_file/repo_dir MUST exist and be readable ON THE COMPUTE NODES
#     # (a shared filesystem), not just on your laptop:
#     LOOM_CP_SLURM_WORKER_CONTROLLER_ENV_FILE=/shared/abs/path/worker.env   # CHANGE ME (compute-visible)
#     LOOM_CP_SLURM_WORKER_CONTROLLER_REPO_DIR=/shared/abs/path/to/loom      # CHANGE ME (compute-visible)
#     LOOM_CP_SLURM_WORKER_CONTROLLER_REQUESTED_CPUS=12
#     LOOM_CP_SLURM_WORKER_CONTROLLER_REQUESTED_MEMORY_MIB=58000
#     LOOM_CP_SLURM_WORKER_CONTROLLER_REQUESTED_CONCURRENCY=6
#     LOOM_CP_SLURM_WORKER_CONTROLLER_MAX_JOBS=2                             # keep small for local dev
#     LOOM_CP_SLURM_WORKER_CONTROLLER_PENDING_JOB_CAP=1
#     LOOM_CP_SLURM_WORKER_CONTROLLER_MIN_QUEUED_TRIALS=1
#     # sbatch/squeue/sacct/scancel default to bare names on PATH; override
#     # with *_SBATCH_PATH etc. if your Slurm client tools live elsewhere.
#
# Pick exactly ONE path: do not enable both the k8s_worker pool and Slurm.

# ─── Topology ────────────────────────────────────────────────────────────────
#
# Local dev is single-node by construction: single-pod Postgres and MinIO
# on hostPath storage. Do not raise these — a local kind/k3s node has no HA
# capacity, and multi_node=true pulls in CloudNativePG / distributed MinIO /
# Longhorn that a laptop cluster cannot satisfy.
[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
