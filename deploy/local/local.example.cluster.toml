# ─────────────────────────────────────────────────────────────────────────────
# Loom LOCAL developer cluster config — EXAMPLE TEMPLATE
#
# Copy this file to a git-ignored path and fill in the placeholders:
#
#     cp deploy/local/local.example.cluster.toml deploy/local/local.cluster.toml
#
# `deploy/local/local.cluster.toml` is for pre-push testing on your own
# laptop. Local is NOT a formal Loom environment: it is not in the env
# identity contract, it is not routed on yylx.world, and nothing here is
# deployed by the operator rollout. Shared `dev`/`staging`/`production`
# live under deploy/environments/ and are the only real deploy targets.
#
# See docs/runbooks/local-dev-workflow.md for the full walkthrough (the default
# Docker Compose path and the advanced-optional
# external-Slurm path). The whole stack runs IN the cluster — do not also start
# the control plane/service as local processes.
#
# Every value below with a <PLACEHOLDER> or a "CHANGE ME" note is
# developer-specific. Localhost routing only — do NOT point this at
# yylx.world.
# ─────────────────────────────────────────────────────────────────────────────

# Kubernetes namespace for an explicitly configured local k3s cluster.
namespace = "loom-local"
runtime_environment = "local"

# Localhost routing. A local k3s cluster has no public DNS or TLS;
# reach the API and web through `kubectl port-forward` (see the runbook).
# Keep this as `localhost` — never a yylx.world host.
ingress_host = "localhost"
ingress_redirect_hosts = []
ingress_tls_secret_name = "loom-local-tls"

frontend_environment = "local"
frontend_environment_label = "Local dev"
frontend_route_path = "/"
frontend_api_base_path = "/"

# Local buckets in your standalone MinIO. Any name works as long as it is
# unique within your local MinIO instance.
trajectories_bucket = "loom-local-trajectories"
artifacts_bucket = "loom-local-artifacts"

# Local single-node cluster: pgbouncer adds a Deployment and slows local
# boot with no upside at single-developer connection counts. Keep it off.
[pgbouncer]
enabled = false

# ─── Worker execution ────────────────────────────────────────────────────────
#
# DEFAULT PATH: in-cluster k8s_worker.
#
# On a laptop the safe default is to run trials IN the local cluster: the
# loom-worker Deployment is the trial execution path and `POST /api/v1/batches`
# accepts the `k8s-worker` pool. This needs nothing beyond the local cluster —
# no remote submit host is required.
[k8s_worker]
enabled = true

# ─── Topology ────────────────────────────────────────────────────────────────
#
# Local dev is single-node by construction: single-pod Postgres and MinIO
# on hostPath storage. Do not raise these — a local k3s node has no HA
# capacity, and multi_node=true pulls in CloudNativePG / distributed MinIO /
# Longhorn that a laptop cluster cannot satisfy.
[topology]
multi_node = false
storage_backend = "host_path"
postgres_replicas = 1
minio_replicas = 1
