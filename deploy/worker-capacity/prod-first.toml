# Shared physical worker capacity desired state for first production.
#
# This file is intentionally secret-free. Inject release-specific image/source
# values with scripts/ops/worker_capacity_manifest.py --var KEY=VALUE when
# generating evidence for a prod promotion.

schema_version = 1

[defaults]
prod_gets_remaining = true
default_staging_slots = 0
staging_slot_limit_per_host = 1

[environments.prod]
name = "production"
api_url = "https://yylx.world/prod/api"
image_tag = "${PROD_IMAGE_TAG}"
source_commit = "${PROD_SOURCE_COMMIT}"
compose_service = "loom-prod-worker"
k8s_deployment = "loom-prod-worker"
k8s_namespace = "loom-prod"

[environments.staging]
name = "staging"
api_url = "https://yylx.world/staging/api"
image_tag = "${STAGING_IMAGE_TAG}"
source_commit = "${STAGING_SOURCE_COMMIT}"
compose_service = "loom-staging-worker"
k8s_deployment = "loom-staging-worker"
k8s_namespace = "loom-staging"

