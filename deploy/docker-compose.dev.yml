# Local development stack. Differs from docker-compose.test.yml in three
# ways: (1) mounts ../src into each loom_* container so edits land
# without a rebuild, (2) persists postgres + minio data across runs,
# (3) exposes the LLM gateway token through a .env file at repo root so
# you can submit trials with `curl` directly.
#
# Quickstart:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   alembic -c migrations/alembic.ini upgrade head
#   python scripts/seed_test_data.py
#   # The team token printed by seed_test_data.py is your bearer.
#
# Endpoint map (matches the k8s ingress in deploy/k8s/):
#   localhost:5173   React SPA via Vite HMR (the user panel)
#   localhost:8090   loom_service (user-facing REST at /api/v1/*)
#   localhost:8080   control_plane (worker-facing, normally internal-only)
#   localhost:9100   llm_gateway   (agent-facing)
#   localhost:9000   minio S3 API
#   localhost:9001   minio console
#
# Hot-reload: the three uvicorn services (loom_service / control_plane /
# llm_gateway) run with `LOOM_*_DEV_RELOAD=1` so Python edits to
# anything under `src/` hot-restart the process. The SPA runs through
# Vite's own HMR. Worker stays manual: `docker compose restart worker`
# after editing worker code.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "loom"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loomdev
      MINIO_ROOT_PASSWORD: loomdev123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20

  llm-gateway:
    image: loom-llm-gateway:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      LOOM_GW_DB_URL: postgresql+psycopg://loom:loom@postgres/loom
      LOOM_GW_ANTHROPIC_API_KEY: ${LOOM_GW_ANTHROPIC_API_KEY:-stub-key}
      LOOM_GW_OPENAI_API_KEY: ${LOOM_GW_OPENAI_API_KEY:-stub-key}
      LOOM_GW_DEV_RELOAD: "1"
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9100:9100"

  control-plane:
    image: loom-control-plane:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      LOOM_CP_DB_URL: postgresql+psycopg://loom:loom@postgres/loom
      LOOM_CP_MINIO_ENDPOINT: http://minio:9000
      LOOM_CP_MINIO_ACCESS_KEY: loomdev
      LOOM_CP_MINIO_SECRET_KEY: loomdev123
      LOOM_CP_LLM_GATEWAY_URL: http://llm-gateway:9100
      LOOM_CP_LOG_LEVEL: debug
      LOOM_CP_DEV_RELOAD: "1"
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"

  loom-service:
    image: loom-service:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
    environment:
      LOOM_SVC_DB_URL: postgresql+psycopg://loom:loom@postgres/loom
      LOOM_SVC_MINIO_ENDPOINT: http://minio:9000
      LOOM_SVC_MINIO_ACCESS_KEY: loomdev
      LOOM_SVC_MINIO_SECRET_KEY: loomdev123
      LOOM_SVC_CONTROL_PLANE_URL: http://control-plane:8080/
      LOOM_SVC_GATEWAY_URL: http://llm-gateway:9100/
      LOOM_SVC_LOG_LEVEL: debug
      LOOM_SVC_DEV_RELOAD: "1"
      # LOOM_SVC_CAMPAIGN_RUNNER_CP_TOKEN unset → runner skips its tick
      # with a warning. Set it after seeding a submit-scoped token if
      # you want to exercise the campaign-runner locally.
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_started
    ports:
      - "8090:8090"

  worker:
    image: loom-worker:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      LOOM_WORKER_CONTROL_PLANE_URL: http://control-plane:8080
      LOOM_WORKER_GATEWAY_URL: http://llm-gateway:9100
      LOOM_WORKER_TOKEN: "${LOOM_WORKER_TOKEN:-placeholder}"
      LOOM_WORKER_MINIO_ENDPOINT: http://minio:9000
      LOOM_WORKER_MINIO_ACCESS_KEY: loomdev
      LOOM_WORKER_MINIO_SECRET_KEY: loomdev123
      LOOM_WORKER_LOG_LEVEL: debug
    volumes:
      - ../src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
      - worker_trajectories:/var/lib/loom/trajectories
    depends_on:
      control-plane:
        condition: service_started

  # React SPA — Vite dev server with HMR. `npm install` runs on first
  # boot (the named volume preserves node_modules across restarts).
  # Edits to web/ files reload in the browser instantly.
  web:
    image: node:20-slim
    working_dir: /app
    # VITE_API_PROXY_TARGET overrides the default (localhost:8090)
    # because inside the docker network `localhost` is the web
    # container itself; loom_service is reachable via its compose
    # service name.
    environment:
      VITE_API_PROXY_TARGET: http://loom-service:8090
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      loom-service:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  worker_trajectories:
  web_node_modules:
