# Local development stack. Differs from docker-compose.test.yml in three
# ways: (1) mounts ../src into each loom_* container so edits land
# without a rebuild, (2) persists postgres + minio data across runs,
# (3) exposes the LLM gateway token through a .env file at repo root so
# you can submit trials with `curl` directly.
#
# Quickstart:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   alembic -c migrations/alembic.ini upgrade head
#   python scripts/seed_test_data.py
#   # The team token printed by seed_test_data.py is your bearer.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "loom"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loomdev
      MINIO_ROOT_PASSWORD: loomdev123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20

  llm-gateway:
    image: loom-llm-gateway:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      LOOM_GW_DB_URL: postgresql+psycopg://loom:loom@postgres/loom
      LOOM_GW_ANTHROPIC_API_KEY: ${LOOM_GW_ANTHROPIC_API_KEY:-stub-key}
      LOOM_GW_OPENAI_API_KEY: ${LOOM_GW_OPENAI_API_KEY:-stub-key}
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9100:9100"

  control-plane:
    image: loom-control-plane:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      LOOM_CP_DB_URL: postgresql+psycopg://loom:loom@postgres/loom
      LOOM_CP_MINIO_ENDPOINT: http://minio:9000
      LOOM_CP_MINIO_ACCESS_KEY: loomdev
      LOOM_CP_MINIO_SECRET_KEY: loomdev123
      LOOM_CP_LLM_GATEWAY_URL: http://llm-gateway:9100
      LOOM_CP_LOG_LEVEL: debug
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    image: loom-worker:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      LOOM_WORKER_CONTROL_PLANE_URL: http://control-plane:8080
      LOOM_WORKER_GATEWAY_URL: http://llm-gateway:9100
      LOOM_WORKER_TOKEN: "${LOOM_WORKER_TOKEN:-placeholder}"
      LOOM_WORKER_MINIO_ENDPOINT: http://minio:9000
      LOOM_WORKER_MINIO_ACCESS_KEY: loomdev
      LOOM_WORKER_MINIO_SECRET_KEY: loomdev123
      LOOM_WORKER_LOG_LEVEL: debug
    volumes:
      - ../src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
      - worker_trajectories:/var/lib/loom/trajectories
    depends_on:
      control-plane:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  worker_trajectories:
