[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-bundle-checksum"
version = "0.1.0"
description = "Dependency-free canonical checksum for Loom task bundles."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["loom_bundle_checksum*"]

[tool.setuptools.package-data]
loom_bundle_checksum = ["py.typed"]
