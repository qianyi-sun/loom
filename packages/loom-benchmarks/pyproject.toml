[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "loom-benchmarks"
version = "0.1.0"
description = "Benchmark/task adapters for Loom."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "datasets>=2.18,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.entry-points."loom.benchmarks"]
# PR-2 (per-year AIME split + series-for-all): each AIME year ships
# as its own adapter so users can pick AIME-24 / AIME-25 / both with
# a single click. The combined `aime-aimo-validation` adapter is gone
# (migration 0016 drops its row); the per-year adapters all pull from
# `AI-MO/aimo-validation-aime` filtered by parsed year. AIME-25 stays
# on its MathArena upstream. `swe-bench-verified` restored as a peer.
# All standalone adapters get a series so the SPA has no "Other"
# bucket: code / agents / skill.
aime-22 = "loom_benchmarks.adapters.aime:AIME22Adapter"
aime-23 = "loom_benchmarks.adapters.aime:AIME23Adapter"
aime-24 = "loom_benchmarks.adapters.aime:AIME24Adapter"
aime-25 = "loom_benchmarks.adapters.aime_2025:AIME25Adapter"
bfcl = "loom_benchmarks.adapters.bfcl:BFCLAdapter"
browsecomp = "loom_benchmarks.adapters.browsecomp:BrowseCompAdapter"
gaia = "loom_benchmarks.adapters.gaia:GAIAAdapter"
gpqa = "loom_benchmarks.adapters.gpqa:GPQAAdapter"
gpqa-diamond = "loom_benchmarks.adapters.gpqa:GPQADiamondAdapter"
hendrycks-math = "loom_benchmarks.adapters.hendrycks_math:HendrycksMATHAdapter"
math-500 = "loom_benchmarks.adapters.hendrycks_math:MATH500Adapter"
humaneval = "loom_benchmarks.adapters.humaneval:HumanEvalAdapter"
livecodebench = "loom_benchmarks.adapters.livecodebench:LiveCodeBenchAdapter"
mbpp = "loom_benchmarks.adapters.mbpp:MBPPAdapter"
mmlu-pro = "loom_benchmarks.adapters.mmlu_pro:MMLUProAdapter"
osworld = "loom_benchmarks.adapters.osworld:OSWorldAdapter"
skillflow = "loom_benchmarks.adapters.skillflow:SkillFlowAdapter"
skilllearnbench = "loom_benchmarks.adapters.skilllearnbench:SkillLearnBenchAdapter"
swe-bench = "loom_benchmarks.adapters.swe_bench:SWEBenchAdapter"
swe-bench-verified = "loom_benchmarks.adapters.swe_bench_verified:SWEBenchVerifiedAdapter"
swe-bench-multimodal = "loom_benchmarks.adapters.swe_bench_multimodal:SWEBenchMultimodalAdapter"
tau2-bench = "loom_benchmarks.adapters.tau2_bench:Tau2BenchAdapter"
webarena = "loom_benchmarks.adapters.webarena:WebArenaAdapter"

[tool.hatch.build.targets.wheel]
packages = ["loom_benchmarks"]
