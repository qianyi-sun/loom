services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://agentic:[REDACTED_DB_PASSWORD]@postgres:5432/agentic_data_platform
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: agentic-data-shared dev
      OBJECT_STORAGE_ACCESS_KEY: loomdev
      OBJECT_STORAGE_SECRET_KEY: loomdev
      OBJECT_STORAGE_REGION: us-east-1
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    command: python -m uvicorn agentic_data_platform.service.app:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://agentic:[REDACTED_DB_PASSWORD]@postgres:5432/agentic_data_platform
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: agentic-data-shared dev
      OBJECT_STORAGE_ACCESS_KEY: loomdev
      OBJECT_STORAGE_SECRET_KEY: loomdev
      OBJECT_STORAGE_REGION: us-east-1
      REDIS_URL: redis://redis:6379/0
      SANDBOX_WORKSPACE_ROOT: /workspace/.runtime/sandbox-workspaces
      SANDBOX_HOST_WORKSPACE_ROOT: ${SANDBOX_HOST_WORKSPACE_ROOT:-}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: python -m agentic_data_platform.worker.service --worker-id worker-dev-1 --poll-interval-seconds 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://agentic:[REDACTED_DB_PASSWORD]@postgres:5432/agentic_data_platform
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: agentic-data-shared dev
      OBJECT_STORAGE_ACCESS_KEY: loomdev
      OBJECT_STORAGE_SECRET_KEY: loomdev
      OBJECT_STORAGE_REGION: us-east-1
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: python -m unittest discover -s tests -v

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://agentic:[REDACTED_DB_PASSWORD]@postgres:5432/agentic_data_platform
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    command: python -m agentic_data_platform.persistence.migrations

  object-storage-smoke:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: agentic-data-shared dev
      OBJECT_STORAGE_ACCESS_KEY: loomdev
      OBJECT_STORAGE_SECRET_KEY: loomdev
      OBJECT_STORAGE_REGION: us-east-1
    volumes:
      - .:/workspace
    depends_on:
      minio:
        condition: service_started
    profiles:
      - tools
    command: python -m agentic_data_platform.artifacts.object_storage_smoke

  worker-smoke:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://agentic:[REDACTED_DB_PASSWORD]@postgres:5432/agentic_data_platform
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: agentic-data-shared dev
      OBJECT_STORAGE_ACCESS_KEY: loomdev
      OBJECT_STORAGE_SECRET_KEY: loomdev
      OBJECT_STORAGE_REGION: us-east-1
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    profiles:
      - tools
    command: python -m agentic_data_platform.worker.smoke

  api-smoke:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      API_SMOKE_BASE_URL: http://api:8000
      API_SMOKE_AUTH_TOKEN: ${API_SMOKE_AUTH_TOKEN:-[REDACTED_TOKEN]}
      API_SMOKE_TIMEOUT_SECONDS: ${API_SMOKE_TIMEOUT_SECONDS:-120}
      API_SMOKE_POLL_INTERVAL_SECONDS: ${API_SMOKE_POLL_INTERVAL_SECONDS:-5}
      API_SMOKE_PROJECT_ID: pilot-project
      API_SMOKE_OWNER_TEAM: pilot group
      API_SMOKE_CREATED_BY_USER_ID: [REDACTED_OWNER]
    volumes:
      - .:/workspace
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    profiles:
      - tools
    command: python -m agentic_data_platform.service.api_smoke

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_data_platform
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: [REDACTED_DB_PASSWORD]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_data_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loomdev
      MINIO_ROOT_PASSWORD: loomdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  minio-data:
