services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://agentic:[REDACTED_DB_PASSWORD]@postgres:5432/agentic_data_platform
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: agentic-data-shared dev
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    command: python -m uvicorn agentic_data_platform.service.app:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: agentic-data-shared dev:latest
    working_dir: /workspace
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://agentic:[REDACTED_DB_PASSWORD]@postgres:5432/agentic_data_platform
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: agentic-data-shared dev
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: python -m unittest discover -s tests -v

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_data_platform
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: [REDACTED_DB_PASSWORD]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_data_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loomdev
      MINIO_ROOT_PASSWORD: loomdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  minio-data:
